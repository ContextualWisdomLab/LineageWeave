name: automation-825-behavior-r2

on:
  push:
    branches:
      - automation/825-current-824-behavior-r2-20260907-0928

permissions:
  contents: write

jobs:
  behavior:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact reconstruction branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact current parent and fetch historical delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "499d653ed6e9206249e3f3a07518ad3fc01f14bd"
          git fetch --no-tags origin \
            8b2ed956b2ba66e3aa2d149b701c242e3b016dd9 \
            bca6baabd917478bf4f6b688ec2755cde95e3575
          test "$(git rev-parse bca6baabd917478bf4f6b688ec2755cde95e3575^)" = "8b2ed956b2ba66e3aa2d149b701c242e3b016dd9"

      - name: Apply historical tests only
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary \
            8b2ed956b2ba66e3aa2d149b701c242e3b016dd9 \
            bca6baabd917478bf4f6b688ec2755cde95e3575 -- \
            frontend/src/App.test.tsx \
            frontend/src/i18n.test.ts \
            frontend/src/leftoverMapCoverage.test.ts > /tmp/825-tests.patch
          git apply --3way --index /tmp/825-tests.patch || {
            git diff --name-only --diff-filter=U
            exit 1
          }

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          cd frontend
          pnpm install --frozen-lockfile

      - name: Realistic RED — incomplete-item comparison translation is absent
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          set +e
          pnpm exec vitest run src/i18n.test.ts -t "formats leftover map comparison incomplete items label" > /tmp/825-red.log 2>&1
          status=$?
          set -e
          cat /tmp/825-red.log
          test "$status" -ne 0
          grep -q "Leftover map comparison incomplete items" /tmp/825-red.log

      - name: Apply minimal historical production delta on current parent
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary \
            8b2ed956b2ba66e3aa2d149b701c242e3b016dd9 \
            bca6baabd917478bf4f6b688ec2755cde95e3575 -- \
            frontend/src/App.tsx \
            frontend/src/i18n.ts \
            frontend/src/leftoverMapCoverage.ts \
            frontend/src/components/LeftoverPairList.tsx \
            frontend/src/leftoverMapPlotLayout.ts > /tmp/825-production.patch
          git apply --3way --index /tmp/825-production.patch || {
            echo 'UNMERGED_FUNCTIONAL_FILES_BEGIN'
            git diff --name-only --diff-filter=U
            echo 'UNMERGED_FUNCTIONAL_FILES_END'
            exit 1
          }
          # Current identity is ADR0294, not the historical collided ADR0292.
          sed -i 's/ADR 0292 names persisted leftover-map incomplete item coverage/ADR 0294 names persisted leftover-map incomplete item coverage/' frontend/src/components/LeftoverPairList.tsx
          sed -i 's/(ADR 0292) caption the pair list/(ADR 0294) caption the pair list/' frontend/src/leftoverMapPlotLayout.ts
          sed -i '1s@ / ADR 0292@ / ADR 0294@' frontend/src/leftoverMapCoverage.ts
          git add frontend/src
          ! grep -R "leftoverMapIncompleteItemCount.*visible" -n frontend/src/App.tsx

      - name: Set up Python and locked dependency manager
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Select pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Install frozen Python dependencies
        run: uv sync --frozen --extra dev --extra backend

      - name: Preserve inherited partial-visibility authorization GREEN
        run: uv run --frozen python -m pytest -q tests/test_compare_coverage_visibility.py

      - name: Exact behavior GREEN
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          pnpm exec vitest run src/App.test.tsx src/i18n.test.ts src/leftoverMapCoverage.test.ts
          pnpm run lint
          pnpm run test
          pnpm run build
          pnpm run build-storybook

      - name: Materialize workflow-free clean behavior tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "LineageWeave automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/automation-825-behavior-r2.yml
          git add frontend/src
          git diff --cached --name-only
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/' || true)"
          git commit -m "feat(reports): reconstruct grouping incomplete-item behavior on current parent"
          echo "CLEAN_COMMIT=$(git rev-parse HEAD)"
          echo "CLEAN_TREE=$(git rev-parse HEAD^{tree})"
          git push origin HEAD:refs/heads/automation/825-current-824-behavior-r2-clean-20260907-0928
