name: Temporary 812 parent convergence

on:
  push:
    branches:
      - "automation/812-parent-convergence-20260906"

permissions:
  contents: write

concurrency:
  group: temporary-812-parent-convergence
  cancel-in-progress: true

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact child staging branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: automation/812-parent-convergence-20260906
          fetch-depth: 0

      - name: Verify exact parent and attempt non-force merge
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/leftover-map-segment-rank-v2370
          parent=8c16fa26ee3e97381a547a5b2e2eca8eed691ff2
          actual="$(git rev-parse origin/feat/leftover-map-segment-rank-v2370)"
          test "$actual" = "$parent"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          git merge --no-commit --no-ff "$parent"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U | sort | tr '\n' ' ' | sed 's/ $//')"
            expected="frontend/src/i18n.test.ts frontend/src/i18n.ts lineageweave/__init__.py"
            if [ "$conflicts" != "$expected" ]; then
              echo "::error title=Unexpected exact-parent conflicts::$conflicts"
              exit 42
            fi
            # #812 owns the v2.38 successor release identity; #811 owns the
            # Vietnamese parent terminology that is reapplied below.
            git checkout --ours frontend/src/i18n.ts frontend/src/i18n.test.ts lineageweave/__init__.py
            git add lineageweave/__init__.py
          fi

      - name: Preserve child i18n delta and parent Vietnamese terminology
        shell: python
        run: |
          from pathlib import Path

          repairs = {
              Path("frontend/src/i18n.ts"): [
                  (
                      "phần dư giải thích bản đồ phần dư {label}",
                      "tỷ phần phần dư được giải thích trên bản đồ phần dư {label}",
                  ),
                  (
                      "phần dư giải thích e",
                      "tỷ phần phần dư được giải thích e",
                  ),
              ],
              Path("frontend/src/i18n.test.ts"): [
                  (
                      "phần dư giải thích e",
                      "tỷ phần phần dư được giải thích e",
                  ),
                  (
                      "phần dư giải thích bản đồ phần dư R̂²/R² 0.76",
                      "tỷ phần phần dư được giải thích trên bản đồ phần dư R̂²/R² 0.76",
                  ),
              ],
          }
          for path, replacements in repairs.items():
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  old_count = text.count(old)
                  if old_count > 1:
                      raise SystemExit(f"{path}: expected at most one old value {old!r}, found {old_count}")
                  if old_count == 1:
                      text = text.replace(old, new)
                  if text.count(new) < 1:
                      raise SystemExit(f"{path}: repaired value {new!r} is absent")
              path.write_text(text, encoding="utf-8")
          import subprocess
          subprocess.run(["git", "add", "frontend/src/i18n.ts", "frontend/src/i18n.test.ts"], check=True)

      - name: Verify v2.38 release identity survives parent convergence
        shell: python
        run: |
          import json
          import re
          import tomllib
          from pathlib import Path

          root = Path(".")
          project = tomllib.loads((root / "pyproject.toml").read_text(encoding="utf-8"))
          frontend = json.loads((root / "frontend/package.json").read_text(encoding="utf-8"))
          init_text = (root / "lineageweave/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__ = "([^"]+)"$', init_text, re.MULTILINE)
          if match is None:
              raise SystemExit("lineageweave.__version__ declaration missing")
          versions = (project["project"]["version"], frontend["version"], match.group(1))
          if versions != ("2.38.0", "2.38.0", "2.38.0"):
              raise SystemExit(f"release identity drift after convergence: {versions!r}")

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run parent-child convergence contracts
        working-directory: frontend
        run: |
          pnpm exec vitest run \
            src/leftoverMapPlotVietnameseCopy.test.ts \
            src/i18n.test.ts \
            src/leftoverMapCoverage.test.ts \
            src/components/LeftoverMapPlot.test.tsx

      - name: Commit clean merge tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm .github/workflows/temporary-812-parent-convergence.yml
          git add -A
          test -f .git/MERGE_HEAD
          git commit -m "merge: converge #812 with repaired #811 parent"
          git push origin HEAD:automation/812-parent-convergence-20260906
