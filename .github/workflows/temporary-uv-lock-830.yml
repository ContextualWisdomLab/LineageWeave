name: Temporary v2.56 lock regeneration

on:
  push:
    branches:
      - feat/leftover-map-compare-axis-singular-v2510

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[lock-regenerated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Regenerate and constrain lock delta
        shell: bash
        run: |
          set -euo pipefail
          uv lock
          git diff --exit-code -- . ':(exclude)uv.lock'
          python - <<'PY'
          import subprocess

          diff = subprocess.check_output(
              ["git", "diff", "--unified=0", "--", "uv.lock"], text=True
          )
          added = [
              line for line in diff.splitlines()
              if line.startswith("+") and not line.startswith("+++")
          ]
          removed = [
              line for line in diff.splitlines()
              if line.startswith("-") and not line.startswith("---")
          ]
          assert removed == ['-version = "2.37.0"'], diff
          assert added == ['+version = "2.56.0"'], diff
          PY
          git diff --check

      - name: Commit generated universal lock non-force
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore(release): regenerate v2.56 universal lock [lock-regenerated]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
