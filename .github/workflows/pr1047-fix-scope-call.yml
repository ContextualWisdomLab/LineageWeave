name: Temporary PR 1047 scope-call repair
on:
  push:
    branches: [fix/post-chat-replay-scope]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/post-chat-replay-scope
          fetch-depth: 0
      - name: Repair keyword-only scope construction
        shell: python
        run: |
          from pathlib import Path
          import ast
          path = Path("backend/app/main.py")
          text = path.read_text()
          old = "PostChatAuthorizationScope.captured(\n        account.corporate_entity_ids, account.process_unit_ids\n    )"
          new = "PostChatAuthorizationScope.captured(\n        corporate_entity_ids=account.corporate_entity_ids,\n        process_unit_ids=account.process_unit_ids,\n    )"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"expected two scope call sites, found {count}")
          path.write_text(text.replace(old, new))
          ast.parse(path.read_text(), filename=str(path))
          Path(".github/workflows/pr1047-fix-scope-call.yml").unlink()
      - name: Commit ordinary repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/main.py .github/workflows/pr1047-fix-scope-call.yml
          git diff --cached --check
          git commit -m "fix(security): construct replay scope with explicit identities"
          git push origin HEAD:fix/post-chat-replay-scope
