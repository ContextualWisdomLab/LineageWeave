name: Temporary 828 documentation review repair

on:
  push:
    branches:
      - "automation/828-doc-review-repair-20260906"

permissions:
  contents: write

concurrency:
  group: temporary-828-doc-review-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact staging branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: automation/828-doc-review-repair-20260906
          fetch-depth: 0

      - name: Verify staging ancestry
        run: |
          git merge-base --is-ancestor bc10896f2587e609dc6c2483c8d7f6c40ecbe16c HEAD
          test "$(git diff --name-only bc10896f2587e609dc6c2483c8d7f6c40ecbe16c..HEAD)" = ".github/workflows/temporary-828-doc-review-repair.yml"

      - name: Apply verified documentation findings
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one target, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          changelog_wording_old = (
              "a grouping comparison leftover-map axis share badge that\n"
              "  matches leftover-axis report badges;"
          )
          changelog_wording_new = (
              "a grouping comparison leftover-map axis share badge that\n"
              "  names the same persisted share as leftover-axis report badges but uses\n"
              "  distinct comparison copy and accessible naming;"
          )
          replace_once(
              "CHANGELOG.d/2.50.0-leftover-map-compare-axis-share.md",
              changelog_wording_old,
              changelog_wording_new,
          )
          replace_once("CHANGELOG.md", changelog_wording_old, changelog_wording_new)

          storybook_old = (
              "The grouping comparison strip names leftover-map complete-case coverage, "
              "leftover-map item complete-case coverage, leftover-map incomplete post coverage, "
              "leftover-map incomplete item coverage, and leftover-map axis share with distinct "
              "comparison labels when leftoverMapCoverageCounts / leftoverMapItemCoverageCounts / "
              "leftoverMapIncompletePostCount / leftoverMapIncompleteItemCount / "
              "leftoverMapCompareAxisShare return usable values."
          )
          storybook_new = (
              "The grouping comparison strip names each coverage label only when its own helper "
              "returns a usable value. The axis-share label is independent: it is shown when "
              "leftoverMapCompareAxisShare returns a finite persisted leftover_share, including "
              "zero and finite negative values, and is omitted only when that share is missing or "
              "non-finite."
          )
          replace_once("docs/storybook-inventory.md", storybook_old, storybook_new)

          architecture_old = (
              "coverage (ADR 0290), leftover-map incomplete post coverage (ADR 0291), and leftover-map\n"
              "incomplete item coverage (ADR 0292);"
          )
          architecture_new = (
              "coverage (ADR 0290), leftover-map incomplete post coverage (ADR 0291), leftover-map\n"
              "incomplete item coverage (ADR 0292), and persisted `leftover_map_axes` consumed through\n"
              "`leftoverMapCompareAxisShare` under the full-visible-grouping rule (ADR 0367);"
          )
          replace_once("ARCHITECTURE.md", architecture_old, architecture_new)

          baseline_path = Path("docs/product-technical-gap-baseline.md")
          baseline = baseline_path.read_text(encoding="utf-8")
          baseline_old = "length as separate columns.\n\n\n> Exact-head loop overlay:"
          baseline_new = "length as separate columns.\n>\n> Exact-head loop overlay:"
          if baseline.count(baseline_old) != 3:
              raise SystemExit(f"{baseline_path}: expected three repeated MD028 targets, found {baseline.count(baseline_old)}")
          baseline_path.write_text(baseline.replace(baseline_old, baseline_new), encoding="utf-8")

      - name: Verify repaired documentation contracts
        shell: python
        run: |
          from pathlib import Path

          changelog = Path("CHANGELOG.d/2.50.0-leftover-map-compare-axis-share.md").read_text(encoding="utf-8")
          root_changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          storybook = Path("docs/storybook-inventory.md").read_text(encoding="utf-8")
          architecture = Path("ARCHITECTURE.md").read_text(encoding="utf-8")
          baseline = Path("docs/product-technical-gap-baseline.md").read_text(encoding="utf-8")

          for text, name in [(changelog, "CHANGELOG.d"), (root_changelog, "CHANGELOG.md")]:
              assert "matches leftover-axis report badges" not in text, name
              assert "names the same persisted share as leftover-axis report badges" in text, name
              assert "distinct comparison copy and accessible naming" in text, name
          assert "axis-share label is independent" in storybook
          assert "including zero and finite negative values" in storybook
          assert "persisted `leftover_map_axes` consumed through" in architecture
          assert "`leftoverMapCompareAxisShare` under the full-visible-grouping rule (ADR 0367)" in architecture
          assert "length as separate columns.\n\n\n> Exact-head loop overlay:" not in baseline

      - name: Check clean diff
        run: git diff --check

      - name: Commit clean documentation tree
        run: |
          rm .github/workflows/temporary-828-doc-review-repair.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(reports): align axis-share review contracts"
          git push origin HEAD:automation/828-doc-review-repair-20260906
