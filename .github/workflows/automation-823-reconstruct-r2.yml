name: automation-823-current-822-reconstruction-r2

on:
  push:
    branches:
      - automation/823-current-822-reconstruction-r2-20260907-0851

permissions:
  contents: write

concurrency:
  group: automation-823-current-822-reconstruction-r2
  cancel-in-progress: true

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    env:
      EXPECTED_PARENT: 724872a34469c84064d5a72b07c6acf16de8a760
      HISTORICAL_PARENT: b7222713a69acdf3d32bbce992001a2433946d21
      HISTORICAL_FEATURE: eb172c40d8ecd08f3e1c220cbf3117b488cddb30
      STAGING_BRANCH: automation/823-product-staging-r2-20260907-0851
    steps:
      - name: Checkout exact repository history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Verify exact parent and reapply reviewed singular-badge source delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git cat-file -e "$EXPECTED_PARENT^{commit}"
          git cat-file -e "$HISTORICAL_PARENT^{commit}"
          git cat-file -e "$HISTORICAL_FEATURE^{commit}"
          test "$(git rev-parse "$HISTORICAL_FEATURE^")" = "$HISTORICAL_PARENT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$STAGING_BRANCH" "$EXPECTED_PARENT"

          git diff --binary "$HISTORICAL_PARENT" "$HISTORICAL_FEATURE" -- \
            frontend/src/App.tsx frontend/src/App.test.tsx \
            frontend/src/i18n.ts frontend/src/i18n.test.ts \
            frontend/src/leftoverMapAxisBadge.ts frontend/src/leftoverMapAxisBadge.test.ts \
            > /tmp/823-ui.patch
          git apply --3way --index /tmp/823-ui.patch
          git diff --cached --name-status

          cat > tests/test_adr_0292_governance.py <<'PY'
          """Governance regression for leftover-axis singular-value badges."""
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]

          def test_axis_singular_badges_use_distinct_proposed_adr_0292() -> None:
              """Keep #823 distinct from #821/#822 decisions and Proposed while Draft."""
              assert (ROOT / "docs/adr/0290-leftover-map-compare-coverage.md").exists()
              assert (ROOT / "docs/adr/0291-leftover-map-compare-item-coverage.md").exists()
              assert not (ROOT / "docs/adr/0290-leftover-map-axis-singular.md").exists()
              successor = ROOT / "docs/adr/0292-leftover-map-axis-singular.md"
              assert successor.exists()
              text = successor.read_text(encoding="utf-8")
              assert text.startswith("# ADR 0292 —")
              assert "**Decision status:** Proposed" in text
              assert "**Decision status:** Accepted" not in text
          PY

      - name: Install RED dependencies
        shell: bash
        run: uv sync --frozen --extra dev

      - name: Reproduce ADR identity governance RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          uv run --no-sync pytest -q tests/test_adr_0292_governance.py
          rc=$?
          set -e
          test "$rc" -eq 1

      - name: Apply minimal v2.49 identity and documentation fix
        shell: bash
        run: |
          set -euo pipefail
          git show "${HISTORICAL_FEATURE}:docs/adr/0290-leftover-map-axis-singular.md" > /tmp/axis-singular-adr.md
          git show "${HISTORICAL_FEATURE}:CHANGELOG.d/2.47.0-leftover-map-axis-singular.md" > /tmp/axis-singular-fragment.md
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected marker missing in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          def insert_after(path: str, marker: str, addition: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if addition.strip() in text:
                  return
              if marker not in text:
                  raise SystemExit(f"insert marker missing in {path}: {marker!r}")
              p.write_text(text.replace(marker, marker + addition, 1), encoding="utf-8")

          adr = Path("/tmp/axis-singular-adr.md").read_text(encoding="utf-8")
          adr = adr.replace("# ADR 0290 —", "# ADR 0292 —", 1)
          adr = adr.replace("**Decision status:** Accepted", "**Decision status:** Proposed", 1)
          adr = adr.replace("ADR 0290", "ADR 0292")
          authority_note = (
              "\nThis successor identity is orthogonal to ADR 0290 (grouping comparison post coverage) "
              "and ADR 0291 (grouping comparison item coverage). Those authorization decisions remain "
              "unchanged; this UI decision does not reinterpret their persisted denominators.\n"
          )
          adr = adr.replace("## Context\n", authority_note + "\n## Context\n", 1)
          Path("docs/adr/0292-leftover-map-axis-singular.md").write_text(adr, encoding="utf-8")

          fragment = Path("/tmp/axis-singular-fragment.md").read_text(encoding="utf-8")
          fragment = fragment.replace("2.47.0", "2.49.0").replace("ADR 0290", "ADR 0292")
          Path("CHANGELOG.d/2.49.0-leftover-map-axis-singular.md").write_text(fragment, encoding="utf-8")

          replace_once("pyproject.toml", 'version = "2.48.0"', 'version = "2.49.0"')
          replace_once("frontend/package.json", '"version": "2.48.0"', '"version": "2.49.0"')
          replace_once("lineageweave/__init__.py", '__version__ = "2.48.0"', '__version__ = "2.49.0"')

          p = Path("docs/adr/0148-leftover-map-axis-share.md")
          text = p.read_text(encoding="utf-8")
          old = "[ADR 0289](0289-leftover-map-plot-singular.md)\n(leftover-map singular values on the graphic display)\n"
          new = (
              "[ADR 0289](0289-leftover-map-plot-singular.md)\n"
              "(leftover-map singular values on the graphic display);\n"
              "[ADR 0292](0292-leftover-map-axis-singular.md)\n"
              "(leftover-map singular values on leftover-axis badges)\n"
          )
          if old not in text:
              raise SystemExit("ADR 0148 amendment marker missing")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "AGENTS.md",
              "/ 0288 / 0289 / 0290 / 0291) are computed",
              "/ 0288 / 0289 / 0290 / 0291 / 0292) are computed",
          )
          insert_after(
              "AGENTS.md",
              "ADR 0289 captions leftover-map graphic axes with persisted leftover-map\nsingular values `σ_k` so leftover-map axis share is not read as leftover-map\nstructure without the Gabriel scale that produced it; a missing, non-finite,\nor negative singular value omits that `σ` badge independently of leftover-map\naxis share and does not invent `σ_k` from leftover-map axis share.\n",
              "ADR 0292 captions leftover-axis report badges with persisted leftover-map singular values `σ_k` when finite and non-negative, including rank-0 zero singular values; missing, non-finite, or negative singular values omit only the `σ` caption and never derive `σ_k` from leftover-map axis share.\n",
          )

          replace_once(
              "ARCHITECTURE.md",
              "/ 0288 / 0289 / 0290 / 0291) persist",
              "/ 0288 / 0289 / 0290 / 0291 / 0292) persist",
          )
          insert_after(
              "ARCHITECTURE.md",
              "ADR 0291 captions grouping-comparison persisted item complete-case coverage through leftoverMapItemCoverageCounts only under ADR 0290's full-visible-grouping authorization boundary.\n",
              "ADR 0292 captions leftover-axis report badges with persisted finite, non-negative leftover-map singular values `σ_k`; missing or invalid singular values omit only that caption, and axis share remains a distinct persisted measure.\n",
          )
          replace_once(
              "CLAUDE.md",
              "/ 0288 / 0289 / 0290 / 0291), occupational",
              "/ 0288 / 0289 / 0290 / 0291 / 0292), occupational",
          )

          p = Path("CHANGELOG.md")
          text = p.read_text(encoding="utf-8")
          addition = (
              "- Period leftover pairs now caption leftover-axis report badges with persisted leftover-map "
              "singular values `σ_k` (ADR 0292 / v2.49.0). Missing, non-finite, or negative singular values "
              "omit only that `σ` caption; rank-0 zero remains `σ 0.00`, and axis share remains distinct.\n\n"
          )
          marker = "### Added\n\n"
          if addition not in text:
              if marker not in text:
                  raise SystemExit("CHANGELOG Added marker missing")
              p.write_text(text.replace(marker, marker + addition, 1), encoding="utf-8")
          PY

      - name: Select repository-pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          test "$(rustc --version | awk '{print $2}')" = "1.97.1"

      - name: Install GREEN dependencies
        shell: bash
        run: uv sync --frozen --extra dev --extra backend

      - name: Enable canonical frontend package manager
        shell: bash
        run: corepack enable

      - name: Install frontend GREEN dependencies
        shell: bash
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: GREEN ADR governance and release identity
        shell: bash
        run: uv run --no-sync pytest -q tests/test_adr_0290_governance.py tests/test_adr_0291_governance.py tests/test_adr_0292_governance.py tests/test_package_version.py

      - name: GREEN singular-badge frontend contracts
        shell: bash
        working-directory: frontend
        run: pnpm exec vitest run src/leftoverMapAxisBadge.test.ts src/leftoverMapPlotAxisSingular.test.ts src/i18n.test.ts src/App.test.tsx

      - name: GREEN frontend lint
        shell: bash
        working-directory: frontend
        run: pnpm exec oxlint src

      - name: GREEN frontend production build
        shell: bash
        working-directory: frontend
        run: pnpm run build

      - name: GREEN Storybook build
        shell: bash
        working-directory: frontend
        run: pnpm run build-storybook

      - name: Verify reconstructed authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          assert Path('docs/adr/0290-leftover-map-compare-coverage.md').exists()
          assert Path('docs/adr/0291-leftover-map-compare-item-coverage.md').exists()
          assert Path('docs/adr/0292-leftover-map-axis-singular.md').exists()
          assert not Path('docs/adr/0290-leftover-map-axis-singular.md').exists()
          assert 'version = "2.49.0"' in Path('pyproject.toml').read_text(encoding='utf-8')
          assert '"version": "2.49.0"' in Path('frontend/package.json').read_text(encoding='utf-8')
          assert '__version__ = "2.49.0"' in Path('lineageweave/__init__.py').read_text(encoding='utf-8')
          assert Path('frontend/src/leftoverMapAxisBadge.ts').exists()
          assert Path('frontend/src/leftoverMapAxisBadge.test.ts').exists()
          assert 'leftoverMapAxisBadgeSingular(axis)' in Path('frontend/src/App.tsx').read_text(encoding='utf-8')
          assert '**Decision status:** Proposed' in Path('docs/adr/0292-leftover-map-axis-singular.md').read_text(encoding='utf-8')
          PY

      - name: Commit workflow-free clean staging tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -z "$(git diff --name-only "$EXPECTED_PARENT" | grep '^.github/workflows/automation-823' || true)"
          git add -A
          git status --short
          git commit -m "feat(reports): reconstruct leftover-axis singular badges as v2.49.0"
          test -z "$(git status --porcelain)"
          git log -1 --format='staging commit=%H tree=%T parents=%P'
          git diff --name-status "$EXPECTED_PARENT" HEAD
          git push origin "HEAD:refs/heads/$STAGING_BRANCH"
