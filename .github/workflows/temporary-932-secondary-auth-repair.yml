name: Temporary 932 secondary-auth repair

on:
  push:
    branches:
      - "automation/932-secondary-auth-repair-20260906"

permissions:
  contents: write

concurrency:
  group: temporary-932-secondary-auth-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: automation/932-secondary-auth-repair-20260906
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Install committed test dependencies
        run: uv sync --frozen --extra dev --extra backend

      - name: Apply exact secondary-auth invalidation and stale-completion guards
        shell: python
        run: |
          from pathlib import Path

          path = Path("frontend/src/App.tsx")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "  const masterRequestGeneration = useRef(0);\n  const [error, setError] = useState<string | null>(null);",
                  "  const masterRequestGeneration = useRef(0);\n  const currentAccessTokenRef = useRef(accessToken);\n  const [error, setError] = useState<string | null>(null);",
              ),
              (
                  '''  useEffect(() => {\n    let active = true;\n    fetchMe(accessToken)\n      .then((member) => {\n        if (active) setCanResolveHints(member.permission_codes.includes("post_admin"));\n      })\n      .catch(() => {\n        if (active) setCanResolveHints(false);\n      });\n    return () => {\n      active = false;\n    };\n  }, [accessToken]);''',
                  '''  useEffect(() => {\n    let active = true;\n    currentAccessTokenRef.current = accessToken;\n    setCanResolveHints(false);\n    setRelatedByEntity({});\n    setExpandedEntityId(null);\n    setRelatedLoading(null);\n    setSelectedPostId(null);\n    setSelectedPostGraph(null);\n    setResolvingHint(null);\n    setResolveError(null);\n    fetchMe(accessToken)\n      .then((member) => {\n        if (active) setCanResolveHints(member.permission_codes.includes("post_admin"));\n      })\n      .catch(() => {\n        if (active) setCanResolveHints(false);\n      });\n    return () => {\n      active = false;\n    };\n  }, [accessToken]);''',
              ),
              (
                  '''  const loadMaster = useCallback(() => {\n    const requestGeneration = ++masterRequestGeneration.current;\n    setError(null);\n    return fetchCustomerMaster(accessToken)\n      .then((nextMaster) => {\n        if (requestGeneration === masterRequestGeneration.current) setMaster(nextMaster);\n      })\n      .catch(() => {\n        if (requestGeneration === masterRequestGeneration.current) {\n          setError(t("Customer master could not be loaded."));\n        }\n      });\n  }, [accessToken]);''',
                  '''  const loadMaster = useCallback(() => {\n    const requestAccessToken = accessToken;\n    const requestGeneration = ++masterRequestGeneration.current;\n    setError(null);\n    return fetchCustomerMaster(requestAccessToken)\n      .then((nextMaster) => {\n        if (\n          requestGeneration === masterRequestGeneration.current &&\n          requestAccessToken === currentAccessTokenRef.current\n        ) {\n          setMaster(nextMaster);\n        }\n      })\n      .catch(() => {\n        if (\n          requestGeneration === masterRequestGeneration.current &&\n          requestAccessToken === currentAccessTokenRef.current\n        ) {\n          setError(t("Customer master could not be loaded."));\n        }\n      });\n  }, [accessToken]);''',
              ),
              (
                  '''  async function handleResolveHint(hintCode: string) {\n    setResolvingHint(hintCode);\n    setResolveError(null);\n    try {\n      await resolveCustomerHint(accessToken, hintCode);\n      await loadMaster();\n    } catch {\n      setResolveError(t("This hint could not be resolved to a corroborated organization name."));\n    } finally {\n      setResolvingHint(null);\n    }\n  }''',
                  '''  async function handleResolveHint(hintCode: string) {\n    const requestAccessToken = accessToken;\n    setResolvingHint(hintCode);\n    setResolveError(null);\n    try {\n      await resolveCustomerHint(requestAccessToken, hintCode);\n      if (requestAccessToken === currentAccessTokenRef.current) await loadMaster();\n    } catch {\n      if (requestAccessToken === currentAccessTokenRef.current) {\n        setResolveError(t("This hint could not be resolved to a corroborated organization name."));\n      }\n    } finally {\n      if (requestAccessToken === currentAccessTokenRef.current) setResolvingHint(null);\n    }\n  }''',
              ),
              (
                  '''  async function toggleEntity(entityId: string) {\n    if (expandedEntityId === entityId) {\n      setExpandedEntityId(null);\n      return;\n    }\n    setExpandedEntityId(entityId);\n    if (relatedByEntity[entityId]) return;\n    setRelatedLoading(entityId);\n    try {\n      const response = await fetchRelatedEntity(accessToken, entityId);\n      setRelatedByEntity((previous) => ({ ...previous, [entityId]: response.related }));\n    } catch {\n      setRelatedByEntity((previous) => ({ ...previous, [entityId]: [] }));\n    } finally {\n      setRelatedLoading(null);\n    }\n  }''',
                  '''  async function toggleEntity(entityId: string) {\n    const requestAccessToken = accessToken;\n    if (expandedEntityId === entityId) {\n      setExpandedEntityId(null);\n      return;\n    }\n    setExpandedEntityId(entityId);\n    if (relatedByEntity[entityId]) return;\n    setRelatedLoading(entityId);\n    try {\n      const response = await fetchRelatedEntity(requestAccessToken, entityId);\n      if (requestAccessToken === currentAccessTokenRef.current) {\n        setRelatedByEntity((previous) => ({ ...previous, [entityId]: response.related }));\n      }\n    } catch {\n      if (requestAccessToken === currentAccessTokenRef.current) {\n        setRelatedByEntity((previous) => ({ ...previous, [entityId]: [] }));\n      }\n    } finally {\n      if (requestAccessToken === currentAccessTokenRef.current) setRelatedLoading(null);\n    }\n  }''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one source block, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Run secondary-auth RED-to-GREEN contract
        run: uv run --frozen python -m pytest -q tests/test_customer_master_translation_auth_gate_contract.py

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run focused Customer Master tests and lint
        working-directory: frontend
        run: |
          pnpm exec vitest run src/App.test.tsx src/components/ScreenTranslationGate.test.tsx
          pnpm exec eslint src/App.tsx

      - name: Commit clean product tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm .github/workflows/temporary-932-secondary-auth-repair.yml
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".github/workflows/temporary-932-secondary-auth-repair.yml frontend/src/App.tsx "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.tsx .github/workflows/temporary-932-secondary-auth-repair.yml
          git commit -m "fix(customer-master): invalidate stale auth projections"
          git push origin HEAD:automation/932-secondary-auth-repair-20260906
