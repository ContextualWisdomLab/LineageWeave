name: Temporary Vitest lock regeneration

on:
  push:
    branches:
      - fix/vitest-ghsa-82fw-gwwq-j7x9
    paths:
      - .github/workflows/automation-1046-regenerate-vitest-lock.yml

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/vitest-ghsa-82fw-gwwq-j7x9
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Enable pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          cd frontend
          pnpm --version
      - name: Regenerate and verify lock graph
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
          if grep -Eq '(^|[^0-9])vitest@4\.1\.10([^0-9]|$)|@vitest/mocker@4\.1\.10([^0-9]|$)' pnpm-lock.yaml; then
            echo 'Vulnerable Vitest 4.1.10 node remains in the generated graph.' >&2
            exit 1
          fi
          cd ..
          changed="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$changed"
          test -n "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^ M frontend/pnpm-lock\.yaml$' | grep -q .; then
            echo 'Unexpected generated-file delta; refusing to commit.' >&2
            exit 1
          fi
      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/pnpm-lock.yaml
          git commit -m 'fix(security): regenerate Vitest lock graph'
          git push origin HEAD:fix/vitest-ghsa-82fw-gwwq-j7x9
