name: automation-825-current-824-reconstruction-r12
on:
  push:
    branches: [automation/825-current-824-reconstruction-r12-20260907-1340]
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 3
      - name: Verify exact current parent and bounded harness ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1de5fc8344b5a5702b3fdebf98328e0686e53ea7"
          test "$(git rev-parse HEAD^^)" = "499d653ed6e9206249e3f3a07518ad3fc01f14bd"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
      - name: Install frontend lock
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          cd frontend
          pnpm install --frozen-lockfile
      - name: Apply regression and causal repair
        run: python .github/automation/825-r12.py
      - name: Diff integrity
        run: git diff --check
      - name: Focused UI and i18n GREEN
        working-directory: frontend
        run: |
          pnpm exec vitest run src/App.test.tsx -t "shows the grouping comparison strip and switches grouping on click"
          pnpm exec vitest run src/i18n.test.ts src/leftoverMapCoverage.test.ts
      - name: Frontend lint build Storybook GREEN
        working-directory: frontend
        run: pnpm run lint && pnpm run build && pnpm run build-storybook
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.28"
          enable-cache: false
      - name: Governance and release-identity GREEN
        run: uv run --frozen python -m pytest -q tests/test_adr_0290_governance.py tests/test_adr_0291_governance.py tests/test_adr_0292_governance.py tests/test_adr_0293_governance.py tests/test_adr_0294_governance.py tests/test_package_version.py
      - name: Emit workflow-free clean staging commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/automation-825-current-824-reconstruction-r12.yml
          rm .github/automation/825-r12.py
          rmdir .github/automation 2>/dev/null || true
          git diff --check
          git config user.name "LineageWeave automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(reports): restore incomplete-item comparison coverage (v2.51.0)"
          test -z "$(git ls-tree -r --name-only HEAD | grep -E '^\.github/(workflows/automation-825-current-824-reconstruction-r12\.yml|automation/825-r12\.py)$' || true)"
          git push origin HEAD:automation/825-current-824-reconstruction-r12-20260907-1340
          echo "CLEAN_STAGING_COMMIT=$(git rev-parse HEAD)"
          echo "CLEAN_STAGING_TREE=$(git rev-parse HEAD^{tree})"
