name: One-shot Ask Agent pending-evidence repair

on:
  push:
    branches:
      - feat/ask-agent-open-focus-event-lineage-v2160
    paths:
      - .github/workflows/repair-ask-agent-stale-answer-final.yml

permissions:
  contents: write

concurrency:
  group: repair-ask-agent-stale-answer-final
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact trigger head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Require the expected predecessor and branch
        env:
          EXPECTED_PARENT: 7d73439a6a81c17b9da3a306a3a7d70f4c65c1cb
          EXPECTED_BRANCH: feat/ask-agent-open-focus-event-lineage-v2160
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin refs/heads/$EXPECTED_BRANCH | cut -f1)" = "$GITHUB_SHA"

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Install committed frontend dependencies
        working-directory: frontend
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Add only the pending-answer regression
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("frontend/src/App.test.tsx")
          text = path.read_text(encoding="utf-8")

          option_anchor = "    deferMe?: boolean;\n"
          if text.count(option_anchor) != 1:
              raise SystemExit("Ask defer option anchor changed")
          text = text.replace(
              option_anchor,
              option_anchor + "    deferSecondAsk?: boolean;\n",
              1,
          )

          release_anchor = "    releaseMe: () => void;\n"
          if text.count(release_anchor) != 1:
              raise SystemExit("Ask release type anchor changed")
          text = text.replace(
              release_anchor,
              release_anchor + "    releaseSecondAsk: () => void;\n",
              1,
          )

          promise_anchor = "      : Promise.resolve();\n    let releaseGroupRelated = () => {};"
          if text.count(promise_anchor) != 1:
              raise SystemExit("Ask promise anchor changed")
          text = text.replace(
              promise_anchor,
              "      : Promise.resolve();\n"
              "    let releaseSecondAsk = () => {};\n"
              "    const secondAskReady = options?.deferSecondAsk\n"
              "      ? new Promise<void>((resolve) => {\n"
              "          releaseSecondAsk = resolve;\n"
              "        })\n"
              "      : Promise.resolve();\n"
              "    let askRequestCount = 0;\n"
              "    let releaseGroupRelated = () => {};",
              1,
          )

          route_start = text.index(
              '      if (url.endsWith("/api/ask") && method === "POST") {'
          )
          route_end = text.index(
              '      if (url.endsWith("/api/customer-master")',
              route_start,
          )
          route = text[route_start:route_end]
          route_anchor = "        return Promise.resolve(\n"
          if route.count(route_anchor) != 1:
              raise SystemExit("Ask route promise anchor changed")
          route = route.replace(
              route_anchor,
              "        askRequestCount += 1;\n"
              "        const ready =\n"
              "          options?.deferSecondAsk && askRequestCount === 2\n"
              "            ? secondAskReady\n"
              "            : Promise.resolve();\n"
              "        return ready.then(() =>\n",
              1,
          )
          text = text[:route_start] + route + text[route_end:]

          assignment = re.compile(r"return Object\.assign\(fetchMock, \{([^}]*)\}\);")
          match = assignment.search(text)
          if match is None or "releaseMe" not in match.group(1):
              raise SystemExit("Ask stub return assignment changed")
          members = [part.strip() for part in match.group(1).split(",") if part.strip()]
          if "releaseSecondAsk" in members:
              raise SystemExit("Ask regression already exists")
          members.insert(members.index("releaseMe") + 1, "releaseSecondAsk")
          text = text[:match.start()] + (
              "return Object.assign(fetchMock, { " + ", ".join(members) + " });"
          ) + text[match.end():]

          test_anchor = '  it("opening an Ask Agent cited post focuses Event Lineage; a home list open does not", async () => {'
          if text.count(test_anchor) != 1:
              raise SystemExit("Ask Agent test anchor changed")
          regression = '''  it("hides previous Ask evidence while a new answer is pending", async () => {
            const fetchMock = stubBackend({ deferSecondAsk: true });
            render(<App />);

            await userEvent.click(await screen.findByRole("button", { name: "Ask Agent" }));
            const ask = await screen.findByRole("region", { name: "Ask Agent" });
            const question = within(ask).getByRole("textbox", { name: "Ask a question" });
            await userEvent.type(question, "Which project?");
            await userEvent.click(within(ask).getByRole("button", { name: "Ask" }));
            expect(
              await within(ask).findByText(
                "The cited project is supported by the stored semantic evidence.",
              ),
            ).toBeInTheDocument();
            expect(within(ask).getByLabelText("Next action")).toBeInTheDocument();

            await userEvent.clear(question);
            await userEvent.type(question, "Which person?");
            await userEvent.click(within(ask).getByRole("button", { name: "Ask" }));

            expect(within(ask).getByRole("button", { name: "Asking..." })).toBeDisabled();
            expect(
              within(ask).queryByText(
                "The cited project is supported by the stored semantic evidence.",
              ),
            ).not.toBeInTheDocument();
            expect(within(ask).queryByLabelText("Next action")).not.toBeInTheDocument();

            fetchMock.releaseSecondAsk();
            expect(
              await within(ask).findByText(
                "The cited project is supported by the stored semantic evidence.",
              ),
            ).toBeInTheDocument();
          });

'''
          path.write_text(text.replace(test_anchor, regression + test_anchor, 1), encoding="utf-8")
          PY
          git diff --check -- frontend/src/App.test.tsx

      - name: Verify RED reproduces stale evidence
        working-directory: frontend
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run src/App.test.tsx \
            -t "hides previous Ask evidence while a new answer is pending" \
            2>&1 | tee /tmp/ask-red.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Regression unexpectedly passed before the production fix" >&2
            exit 1
          fi
          grep -Eq "failed|FAIL" /tmp/ask-red.log

      - name: Clear superseded evidence when Ask begins
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/App.tsx")
          text = path.read_text(encoding="utf-8")
          panel_start = text.index("function AskAgentPanel({")
          panel_end = text.index("\n\nexport default function App", panel_start)
          block = text[panel_start:panel_end]
          old = "    setAsking(true);\n    setError(null);\n    try {"
          new = "    setAsking(true);\n    setError(null);\n    setAnswer(null);\n    try {"
          if block.count(old) != 1:
              raise SystemExit("Ask pending-state anchor changed")
          block = block.replace(old, new, 1)
          path.write_text(text[:panel_start] + block + text[panel_end:], encoding="utf-8")
          PY
          git diff --check -- frontend/src/App.tsx frontend/src/App.test.tsx

      - name: Verify GREEN and complete frontend
        working-directory: frontend
        run: |
          set -euo pipefail
          pnpm exec vitest run src/App.test.tsx \
            -t "hides previous Ask evidence while a new answer is pending"
          pnpm run lint
          pnpm run test
          pnpm run build
          pnpm run build-storybook

      - name: Publish exact tested repair and remove writer
        env:
          BRANCH_NAME: feat/ask-agent-open-focus-event-lineage-v2160
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$BRANCH_NAME | cut -f1)" = "$GITHUB_SHA"
          git rm .github/workflows/repair-ask-agent-stale-answer-final.yml
          git config user.name "CWL Buyer Surface Repair"
          git config user.email "actions@users.noreply.github.com"
          git add -- frontend/src/App.tsx frontend/src/App.test.tsx
          git diff --cached --check
          git commit -m "fix(ui): clear superseded Ask evidence"
          git push origin HEAD:$BRANCH_NAME
