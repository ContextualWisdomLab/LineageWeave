name: Refresh MCP dependency lock once

on:
  push:
    paths:
      - pyproject.toml
      - .github/workflows/mcp-lock-refresh.yml
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - pyproject.toml
      - uv.lock
      - backend/app/mcp_*.py
      - backend/app/global_ask.py
      - backend/app/global_ask_verification.py
      - lineageweave/post_chat.py
      - tests/test_mcp_*.py
      - tests/test_global_ask_external_verification.py
      - tests/test_post_chat_*.py
      - .github/workflows/mcp-lock-refresh.yml

concurrency:
  group: mcp-lock-refresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh-lock:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.repository_owner == 'ContextualWisdomLab' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Resolve only the declared dependency change
        run: uv lock

      - name: Remove the superseded verify-mode architecture caveat
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("ARCHITECTURE.md")
          text = path.read_text(encoding="utf-8")
          start_marker = "> **Known local-test-environment limitation:**"
          end_marker = "unaffected.\n"
          assert text.count(start_marker) == 1, "expected one stale verify-mode architecture block"
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          replacement = (
              "> **Contextual-orchestrator contract:** Post Ask and MCP Global Ask use the\n"
              "> currently supported `mode=\"conduct\"` path for verified multi-step\n"
              "> reasoning. Model-based verification requires fast-mlsirm in the same\n"
              "> contextual-orchestrator runtime and fails closed when that dependency or\n"
              "> its contract is unavailable. LineageWeave never falls back to a direct\n"
              "> provider or the rejected legacy `verify` mode.\n"
          )
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY

      - name: Verify the frozen backend environment and MCP regressions
        run: |
          uv sync --frozen --extra dev --extra backend
          uv run --frozen python -m pytest -q \
            tests/test_mcp_*.py \
            tests/test_global_ask_external_verification.py \
            tests/test_post_chat_*.py

      - name: Commit the regenerated lock and architecture contract
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock ARCHITECTURE.md
          if git diff --cached --quiet; then
            echo "lock and architecture already match the product contract"
            exit 0
          fi
          git commit -m "build: lock MCP runtime and conduct contract"
          git push origin "HEAD:${TARGET_BRANCH}"
