name: Refresh MCP dependency lock once

on:
  push:
    paths:
      - pyproject.toml
      - .github/workflows/mcp-lock-refresh.yml
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - pyproject.toml
      - uv.lock
      - backend/app/mcp_*.py
      - backend/app/global_ask.py
      - backend/app/global_ask_verification.py
      - lineageweave/post_chat.py
      - tests/test_mcp_*.py
      - tests/test_global_ask_external_verification.py
      - tests/test_post_chat_*.py
      - .github/workflows/mcp-lock-refresh.yml

concurrency:
  group: mcp-lock-refresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh-lock:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.repository_owner == 'ContextualWisdomLab' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Resolve only the declared dependency change
        run: uv lock

      - name: Verify the frozen backend environment and MCP regressions
        run: |
          uv sync --frozen --extra dev --extra backend
          uv run --frozen python -m pytest -q \
            tests/test_mcp_*.py \
            tests/test_global_ask_external_verification.py \
            tests/test_post_chat_*.py

      - name: Commit the regenerated lock and remove this one-shot workflow
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          rm .github/workflows/mcp-lock-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock .github/workflows/mcp-lock-refresh.yml
          git diff --cached --check
          git commit -m "build: lock MCP runtime"
          git push origin "HEAD:${TARGET_BRANCH}"
