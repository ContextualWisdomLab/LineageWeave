name: Localize PR 271 TEPP findings

on:
  push:
    branches:
      - feat/tepp-project-history-ask-v2180
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: localize-pr271-tepp-findings
  cancel-in-progress: false

jobs:
  red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact stacked head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: feat/tepp-project-history-ask-v2180
          fetch-depth: 0
          persist-credentials: true

      - name: Record input head
        run: git rev-parse HEAD > /tmp/pr271_findings_input_sha

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Reproduce the missing localized finding RED
        working-directory: frontend
        run: |
          set +e
          pnpm exec vitest run src/components/ProjectHistoryTimeline.finding.test.tsx \
            > /tmp/tepp-finding-red.log 2>&1
          exit_code=$?
          set -e
          cat /tmp/tepp-finding-red.log
          test "$exit_code" -ne 0
          grep -F "명시적인 사양 변경 이벤트가 현재 이벤트보다 앞섭니다" \
            /tmp/tepp-finding-red.log

      - name: Apply localized finding-code explanations
        run: python scripts/localize_tepp_finding_explanations.py

      - name: Verify focused GREEN and complete frontend
        working-directory: frontend
        run: |
          pnpm exec vitest run src/components/ProjectHistoryTimeline.finding.test.tsx
          pnpm run lint
          pnpm run test
          pnpm run build
          pnpm run build-storybook

      - name: Refuse a stale-head publication
        env:
          BRANCH_NAME: feat/tepp-project-history-ask-v2180
        run: |
          expected="$(cat /tmp/pr271_findings_input_sha)"
          remote="$(git ls-remote origin "refs/heads/${BRANCH_NAME}" | cut -f1)"
          test -n "$remote"
          test "$remote" = "$expected"

      - name: Commit verified finding localization
        env:
          BRANCH_NAME: feat/tepp-project-history-ask-v2180
        run: |
          rm -f scripts/localize_tepp_finding_explanations.py
          rm -f .github/workflows/localize-271-tepp-findings.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            frontend/src/i18n.ts \
            frontend/src/components/ProjectHistoryTimeline.tsx \
            frontend/src/components/ProjectHistoryTimeline.finding.test.tsx \
            CHANGELOG.d/2.18.0-tepp-project-history-ask.md \
            scripts/localize_tepp_finding_explanations.py \
            .github/workflows/localize-271-tepp-findings.yml
          git diff --cached --check
          git commit -m "feat(frontend): localize TEPP finding explanations"
          git push origin "HEAD:${BRANCH_NAME}"
