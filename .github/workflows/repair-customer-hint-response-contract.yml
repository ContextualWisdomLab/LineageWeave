name: Bounded customer hint response-contract repair

on:
  push:
    branches: [fix/customer-hint-resolution-ownership]
    paths:
      - .github/workflows/repair-customer-hint-response-contract.yml

permissions:
  contents: write

concurrency:
  group: repair-customer-hint-response-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: fix/customer-hint-resolution-ownership
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Install committed backend test environment
        run: uv sync --frozen --extra dev --extra backend

      - name: Materialize executable response-shape RED
        run: |
          cat > tests/test_customer_master_hint_response_contract.py <<'PY'
          """CI-runnable Customer Master hint response-shape contract."""

          from backend.app.main import _serialize_customer_hint


          _PROVENANCE = (
              "source_post.source_customer_code/source_post.source_customer_name/"
              "source_post_customer_resolution.resolved_corporate_entity_id"
          )


          def test_unresolved_customer_hint_keeps_explicit_resolution_shape() -> None:
              """Unresolved hints keep nullable resolution fields in the public contract."""
              row = {
                  "customer_code": "TEST-CUSTOMER-001",
                  "customer_name": None,
                  "post_count": 1,
                  "related_posts": '[{"post_id":"post-1","post_title":"Public post"}]',
                  "verification_status_code": None,
                  "resolved_corporate_entity_id": None,
                  "resolved_entity_name": None,
                  "verification_evidence_url": None,
              }

              assert _serialize_customer_hint(row) == {
                  "customer_code": "TEST-CUSTOMER-001",
                  "customer_name": None,
                  "post_count": 1,
                  "related_posts": [{"post_id": "post-1", "post_title": "Public post"}],
                  "resolution_status": "hint_only",
                  "resolved_corporate_entity_id": None,
                  "resolved_entity_name": None,
                  "verification_evidence_url": None,
                  "hint_trust": "normal",
                  "provenance": _PROVENANCE,
              }


          def test_resolved_customer_hint_serializes_one_coherent_resolution_row() -> None:
              """Resolved hints expose the selected resolution row without dropping evidence."""
              row = {
                  "customer_code": "HINT-CODE-001",
                  "customer_name": "Northridge Grid",
                  "post_count": 2,
                  "related_posts": [{"post_id": "post-2", "post_title": "Grid update"}],
                  "verification_status_code": "corroborated",
                  "resolved_corporate_entity_id": "corp-1",
                  "resolved_entity_name": "Northridge Grid",
                  "verification_evidence_url": "https://example.test/northridge-grid",
              }

              result = _serialize_customer_hint(row)

              assert result["resolution_status"] == "corroborated"
              assert result["resolved_corporate_entity_id"] == "corp-1"
              assert result["resolved_entity_name"] == "Northridge Grid"
              assert result["verification_evidence_url"] == "https://example.test/northridge-grid"
              assert result["provenance"] == _PROVENANCE
          PY

          set +e
          uv run --frozen python -m pytest -q tests/test_customer_master_hint_response_contract.py > /tmp/customer-hint-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/customer-hint-red.log
          if [ "$rc" -eq 0 ]; then
            echo "Expected RED did not reproduce: serializer contract unexpectedly already exists." >&2
            exit 1
          fi
          if ! grep -Eq '_serialize_customer_hint|cannot import name|ImportError' /tmp/customer-hint-red.log; then
            echo "RED failed for an unrelated reason." >&2
            exit 1
          fi

      - name: Apply minimal causal repair
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path("backend/app/main.py")
          main = main_path.read_text()
          if "def _serialize_customer_hint(" in main:
              raise SystemExit("serializer already exists; refuse overlapping writer")
          if "import json" not in main:
              raise SystemExit("main.py no longer imports json; inspect live head")

          anchor = '@app.get("/api/customer-master")\n'
          if main.count(anchor) != 1:
              raise SystemExit(f"unexpected Customer Master route anchor count: {main.count(anchor)}")

          helper = '''def _serialize_customer_hint(row: Any) -> dict[str, Any]:
              """Build the stable Customer Master hint response from one authorized read-model row."""
              related_posts = row["related_posts"]
              if isinstance(related_posts, str):
                  related_posts = json.loads(related_posts)
              return {
                  "customer_code": row["customer_code"],
                  "customer_name": row["customer_name"],
                  "post_count": row["post_count"],
                  "related_posts": related_posts or [],
                  "resolution_status": row["verification_status_code"] or "hint_only",
                  "resolved_corporate_entity_id": row["resolved_corporate_entity_id"],
                  "resolved_entity_name": row["resolved_entity_name"],
                  "verification_evidence_url": row["verification_evidence_url"],
                  "hint_trust": customer_hint_trust(row["customer_name"], row["customer_code"]),
                  "provenance": (
                      "source_post.source_customer_code/source_post.source_customer_name/"
                      "source_post_customer_resolution.resolved_corporate_entity_id"
                  ),
              }


          '''
          main = main.replace(anchor, helper + anchor, 1)

          start_marker = '        "source_customer_hints": [\n'
          end_marker = '        "source_author_hints": [\n'
          start = main.find(start_marker)
          if start < 0:
              raise SystemExit("source_customer_hints serializer block not found")
          end = main.find(end_marker, start)
          if end < 0:
              raise SystemExit("source_author_hints boundary not found")
          old_block = main[start:end]
          required_old_tokens = (
              '"resolution_status": row["verification_status_code"] or "hint_only"',
              '"resolved_corporate_entity_id": row["resolved_corporate_entity_id"]',
              '"verification_evidence_url": row["verification_evidence_url"]',
              'for row in source_customer_rows',
          )
          missing = [token for token in required_old_tokens if token not in old_block]
          if missing:
              raise SystemExit(f"live serializer block drifted; missing {missing}")
          replacement = (
              '        "source_customer_hints": [\n'
              '            _serialize_customer_hint(row) for row in source_customer_rows\n'
              '        ],\n'
          )
          main = main[:start] + replacement + main[end:]
          main_path.write_text(main)

          api_path = Path("backend/tests/test_api.py")
          api = api_path.read_text()
          function_marker = "def test_customer_master_returns_authorized_catalog_contract"
          fn_start = api.find(function_marker)
          if fn_start < 0:
              raise SystemExit("authenticated Customer Master contract function not found")
          fn_end = api.find("\ndef ", fn_start + len(function_marker))
          if fn_end < 0:
              fn_end = len(api)
          block = api[fn_start:fn_end]

          status_token = '"resolution_status": "hint_only",'
          provenance_token = (
              '"provenance": '
              '"source_post.source_customer_code/source_post.source_customer_name",'
          )
          if block.count(status_token) != 1:
              raise SystemExit(
                  f"authenticated status token count is {block.count(status_token)}, expected 1"
              )
          if block.count(provenance_token) != 1:
              raise SystemExit(
                  f"authenticated provenance token count is {block.count(provenance_token)}, expected 1"
              )
          if '"resolved_corporate_entity_id"' in block:
              raise SystemExit("authenticated response expectation already contains resolution fields")

          status_pos = block.index(status_token)
          status_line_start = block.rfind("\n", 0, status_pos) + 1
          indent = block[status_line_start:status_pos]
          status_replacement = (
              f'{indent}{status_token}\n'
              f'{indent}"resolved_corporate_entity_id": None,\n'
              f'{indent}"resolved_entity_name": None,\n'
              f'{indent}"verification_evidence_url": None,'
          )
          old_status_line = f"{indent}{status_token}"
          block = block.replace(old_status_line, status_replacement, 1)

          provenance_pos = block.index(provenance_token)
          provenance_line_start = block.rfind("\n", 0, provenance_pos) + 1
          provenance_indent = block[provenance_line_start:provenance_pos]
          old_provenance_line = f"{provenance_indent}{provenance_token}"
          provenance_replacement = (
              f'{provenance_indent}"provenance": (\n'
              f'{provenance_indent}    "source_post.source_customer_code/source_post.source_customer_name/"\n'
              f'{provenance_indent}    "source_post_customer_resolution.resolved_corporate_entity_id"\n'
              f'{provenance_indent}),'
          )
          block = block.replace(old_provenance_line, provenance_replacement, 1)
          api_path.write_text(api[:fn_start] + block + api[fn_end:])
          PY

      - name: Exact-head focused GREEN
        run: |
          uv run --frozen ruff check \
            backend/app/main.py \
            backend/tests/test_api.py \
            tests/test_customer_master_hint_response_contract.py
          uv run --frozen python -m pytest -q \
            tests/test_customer_master_hint_response_contract.py \
            tests/test_customer_hint_docstring_contract.py
          uv run --frozen python -m compileall -q backend/app/main.py tests/test_customer_master_hint_response_contract.py

      - name: Publish ordinary self-cleaning repair commit
        env:
          BRANCH: fix/customer-hint-resolution-ownership
        run: |
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | cut -f1)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "Branch moved during repair: remote=$remote_head workflow=$GITHUB_SHA" >&2
            exit 1
          fi
          git rm .github/workflows/repair-customer-hint-response-contract.yml
          git add backend/app/main.py backend/tests/test_api.py tests/test_customer_master_hint_response_contract.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(customer-master): lock resolved hint response contract"
          git push origin "HEAD:${BRANCH}"
