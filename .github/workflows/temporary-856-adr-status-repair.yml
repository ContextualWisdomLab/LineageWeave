name: Temporary 856 ADR status repair

on:
  push:
    branches:
      - "automation/856-adr-status-repair-20260906"

permissions:
  contents: write

concurrency:
  group: temporary-856-adr-status-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact staging branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: automation/856-adr-status-repair-20260906
          fetch-depth: 0

      - name: Verify exact product ancestor
        run: |
          git merge-base --is-ancestor 974109a055573e3534f4e653fc9929ffad1ac8d8 HEAD
          test "$(git diff --name-only 974109a055573e3534f4e653fc9929ffad1ac8d8..HEAD)" = ".github/workflows/temporary-856-adr-status-repair.yml"

      - name: Apply causal ADR status repair
        shell: python
        run: |
          from pathlib import Path
          path = Path("docs/adr/0316-leftover-map-compare-plot-observed.md")
          text = path.read_text(encoding="utf-8")
          old = "**Decision status:** Accepted"
          new = "**Decision status:** Proposed"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one Accepted status, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Verify governing RED turns GREEN
        run: |
          python -m pytest -q tests/test_adr_0316_governance.py
          git diff --check
          test "$(git diff --name-only 974109a055573e3534f4e653fc9929ffad1ac8d8 -- docs/adr/0316-leftover-map-compare-plot-observed.md)" = "docs/adr/0316-leftover-map-compare-plot-observed.md"

      - name: Commit clean product tree
        run: |
          rm .github/workflows/temporary-856-adr-status-repair.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(adr): keep 0316 proposed while draft"
          git push origin HEAD:automation/856-adr-status-repair-20260906
