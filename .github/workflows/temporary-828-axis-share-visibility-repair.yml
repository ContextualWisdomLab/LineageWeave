name: Temporary 828 axis-share visibility repair

on:
  push:
    branches:
      - "automation/828-axis-share-visibility-repair-20260906"

permissions:
  contents: write

concurrency:
  group: temporary-828-axis-share-visibility-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: automation/828-axis-share-visibility-repair-20260906
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Install committed backend test dependencies
        run: uv sync --frozen --extra dev --extra backend

      - name: Apply exact mixed-visibility fail-closed repair
        shell: python
        run: |
          from pathlib import Path

          path = Path("backend/app/main.py")
          text = path.read_text(encoding="utf-8")
          old = '''        visible.append(
            {
                **row,
                "members": [],
                "leftover_pairs": leftover_pairs,
                "post_count": len(members),
            }
        )'''
          new = '''        visible.append(
            {
                **row,
                "members": [],
                "leftover_pairs": leftover_pairs,
                "leftover_map_axes": (
                    row.get("leftover_map_axes", [])
                    if len(members) == len(row["members"])
                    else []
                ),
                "post_count": len(members),
            }
        )'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one compare response block, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")

      - name: Move axis-share decision to unclaimed Proposed ADR 0367
        shell: python
        run: |
          from pathlib import Path

          old_adr = Path("docs/adr/0293-leftover-map-compare-axis-share.md")
          new_adr = Path("docs/adr/0367-leftover-map-compare-axis-share.md")
          if not old_adr.exists() or new_adr.exists():
              raise SystemExit("expected exactly the colliding ADR 0293 source and no ADR 0367 target")
          content = old_adr.read_text(encoding="utf-8")
          if not content.startswith("# ADR 0293 —"):
              raise SystemExit("unexpected axis-share ADR header")
          if content.count("**Decision status:** Accepted") != 1:
              raise SystemExit("expected one premature Accepted status")
          content = content.replace("# ADR 0293 —", "# ADR 0367 —", 1)
          content = content.replace("**Decision status:** Accepted", "**Decision status:** Proposed", 1)
          content = content.replace("ADR 0293", "ADR 0367")
          new_adr.write_text(content, encoding="utf-8")
          old_adr.unlink()

          reference_files = [
              Path("AGENTS.md"),
              Path("ARCHITECTURE.md"),
              Path("CHANGELOG.d/2.50.0-leftover-map-compare-axis-share.md"),
              Path("CHANGELOG.md"),
              Path("docs/product-technical-gap-baseline.md"),
              Path("docs/storybook-inventory.md"),
          ]
          for path in reference_files:
              text = path.read_text(encoding="utf-8")
              text = text.replace("0293-leftover-map-compare-axis-share", "0367-leftover-map-compare-axis-share")
              text = text.replace("ADR 0293", "ADR 0367")
              path.write_text(text, encoding="utf-8")

          claude = Path("CLAUDE.md")
          text = claude.read_text(encoding="utf-8")
          marker = "/ 0293), occupational construct search"
          if text.count(marker) != 1:
              raise SystemExit(f"expected one CLAUDE numeric authority marker, found {text.count(marker)}")
          claude.write_text(text.replace(marker, "/ 0367), occupational construct search"), encoding="utf-8")

          excluded = {Path("tests/test_leftover_map_axis_share_adr_authority.py")}
          leftovers = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or path in excluded or ".git" in path.parts or ".venv" in path.parts:
                  continue
              if path.suffix.lower() not in {".md", ".py", ".ts", ".tsx", ".json", ".toml"}:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if "0293-leftover-map-compare-axis-share" in text:
                  leftovers.append(f"{path}: stale axis-share ADR path")
          if leftovers:
              raise SystemExit("\n".join(leftovers))

      - name: Run RED-to-GREEN contracts
        run: |
          uv run --frozen python -m pytest -q \
            tests/test_compare_axis_share_visibility.py \
            tests/test_leftover_map_axis_share_adr_authority.py

      - name: Check changed source
        run: |
          uv run --frozen ruff check \
            backend/app/main.py \
            tests/test_compare_axis_share_visibility.py \
            tests/test_leftover_map_axis_share_adr_authority.py
          git diff --check

      - name: Commit clean product tree
        run: |
          rm .github/workflows/temporary-828-axis-share-visibility-repair.yml
          test ! -e docs/adr/0293-leftover-map-compare-axis-share.md
          test -e docs/adr/0367-leftover-map-compare-axis-share.md
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(reports): repair axis-share authority and visibility"
          git push origin HEAD:automation/828-axis-share-visibility-repair-20260906
