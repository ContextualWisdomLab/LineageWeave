name: Temporary 828 axis-share visibility repair

on:
  push:
    branches:
      - "automation/828-axis-share-visibility-repair-20260906"

permissions:
  contents: write

concurrency:
  group: temporary-828-axis-share-visibility-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: automation/828-axis-share-visibility-repair-20260906
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Install committed backend test dependencies
        run: uv sync --frozen --extra dev --extra backend

      - name: Apply exact mixed-visibility fail-closed repair
        shell: python
        run: |
          from pathlib import Path

          path = Path("backend/app/main.py")
          text = path.read_text(encoding="utf-8")
          old = '''        visible.append(
              {
                  **row,
                  "members": [],
                  "leftover_pairs": leftover_pairs,
                  "post_count": len(members),
              }
          )'''
          new = '''        visible.append(
              {
                  **row,
                  "members": [],
                  "leftover_pairs": leftover_pairs,
                  "leftover_map_axes": (
                      row.get("leftover_map_axes", [])
                      if len(members) == len(row["members"])
                      else []
                  ),
                  "post_count": len(members),
              }
          )'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one compare response block, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")

      - name: Run visibility RED-to-GREEN contract
        run: uv run --frozen python -m pytest -q tests/test_compare_axis_share_visibility.py

      - name: Check changed source
        run: |
          uv run --frozen ruff check backend/app/main.py tests/test_compare_axis_share_visibility.py
          git diff --check

      - name: Commit clean product tree
        run: |
          rm .github/workflows/temporary-828-axis-share-visibility-repair.yml
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".github/workflows/temporary-828-axis-share-visibility-repair.yml backend/app/main.py "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/main.py .github/workflows/temporary-828-axis-share-visibility-repair.yml
          git commit -m "fix(reports): fail closed mixed-visibility axis share"
          git push origin HEAD:automation/828-axis-share-visibility-repair-20260906
