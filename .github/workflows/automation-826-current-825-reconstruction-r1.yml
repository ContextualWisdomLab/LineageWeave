name: automation-826-current-825-reconstruction-r1
on:
  push:
    branches: [automation/826-current-825-reconstruction-r1-20260907-1350]
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 10
      - name: Verify exact #825 and bounded harness ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b73b10e3079e77f3e62235b2b709dc8a3f450292 HEAD
          unexpected="$(git diff --name-only b73b10e3079e77f3e62235b2b709dc8a3f450292..HEAD | grep -Ev '^\.github/(automation/826-r1\.py|workflows/automation-826-current-825-reconstruction-r1\.yml)$' || true)"
          test -z "$unexpected"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
      - name: Install frozen frontend graph
        run: corepack enable && cd frontend && pnpm install --frozen-lockfile
      - name: RED historical visual badge is suppressed by explicit button aria-label
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          def one(path,old,new):
              p=Path(path); text=p.read_text(); c=text.count(old)
              if c!=1: raise SystemExit(f'{path}: anchor count={c}: {old[:100]!r}')
              p.write_text(text.replace(old,new,1))
          one('frontend/src/leftoverMapReconstruction.ts','export const LEFTOVER_MAP_RECONSTRUCTION_ACTION =\n  "Leftover map reconstructs R̂ {value} after IRT main effects. Open this post to read {criterion}.";\n','export const LEFTOVER_MAP_RECONSTRUCTION_ACTION =\n  "Leftover map reconstructs R̂ {value} after IRT main effects. Open this post to read {criterion}.";\n\nexport const LEFTOVER_MAP_COMPARE_RECONSTRUCTION_LABEL =\n  "Leftover map comparison reconstruction";\n')
          one('frontend/src/App.tsx','import "./App.css";\n','import { formatLeftoverMapReconstruction, LEFTOVER_MAP_COMPARE_RECONSTRUCTION_LABEL } from "./leftoverMapReconstruction";\nimport "./App.css";\n')
          one('frontend/src/App.tsx','                    const criterion = criterionShortLabel(pair.criterion_code);\n                    return (\n','                    const criterion = criterionShortLabel(pair.criterion_code);\n                    const reconstruction = formatLeftoverMapReconstruction(pair.leftover_map_reconstruction);\n                    return (\n')
          one('frontend/src/App.tsx','                          <span className="post-badge">d {pair.leftover_distance.toFixed(2)}</span>\n','                          <span className="post-badge">d {pair.leftover_distance.toFixed(2)}</span>\n                          {reconstruction ? (<span className="post-badge" aria-label={t(LEFTOVER_MAP_COMPARE_RECONSTRUCTION_LABEL)}>{reconstruction}</span>) : null}\n')
          fixture_old='''                    post_id: "post-1",\n                    post_title: "Public post",\n                    criterion_code: "sales_lead_specificity",\n                    leftover_distance: 0.12,\n                    leftover_residual: 0.4,\n'''
          p=Path('frontend/src/App.test.tsx'); text=p.read_text(); c=text.count(fixture_old)
          if c < 1: raise SystemExit('comparison fixture missing')
          p.write_text(text.replace(fixture_old,fixture_old+'                    leftover_map_reconstruction: 0.248,\n'))
          one('frontend/src/App.test.tsx','    ).toHaveTextContent("Closest leftover: Public post · sales-lead");\n','    ).toHaveTextContent("Closest leftover: Public post · sales-lead");\n    expect(screen.getByRole("button", { name: /open leftover closest pair from comparison: public post.*R̂ \\+0\\.25/i })).toBeInTheDocument();\n')
          PY
          cd frontend
          set +e
          pnpm exec vitest run src/App.test.tsx -t "shows the grouping comparison strip and switches grouping on click" >/tmp/826-red.log 2>&1
          status=$?
          set -e
          cat /tmp/826-red.log
          test "$status" -ne 0
          grep -F "Unable to find an accessible element with the role \"button\"" /tmp/826-red.log
          cd ..
          git reset --hard HEAD
      - name: Apply causal reconstruction and accessibility repair
        run: python .github/automation/826-r1.py
      - name: Diff integrity
        run: git diff --check
      - name: Focused UI and i18n GREEN
        working-directory: frontend
        run: pnpm exec vitest run src/App.test.tsx -t "shows the grouping comparison strip and switches grouping on click" && pnpm exec vitest run src/i18n.test.ts src/leftoverMapReconstruction.test.ts
      - name: Frontend lint build Storybook GREEN
        working-directory: frontend
        run: pnpm run lint && pnpm run build && pnpm run build-storybook
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.28"
          enable-cache: false
      - name: Install frozen dev backend graph
        run: uv sync --frozen --extra dev --extra backend
      - name: Governance release identity GREEN
        run: uv run --frozen python -m pytest -q tests/test_compare_coverage_visibility.py tests/test_adr_0294_governance.py tests/test_adr_0295_governance.py tests/test_package_version.py
      - name: Emit workflow-free clean staging commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/automation-826-current-825-reconstruction-r1.yml
          rm .github/automation/826-r1.py
          rmdir .github/automation 2>/dev/null || true
          git diff --check
          git config user.name "LineageWeave automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(reports): reconstruct comparison R-hat accessibly (v2.52.0)"
          test -z "$(git ls-tree -r --name-only HEAD | grep -E '^\.github/(workflows/automation-826-current-825-reconstruction-r1\.yml|automation/826-r1\.py)$' || true)"
          git push origin HEAD:automation/826-current-825-reconstruction-r1-20260907-1350
          echo "CLEAN_STAGING_COMMIT=$(git rev-parse HEAD)"
          echo "CLEAN_STAGING_TREE=$(git rev-parse HEAD^{tree})"
