name: Temporary #831 nonfinite cross-share repair

on:
  push:
    branches: [feat/leftover-map-compare-cross-share-v2530]
    paths:
      - .github/workflows/automation-831-nonfinite-cross-share-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          fetch-depth: 4
          persist-credentials: true

      - name: Verify single-writer staging ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "e6c17e23ce36b11c1a0c2c019bdb9cdb12cd8413"
          test "$(git rev-parse HEAD^^)" = "071fe46d7decacbc058c43f3b0c53cf590d5f84c"
          test "$(git rev-parse HEAD^^^)" = "ee88c921b17632523db7d413291c262abc909f2a"
          test "$(git diff --name-only ee88c921b17632523db7d413291c262abc909f2a HEAD)" = ".github/workflows/automation-831-nonfinite-cross-share-repair.yml"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Select pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Install backend dependencies
        shell: bash
        run: uv sync --frozen --extra dev --extra backend

      - name: Prove realistic RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          uv run --frozen python -m pytest -q backend/tests/test_period_comparison_cross_share.py > /tmp/red.log 2>&1
          rc=$?
          set -e
          cat /tmp/red.log
          test "$rc" -ne 0
          grep -F 'test_period_comparison_transports_persisted_cross_share' /tmp/red.log
          grep -F 'At index 4 diff' /tmp/red.log

      - name: Apply minimum causal repair and rendered regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path("backend/app/report_ingestion.py")
          text = source.read_text()
          old_import = "import asyncio\nimport re\n"
          assert text.count(old_import) == 1
          text = text.replace(old_import, "import asyncio\nimport math\nimport re\n", 1)

          anchor = '_SOURCE_CONTEXT_PRESENT_SQL = source_context_present_sql("p")\n\n'
          assert text.count(anchor) == 1
          helper = '''_SOURCE_CONTEXT_PRESENT_SQL = source_context_present_sql("p")\n\n\ndef _finite_float_or_none(value: Any) -> float | None:\n    """Return a strict-JSON finite float for an optional persisted numeric."""\n\n    if value is None:\n        return None\n    result = float(value)\n    return result if math.isfinite(result) else None\n\n'''
          text = text.replace(anchor, helper, 1)

          old_cross = '''                        "leftover_map_cross_share": (\n                            None\n                            if pair["leftover_map_cross_share"] is None\n                            else float(pair["leftover_map_cross_share"])\n                        ),\n'''
          new_cross = '''                        "leftover_map_cross_share": _finite_float_or_none(\n                            pair["leftover_map_cross_share"]\n                        ),\n'''
          assert text.count(old_cross) == 1
          text = text.replace(old_cross, new_cross, 1)
          source.write_text(text)

          app_test = Path("frontend/src/App.test.tsx")
          app_text = app_test.read_text()
          needle = '    expect(unexplainedSharePair).toHaveTextContent("U²/R² 0.02");\n'
          assert app_text.count(needle) == 1
          rendered_regression = needle + '''    const comparisonCrossSharePair = screen.getByRole("button", {\n      name: /open leftover farthest pair from comparison: specification revision requested.*2R̂U\\/R² -0\\.24/i,\n    });\n    expect(comparisonCrossSharePair).toHaveTextContent("2R̂U/R² -0.24");\n    expect(within(comparisonCrossSharePair).getByText("2R̂U/R² -0.24")).toHaveAttribute(\n      "aria-hidden",\n      "true",\n    );\n'''
          app_text = app_text.replace(needle, rendered_regression, 1)
          app_test.write_text(app_text)
          PY

      - name: Verify backend GREEN
        shell: bash
        run: uv run --frozen python -m pytest -q backend/tests/test_period_comparison_cross_share.py

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Enable Corepack and install frontend
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          cd frontend
          pnpm install --frozen-lockfile

      - name: Verify rendered accessibility GREEN
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run src/App.test.tsx
          pnpm run lint

      - name: Publish workflow-free causal child
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/automation-831-nonfinite-cross-share-repair.yml
          git diff --check
          git status --short
          git config user.name "LineageWeave hourly maintainer"
          git config user.email "8172694+seonghobae@users.noreply.github.com"
          git add backend/app/report_ingestion.py backend/tests/test_period_comparison_cross_share.py frontend/src/App.test.tsx .github/workflows/automation-831-nonfinite-cross-share-repair.yml
          git commit -m "fix(reports): normalize nonfinite comparison cross share"
          git push origin HEAD:feat/leftover-map-compare-cross-share-v2530
