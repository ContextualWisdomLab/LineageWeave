name: automation-830-current-829-reconstruction-r3
on:
  push:
    branches: [automation/830-current-829-reconstruction-r3-20260907-2043]
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PARENT: 0e4fd5815686120ec66203cb6848834b56bdf289
      OLD_HEAD: ef5fcf63b6bcc2f6b451cb22b277116fb10fe138
      FEATURE_PARENT: e79137611f0d3041ad836c21e49a95bf7ef1001e
      PRODUCT_BRANCH: feat/leftover-map-compare-axis-singular-v2510
      LINEAGEWEAVE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout exact reconstruction lane
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact parent and live product authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PARENT"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/automation-830-current-829-reconstruction-r3.yml"
          test "$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | cut -f1)" = "$OLD_HEAD"
          git fetch origin "$PARENT" "$OLD_HEAD" "$FEATURE_PARENT"
          test "$(git rev-parse "$OLD_HEAD^")" = "$FEATURE_PARENT"

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"

      - name: Install frozen frontend graph
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          cd frontend
          pnpm install --frozen-lockfile

      - name: Realistic RED on exact #829
        shell: bash
        run: |
          set -euo pipefail
          cat > frontend/src/automation830AxisSingular.red.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { leftoverMapCompareAxisSingular } from "./leftoverMapCompareAxis";

          describe("serialized grouping comparison axis singular value", () => {
            it("preserves persisted zero and rejects negative singular values", () => {
              expect(
                leftoverMapCompareAxisSingular({ axis_index: 1, leftover_singular_value: 0 }),
              ).toEqual({ axis: 1, value: "0.00" });
              expect(
                leftoverMapCompareAxisSingular({ axis_index: 1, leftover_singular_value: -0.01 }),
              ).toBeNull();
            });
          });
          EOF
          set +e
          (cd frontend && pnpm exec vitest run src/automation830AxisSingular.red.test.ts) > /tmp/830-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/830-red.log
          rm frontend/src/automation830AxisSingular.red.test.ts
          if [ "$rc" -eq 0 ]; then
            echo "Expected exact #829 to RED before #830 singular-value reconstruction" >&2
            exit 41
          fi
          echo "Expected RED observed with exit=$rc"

      - name: Reconstruct only current-compatible #830 product delta
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B candidate "$PARENT"

          git diff --binary "$FEATURE_PARENT" "$OLD_HEAD" -- \
            backend/tests/test_api.py \
            frontend/src/App.test.tsx \
            frontend/src/App.tsx \
            > /tmp/830-clean.patch
          git apply --3way --index /tmp/830-clean.patch

          git checkout "$OLD_HEAD" -- frontend/src/leftoverMapCompareAxis.test.ts

          cat > frontend/src/leftoverMapCompareAxis.ts <<'EOF'
          /** Caption persisted leftover-map axis share and singular values on the grouping comparison strip. */

          import type { LeftoverMapAxis } from "./api";

          export const LEFTOVER_MAP_COMPARE_AXIS_SHARE_LABEL = "Leftover map comparison axis share";

          export const LEFTOVER_MAP_COMPARE_AXIS_SHARE = "leftover map comparison axis {axis} {share}%";

          export const LEFTOVER_MAP_LIST_AXIS_SHARE = "leftover axis {axis} {share}%";

          export const LEFTOVER_MAP_PLOT_AXIS_SHARE = "leftover-map axis {axis} ({share}%)";

          export const LEFTOVER_MAP_COMPARE_AXIS_SINGULAR_LABEL = "Leftover map comparison axis singular";

          export const LEFTOVER_MAP_COMPARE_AXIS_SINGULAR = "leftover map comparison axis {axis} σ {value}";

          export const LEFTOVER_MAP_LIST_AXIS_SINGULAR = "leftover axis {axis} σ {value} {share}%";

          export const LEFTOVER_MAP_PLOT_AXIS_SINGULAR = "leftover-map axis {axis} σ {value}";

          export type LeftoverMapCompareAxisShare = {
            axis: number;
            share: string;
          };

          export type LeftoverMapCompareAxisSingular = {
            axis: number;
            value: string;
          };

          type LeftoverMapCompareAxisSingularInput =
            Pick<LeftoverMapAxis, "axis_index"> &
            Partial<Pick<LeftoverMapAxis, "leftover_singular_value">>;

          export function leftoverMapCompareAxisShare(
            axis: Pick<LeftoverMapAxis, "axis_index" | "leftover_share"> | null | undefined,
          ): LeftoverMapCompareAxisShare | null {
            if (axis == null) {
              return null;
            }
            if (!Number.isInteger(axis.axis_index) || axis.axis_index < 1) {
              return null;
            }
            if (axis.leftover_share == null || !Number.isFinite(axis.leftover_share)) {
              return null;
            }
            return {
              axis: axis.axis_index,
              share: (axis.leftover_share * 100).toFixed(0),
            };
          }

          /**
           * Format the canonical persisted singular value for one comparison axis.
           *
           * The persisted singular field is optional at the read boundary. This
           * deliberately does not derive a singular value from share, pair count,
           * marker count, rank, distance, or coverage. Missing/invalid persisted
           * values are omitted so the UI cannot invent psychometric output.
           */
          export function leftoverMapCompareAxisSingular(
            axis: LeftoverMapCompareAxisSingularInput | null | undefined,
          ): LeftoverMapCompareAxisSingular | null {
            if (axis == null) {
              return null;
            }
            if (!Number.isInteger(axis.axis_index) || axis.axis_index < 1) {
              return null;
            }
            if (
              axis.leftover_singular_value == null ||
              !Number.isFinite(axis.leftover_singular_value) ||
              axis.leftover_singular_value < 0
            ) {
              return null;
            }
            return {
              axis: axis.axis_index,
              value: axis.leftover_singular_value.toFixed(2),
            };
          }
          EOF
          git add frontend/src/leftoverMapCompareAxis.ts frontend/src/leftoverMapCompareAxis.test.ts

          expected=$(cat <<'EOF'
          backend/tests/test_api.py
          frontend/src/App.test.tsx
          frontend/src/App.tsx
          frontend/src/leftoverMapCompareAxis.test.ts
          frontend/src/leftoverMapCompareAxis.ts
          EOF
          )
          actual=$(git diff --cached --name-only | sort)
          printf 'EXPECTED_FILES\n%s\nACTUAL_FILES\n%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
          test -z "$(git diff --name-only)"

      - name: Focused GREEN for persisted singular-value contract
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          pnpm exec vitest run src/leftoverMapCompareAxis.test.ts src/App.test.tsx
          pnpm exec oxlint src/leftoverMapCompareAxis.ts src/leftoverMapCompareAxis.test.ts src/App.tsx src/App.test.tsx

      - name: Full frontend GREEN
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          pnpm run lint
          pnpm run test
          pnpm run build
          pnpm run build-storybook

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Select pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Install committed backend graph
        shell: bash
        run: uv sync --frozen --extra dev --extra backend

      - name: Full PostgreSQL-backed GREEN
        shell: bash
        run: uv run --frozen python -m pytest -q

      - name: Build exact convergence commit and promote non-force
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | cut -f1)" = "$OLD_HEAD"
          test -z "$(git diff --name-only)"
          tree=$(git write-tree)
          git config user.name "LineageWeave automation"
          git config user.email "lineageweave-automation@users.noreply.github.com"
          commit=$(printf '%s\n\n%s\n' \
            'feat(reports): reconstruct grouping comparison axis singular value on current stack' \
            'Preserve the valid historical #830 delta on exact #829; consume only persisted singular values, accept the persisted field as optional at the read boundary, and keep share/singular omission independent.' \
            | git commit-tree "$tree" -p "$OLD_HEAD" -p "$PARENT")
          test "$(git rev-parse "$commit^1")" = "$OLD_HEAD"
          test "$(git rev-parse "$commit^2")" = "$PARENT"
          expected=$(cat <<'EOF'
          backend/tests/test_api.py
          frontend/src/App.test.tsx
          frontend/src/App.tsx
          frontend/src/leftoverMapCompareAxis.test.ts
          frontend/src/leftoverMapCompareAxis.ts
          EOF
          )
          actual=$(git diff --name-only "$PARENT" "$commit" | sort)
          test "$actual" = "$expected"
          echo "PRODUCT_COMMIT=$commit"
          echo "PRODUCT_TREE=$tree"
          git push origin "$commit:refs/heads/$PRODUCT_BRANCH"

      - name: Remove purpose-complete workflow from automation branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B cleanup "$GITHUB_SHA"
          git rm .github/workflows/automation-830-current-829-reconstruction-r3.yml
          git commit -m "chore: remove completed #830 reconstruction workflow"
          git push origin "HEAD:refs/heads/automation/830-current-829-reconstruction-r3-20260907-2043"
