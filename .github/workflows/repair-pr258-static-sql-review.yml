name: Repair PR 258 static SQL review findings once

on:
  push:
    branches:
      - "feat/analysis-run-name-evidence-lineage"
    paths:
      - ".github/workflows/repair-pr258-static-sql-review.yml"

permissions:
  contents: write

concurrency:
  group: repair-pr258-static-sql-review
  cancel-in-progress: false

jobs:
  repair:
    name: Prove RED, remove dynamic statement construction, and verify GREEN
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LINEAGEWEAVE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: feat/analysis-run-name-evidence-lineage
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Install frozen dependencies
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          uv sync --frozen --extra dev --extra backend

      - name: Prove review contracts are RED on the unmodified product tree
        shell: bash
        run: |
          set +e
          uv run --frozen python -m pytest -q tests/test_static_sql_review_contracts.py > /tmp/pr258-red.log 2>&1
          status=$?
          set -e
          cat /tmp/pr258-red.log
          test "$status" -ne 0
          grep -q "test_static_sql_review_contracts.py" /tmp/pr258-red.log

      - name: Apply the narrow production repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path


          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected one replacement in {path}: {old[:80]!r}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")


          def replace_section(path: str, start_marker: str, end_marker: str, replacement: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f"start marker not found in {path}: {start_marker!r}")
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f"end marker not found in {path}: {end_marker!r}")
              file_path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")


          replace_once(
              "lineageweave/post_structure.py",
              '''    def infer(
                  self, post_title: str, units: list[dict[str, object]]
              ) -> tuple[StructureDecision, ...]: ...
          ''',
              '''    def infer(
                  self, post_title: str, units: list[dict[str, object]]
              ) -> tuple[StructureDecision, ...]:
                  """Infer one explicit structure decision per supplied unit."""
                  raise NotImplementedError
          ''',
          )

          replace_once(
              "backend/app/demo_scope.py",
              '''from .post_eligibility import source_context_present_sql
          ''',
              '''from .post_eligibility import source_context_present_sql


          _HAS_REAL_SOURCE_CONTEXT_QUERY = """
          select exists (
              select 1
                from source_post
               where (visibility_code = 'public'
                      or corporate_entity_id = any($1::uuid[]))
                 and ({source_context_sql})
          )
          """.format(source_context_sql=source_context_present_sql("source_post"))

          _FETCH_DEMO_CORPORATE_ENTITY_IDS_QUERY = """
          select entity.corporate_entity_id
            from corporate_entity entity
           where entity.corporate_entity_code like 'DEMO-%'
             and not exists (
                 select 1
                   from source_post real_post
                  where real_post.corporate_entity_id = entity.corporate_entity_id
                    and ({source_context_sql})
             )
          """.format(source_context_sql=source_context_present_sql("real_post"))
          ''',
          )
          replace_section(
              "backend/app/demo_scope.py",
              "async def has_real_source_context(",
              "async def fetch_demo_corporate_entity_ids(",
              '''async def has_real_source_context(
              conn: asyncpg.Connection, corporate_entity_ids: list[str]
          ) -> bool:
              """Return whether the account can see imported source evidence."""
              return bool(
                  await conn.fetchval(
                      _HAS_REAL_SOURCE_CONTEXT_QUERY,
                      list(corporate_entity_ids),
                  )
              )


          ''',
          )
          replace_section(
              "backend/app/demo_scope.py",
              "async def fetch_demo_corporate_entity_ids(",
              "    return {str(row[\"corporate_entity_id\"]) for row in rows}",
              '''async def fetch_demo_corporate_entity_ids(conn: asyncpg.Connection) -> set[str]:
              """Return synthetic-only Demo entity IDs, excluding imported entities."""
              rows = await conn.fetch(_FETCH_DEMO_CORPORATE_ENTITY_IDS_QUERY)
          ''',
          )

          relationship_query = '''
          _RELATIONSHIP_NETWORK_QUERY = f"""
          with scoped as (
              select counterparty.counterparty_entity_name,
                     counterparty.relationship_type_code,
                     lookup.lookup_label as relationship_label
                from post_counterparty_entity counterparty
                join source_post post on post.post_id = counterparty.post_id
                join common_lookup_value lookup
                  on lookup.lookup_code = counterparty.relationship_type_code
               where (post.visibility_code = 'public' or post.corporate_entity_id = any($1::uuid[]))
                 and {SOURCE_POST_ELIGIBILITY_SQL.format(alias='post')}
          ), grouped as (
              select counterparty_entity_name, relationship_type_code, relationship_label,
                     count(*) as post_count
                from scoped
               group by counterparty_entity_name, relationship_type_code, relationship_label
          ), entity_totals as (
              select counterparty_entity_name, sum(post_count) as total_post_count
                from grouped
               group by counterparty_entity_name
          ), top_entities as materialized (
              select counterparty_entity_name, total_post_count
                from entity_totals
               order by total_post_count desc, counterparty_entity_name
               limit {_RELATIONSHIP_NETWORK_LIMIT}
          )
          select top_entities.counterparty_entity_name, top_entities.total_post_count,
                 json_agg(
                     json_build_object(
                         'relationship_type_code', grouped.relationship_type_code,
                         'relationship_label', grouped.relationship_label,
                         'post_count', grouped.post_count
                     )
                     order by grouped.post_count desc, grouped.relationship_type_code
                 ) as relationships
            from top_entities
            join grouped on grouped.counterparty_entity_name = top_entities.counterparty_entity_name
           group by top_entities.counterparty_entity_name, top_entities.total_post_count
           order by top_entities.total_post_count desc, top_entities.counterparty_entity_name
          """
          '''
          replace_once(
              "backend/app/entity_relationship_ingestion.py",
              "_RELATIONSHIP_NETWORK_LIMIT = 100\n",
              "_RELATIONSHIP_NETWORK_LIMIT = 100\n" + relationship_query,
          )
          replace_section(
              "backend/app/entity_relationship_ingestion.py",
              "    # nosemgrep: python.lang.security.audit.sqli.asyncpg-sqli",
              '    candidate_rows = await conn.fetch("select corporate_entity_id, entity_name from corporate_entity")',
              '''    rows = await conn.fetch(
                  _RELATIONSHIP_NETWORK_QUERY,
                  list(corporate_entity_ids),
              )
          ''',
          )

          customer_query = '''
          _CUSTOMER_HINT_SAMPLE_QUERY = f"""
          select post_title, left(post_body, {_RAW_BODY_SQL_CAP}) as post_body
            from source_post
           where source_customer_code = $1
             and {SOURCE_POST_ELIGIBILITY_SQL.format(alias="source_post")}
           order by created_at desc
           limit {_SAMPLE_POST_LIMIT}
          """
          '''
          replace_once(
              "backend/app/customer_hint_ingestion.py",
              "_RAW_BODY_SQL_CAP = 20000\n",
              "_RAW_BODY_SQL_CAP = 20000\n" + customer_query,
          )
          replace_section(
              "backend/app/customer_hint_ingestion.py",
              "    # nosemgrep: python.lang.security.audit.sqli.asyncpg-sqli",
              "    if not rows:",
              '''    rows = await conn.fetch(_CUSTOMER_HINT_SAMPLE_QUERY, hint_code)
          ''',
          )
          replace_once(
              "backend/app/customer_hint_ingestion.py",
              '''        # nosemgrep: python.lang.security.audit.sqli.asyncpg-sqli -- The generated code is a bound value, not part of the SQL statement.
                  created = await conn.fetchrow(
          ''',
              '''        entity_code = f"HINT-{hint_code}"
                  created = await conn.fetchrow(
          ''',
          )
          replace_once(
              "backend/app/customer_hint_ingestion.py",
              '''            f"HINT-{hint_code}",
                      entity_name,
          ''',
              '''            entity_code,
                      entity_name,
          ''',
          )

          keyman_queries = '''
          _SELECT_POST_BY_ID_QUERY = f"""
          select post_id, post_title, post_body, author_account_id,
                 source_author_code, source_company_code,
                 source_customer_code, source_project_code,
                 source_sales_pool_code, source_process_unit_code
            from source_post post
           where post.post_id = $1
             and {SOURCE_POST_ELIGIBILITY_SQL.format(alias="post")}
          """

          _SELECT_POST_BATCH_QUERY = f"""
          select post_id, post_title, post_body, author_account_id,
                 source_author_code, source_company_code,
                 source_customer_code, source_project_code,
                 source_sales_pool_code, source_process_unit_code
            from source_post post
           where {SOURCE_POST_ELIGIBILITY_SQL.format(alias="post")}
             and not exists (
                 select 1 from post_person_mention mention
                  where mention.post_id = post.post_id
             )
           order by post.created_at, post.post_id
           limit $1::bigint
          """
          '''
          replace_once(
              "scripts/backfill_post_keymen.py",
              "from lineageweave.post_content_normalization import normalize_post_body\n",
              "from lineageweave.post_content_normalization import normalize_post_body\n" + keyman_queries,
          )
          replace_section(
              "scripts/backfill_post_keymen.py",
              "async def _select_posts(",
              "async def _run(",
              '''async def _select_posts(
              conn: asyncpg.Connection, *, limit: int, post_id: str | None
          ) -> list[asyncpg.Record]:
              """Select one explicit post or one bounded unprojected batch."""
              if post_id:
                  return list(await conn.fetch(_SELECT_POST_BY_ID_QUERY, post_id))
              return list(await conn.fetch(_SELECT_POST_BATCH_QUERY, limit))


          ''',
          )

          summary_queries = '''
          _POST_SELECTION_FROM_SQL = f"""
          select post.post_id, post.post_title, post.post_body, post.author_account_id,
                 author.display_name as author_name,
                 post.source_author_code, post.source_author_name,
                 post.source_company_code, post.source_company_name,
                 post.source_process_unit_code, post.source_process_unit_name,
                 post.source_sales_pool_code, post.source_sales_pool_name,
                 post.source_customer_code, post.source_customer_name,
                 post.source_project_code, post.source_project_name,
                 post.secondary_grouping_key as project_field,
                 customer.entity_name as customer_name,
                 coalesce(
                     (select array_agg(distinct affiliated.entity_name)
                        from account_affiliation affiliation
                        join corporate_entity affiliated
                          on affiliated.corporate_entity_id = affiliation.corporate_entity_id
                       where affiliation.user_account_id = post.author_account_id),
                     '{{}}'::text[]
                 ) as author_affiliations
            from source_post post
            left join user_account author
              on author.user_account_id = post.author_account_id
            left join corporate_entity customer
              on customer.corporate_entity_id = post.corporate_entity_id
          """

          _SELECT_POSTS_BY_ID_QUERY = f"""
          {{_POST_SELECTION_FROM_SQL}}
           where {SOURCE_POST_ELIGIBILITY_SQL.format(alias="post")}
             and post.post_id = any($1::uuid[])
           order by post.created_at, post.post_id
           limit $2::bigint
          """

          _SELECT_UNPROJECTED_POSTS_QUERY = f"""
          {{_POST_SELECTION_FROM_SQL}}
           where {SOURCE_POST_ELIGIBILITY_SQL.format(alias="post")}
             and nullif(btrim(post.source_project_code::text), '') is null
             and nullif(btrim(post.source_project_name::text), '') is null
             and not exists (
                 select 1 from post_project_mention mention
                  where mention.post_id = post.post_id
             )
           order by post.created_at, post.post_id
           limit $1::bigint
          """
          '''
          replace_once(
              "scripts/backfill_post_summaries.py",
              "from lineageweave.semantic_hints import format_semantic_hints\n",
              "from lineageweave.semantic_hints import format_semantic_hints\n" + summary_queries,
          )
          replace_section(
              "scripts/backfill_post_summaries.py",
              "async def _load_posts(",
              "async def backfill_post_summaries(",
              '''async def _load_posts(
              conn: asyncpg.Connection,
              post_ids: list[str],
              limit: int | None,
          ) -> list[asyncpg.Record]:
              """Load explicit IDs or one bounded unprojected-post batch."""
              if post_ids:
                  return list(await conn.fetch(_SELECT_POSTS_BY_ID_QUERY, post_ids, limit))
              return list(await conn.fetch(_SELECT_UNPROJECTED_POSTS_QUERY, limit))


          ''',
          )

          content_queries = '''
          _SELECT_POSTS_BY_ID_QUERY = f"""
          select post.post_id
            from source_post post
           where {SOURCE_POST_ELIGIBILITY_SQL.format(alias="post")}
             and post.post_id = any($1::uuid[])
           order by post.created_at, post.post_id
           limit $2::bigint
          """

          _SELECT_POSTS_WITHOUT_UNITS_QUERY = f"""
          select post.post_id
            from source_post post
           where {SOURCE_POST_ELIGIBILITY_SQL.format(alias="post")}
             and not exists (
                 select 1 from post_content_unit unit
                  where unit.post_id = post.post_id
             )
           order by post.created_at, post.post_id
           limit $1::bigint
          """

          _SELECT_POSTS_WITH_MISSING_CONTENT_QUERY = f"""
          select post.post_id
            from source_post post
           where {SOURCE_POST_ELIGIBILITY_SQL.format(alias="post")}
             and (
                 not exists (
                     select 1 from post_content_unit unit
                      where unit.post_id = post.post_id
                 )
                 or exists (
                     select 1
                       from post_content_unit unit
                       left join post_content_embedding embedding
                         on embedding.post_content_unit_id = unit.post_content_unit_id
                      where unit.post_id = post.post_id
                        and embedding.post_content_unit_id is null
                 )
             )
           order by post.created_at, post.post_id
           limit $1::bigint
          """
          '''
          replace_once(
              "scripts/backfill_post_content.py",
              "from lineageweave.post_structure import ContextualOrchestratorPostStructureClient, NullPostStructureClient\n",
              "from lineageweave.post_structure import ContextualOrchestratorPostStructureClient, NullPostStructureClient\n" + content_queries,
          )
          replace_section(
              "scripts/backfill_post_content.py",
              "        conditions = [SOURCE_POST_ELIGIBILITY_SQL.format(alias=\"post\")]",
              "        if post_ids and len(selected_rows) != len(post_ids):",
              '''        if post_ids:
              selected_rows = await conn.fetch(_SELECT_POSTS_BY_ID_QUERY, post_ids, limit)
          elif normalize_only:
              selected_rows = await conn.fetch(_SELECT_POSTS_WITHOUT_UNITS_QUERY, limit)
          else:
              selected_rows = await conn.fetch(_SELECT_POSTS_WITH_MISSING_CONTENT_QUERY, limit)
          ''',
          )

          synthetic_constants = '''_CANDIDATE_POSTS_QUERY = f"""
          select post.post_id
            from source_post post
           where ({_missing_source_context()})
             and exists (
                 select 1
                   from source_post real_post
                  where real_post.corporate_entity_id = post.corporate_entity_id
                    and ({_has_source_context('real_post')})
             )
          """

          _BLOCKED_POSTS_QUERY = """
          select distinct post_id
            from (
                select source_post_id as post_id
                  from analysis_source_snapshot_member
                 where source_post_id = any($1::uuid[])
                union
                select child_post_id as post_id
                  from analysis_run_lineage_edge
                 where child_post_id = any($1::uuid[])
                union
                select parent_post_id as post_id
                  from analysis_run_lineage_edge
                 where parent_post_id = any($1::uuid[])
            ) referenced
          """

          _CREATE_CLEANUP_TARGET_SQL = """
          create temporary table if not exists synthetic_cleanup_target_post (
              post_id uuid primary key
          ) on commit drop
          """
          _CLEAR_CLEANUP_TARGET_SQL = "truncate table pg_temp.synthetic_cleanup_target_post"
          _INSERT_CLEANUP_TARGETS_QUERY = """
          insert into pg_temp.synthetic_cleanup_target_post (post_id)
          select unnest($1::uuid[])
          """
          _CLEANUP_REFERENCES_SQL = """
          do $cleanup$
          declare
              reference_row record;
          begin
              for reference_row in
                  select child_ns.nspname as child_schema,
                         child_table.relname as child_table,
                         child_column.attname as child_column
                    from pg_constraint constraint_row
                    join pg_class parent_table
                      on parent_table.oid = constraint_row.confrelid
                    join pg_class child_table
                      on child_table.oid = constraint_row.conrelid
                    join pg_namespace child_ns
                      on child_ns.oid = child_table.relnamespace
                    join pg_attribute child_column
                      on child_column.attrelid = child_table.oid
                     and child_column.attnum = constraint_row.conkey[1]
                   where parent_table.oid = 'source_post'::regclass
                     and constraint_row.contype = 'f'
                     and constraint_row.confdeltype <> 'c'
                     and array_length(constraint_row.conkey, 1) = 1
              loop
                  if reference_row.child_table in (
                      'analysis_source_snapshot_member',
                      'analysis_run_lineage_edge'
                  ) then
                      continue;
                  end if;
                  if reference_row.child_table = 'post_counterparty_entity'
                     and reference_row.child_column = 'verification_evidence_post_id' then
                      execute format(
                          'update %I.%I set %I = null where %I in '
                          '(select post_id from pg_temp.synthetic_cleanup_target_post)',
                          reference_row.child_schema,
                          reference_row.child_table,
                          reference_row.child_column,
                          reference_row.child_column
                      );
                  else
                      execute format(
                          'delete from %I.%I where %I in '
                          '(select post_id from pg_temp.synthetic_cleanup_target_post)',
                          reference_row.child_schema,
                          reference_row.child_table,
                          reference_row.child_column
                      );
                  end if;
              end loop;
              delete from source_post
               where post_id in (
                   select post_id from pg_temp.synthetic_cleanup_target_post
               );
          end
          $cleanup$
          """


          '''
          replace_section(
              "lineageweave/synthetic_seed_cleanup.py",
              "def _quote_identifier(value: str) -> str:",
              "async def cleanup_synthetic_seed(",
              synthetic_constants,
          )
          replace_section(
              "lineageweave/synthetic_seed_cleanup.py",
              "    candidates = await conn.fetch(",
              '    candidate_ids = [row["post_id"] for row in candidates]',
              '''    candidates = await conn.fetch(_CANDIDATE_POSTS_QUERY)
          ''',
          )
          replace_section(
              "lineageweave/synthetic_seed_cleanup.py",
              "    blocked = await conn.fetch(",
              '    blocked_ids = {row["post_id"] for row in blocked}',
              '''    blocked = await conn.fetch(_BLOCKED_POSTS_QUERY, candidate_ids)
          ''',
          )
          replace_section(
              "lineageweave/synthetic_seed_cleanup.py",
              "    async with conn.transaction():",
              "    return {",
              '''    async with conn.transaction():
              await conn.execute(_CREATE_CLEANUP_TARGET_SQL)
              await conn.execute(_CLEAR_CLEANUP_TARGET_SQL)
              await conn.execute(_INSERT_CLEANUP_TARGETS_QUERY, deletable_ids)
              await conn.execute(_CLEANUP_REFERENCES_SQL)
              await conn.execute(
                  """
                  delete from account_affiliation affiliation
                   using process_unit unit, user_account account
                   where affiliation.process_unit_id = unit.process_unit_id
                     and affiliation.user_account_id = account.user_account_id
                     and unit.process_unit_code like 'DEMO-PU-%'
                     and account.external_subject_id like 'demo.%'
                     and not exists (
                         select 1 from source_post post
                          where post.process_unit_id = unit.process_unit_id
                     )
                  """
              )
              await conn.execute(
                  """
                  delete from process_unit unit
                   where unit.process_unit_code like 'DEMO-PU-%'
                     and not exists (
                         select 1 from source_post post
                          where post.process_unit_id = unit.process_unit_id
                     )
                     and not exists (
                         select 1 from account_affiliation affiliation
                          where affiliation.process_unit_id = unit.process_unit_id
                     )
                  """
              )
              await conn.execute(
                  """
                  delete from corporate_entity entity
                   where entity.corporate_entity_code like 'DEMO-%'
                     and not exists (
                         select 1 from source_post post
                          where post.corporate_entity_id = entity.corporate_entity_id
                     )
                     and not exists (
                         select 1 from process_unit unit
                          where unit.corporate_entity_id = entity.corporate_entity_id
                     )
                     and not exists (
                         select 1 from account_affiliation affiliation
                          where affiliation.corporate_entity_id = entity.corporate_entity_id
                     )
                     and not exists (
                         select 1 from corporate_entity child
                          where child.parent_entity_id = entity.corporate_entity_id
                     )
                  """
              )
          ''',
          )
          PY

      - name: Verify focused and full GREEN contracts
        run: |
          uv run --frozen python -m compileall -q backend lineageweave scripts tests
          uv run --frozen python -m pytest -q \
            tests/test_static_sql_review_contracts.py \
            tests/test_customer_hint_ingestion.py \
            tests/test_entity_relationship_ingestion.py \
            tests/test_post_structure.py \
            tests/test_synthetic_seed_cleanup.py
          uv run --frozen python -m pytest -q
          git diff --check

      - name: Publish only the exact verified repair
        env:
          TARGET_BRANCH: feat/analysis-run-name-evidence-lineage
        run: |
          rm .github/workflows/repair-pr258-static-sql-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(security): make reviewed SQL statements static"
          git push origin "HEAD:${TARGET_BRANCH}"
