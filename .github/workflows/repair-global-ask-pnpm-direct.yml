name: Repair Global Ask pnpm provisioning directly

on:
  pull_request:
    branches:
      - "feat/event-lineage-node-keeps-gnb-focus-v2170"
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: repair-global-ask-pnpm-direct-v2200-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    name: Patch the one-shot workflow with the repository pnpm pin
    if: >-
      github.event.pull_request.number == 276 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact pull request branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the bounded workflow repair
        shell: python
        run: |
          from pathlib import Path

          workflow_path = Path(".github/workflows/apply-global-ask-public-verification-v2200.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          old_guard = """      github.event.pull_request.number == 276 &&
                github.event.pull_request.head.repo.full_name == github.repository &&
                github.actor != 'github-actions[bot]'"""
          new_guard = """      github.event.pull_request.number == 276 &&
                github.event.pull_request.head.repo.full_name == github.repository"""
          if old_guard not in workflow:
              raise SystemExit("expected actor guard was not found")
          workflow = workflow.replace(old_guard, new_guard, 1)

          old_install = """          corepack enable
                pnpm --dir frontend install --frozen-lockfile"""
          new_install = """          corepack enable
                corepack prepare pnpm@9.15.9 --activate
                test \"$(pnpm --version)\" = \"9.15.9\"
                pnpm --dir frontend install --frozen-lockfile"""
          if old_install not in workflow:
              raise SystemExit("expected unpinned pnpm install was not found")
          workflow = workflow.replace(old_install, new_install, 1)
          workflow_path.write_text(workflow, encoding="utf-8")

          Path(".github/workflows/repair-global-ask-pnpm.yml").unlink(missing_ok=True)
          Path(".github/workflows/repair-global-ask-pnpm-direct.yml").unlink()

      - name: Publish only the workflow repair
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows
          git diff --cached --check
          git commit -m "ci: pin pnpm 9.15.9 for Global Ask integration"
          git push origin "HEAD:${TARGET_BRANCH}"
