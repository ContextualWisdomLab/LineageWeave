name: Repair Global Ask pnpm provisioning directly

on:
  pull_request:
    branches:
      - "feat/event-lineage-node-keeps-gnb-focus-v2170"
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: repair-global-ask-pnpm-direct-v2200-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    name: Patch the one-shot workflow with the repository pnpm pin
    if: >-
      github.event.pull_request.number == 276 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact pull request branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the bounded workflow repair
        shell: python
        run: |
          from pathlib import Path

          workflow_path = Path(".github/workflows/apply-global-ask-public-verification-v2200.yml")
          lines = workflow_path.read_text(encoding="utf-8").splitlines()

          actor_indexes = [
              index
              for index, line in enumerate(lines)
              if line.strip() == "github.actor != 'github-actions[bot]'"
          ]
          if len(actor_indexes) != 1:
              raise SystemExit(f"expected one actor guard, found {len(actor_indexes)}")
          actor_index = actor_indexes[0]
          previous = lines[actor_index - 1]
          if not previous.rstrip().endswith("&&"):
              raise SystemExit("actor guard predecessor does not end in &&")
          lines[actor_index - 1] = previous.rstrip()[:-2].rstrip()
          del lines[actor_index]

          corepack_indexes = [
              index for index, line in enumerate(lines) if line.strip() == "corepack enable"
          ]
          if len(corepack_indexes) != 1:
              raise SystemExit(f"expected one corepack enable, found {len(corepack_indexes)}")
          corepack_index = corepack_indexes[0]
          indentation = lines[corepack_index][:-len(lines[corepack_index].lstrip())]
          insertion = [
              f"{indentation}corepack prepare pnpm@9.15.9 --activate",
              f'{indentation}test "$(pnpm --version)" = "9.15.9"',
          ]
          if any("corepack prepare pnpm@9.15.9" in line for line in lines):
              raise SystemExit("pnpm pin already present unexpectedly")
          lines[corepack_index + 1:corepack_index + 1] = insertion
          workflow_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          Path(".github/workflows/repair-global-ask-pnpm.yml").unlink(missing_ok=True)
          Path(".github/workflows/repair-global-ask-pnpm-direct.yml").unlink()

      - name: Publish only the workflow repair
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows
          git diff --cached --check
          git commit -m "ci: pin pnpm 9.15.9 for Global Ask integration"
          git push origin "HEAD:${TARGET_BRANCH}"
