name: automation-825-current-824-reconstruction-r5

on:
  push:
    branches:
      - automation/825-current-824-reconstruction-r5-20260907-1242

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 2
      - name: Verify exact current parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "499d653ed6e9206249e3f3a07518ad3fc01f14bd"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Enable Corepack and install frontend lock
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          cd frontend
          pnpm install --frozen-lockfile
      - name: Add realistic comparison incomplete-item regression only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/App.test.tsx')
          text = p.read_text()
          anchor = '''    expect(\n      within(screen.getByLabelText("Grouping comparison")).queryByLabelText("Leftover map incomplete items"),\n    ).not.toBeInTheDocument();\n'''
          addition = '''    expect(\n      within(screen.getByLabelText("Grouping comparison")).getAllByLabelText(\n        "Leftover map comparison incomplete items",\n      ),\n    ).toHaveLength(2);\n    expect(\n      within(screen.getByLabelText("Grouping comparison")).getAllByLabelText(\n        "Leftover map comparison incomplete items",\n      )[0],\n    ).toHaveTextContent("Leftover map dropped 0 incomplete criteria");\n    expect(\n      within(screen.getByLabelText("Grouping comparison")).getAllByLabelText(\n        "Leftover map comparison incomplete items",\n      )[1],\n    ).toHaveTextContent("Leftover map dropped 1 incomplete criteria");\n    expect(\n      within(screen.getByLabelText("Grouping comparison")).queryByLabelText(\n        "Leftover-map graphic incomplete items",\n      ),\n    ).not.toBeInTheDocument();\n'''
          if text.count(anchor) != 1:
              raise SystemExit('App regression anchor drifted')
          p.write_text(text.replace(anchor, anchor + addition, 1))
          PY
          git diff --check
      - name: RED current #824 omits persisted incomplete-item comparison note
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          set +e
          pnpm exec vitest run src/App.test.tsx -t "shows the grouping comparison strip and switches grouping on click" >/tmp/825-red.log 2>&1
          status=$?
          set -e
          cat /tmp/825-red.log
          test "$status" -ne 0
          grep -F "Leftover map comparison incomplete items" /tmp/825-red.log
      - name: Apply minimal v2.51 / ADR0294 causal repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          # The helper already validates persisted incomplete-item counts. The missing
          # product behavior is the grouping-comparison presentation and its distinct a11y label.
          replace_once(
              'frontend/src/leftoverMapCoverage.ts',
              'export const LEFTOVER_MAP_COMPARE_INCOMPLETE_POST_LABEL = "Leftover map comparison incomplete posts";\n',
              'export const LEFTOVER_MAP_COMPARE_INCOMPLETE_POST_LABEL = "Leftover map comparison incomplete posts";\n\nexport const LEFTOVER_MAP_COMPARE_INCOMPLETE_ITEM_LABEL = "Leftover map comparison incomplete items";\n',
          )
          replace_once(
              'frontend/src/leftoverMapCoverage.ts',
              'ADR 0288 / ADR 0290 / ADR 0291).',
              'ADR 0288 / ADR 0290 / ADR 0291 / ADR 0294).',
          )
          replace_once(
              'frontend/src/App.tsx',
              '  LEFTOVER_MAP_COMPARE_INCOMPLETE_POST_LABEL,\n  LEFTOVER_MAP_LIST_COVERAGE_LABEL,',
              '  LEFTOVER_MAP_COMPARE_INCOMPLETE_POST_LABEL,\n  LEFTOVER_MAP_COMPARE_INCOMPLETE_ITEM_LABEL,\n  LEFTOVER_MAP_LIST_COVERAGE_LABEL,',
          )
          replace_once(
              'frontend/src/App.tsx',
              '''            const comparisonIncompletePostCount = leftoverMapIncompletePostCount(\n              row.leftover_map_coverage,\n            );\n            return (''',
              '''            const comparisonIncompletePostCount = leftoverMapIncompletePostCount(\n              row.leftover_map_coverage,\n            );\n            const comparisonIncompleteItemCount = leftoverMapIncompleteItemCount(\n              row.leftover_map_coverage,\n            );\n            return (''',
          )
          replace_once(
              'frontend/src/App.tsx',
              '''              {comparisonIncompletePostCount !== null ? (\n                <p className="post-meta" role="note" aria-label={t(LEFTOVER_MAP_COMPARE_INCOMPLETE_POST_LABEL)}>\n                  {tf(LEFTOVER_MAP_PLOT_INCOMPLETE_POST, comparisonIncompletePostCount)}\n                </p>\n              ) : null}\n              {row.leftover_pairs && row.leftover_pairs.length > 0 && (''',
              '''              {comparisonIncompletePostCount !== null ? (\n                <p className="post-meta" role="note" aria-label={t(LEFTOVER_MAP_COMPARE_INCOMPLETE_POST_LABEL)}>\n                  {tf(LEFTOVER_MAP_PLOT_INCOMPLETE_POST, comparisonIncompletePostCount)}\n                </p>\n              ) : null}\n              {comparisonIncompleteItemCount !== null ? (\n                <p className="post-meta" role="note" aria-label={t(LEFTOVER_MAP_COMPARE_INCOMPLETE_ITEM_LABEL)}>\n                  {tf(LEFTOVER_MAP_PLOT_INCOMPLETE_ITEM, comparisonIncompleteItemCount)}\n                </p>\n              ) : null}\n              {row.leftover_pairs && row.leftover_pairs.length > 0 && (''',
          )

          translations = {
              '"Leftover map comparison incomplete posts": "잔여 지도 비교 불완전 글",': '"Leftover map comparison incomplete posts": "잔여 지도 비교 불완전 글",\n    "Leftover map comparison incomplete items": "잔여 지도 비교 불완전 기준",',
              '"Leftover map comparison incomplete posts": "残差地图比较不完整帖文",': '"Leftover map comparison incomplete posts": "残差地图比较不完整帖文",\n    "Leftover map comparison incomplete items": "残差地图比较不完整准则",',
              '"Leftover map comparison incomplete posts": "残差マップの比較不完全投稿",': '"Leftover map comparison incomplete posts": "残差マップの比較不完全投稿",\n    "Leftover map comparison incomplete items": "残差マップの比較不完全基準",',
              '"Leftover map comparison incomplete posts": "Bài không đầy đủ so sánh trên bản đồ phần dư",': '"Leftover map comparison incomplete posts": "Bài không đầy đủ so sánh trên bản đồ phần dư",\n    "Leftover map comparison incomplete items": "Tiêu chí không đầy đủ so sánh trên bản đồ phần dư",',
          }
          p = Path('frontend/src/i18n.ts')
          text = p.read_text()
          for old, new in translations.items():
              if text.count(old) != 1:
                  raise SystemExit(f'i18n anchor drifted: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text)

          replace_once(
              'frontend/src/i18n.test.ts',
              '    "Leftover map comparison incomplete posts",\n    "Leftover-map graphic item coverage",',
              '    "Leftover map comparison incomplete posts",\n    "Leftover map comparison incomplete items",\n    "Leftover-map graphic item coverage",',
          )
          replace_once(
              'frontend/src/i18n.test.ts',
              '''  it.each([\n    ["ko", "잔여 지도 그림 기준 포함 범위"],''',
              '''  it.each([\n    ["ko", "잔여 지도 비교 불완전 기준"],\n    ["zh", "残差地图比较不完整准则"],\n    ["ja", "残差マップの比較不完全基準"],\n    ["vi", "Tiêu chí không đầy đủ so sánh trên bản đồ phần dư"],\n  ] as const)("formats leftover map comparison incomplete items label in %s", (locale, expected) => {\n    setLocale(locale);\n    expect(t("Leftover map comparison incomplete items")).toBe(expected);\n  });\n\n  it.each([\n    ["ko", "잔여 지도 그림 기준 포함 범위"],''',
          )

          replace_once('pyproject.toml', 'version = "2.50.0"', 'version = "2.51.0"')
          replace_once('lineageweave/__init__.py', '__version__ = "2.50.0"', '__version__ = "2.51.0"')
          package_path = Path('frontend/package.json')
          package = json.loads(package_path.read_text())
          if package.get('version') != '2.50.0':
              raise SystemExit('frontend package version drifted')
          package['version'] = '2.51.0'
          package_path.write_text(json.dumps(package, indent=2, ensure_ascii=False) + '\n')

          changelog_entry = '- Grouping comparison rows now show persisted leftover-map incomplete-item count through `leftoverMapIncompleteItemCount` (ADR 0294 / v2.51.0) only when the caller can see the full persisted grouping. Partial visibility remains omitted by the server-side coverage authority; valid persisted zero stays visible, and the UI never derives dropped criteria from scored-minus-used.\n\n'
          replace_once('CHANGELOG.md', '### Added\n\n', '### Added\n\n' + changelog_entry)

          Path('CHANGELOG.d/2.51.0-leftover-map-compare-incomplete-item.md').write_text('''## 2.51.0 — Grouping comparison incomplete-item coverage\n\n- Show the persisted leftover-map incomplete-item count on grouping comparison rows with a distinct accessible label (ADR 0294).\n- Preserve the existing authorization boundary: partial-visibility groupings receive no persisted full-population coverage object, so the UI neither leaks the hidden denominator nor recomputes psychometric coverage from a visible subset.\n- Missing, non-integer, negative, or internally contradictory dropped-item counts remain omitted; persisted zero is shown.\n- No schema, SQL, psychometric kernel, or inference-policy change.\n''')

          Path('docs/adr/0294-leftover-map-compare-incomplete-item.md').write_text('''# ADR 0294 — Grouping comparison incomplete-item coverage\n\n**Decision status:** Proposed\n\n## Problem\n\nThe grouping comparison strip already presents persisted post coverage, item coverage, and incomplete-post counts, but it omits the persisted incomplete-item count. Buyers therefore cannot see how many scored criteria were excluded from each grouping's leftover-map factorization without opening a deeper report surface.\n\n## Constraints\n\n- LineageWeave owns this read-model presentation; fast-mlsirm continues to own psychometric computation.\n- The API may expose persisted grouping coverage only for a full persisted grouping that the caller is authorized to see. For partial visibility it must remain absent; the frontend must not reconstruct a hidden full-population denominator or recompute psychometric coverage from the visible subset.\n- Missing, non-integer, negative, or internally contradictory dropped counts fail closed. Persisted zero is meaningful and must remain visible.\n- The comparison strip does not gain a second leftover-map graphic.\n\n## Decision\n\nRender `leftoverMapIncompleteItemCount(row.leftover_map_coverage)` beside the existing comparison coverage notes with the distinct accessible label `Leftover map comparison incomplete items`. Reuse the already validated persisted-count helper and the existing localized incomplete-item sentence. Do not derive the count from scored-minus-used in the component.\n\nThe decision remains Proposed while this PR is Draft. Accepted status requires current-head hosted tests, browser/keyboard/accessibility evidence, the canonical eight-locale translation-ledger consumer path, independent review, and protected-branch merge under normal gates.\n\n## Evidence and risk\n\nThe realistic regression fails on exact parent `499d653ed6e9206249e3f3a07518ad3fc01f14bd` because the grouping strip has no incomplete-item comparison note. The same test must pass after the minimal presentation repair. The principal risk is disclosure of a hidden grouping population; that risk is controlled by consuming only the authorization-filtered `leftover_map_coverage` object and never recreating it client-side.\n''')

          Path('tests/test_adr_0294_governance.py').write_text('''from pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\n\n\ndef test_incomplete_item_comparison_uses_distinct_proposed_adr_0294() -> None:\n    assert (ROOT / "docs/adr/0290-leftover-map-compare-coverage.md").exists()\n    assert (ROOT / "docs/adr/0291-leftover-map-compare-item-coverage.md").exists()\n    assert (ROOT / "docs/adr/0292-leftover-map-axis-singular.md").exists()\n    assert (ROOT / "docs/adr/0293-leftover-map-compare-incomplete-post.md").exists()\n    path = ROOT / "docs/adr/0294-leftover-map-compare-incomplete-item.md"\n    assert path.exists()\n    text = path.read_text(encoding="utf-8")\n    assert text.startswith("# ADR 0294 —")\n    assert "**Decision status:** Proposed" in text\n    assert "**Decision status:** Accepted" not in text\n    assert "full persisted grouping" in text and "partial" in text.lower()\n''')

          append_blocks = {
              'AGENTS.md': '\nADR 0294 keeps grouping-comparison incomplete-item coverage in the LineageWeave read-model boundary: render only the authorization-filtered persisted coverage object for a full persisted grouping, omit it for partial visibility, and never derive or recompute psychometric coverage in the client.\n',
              'ARCHITECTURE.md': '\nADR 0294 adds the persisted incomplete-item count to grouping comparison presentation. The API authorization boundary remains authoritative: partial-visibility groupings omit persisted full-population coverage, while the frontend only formats an admitted count and never recomputes psychometrics.\n',
              'CLAUDE.md': '\nADR 0294 is the Proposed grouping-comparison incomplete-item presentation contract. Preserve server-side full-group visibility gating and do not infer dropped criteria in the frontend.\n',
              'docs/product-technical-gap-baseline.md': '\n### 2026-09-07 — #825 current-parent reconstruction candidate\n\nExact parent `#824@499d653ed6e9206249e3f3a07518ad3fc01f14bd` lacks the grouping-comparison incomplete-item note while already carrying persisted authorization-filtered coverage. ADR 0294 / v2.51.0 adds only that buyer-visible read-model presentation and its regression. This is candidate evidence, not protected-main or release evidence; current-head hosted browser/a11y, eight-locale translation-ledger consumption, independent review, and normal protected merge remain outstanding.\n',
          }
          for path, block in append_blocks.items():
              p = Path(path)
              text = p.read_text()
              if block.strip() not in text:
                  p.write_text(text.rstrip() + '\n' + block)
          PY
          git diff --check
      - name: Exact reconstructed GREEN
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          pnpm exec vitest run src/App.test.tsx -t "shows the grouping comparison strip and switches grouping on click"
          pnpm exec vitest run src/i18n.test.ts src/leftoverMapCoverage.test.ts
          pnpm run lint
          pnpm run build
          pnpm run build-storybook
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false
      - name: Governance and release-identity GREEN
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python -m pytest -q tests/test_adr_0290_governance.py tests/test_adr_0291_governance.py tests/test_adr_0292_governance.py tests/test_adr_0293_governance.py tests/test_adr_0294_governance.py tests/test_package_version.py
      - name: Emit workflow-free clean staging commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/automation-825-current-824-reconstruction-r5.yml
          git diff --check
          test -z "$(git status --porcelain | awk '$2 ~ /^\.github\/workflows\// && $1 != "D" {print}')"
          git config user.name "LineageWeave automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(reports): restore incomplete-item comparison coverage (v2.51.0)"
          test -z "$(git ls-tree -r --name-only HEAD | grep '^.github/workflows/automation-825-current-824-reconstruction-r5.yml$' || true)"
          git push origin HEAD:automation/825-current-824-reconstruction-r5-20260907-1242
          echo "CLEAN_STAGING_COMMIT=$(git rev-parse HEAD)"
          echo "CLEAN_STAGING_TREE=$(git rev-parse HEAD^{tree})"
