name: automation-972-body-abort-reason-r1
on:
  push:
    branches: [automation/972-body-abort-reason-r1-20260907-1432]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 2
      - name: Verify exact #972 product parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8e14f11295c0ffeb26a270ee9b7d7b21f5f2c895"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
      - name: Install frozen frontend graph
        run: corepack enable && cd frontend && pnpm install --frozen-lockfile
      - name: Add realistic cancellation-body regression
        shell: bash
        run: |
          cat >> frontend/src/api.test.ts <<'EOF'

it.each([200, 503])("preserves custom cancellation reason while parsing a %i response body", async (status) => {
  const controller = new AbortController();
  const retirement = new Error("authorized screen retired");
  let rejectBody: (reason: unknown) => void = () => undefined;
  const body = new Promise<unknown>((_resolve, reject) => {
    rejectBody = reject;
  });
  const fetchMock = vi.fn().mockResolvedValue({
    ok: status >= 200 && status < 300,
    status,
    json: vi.fn().mockImplementation(() => body),
  } as unknown as Response);
  vi.stubGlobal("fetch", fetchMock);

  const result = askAgent("token", "Question", false, undefined, controller.signal).catch(
    (error: unknown) => error,
  );
  await vi.waitFor(() => expect(fetchMock).toHaveBeenCalledTimes(1));
  controller.abort(retirement);
  rejectBody(new DOMException("The operation was aborted.", "AbortError"));

  expect(await result).toBe(retirement);
});
EOF
      - name: RED body parsing loses custom cancellation reason
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          set +e
          pnpm exec vitest run src/api.test.ts -t "preserves custom cancellation reason while parsing" >/tmp/972-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/972-red.log
          test "$rc" -ne 0
      - name: Apply minimum causal fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/src/api.ts')
          t=p.read_text()
          old='''    } catch {\n      detail = undefined;\n    }\n    throw new BackendError(path, response.status, detail);\n  }\n  return response.json() as Promise<T>;\n'''
          new='''    } catch {\n      init?.signal?.throwIfAborted();\n      detail = undefined;\n    }\n    throw new BackendError(path, response.status, detail);\n  }\n  try {\n    return (await response.json()) as T;\n  } catch (error) {\n    init?.signal?.throwIfAborted();\n    throw error;\n  }\n'''
          if t.count(old) != 1:
              raise SystemExit('backendFetch anchor drift')
          p.write_text(t.replace(old,new,1))
          PY
      - name: Exact repaired GREEN
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          pnpm exec vitest run src/api.test.ts src/AskAgentPanel.test.tsx
          pnpm run lint
          pnpm run build
      - name: Emit workflow-free clean staging commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/automation-972-body-abort-reason-r1.yml
          git diff --check
          git config user.name "LineageWeave automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ask): preserve cancellation reason during body parsing"
          test ! -e .github/workflows/automation-972-body-abort-reason-r1.yml
          git push origin HEAD:automation/972-body-abort-reason-r1-20260907-1432
          echo "CLEAN_STAGING_COMMIT=$(git rev-parse HEAD)"
          echo "CLEAN_STAGING_TREE=$(git rev-parse HEAD^{tree})"
