name: Temporary PR 1047 causal repair

on:
  push:
    branches:
      - fix/post-chat-replay-scope

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/post-chat-replay-scope
          fetch-depth: 0
      - name: Apply causal repair and remove this temporary workflow
        shell: python
        run: |
          from pathlib import Path
          import ast

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              p.write_text(text.replace(old, new, 1))

          # Production replay/persistence consumes the normalized scope policy and shared ABAC SQL.
          replace_once(
              "backend/app/post_chat_ingestion.py",
              "from .post_eligibility import SOURCE_POST_ELIGIBILITY_SQL\n",
              "from .post_eligibility import SOURCE_POST_ELIGIBILITY_SQL, source_post_scope_sql\n"
              "from .post_chat_replay_policy import PostChatAuthorizationScope\n",
          )

          ingestion = Path("backend/app/post_chat_ingestion.py")
          text = ingestion.read_text()
          start = text.index("async def fetch_persisted_chat(\n")
          end = text.index("\ndef seeded_demo_chat() -> SeededChat:\n", start)
          replacement = '''async def _load_post_chat_authorization_receipt(
              conn: asyncpg.Connection,
              post_id: str,
              question_norm: str,
          ) -> tuple[PostChatAuthorizationScope, tuple[str, ...]] | None:
              """Load immutable generation scope and every source that could influence an answer."""
              receipt = await conn.fetchrow(
                  "select process_scope_limited from post_chat_authorization_receipt "
                  "where post_id = $1 and question_norm = $2",
                  post_id,
                  question_norm,
              )
              if receipt is None:
                  return None
              corporate_rows = await conn.fetch(
                  "select corporate_entity_id::text as corporate_entity_id "
                  "from post_chat_corporate_entity_scope "
                  "where post_id = $1 and question_norm = $2 order by corporate_entity_id",
                  post_id,
                  question_norm,
              )
              process_rows = await conn.fetch(
                  "select process_unit_id::text as process_unit_id "
                  "from post_chat_process_unit_scope "
                  "where post_id = $1 and question_norm = $2 order by process_unit_id",
                  post_id,
                  question_norm,
              )
              source_rows = await conn.fetch(
                  "select source_post_id::text as source_post_id from post_chat_source "
                  "where post_id = $1 and question_norm = $2 order by source_ordinal",
                  post_id,
                  question_norm,
              )
              if not source_rows:
                  return None
              try:
                  scope = PostChatAuthorizationScope(
                      corporate_entity_ids=frozenset(
                          str(row["corporate_entity_id"]) for row in corporate_rows
                      ),
                      process_unit_ids=frozenset(
                          str(row["process_unit_id"]) for row in process_rows
                      ),
                      process_scope_limited=receipt["process_scope_limited"],
                  )
              except (TypeError, ValueError):
                  return None
              return scope, tuple(str(row["source_post_id"]) for row in source_rows)


          async def _captured_sources_are_visible(
              conn: asyncpg.Connection,
              source_post_ids: tuple[str, ...],
              current_scope: PostChatAuthorizationScope,
          ) -> bool:
              """Reauthorize every captured source and lock it only for this short replay read."""
              if not source_post_ids:
                  return False
              rows = await conn.fetch(
                  f"""
                  select source_post.post_id::text as post_id
                    from source_post
                   where source_post.post_id = any($3::uuid[])
                     and {source_post_scope_sql("source_post")}
                     and {SOURCE_POST_ELIGIBILITY_SQL.format(alias="source_post")}
                   order by source_post.post_id
                   for key share
                  """,
                  sorted(current_scope.corporate_entity_ids),
                  sorted(current_scope.process_unit_ids),
                  list(source_post_ids),
              )
              return {str(row["post_id"]) for row in rows} == set(source_post_ids)


          async def _fetch_authorized_persisted_chat(
              conn: asyncpg.Connection,
              post_id: str,
              question_norm: str,
              current_scope: PostChatAuthorizationScope,
          ) -> dict[str, Any] | None:
              """Return one replay only when generation scope and every source remain authorized."""
              receipt = await _load_post_chat_authorization_receipt(conn, post_id, question_norm)
              if receipt is None:
                  return None
              generation_scope, source_post_ids = receipt
              if not generation_scope.is_subsumed_by(
                  current_corporate_entity_ids=current_scope.corporate_entity_ids,
                  current_process_unit_ids=current_scope.process_unit_ids,
              ):
                  return None
              if not await _captured_sources_are_visible(conn, source_post_ids, current_scope):
                  return None
              payload = await _serialize_chat(conn, post_id, question_norm)
              if payload is None:
                  return None
              payload["_authorization_validated"] = True
              payload["_source_post_ids"] = list(source_post_ids)
              return payload


          async def fetch_persisted_chat(
              conn: asyncpg.Connection,
              post_id: str,
              question: str,
              current_scope: PostChatAuthorizationScope,
          ) -> dict[str, Any] | None:
              """Return a cached answer only after current-reader replay authorization succeeds."""
              norm = normalize_chat_question(question)
              if not norm:
                  return None
              async with conn.transaction():
                  return await _fetch_authorized_persisted_chat(
                      conn, post_id, norm, current_scope
                  )


          async def fetch_persisted_chats(
              conn: asyncpg.Connection,
              post_id: str,
              current_scope: PostChatAuthorizationScope,
          ) -> list[dict[str, Any]]:
              """Return only stored exchanges whose generation evidence is replay-safe now."""
              rows = await conn.fetch(
                  "select question_norm from post_chat_result where post_id = $1 "
                  "order by computed_at, question_norm",
                  post_id,
              )
              exchanges: list[dict[str, Any]] = []
              for row in rows:
                  async with conn.transaction():
                      payload = await _fetch_authorized_persisted_chat(
                          conn, post_id, row["question_norm"], current_scope
                      )
                  if payload is not None:
                      payload.pop("_authorization_validated", None)
                      payload.pop("_source_post_ids", None)
                      exchanges.append(payload)
              return exchanges


          async def persist_post_chat(
              conn: asyncpg.Connection,
              post_id: str,
              question: str,
              answer_text: str,
              cited_post_ids: list[str] | tuple[str, ...],
              generation_scope: PostChatAuthorizationScope,
              source_post_ids: list[str] | tuple[str, ...],
          ) -> dict[str, Any]:
              """Atomically replace one answer together with immutable replay evidence."""
              norm = normalize_chat_question(question)
              if not norm:
                  raise ValueError("question is empty after normalize")
              captured_sources = tuple(dict.fromkeys(str(value) for value in source_post_ids))
              if not captured_sources or post_id not in captured_sources:
                  raise ValueError("post chat replay evidence must include the focal source post")
              cited = tuple(dict.fromkeys(str(value) for value in cited_post_ids))
              if not set(cited).issubset(captured_sources):
                  raise ValueError("every cited post must be part of the captured source set")

              async with conn.transaction():
                  await conn.execute(
                      "delete from post_chat_result where post_id = $1 and question_norm = $2",
                      post_id,
                      norm,
                  )
                  await conn.execute(
                      "insert into post_chat_result (post_id, question_norm, question_text, answer_text) "
                      "values ($1, $2, $3, $4)",
                      post_id,
                      norm,
                      question.strip(),
                      answer_text,
                  )
                  for ordinal, cited_id in enumerate(cited):
                      await conn.execute(
                          "insert into post_chat_citation "
                          "(post_id, question_norm, citation_ordinal, cited_post_id) "
                          "values ($1, $2, $3, $4)",
                          post_id,
                          norm,
                          ordinal,
                          cited_id,
                      )
                  await conn.execute(
                      "insert into post_chat_authorization_receipt "
                      "(post_id, question_norm, process_scope_limited) values ($1, $2, $3)",
                      post_id,
                      norm,
                      generation_scope.process_scope_limited,
                  )
                  for corporate_entity_id in sorted(generation_scope.corporate_entity_ids):
                      await conn.execute(
                          "insert into post_chat_corporate_entity_scope "
                          "(post_id, question_norm, corporate_entity_id) values ($1, $2, $3)",
                          post_id,
                          norm,
                          corporate_entity_id,
                      )
                  for process_unit_id in sorted(generation_scope.process_unit_ids):
                      await conn.execute(
                          "insert into post_chat_process_unit_scope "
                          "(post_id, question_norm, process_unit_id) values ($1, $2, $3)",
                          post_id,
                          norm,
                          process_unit_id,
                      )
                  for source_ordinal, source_post_id in enumerate(captured_sources):
                      await conn.execute(
                          "insert into post_chat_source "
                          "(post_id, question_norm, source_ordinal, source_post_id) "
                          "values ($1, $2, $3, $4)",
                          post_id,
                          norm,
                          source_ordinal,
                          source_post_id,
                      )
                  payload = await _serialize_chat(conn, post_id, norm)
              if payload is None:
                  raise RuntimeError("persist_post_chat wrote no row")
              return payload

          '''
          ingestion.write_text(text[:start] + replacement + text[end + 1:])

          # API constructs one immutable scope value per request and refuses unvalidated cache objects.
          replace_once(
              "backend/app/main.py",
              "from backend.app.post_chat_ingestion import (\n",
              "from backend.app.post_chat_replay_policy import PostChatAuthorizationScope\n"
              "from backend.app.post_chat_ingestion import (\n",
          )
          main_path = Path("backend/app/main.py")
          main_text = main_path.read_text()
          main_start = main_text.index('@app.get("/api/posts/{post_id}/chat")\n')
          main_end = main_text.index('@app.post("/api/ask", status_code=status.HTTP_202_ACCEPTED)\n', main_start)
          main_replacement = '''@app.get("/api/posts/{post_id}/chat")
          async def read_post_chat(
              post_id: str,
              account: CurrentAccount = Depends(get_current_account),
              pool: asyncpg.Pool = Depends(get_pool),
          ) -> dict[str, Any]:
              """Return only stored Ask exchanges whose replay evidence is authorized now."""
              await _load_visible_post(post_id, account, pool)
              current_scope = PostChatAuthorizationScope.captured(
                  account.corporate_entity_ids,
                  account.process_unit_ids,
              )
              async with pool.acquire() as conn:
                  exchanges = await fetch_persisted_chats(conn, post_id, current_scope)
              return {"post_id": post_id, "exchanges": exchanges}


          @app.post("/api/posts/{post_id}/chat")
          async def chat_about_post(
              post_id: str,
              request: ChatRequest,
              account: CurrentAccount = Depends(get_current_account),
              pool: asyncpg.Pool = Depends(get_pool),
              valkey: redis.Redis = Depends(get_valkey),
          ) -> dict[str, Any]:
              """Answer from authorized lineage evidence, revalidating any persisted replay first.

              Cached derived text is replayed only when its immutable generation scope is
              subsumed by the current reader and every source that could influence the answer
              is still visible. Legacy or contracted-scope rows fail closed to live generation.
              No database transaction is held while the orchestrator performs LLM work.
              """
              question = request.question.strip()
              if not question:
                  raise HTTPException(
                      status.HTTP_422_UNPROCESSABLE_CONTENT, "question is required"
                  )
              post = await _load_visible_post(post_id, account, pool)
              post_metadata = build_post_llm_metadata(post_id, post)
              current_scope = PostChatAuthorizationScope.captured(
                  account.corporate_entity_ids,
                  account.process_unit_ids,
              )
              async with pool.acquire() as conn:
                  stored = await fetch_persisted_chat(conn, post_id, question, current_scope)
                  if stored is not None and stored.get("_authorization_validated") is True:
                      return {
                          "post_id": post_id,
                          "answer_text": stored["answer_text"],
                          "cited_post_ids": stored["cited_post_ids"],
                          "cited_posts": stored["cited_posts"],
                          "source_post_ids": list(stored.get("_source_post_ids", ())),
                      }
              with use_llm_metadata(post_metadata):
                  with traced(
                      "lineageweave.api.post_chat",
                      {"lineageweave.operation_code": "post_chat"},
                  ):
                      try:
                          client = _post_chat_client()
                          if not client.available:
                              record_server_failure(
                                  "post_chat",
                                  RuntimeError("orchestrator unavailable"),
                                  outcome="provider_unavailable",
                              )
                              raise HTTPException(
                                  status.HTTP_503_SERVICE_UNAVAILABLE,
                                  "Post chat is temporarily unavailable. "
                                  "Saved evidence is still available.",
                              )
                          async with pool.acquire() as conn:
                              sources = await gather_chat_sources(
                                  conn,
                                  post_id,
                                  lambda row: _can_see_post(account, row),
                                  vision_client=_vision_client(),
                              )
                          answer = await asyncio.to_thread(client.answer, question, sources)
                      except HTTPException:
                          raise
                      except (
                          HttpClientError,
                          TimeoutError,
                          KeyError,
                          OSError,
                          TypeError,
                          ValueError,
                      ) as exc:
                          record_server_failure("post_chat", exc, outcome="provider_unavailable")
                          raise HTTPException(
                              status.HTTP_503_SERVICE_UNAVAILABLE,
                              "Post chat is temporarily unavailable. "
                              "Saved evidence is still available.",
                          ) from exc
                      except Exception as exc:
                          record_server_failure("post_chat", exc, outcome="internal_error")
                          raise HTTPException(
                              status.HTTP_503_SERVICE_UNAVAILABLE,
                              "Post chat is temporarily unavailable. "
                              "Saved evidence is still available.",
                          ) from exc
              cited_ids = list(answer.cited_post_ids)
              source_post_ids = [source.post_id for source in sources]
              async with pool.acquire() as conn:
                  await persist_post_chat(
                      conn,
                      post_id,
                      question,
                      answer.answer_text,
                      cited_ids,
                      current_scope,
                      source_post_ids,
                  )
              await publish_activity_event(
                  valkey,
                  post_id,
                  "chat_answered",
                  account.user_account_id,
                  f"Chat answered: {question}",
              )
              return {
                  "post_id": post_id,
                  "answer_text": answer.answer_text,
                  "cited_post_ids": cited_ids,
                  "cited_posts": cited_post_summaries(sources, cited_ids),
                  "source_post_ids": source_post_ids,
              }


          '''
          main_path.write_text(main_text[:main_start] + main_replacement + main_text[main_end:])

          # Real PostgreSQL fixture passes UUID strings through psycopg2 without requiring a global adapter.
          replace_once(
              "tests/test_post_chat_authorization_migration_postgres.py",
              "    focal_post_id = uuid.uuid4()\n    contributing_post_id = uuid.uuid4()\n",
              "    focal_post_id = str(uuid.uuid4())\n    contributing_post_id = str(uuid.uuid4())\n",
          )

          # Existing ingestion unit doubles now model short transactions and replay receipts explicitly.
          test_path = Path("tests/test_post_chat_ingestion.py")
          test_text = test_path.read_text()
          test_text = test_text.replace(
              "from backend.app.post_chat_ingestion import (\n",
              "from backend.app.post_chat_replay_policy import PostChatAuthorizationScope\n"
              "from backend.app.post_chat_ingestion import (\n",
              1,
          )
          class_start = test_text.index("class _Connection:\n")
          class_end = test_text.index("\n\nclass _SourceConnection:\n", class_start)
          new_connection = '''class _Transaction:
              """No-op async transaction context for persistence/replay unit doubles."""

              async def __aenter__(self) -> None:
                  """Enter the unit-test transaction boundary."""
                  return None

              async def __aexit__(self, _exc_type: object, _exc: object, _tb: object) -> None:
                  """Exit the unit-test transaction boundary."""
                  return None


          class _Connection:
              def __init__(self, *, header: dict[str, str] | None, citations: list[dict[str, str]]) -> None:
                  self.header = header
                  self.citations = citations
                  self.executed: list[tuple[str, tuple[object, ...]]] = []

              def transaction(self) -> _Transaction:
                  """Return the short transaction boundary used by production replay code."""
                  return _Transaction()

              async def execute(self, query: str, *args: object) -> str:
                  self.executed.append((query, args))
                  return "OK"

              async def fetchrow(self, query: str, *_args: object):
                  if "post_chat_authorization_receipt" in query:
                      return None if self.header is None else {"process_scope_limited": True}
                  return self.header

              async def fetch(self, query: str, *_args: object):
                  if "question_norm from post_chat_result" in query:
                      return [] if self.header is None else [{"question_norm": "question"}]
                  if "post_chat_corporate_entity_scope" in query:
                      return [{"corporate_entity_id": "corp-a"}]
                  if "post_chat_process_unit_scope" in query:
                      return [{"process_unit_id": "pu-a"}]
                  if "from post_chat_source" in query:
                      return [{"source_post_id": "post-1"}]
                  if "from source_post" in query and "for key share" in query.lower():
                      return [{"post_id": "post-1"}]
                  return self.citations
          '''
          test_text = test_text[:class_start] + new_connection + test_text[class_end:]
          marker = "def test_normalize_question_rejects_empty_and_collapses_whitespace() -> None:\n"
          scope_helper = '''def _replay_scope() -> PostChatAuthorizationScope:
              """Return one deterministic restricted scope for replay unit tests."""
              return PostChatAuthorizationScope.captured({"corp-a"}, {"pu-a"})


          '''
          test_text = test_text.replace(marker, scope_helper + marker, 1)
          old_persist = '''        persist_post_chat(conn, "post-1", "  What   happened? ", "A synthetic answer.", ["post-a", "post-a", "post-b"])
          '''
          new_persist = '''        persist_post_chat(
                      conn,
                      "post-1",
                      "  What   happened? ",
                      "A synthetic answer.",
                      ["post-a", "post-a", "post-b"],
                      _replay_scope(),
                      ["post-1", "post-a", "post-b"],
                  )
          '''
          if old_persist not in test_text:
              raise SystemExit("tests/test_post_chat_ingestion.py: persist call target missing")
          test_text = test_text.replace(old_persist, new_persist, 1)
          test_text = test_text.replace(
              'asyncio.run(fetch_persisted_chat(missing, "post-1", "question"))',
              'asyncio.run(fetch_persisted_chat(missing, "post-1", "question", _replay_scope()))',
              1,
          )
          test_text = test_text.replace(
              'asyncio.run(fetch_persisted_chats(missing, "post-1"))',
              'asyncio.run(fetch_persisted_chats(missing, "post-1", _replay_scope()))',
              1,
          )
          test_text = test_text.replace(
              'exchanges = asyncio.run(fetch_persisted_chats(conn, "post-1"))',
              'exchanges = asyncio.run(fetch_persisted_chats(conn, "post-1", _replay_scope()))',
              1,
          )
          test_path.write_text(test_text)

          # Static RED must now be a real production contract, not only a migration/policy artifact.
          for py_path in (
              "backend/app/post_chat_ingestion.py",
              "backend/app/main.py",
              "tests/test_post_chat_ingestion.py",
              "tests/test_post_chat_authorization_migration_postgres.py",
          ):
              ast.parse(Path(py_path).read_text(), filename=py_path)
          ingestion_now = ingestion.read_text()
          main_now = main_path.read_text()
          assert "PostChatAuthorizationScope" in ingestion_now
          assert "post_chat_authorization_receipt" in ingestion_now
          assert "source_post_scope_sql" in ingestion_now
          assert "_authorization_validated" in main_now
          assert "account.corporate_entity_ids" in main_now
          assert "account.process_unit_ids" in main_now

          Path(".github/workflows/pr1047-causal-repair.yml").unlink()
      - name: Commit ordinary non-force repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/post_chat_ingestion.py backend/app/main.py tests/test_post_chat_ingestion.py tests/test_post_chat_authorization_migration_postgres.py .github/workflows/pr1047-causal-repair.yml
          git diff --cached --check
          git commit -m "fix(security): validate persisted chat replay scope"
          git push origin HEAD:fix/post-chat-replay-scope
