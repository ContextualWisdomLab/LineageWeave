name: Live-authority gap baseline refresh

on:
  push:
    branches:
      - codex/gap-loop-20260912
    paths:
      - .github/workflows/zz-gap-baseline-live-refresh.yml

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: lineageweave-gap-baseline-live-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/gap-loop-20260912
          fetch-depth: 0
      - name: Adopt intervening ordinary delta
        shell: bash
        run: git pull --ff-only origin codex/gap-loop-20260912
      - name: Read live GitHub authority and prepend overlay
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ContextualWisdomLab/LineageWeave
        run: |
          main_sha="$(gh api repos/$GH_REPO/branches/main --jq .commit.sha)"
          pr_head="$(gh api repos/$GH_REPO/pulls/1055 --jq .head.sha)"
          pr_draft="$(gh api repos/$GH_REPO/pulls/1055 --jq .draft)"
          open_prs="$(gh api -X GET search/issues -f q='repo:ContextualWisdomLab/LineageWeave is:pr is:open' --jq .total_count)"
          open_issues="$(gh api -X GET search/issues -f q='repo:ContextualWisdomLab/LineageWeave is:issue is:open' --jq .total_count)"
          export MAIN_SHA="$main_sha" PR_HEAD="$pr_head" PR_DRAFT="$pr_draft" OPEN_PRS="$open_prs" OPEN_ISSUES="$open_issues"
          python - <<'PY'
          import os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          path = Path("docs/product-technical-gap-baseline.md")
          text = path.read_text(encoding="utf-8")
          marker = "# Product & Technical Gap Baseline\n"
          if not text.startswith(marker):
              raise SystemExit("unexpected baseline heading; refusing partial rewrite")
          kst = timezone(timedelta(hours=9))
          now = datetime.now(kst).strftime("%Y-%m-%d %H:%M KST")
          readiness = "Draft" if os.environ["PR_DRAFT"] == "true" else "Ready validation admission"
          overlay = f'''\n\n> Live-authority overlay: {now}. Protected `main` is `{os.environ["MAIN_SHA"]}`;
> inventory is {os.environ["OPEN_PRS"]} open PR / {os.environ["OPEN_ISSUES"]} open issue.
> Customer Master ownership repair #1055 is {readiness} at exact
> `{os.environ["PR_HEAD"]}`. Current repair separates source-post corporate/process
> authorization ownership from corroborated customer identity and delegates corporate
> catalog binding to the accepted `get_or_create_corporate_entity` owner (ADR 0010,
> ADR 0012, ADR 0160) instead of a Customer Master-local display-name lookup/direct
> insert. Source authorization locks are reacquired only for the short exact-source
> revalidation/persistence transaction after external corroboration/catalog resolution.
> Validation evidence from predecessor heads does not transfer across this head.
>
> #1042, #1054, #1047, #1049 and #1046 remain repair prerequisites/Draft unless
> their own live PR authority says otherwise. #1042's Medium CWE-862 period-report
> aggregate disclosure remains owned by #1050/#1054, not duplicated into Customer
> Master relationship code. Canonical central workflow defects remain `.github#1929`
> (required CodeQL producer/consumer ordering) and `.github#2045` (unchanged-head
> Ready reconciliation). Protected-main release metadata is still blocked by the
> tracked `pyproject.toml` 2.28.0 versus `lineageweave.__version__` 2.20.0 mismatch;
> no release is admitted from this overlay. Older overlays below are dated evidence.
'''
          path.write_text(marker + overlay + text[len(marker):], encoding="utf-8")
          PY
      - name: Remove purpose-complete workflow and publish normally
        shell: bash
        run: |
          rm .github/workflows/zz-gap-baseline-live-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/product-technical-gap-baseline.md .github/workflows/zz-gap-baseline-live-refresh.yml
          git diff --cached --check
          git commit -m "docs(gaps): refresh live product authority"
          git push origin HEAD:codex/gap-loop-20260912
