name: Temporary 960 current-head review repair

on:
  push:
    branches:
      - "automation/960-review-repair-current-20260906"

permissions:
  contents: write

concurrency:
  group: temporary-960-current-head-review-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: automation/960-review-repair-current-20260906
          fetch-depth: 0

      - name: Verify exact product head before mutation
        shell: bash
        run: |
          set -euo pipefail
          product=38900637e646f8a6d29438406202e1e67cfc0417
          git fetch origin codex/voice-export-loop-20260906
          test "$(git rev-parse origin/codex/voice-export-loop-20260906)" = "$product"
          test "$(git rev-parse HEAD^)" = "$product"
          test "$(git diff --name-only "$product"..HEAD)" = ".github/workflows/temporary-960-review-repair-current.yml"

      - name: Apply verified current-head repairs
        shell: python
        run: |
          from pathlib import Path

          test_path = Path("frontend/src/api.test.ts")
          text = test_path.read_text(encoding="utf-8")
          old_loop = '''    for (const request of [\n      () => fetchMe("synthetic-token"),\n      () => updateTenantConfig("synthetic-token", "Example tenant"),\n    ]) {\n      const error = await request().catch((reason: unknown) => reason);\n      expect(error).toBeInstanceOf(BackendError);\n      expect(error).toMatchObject({\n        status,\n        message: "The service could not complete this request. Try again later.",\n      });\n      expect(String(error)).not.toContain("synthetic-private-body");\n    }\n'''
          new_loop = '''    const error = await fetchMe("synthetic-token").catch((reason: unknown) => reason);\n    expect(error).toBeInstanceOf(BackendError);\n    expect(error).toMatchObject({\n      status,\n      message: "The service could not complete this request. Try again later.",\n    });\n    expect(String(error)).not.toContain("synthetic-private-body");\n'''
          if text.count(old_loop) != 1:
              raise SystemExit("expected malformed-response request loop once")
          text = text.replace(old_loop, new_loop, 1)

          anchor = '''  it("hides body-stream failures after successful response headers", async () => {\n'''
          write_test = '''  it("does not retry an unreadable successful write response", async () => {\n    const fetchMock = vi.fn().mockImplementation(async () => new Response(\n      'synthetic-private-body {"unfinished":',\n      { status: 201, headers: { "Content-Type": "application/json" } },\n    ));\n    vi.stubGlobal("fetch", fetchMock);\n\n    const error = await updateTenantConfig("synthetic-token", "Example tenant")\n      .catch((reason: unknown) => reason);\n    expect(error).toBeInstanceOf(BackendError);\n    expect(error).toMatchObject({\n      status: 201,\n      message: "The service could not complete this request. Try again later.",\n    });\n    expect(String(error)).not.toContain("synthetic-private-body");\n    expect(fetchMock).toHaveBeenCalledTimes(1);\n  });\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit("body-stream test anchor missing")
          text = text.replace(anchor, write_test + anchor, 1)
          test_path.write_text(text, encoding="utf-8")

          baseline = Path("docs/product-technical-gap-baseline.md")
          text = baseline.read_text(encoding="utf-8")
          old_heading = "## Current bounded audit — 2026-09-06"
          new_heading = "## Bounded audit snapshot — 2026-09-06T13:14:00Z"
          if text.count(old_heading) != 1:
              raise SystemExit("bounded-audit heading missing")
          text = text.replace(old_heading, new_heading, 1)

          old_queue = "Queue rechecked on 2026-09-06 at 13:14 UTC: 122 open PRs (116 Draft, 6 Ready), 16 open issues. A second complete head inventory found no moved heads. This snapshot supersedes queue and runtime claims in the dated historical material below."
          new_queue = "Queue rechecked on 2026-09-06 at 13:14 UTC: 122 open PRs (116 Draft, 6 Ready), 16 open issues. A second complete head inventory found no moved heads. This is time-scoped evidence only: live GitHub PR/check/runtime state supersedes it. It supersedes only older dated snapshots below, not later live state."
          if text.count(old_queue) != 1:
              raise SystemExit("bounded-audit queue sentence missing")
          text = text.replace(old_queue, new_queue, 1)
          baseline.write_text(text, encoding="utf-8")

      - name: Verify focused API and status contracts
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec vitest run src/api.test.ts src/components/StatusNotice.test.tsx

      - name: Verify TypeScript, lint, and production build
        working-directory: frontend
        run: |
          pnpm exec tsc -b
          pnpm exec oxlint
          pnpm exec vite build

      - name: Commit clean repair tree
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/temporary-960-review-repair-current.yml
          git diff --check
          rm "$workflow"
          git add -A
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/' | grep -v '^\.github/workflows/temporary-960-review-repair-current\.yml$' || true)"
          test "$(git diff --cached --name-status -- "$workflow")" = $'D\t.github/workflows/temporary-960-review-repair-current.yml'
          test "$(git diff --cached --name-only | grep -v '^\.github/workflows/temporary-960-review-repair-current\.yml$' | sort)" = $'docs/product-technical-gap-baseline.md\nfrontend/src/api.test.ts'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(api): pin current unreadable-write contract"
          git push origin HEAD:automation/960-review-repair-current-20260906
