name: automation-825-current-824-reconstruction-r10

on:
  push:
    branches:
      - automation/825-current-824-reconstruction-r10-20260907-1320

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 2
      - name: Verify exact current parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "499d653ed6e9206249e3f3a07518ad3fc01f14bd"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
      - name: Install frontend lock
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          cd frontend
          pnpm install --frozen-lockfile
      - name: Apply regression and causal read-model presentation repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, got {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # r5 already proved the buyer-visible RED on exact #824. Persist that regression
          # using the current multiline source shape that r9 incorrectly flattened.
          test_path = Path("frontend/src/App.test.tsx")
          text = test_path.read_text()
          anchor = '''    expect(
            within(screen.getByLabelText("Grouping comparison")).queryByLabelText(
              "Leftover map incomplete items",
            ),
          ).not.toBeInTheDocument();
'''
          addition = '''    expect(
            within(screen.getByLabelText("Grouping comparison")).getAllByLabelText(
              "Leftover map comparison incomplete items",
            ),
          ).toHaveLength(2);
          expect(
            within(screen.getByLabelText("Grouping comparison")).getAllByLabelText(
              "Leftover map comparison incomplete items",
            )[0],
          ).toHaveTextContent("Leftover map dropped 0 incomplete criteria");
          expect(
            within(screen.getByLabelText("Grouping comparison")).getAllByLabelText(
              "Leftover map comparison incomplete items",
            )[1],
          ).toHaveTextContent("Leftover map dropped 1 incomplete criteria");
          expect(
            within(screen.getByLabelText("Grouping comparison")).queryByLabelText(
              "Leftover-map graphic incomplete items",
            ),
          ).not.toBeInTheDocument();
'''
          if text.count(anchor) != 1:
              raise SystemExit(f"App.test current multiline anchor count={text.count(anchor)}")
          test_path.write_text(text.replace(anchor, anchor + addition, 1))

          replace_once(
              "frontend/src/leftoverMapCoverage.ts",
              'export const LEFTOVER_MAP_COMPARE_INCOMPLETE_POST_LABEL = "Leftover map comparison incomplete posts";\n',
              'export const LEFTOVER_MAP_COMPARE_INCOMPLETE_POST_LABEL = "Leftover map comparison incomplete posts";\n\nexport const LEFTOVER_MAP_COMPARE_INCOMPLETE_ITEM_LABEL = "Leftover map comparison incomplete items";\n',
          )
          replace_once(
              "frontend/src/leftoverMapCoverage.ts",
              "ADR 0288 / ADR 0290 / ADR 0291).",
              "ADR 0288 / ADR 0290 / ADR 0291 / ADR 0294).",
          )

          app_path = Path("frontend/src/App.tsx")
          app = app_path.read_text()
          import_anchor = "  LEFTOVER_MAP_COMPARE_INCOMPLETE_POST_LABEL,\n"
          if app.count(import_anchor) != 1:
              raise SystemExit(f"App import anchor count={app.count(import_anchor)}")
          app = app.replace(
              import_anchor,
              import_anchor + "  LEFTOVER_MAP_COMPARE_INCOMPLETE_ITEM_LABEL,\n",
              1,
          )
          count_anchor = """            const comparisonIncompletePostCount = leftoverMapIncompletePostCount(row.leftover_map_coverage);\n"""
          if app.count(count_anchor) != 1:
              raise SystemExit(f"App count anchor count={app.count(count_anchor)}")
          app = app.replace(
              count_anchor,
              count_anchor + "            const comparisonIncompleteItemCount = leftoverMapIncompleteItemCount(row.leftover_map_coverage);\n",
              1,
          )
          render_anchor = '''              {comparisonIncompletePostCount !== null ? (
                <p className="post-meta" role="note" aria-label={t(LEFTOVER_MAP_COMPARE_INCOMPLETE_POST_LABEL)}>
                  {tf(LEFTOVER_MAP_PLOT_INCOMPLETE_POST, comparisonIncompletePostCount)}
                </p>
              ) : null}
'''
          render_addition = '''              {comparisonIncompleteItemCount !== null ? (
                <p className="post-meta" role="note" aria-label={t(LEFTOVER_MAP_COMPARE_INCOMPLETE_ITEM_LABEL)}>
                  {tf(LEFTOVER_MAP_PLOT_INCOMPLETE_ITEM, comparisonIncompleteItemCount)}
                </p>
              ) : null}
'''
          if app.count(render_anchor) != 1:
              raise SystemExit(f"App render anchor count={app.count(render_anchor)}")
          app_path.write_text(app.replace(render_anchor, render_anchor + render_addition, 1))
          PY
          git diff --check
      - name: Apply current inline-locale compatibility copy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/i18n.ts')
          text = p.read_text()
          pairs = [
            ('"Leftover map comparison incomplete posts": "잔여 지도 비교 불완전 글",', '"Leftover map comparison incomplete posts": "잔여 지도 비교 불완전 글",\n    "Leftover map comparison incomplete items": "잔여 지도 비교 불완전 기준",'),
            ('"Leftover map comparison incomplete posts": "残差地图比较不完整帖文",', '"Leftover map comparison incomplete posts": "残差地图比较不完整帖文",\n    "Leftover map comparison incomplete items": "残差地图比较不完整准则",'),
            ('"Leftover map comparison incomplete posts": "残差マップの比較不完全投稿",', '"Leftover map comparison incomplete posts": "残差マップの比較不完全投稿",\n    "Leftover map comparison incomplete items": "残差マップの比較不完全基準",'),
            ('"Leftover map comparison incomplete posts": "Bài không đầy đủ so sánh trên bản đồ phần dư",', '"Leftover map comparison incomplete posts": "Bài không đầy đủ so sánh trên bản đồ phần dư",\n    "Leftover map comparison incomplete items": "Tiêu chí không đầy đủ so sánh trên bản đồ phần dư",'),
          ]
          for old, new in pairs:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'i18n.ts anchor count={count}: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path('frontend/src/i18n.test.ts')
          text = p.read_text()
          old = '    "Leftover map comparison incomplete posts",\n    "Leftover-map graphic item coverage",'
          if text.count(old) != 1:
              raise SystemExit(f'i18n required-label anchor count={text.count(old)}')
          text = text.replace(old, '    "Leftover map comparison incomplete posts",\n    "Leftover map comparison incomplete items",\n    "Leftover-map graphic item coverage",', 1)
          marker = '''  it.each([\n    ["ko", "잔여 지도 그림 기준 포함 범위"],'''
          if text.count(marker) != 1:
              raise SystemExit(f'i18n locale marker count={text.count(marker)}')
          block = '''  it.each([\n    ["ko", "잔여 지도 비교 불완전 기준"],\n    ["zh", "残差地图比较不完整准则"],\n    ["ja", "残差マップの比較不完全基準"],\n    ["vi", "Tiêu chí không đầy đủ so sánh trên bản đồ phần dư"],\n  ] as const)("formats leftover map comparison incomplete items label in %s", (locale, expected) => {\n    setLocale(locale);\n    expect(t("Leftover map comparison incomplete items")).toBe(expected);\n  });\n\n'''
          p.write_text(text.replace(marker, block + marker, 1))
          PY
          git diff --check
      - name: Apply ADR0294 v2.51 identity and bounded authority docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: anchor count={count}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once('pyproject.toml', 'version = "2.50.0"', 'version = "2.51.0"')
          replace_once('lineageweave/__init__.py', '__version__ = "2.50.0"', '__version__ = "2.51.0"')
          p = Path('frontend/package.json')
          data = json.loads(p.read_text())
          if data.get('version') != '2.50.0':
              raise SystemExit(f'frontend version drift={data.get("version")}')
          data['version'] = '2.51.0'
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          entry = '- Grouping comparison rows now show persisted leftover-map incomplete-item count through `leftoverMapIncompleteItemCount` (ADR 0294 / v2.51.0) only for fully caller-visible persisted groupings. Partial visibility remains omitted by the API; valid zero stays visible, and the UI never derives dropped criteria from scored-minus-used.\n\n'
          replace_once('CHANGELOG.md', '### Added\n\n', '### Added\n\n' + entry)
          Path('CHANGELOG.d/2.51.0-leftover-map-compare-incomplete-item.md').write_text('''## 2.51.0 — Grouping comparison incomplete-item coverage\n\n- Show persisted leftover-map incomplete-item coverage on grouping comparison rows with a distinct accessible label (ADR 0294).\n- Preserve API authorization: partial-visibility groupings have no full-population coverage object; the client does not reconstruct or recompute psychometric coverage.\n- Persisted zero remains visible; invalid or contradictory counts are omitted.\n''')
          Path('docs/adr/0294-leftover-map-compare-incomplete-item.md').write_text('''# ADR 0294 — Grouping comparison incomplete-item coverage\n\n**Decision status:** Proposed\n\n## Problem\nThe grouping comparison strip omits the persisted incomplete-item count even though the full persisted grouping read model already carries authorization-filtered coverage.\n\n## Decision\nRender `leftoverMapIncompleteItemCount(row.leftover_map_coverage)` with the distinct accessible label `Leftover map comparison incomplete items`. Reuse the persisted-count validator. Do not derive the count from scored-minus-used, pair count, plotted criteria, or any other client-side proxy.\n\nOnly a full persisted grouping authorized by the API may carry the coverage object. Partial visibility must keep coverage absent; the frontend must not reconstruct a hidden full-population denominator or recompute psychometrics from the visible subset. Valid persisted zero remains visible. Missing, negative, non-integer, or contradictory counts fail closed.\n\nThis ADR remains Proposed while the PR is Draft. Accepted status requires current-head hosted tests, rendered keyboard/accessibility evidence, canonical eight-locale translation-ledger convergence, independent approval, and normal protected-branch merge.\n''')
          Path('tests/test_adr_0294_governance.py').write_text('''from pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\n\ndef test_incomplete_item_comparison_uses_distinct_proposed_adr_0294() -> None:\n    assert (ROOT / "docs/adr/0293-leftover-map-compare-incomplete-post.md").exists()\n    path = ROOT / "docs/adr/0294-leftover-map-compare-incomplete-item.md"\n    assert path.exists()\n    text = path.read_text(encoding="utf-8")\n    assert text.startswith("# ADR 0294 —")\n    assert "**Decision status:** Proposed" in text\n    assert "**Decision status:** Accepted" not in text\n    assert "full persisted grouping" in text and "Partial visibility" in text\n''')
          blocks = {
            'AGENTS.md': 'ADR 0294 keeps grouping-comparison incomplete-item coverage in the LineageWeave read-model boundary: consume only authorization-filtered persisted coverage for a full grouping, omit partial visibility, and never recompute psychometrics in the client.',
            'ARCHITECTURE.md': 'ADR 0294 adds persisted incomplete-item coverage to grouping comparison presentation while the API remains the full-group visibility authority; the frontend formats only an admitted persisted count.',
            'CLAUDE.md': 'ADR 0294 is the Proposed grouping-comparison incomplete-item presentation contract; preserve server-side full-group visibility gating and do not infer dropped criteria in the frontend.',
            'docs/product-technical-gap-baseline.md': '### 2026-09-07 — #825 current-parent reconstruction candidate\n\nExact parent `#824@499d653ed6e9206249e3f3a07518ad3fc01f14bd` lacks the grouping-comparison incomplete-item note while carrying authorization-filtered persisted coverage. ADR 0294 / v2.51.0 adds that buyer-visible read-model presentation and regression. Candidate evidence is not protected-main/release evidence; current-head browser/a11y, canonical eight-locale ledger consumption, independent review, and normal protected merge remain outstanding.',
          }
          for path, block in blocks.items():
              p = Path(path)
              text = p.read_text()
              if block not in text:
                  p.write_text(text.rstrip() + '\n\n' + block + '\n')
          PY
          git diff --check
      - name: Focused UI and i18n GREEN
        working-directory: frontend
        run: |
          pnpm exec vitest run src/App.test.tsx -t "shows the grouping comparison strip and switches grouping on click"
          pnpm exec vitest run src/i18n.test.ts src/leftoverMapCoverage.test.ts
      - name: Frontend lint build Storybook GREEN
        working-directory: frontend
        run: pnpm run lint && pnpm run build && pnpm run build-storybook
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.28"
          enable-cache: false
      - name: Governance and release-identity GREEN
        run: uv run --frozen python -m pytest -q tests/test_adr_0290_governance.py tests/test_adr_0291_governance.py tests/test_adr_0292_governance.py tests/test_adr_0293_governance.py tests/test_adr_0294_governance.py tests/test_package_version.py
      - name: Emit workflow-free clean staging commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/automation-825-current-824-reconstruction-r10.yml
          git diff --check
          git config user.name "LineageWeave automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(reports): restore incomplete-item comparison coverage (v2.51.0)"
          test -z "$(git ls-tree -r --name-only HEAD | grep '^.github/workflows/automation-825-current-824-reconstruction-r10.yml$' || true)"
          git push origin HEAD:automation/825-current-824-reconstruction-r10-20260907-1320
          echo "CLEAN_STAGING_COMMIT=$(git rev-parse HEAD)"
          echo "CLEAN_STAGING_TREE=$(git rev-parse HEAD^{tree})"
