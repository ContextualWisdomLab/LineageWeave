name: Bounded gap baseline 0946 refresh

on:
  push:
    branches:
      - codex/gap-loop-20260912

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: codex/gap-loop-20260912
          persist-credentials: false
      - name: Apply bounded overlay
        run: |
          python scripts/bounded_gap_baseline_0946.py
          git diff --check
      - name: Commit overlay and remove purpose-complete machinery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm scripts/bounded_gap_baseline_0946.py
          rm .github/workflows/bounded-gap-baseline-0946.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/product-technical-gap-baseline.md scripts/bounded_gap_baseline_0946.py .github/workflows/bounded-gap-baseline-0946.yml
          git commit -m 'docs(gaps): refresh customer-master exact-head authority'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:codex/gap-loop-20260912
