name: automation-1120-seed-ropc-repair

on:
  push:
    branches:
      - fix/eliminate-public-client-ropc-20260918

permissions:
  contents: write

# Each exact head gets its own lane. Older queued runs checkout the live branch,
# so the explicit GITHUB_SHA guard below makes them fail closed after a newer
# commit instead of serializing or mutating a descendant head.
concurrency:
  group: automation-1120-seed-ropc-repair-${{ github.sha }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: fix/eliminate-public-client-ropc-20260918
          fetch-depth: 20

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Guard exact head, ancestry, and install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor 6786af06b02c20c339c38720e29af29ef1ad9249 HEAD
          uv sync --frozen --extra dev --extra backend

      - name: Prove focused RED
        shell: bash
        run: |
          set -euo pipefail
          python .github/automation/repair_1120_seed_ropc.py contract
          set +e
          uv run --frozen python -m pytest -q tests/test_seed_demo_identity_contract.py
          status=$?
          set -e
          test "$status" -ne 0

      - name: Apply causal repair
        shell: bash
        run: python .github/automation/repair_1120_seed_ropc.py repair

      - name: Verify focused GREEN
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python -m pytest -q \
            tests/test_seed_demo_identity_contract.py \
            tests/test_makefile_contract.py \
            tests/test_local_service_account_provisioning_contract.py
          uv run --frozen python -m py_compile \
            scripts/seed_demo_data.py \
            scripts/warm_seeded_post_content.py
          ! grep -n '"grant_type": "password"' scripts/seed_demo_data.py scripts/warm_seeded_post_content.py
          ! grep -n 'admin-cli' scripts/seed_demo_data.py scripts/warm_seeded_post_content.py

      - name: Commit repair and delete one-shot automation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          rm .github/workflows/automation-1120-seed-ropc-repair.yml
          rm .github/automation/repair_1120_seed_ropc.py
          expected=$(printf '%s\n' \
            .github/automation/repair_1120_seed_ropc.py \
            .github/workflows/automation-1120-seed-ropc-repair.yml \
            Makefile \
            scripts/seed_demo_data.py \
            scripts/warm_seeded_post_content.py \
            tests/test_makefile_contract.py \
            tests/test_seed_demo_identity_contract.py | sort)
          git add -A
          actual=$(git diff --cached --name-only | sort)
          test "$actual" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(auth): remove seed password grants"
          git push origin HEAD:fix/eliminate-public-client-ropc-20260918
