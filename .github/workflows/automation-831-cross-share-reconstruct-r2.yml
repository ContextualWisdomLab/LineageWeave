name: Stage current #831 cross-share reconstruction

on:
  push:
    branches:
      - automation/831-cross-share-reconstruct-r2-20260911

permissions:
  contents: write

concurrency:
  group: automation-831-cross-share-reconstruct-r2-20260911
  cancel-in-progress: true

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc4999588649806c4e8e9fbe298e2eca468e6018e6a5f4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CURRENT_PARENT: bebd77c03e5beae469f42361c20bccc80787ebb5
      LINEAGEWEAVE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: automation/831-cross-share-reconstruct-r2-20260911
          fetch-depth: 4

      - name: Verify exact current parent
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$CURRENT_PARENT" HEAD
          git diff --quiet "$CURRENT_PARENT" HEAD -- . ':(exclude).github/workflows/automation-831-cross-share-reconstruct-r2.yml' ':(exclude).automation/pr831_reconstruct_current.py'

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Prove current parent RED
        shell: bash
        run: |
          set -euo pipefail
          python .automation/pr831_reconstruct_current.py red
          set +e
          (cd frontend && pnpm exec vitest run src/App.test.tsx) > /tmp/pr831-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/pr831-red.log
          test "$rc" -ne 0
          grep -qi "leftover map comparison cross share" /tmp/pr831-red.log
          git checkout "$CURRENT_PARENT" -- frontend/src/App.test.tsx

      - name: Apply minimal reconstruction
        run: |
          set -euo pipefail
          python .automation/pr831_reconstruct_current.py apply
          git diff --check

      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Regenerate universal lock
        run: uv lock

      - name: Lint frontend
        working-directory: frontend
        run: pnpm run lint

      - name: Run focused frontend GREEN
        working-directory: frontend
        run: pnpm exec vitest run src/App.test.tsx src/leftoverMapCrossShare.test.ts src/leftoverMapUnexplainedShare.test.ts src/leftoverMapCompareAxis.test.ts src/leftoverMapCompareAxisAccessibility.test.ts

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Build Storybook
        working-directory: frontend
        run: pnpm run build-storybook

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Select pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra backend

      - name: Run release and composition contracts
        run: |
          uv run --frozen python -m pytest -q tests/test_leftover_map_compare_cross_share_release_authority.py tests/test_compare_axis_share_accessibility_contract.py tests/test_compare_axis_share_visibility.py tests/test_leftover_map_axis_share_adr_authority.py tests/test_leftover_map_compare_axis_singular_accessibility.py tests/test_leftover_map_compare_axis_singular_release_authority.py

      - name: Run full PostgreSQL backed suite
        run: uv run --frozen python -m pytest -q

      - name: Commit workflow free reconstructed tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/automation-831-cross-share-reconstruct-r2.yml .automation/pr831_reconstruct_current.py
          git config user.name "LineageWeave automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.tsx frontend/src/App.test.tsx frontend/src/leftoverMapCrossShare.ts frontend/src/leftoverMapCrossShare.test.ts frontend/package.json lineageweave/__init__.py pyproject.toml uv.lock docs/adr/0372-leftover-map-compare-cross-share.md CHANGELOG.d/2.57.0-leftover-map-compare-cross-share.md tests/test_leftover_map_compare_cross_share_release_authority.py
          git diff --cached --check
          git commit -m "feat(reports): reconstruct persisted comparison cross share"
          git push origin HEAD:automation/831-cross-share-reconstruct-r2-20260911
