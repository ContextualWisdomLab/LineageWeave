            docs/adr/0031-authenticated-mcp-global-ask.md \
            .github/workflows/mcp-global-ask-multimodal-one-shot.yml
          git commit -m "feat: return cited images from MCP Global Ask"
          git push origin HEAD:agent/authenticated-mcp-global-ask
