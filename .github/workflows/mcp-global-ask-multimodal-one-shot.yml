              "        assert result.content[1].mime_type == \"image/png\"\n"
              "        assert result.content[1].data == \"cHJvamVjdC10aW1lbGluZQ==\"\n"
              "        assert result.structured_content == {\n",
          )
          replace_once(
              "tests/test_mcp_server.py",
              "            \"answer_text\": \"Grounded\",\n            \"anchor_post_id\": \"post-1\",\n",
              "            \"answer_text\": \"Grounded\",\n"
              "            \"content_blocks\": [\n"
              "                {\n"
