              "                    \"caption\": \"Evidence\",\n"
              "                },\n"
              "            ],\n"
              "            \"anchor_post_id\": \"post-1\",\n",
          )

          fragment = Path("CHANGELOG.d/2.13.0-authenticated-mcp-global-ask.md")
          fragment_text = fragment.read_text(encoding="utf-8")
          media_entry = (
              "\n- MCP Global Ask now emits the answer as `TextContent` followed by up to three "
              "bounded `ImageContent` blocks reconstructed only from authorized cited post bodies. "
              "The structured response carries captions and alternative text; SVG/active media and "
              "oversized payloads fail closed.\n"
          )
          if media_entry.strip() not in fragment_text:
              fragment.write_text(fragment_text.rstrip() + media_entry, encoding="utf-8")

          integration = Path("docs/integrations/MCP.md")
          integration_text = integration.read_text(encoding="utf-8")
          marker = "## Multimodal Global Ask"
          if marker not in integration_text:
              integration.write_text(
                  integration_text
                  + '''

## Multimodal Global Ask

When an authorized cited post contains embedded raster images, `global_ask`
returns the prose as MCP `TextContent` and follows it with up to three MCP
`ImageContent` blocks. `structuredContent.content_blocks` preserves the cited
post id, document unit index, MIME type, caption, and alternative text. Images
are restricted to PNG, JPEG, WebP, and GIF, with 2 MiB per-image and 4 MiB
aggregate limits. SVG and other active media are not emitted.
''',
                  encoding="utf-8",
              )

          refs = Path("docs/doctoring/MCP_REFERENCES.md")
          refs_text = refs.read_text(encoding="utf-8")
          reference = "\nMasinter, L. (1998). *The “data” URL scheme* (RFC 2397). RFC Editor. https://doi.org/10.17487/RFC2397\n"
          if reference.strip() not in refs_text:
              refs.write_text(refs_text.rstrip() + reference, encoding="utf-8")

          adr = Path("docs/adr/0031-authenticated-mcp-global-ask.md")
          adr_text = adr.read_text(encoding="utf-8")
          adr_marker = "## Multimodal result boundary"
          if adr_marker not in adr_text:
              adr.write_text(
                  adr_text
                  + '''

## Multimodal result boundary

The MCP tool may emit raster images only when their owning posts survived the
same RBAC/ABAC retrieval boundary and were actually cited by the answer. The
server reconstructs bytes from the original cited body, never from an external
URL, and returns bounded MCP `ImageContent` alongside structured caption and
alternative-text metadata. Active image formats and oversized payloads are
excluded.
''',
                  encoding="utf-8",
              )
