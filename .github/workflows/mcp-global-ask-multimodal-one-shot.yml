              "        source_post_ids=source_ids,\n    )\n",
              "        source_post_ids=source_ids,\n"
              "        content_blocks=content_blocks,\n"
              "    )\n",
          )

          replace_once(
              "backend/app/mcp_server.py",
              "from typing import Any\n",
              "from typing import Annotated, Any, Literal\n",
          )
          replace_once(
              "backend/app/mcp_server.py",
              "from mcp.types import ToolAnnotations\n",
              "from mcp.types import CallToolResult, ImageContent, TextContent, ToolAnnotations\n",
          )
          replace_once(
              "backend/app/mcp_server.py",
              "class GlobalAskResult(BaseModel):\n",
              '''class GlobalAskContentBlockModel(BaseModel):
    """Structured metadata for one text or image response block."""

    type: Literal["text", "image"]
    text: str | None = None
    post_id: str | None = None
    unit_index: int | None = None
    mime_type: str | None = None
    data_base64: str | None = None
    alt_text: str | None = None
    caption: str | None = None


class GlobalAskResult(BaseModel):
''',
          )
          replace_once(
              "backend/app/mcp_server.py",
              "    answer_text: str\n    anchor_post_id: str\n",
              "    answer_text: str\n"
              "    content_blocks: list[GlobalAskContentBlockModel] = Field(default_factory=list)\n"
              "    anchor_post_id: str\n",
          )
          replace_once(
              "backend/app/mcp_server.py",
              '        version="1.0.0",\n',
              '        version="1.0.1",\n',
          )
          replace_once(
              "backend/app/mcp_server.py",
              "    ) -> GlobalAskResult:\n",
              "    ) -> Annotated[CallToolResult, GlobalAskResult]:\n",
          )
          replace_once(
              "backend/app/mcp_server.py",
              "        return GlobalAskResult(\n            **asdict(result),\n            external_verification_status=verification.status_code,\n            external_evidence_urls=list(verification.evidence_urls),\n            external_verification_rationale=verification.rationale,\n        )\n",
              '''        structured = GlobalAskResult(
            **asdict(result),
            external_verification_status=verification.status_code,
            external_evidence_urls=list(verification.evidence_urls),
            external_verification_rationale=verification.rationale,
        )
        content = [TextContent(type="text", text=result.answer_text)]
        for block in result.content_blocks:
            if block.type != "image" or not block.data_base64 or not block.mime_type:
                continue
            content.append(
                ImageContent(
                    type="image",
                    data=block.data_base64,
                    mime_type=block.mime_type,
                )
            )
        return CallToolResult(
            content=content,
            structured_content=structured.model_dump(mode="json"),
        )
''',
          )

          replace_once(
              "tests/test_mcp_server.py",
              "from mcp.server.transport_security import TransportSecuritySettings\n",
              "from mcp.server.transport_security import TransportSecuritySettings\n"
              "from mcp.types import ImageContent, TextContent\n",
          )
          replace_once(
              "tests/test_mcp_server.py",
              "from backend.app.global_ask import GlobalAskAnswer\n",
              "from backend.app.global_ask import GlobalAskAnswer\n"
              "from backend.app.global_ask_media import GlobalAskContentBlock\n",
          )
          replace_once(
              "tests/test_mcp_server.py",
              "            source_post_ids=(\"post-1\",),\n        )\n",
              "            source_post_ids=(\"post-1\",),\n"
              "            content_blocks=(\n"
              "                GlobalAskContentBlock(type=\"text\", text=\"Grounded\"),\n"
              "                GlobalAskContentBlock(\n"
              "                    type=\"image\",\n"
              "                    post_id=\"post-1\",\n"
