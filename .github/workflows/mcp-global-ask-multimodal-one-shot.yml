              "    cited_posts = tuple(cited_post_summaries(sources, cited_ids))\n"
              "    content_blocks = await load_global_ask_content_blocks(\n"
              "        conn, answer.answer_text, cited_ids\n"
              "    )\n"
              "    return GlobalAskAnswer(\n",
          )
          replace_once(
