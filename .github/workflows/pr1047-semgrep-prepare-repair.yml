name: Temporary PR 1047 prepared replay query repair

on:
  push:
    branches:
      - fix/post-chat-replay-scope

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: fix/post-chat-replay-scope
          fetch-depth: 0

      - name: Use an explicit prepared statement for trusted composed SQL
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast

          path = Path("backend/app/post_chat_ingestion.py")
          text = path.read_text()
          old = "    rows = await conn.fetch(\n        _POST_CHAT_VISIBLE_CAPTURED_SOURCE_SQL,\n        sorted(current_scope.corporate_entity_ids),\n        sorted(current_scope.process_unit_ids),\n        list(source_post_ids),\n    )\n"
          new = "    statement = await conn.prepare(_POST_CHAT_VISIBLE_CAPTURED_SOURCE_SQL)\n    rows = await statement.fetch(\n        sorted(current_scope.corporate_entity_ids),\n        sorted(current_scope.process_unit_ids),\n        list(source_post_ids),\n    )\n"
          if text.count(old) != 1:
              raise SystemExit("exact replay query target missing")
          text = text.replace(old, new, 1)
          ast.parse(text, filename=str(path))
          path.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/post_chat_ingestion.py
          git diff --cached --check
          git commit -m "fix(security): prepare composed replay authorization SQL"
          git push origin HEAD:fix/post-chat-replay-scope
