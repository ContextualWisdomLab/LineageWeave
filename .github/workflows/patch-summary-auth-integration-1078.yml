name: Patch summary authorization integration regression 1078

on:
  push:
    branches:
      - fix/summary-catalog-authorization-1078

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/summary-catalog-authorization-1078
          fetch-depth: 0

      - name: Add authenticated reader/admin catalog regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          api_path = Path('backend/tests/test_api.py')
          api = api_path.read_text()

          target = '''    from lineageweave.post_summary import ACTOR_TYPE_TEAM, PostSummary, RoleResponsibility

    class _FakeSummaryClient:
'''
          replacement = '''    from lineageweave.post_summary import ACTOR_TYPE_TEAM, PostSummary, RoleResponsibility

    _grant_post_admin(seeded_db["dsn"])

    class _FakeSummaryClient:
'''
          if api.count(target) != 1:
              raise SystemExit(f'expected one same-team admin insertion point, found {api.count(target)}')
          api = api.replace(target, replacement, 1)

          marker = '''

def test_organization_mention_only_posts_appear_in_entity_related(
