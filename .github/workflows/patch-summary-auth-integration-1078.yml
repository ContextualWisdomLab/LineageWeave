name: Patch summary authorization integration regression 1078

on:
  push:
    branches:
      - fix/summary-catalog-authorization-1078

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Repair stale authorization contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          api_path = Path("backend/tests/test_api.py")
          api = api_path.read_text()
          target = "    from lineageweave.post_summary import ACTOR_TYPE_TEAM, PostSummary, RoleResponsibility\n\n    class _FakeSummaryClient:\n"
          replacement = "    from lineageweave.post_summary import ACTOR_TYPE_TEAM, PostSummary, RoleResponsibility\n\n    _grant_post_admin(seeded_db[\"dsn\"])\n\n    class _FakeSummaryClient:\n"
          if api.count(target) != 1:
              raise SystemExit(f"expected one same-team admin insertion point, found {api.count(target)}")
          api = api.replace(target, replacement, 1)
          ast.parse(api)
          api_path.write_text(api)
          contract_path = Path("tests/test_ingestion_transaction_contracts.py")
          contracts = contract_path.read_text()
          def add_explicit_enrichment(function_name: str, source: str) -> str:
              start = source.index(f"def {function_name}")
              next_def = source.find("\ndef ", start + 4)
              end = len(source) if next_def == -1 else next_def
              section = source[start:end]
              needle = "            str(uuid.uuid4()),\n            summary,\n        )"
              if section.count(needle) != 1:
                  raise SystemExit(f"expected one persist call in {function_name}, found {section.count(needle)}")
              replacement_call = "            str(uuid.uuid4()),\n            summary,\n            allow_catalog_enrichment=True,\n        )"
              section = section.replace(needle, replacement_call, 1)
              return source[:start] + section + source[end:]
          contracts = add_explicit_enrichment("test_post_summary_replacement_mentions_and_edges_share_one_transaction", contracts)
          contracts = add_explicit_enrichment("test_organization_enrichment_finishes_before_summary_transaction", contracts)
          ast.parse(contracts)
          contract_path.write_text(contracts)
          PY

      - name: Verify repaired test source
        shell: bash
        run: |
          python -m py_compile backend/tests/test_api.py tests/test_ingestion_transaction_contracts.py
          grep -n '_grant_post_admin(seeded_db\["dsn"\])' backend/tests/test_api.py
          test "$(grep -c 'allow_catalog_enrichment=True' tests/test_ingestion_transaction_contracts.py)" -ge 2

      - name: Commit contracts and remove temporary patcher
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/fix/summary-catalog-authorization-1078 | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          rm .github/workflows/patch-summary-auth-integration-1078.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/tests/test_api.py tests/test_ingestion_transaction_contracts.py .github/workflows/patch-summary-auth-integration-1078.yml
          git commit -m 'test(security): make summary catalog authority explicit (#1078)'
          git push origin HEAD:fix/summary-catalog-authorization-1078
