def test_post_read_summary_materialization_cannot_mutate_shared_catalogs(
    client, demo_analyst_token, seeded_db, monkeypatch
) -> None:
    """Real OIDC/API/PostgreSQL proof of the summary catalog-write boundary."""
    from lineageweave.corporate_hierarchy_inference import HierarchyProposal
    from lineageweave.post_summary import (
        ACTOR_TYPE_ORGANIZATION,
        ACTOR_TYPE_TEAM,
        PostSummary,
        RoleResponsibility,
    )
    from lineageweave.relation_verification import (
        STATUS_CORROBORATED,
        RelationVerificationResult,
    )

    reader_org = "Reader Summary Never Create Corp"
    reader_team = "Reader Summary Never Create Team"
    admin_org = "Admin Summary Create Corp"
    admin_team = "Admin Summary Create Team"

    class _FakeSummaryClient:
        available = True

        def summarize(self, post_title: str, post_body: str) -> PostSummary:
            if post_title.startswith("Reader summary auth"):
                organization_name, team_name = reader_org, reader_team
            else:
                organization_name, team_name = admin_org, admin_team
            return PostSummary(
                korean_summary="권한 경계를 검증하는 합성 요약이다.",
                roles_and_responsibilities=(
                    RoleResponsibility(
                        actor_name=organization_name,
                        responsibility="조직 역할",
                        actor_type_code=ACTOR_TYPE_ORGANIZATION,
                    ),
                    RoleResponsibility(
                        actor_name=team_name,
                        responsibility="팀 역할",
                        actor_type_code=ACTOR_TYPE_TEAM,
                        affiliated_organization_name=organization_name,
                    ),
                ),
            )

    hierarchy_factory_calls = 0
    verification_factory_calls = 0

    class _FakeHierarchyInferenceClient:
        available = True

        def infer(self, organization_name: str, context_text: str) -> HierarchyProposal:
            return HierarchyProposal(level_code="company", parent_name=None)

    class _FakeVerificationClient:
        available = True

        def verify(self, organization_name: str, relationship_label: str) -> RelationVerificationResult:
            return RelationVerificationResult(
                status_code=STATUS_CORROBORATED,
                evidence_url=f"https://example.org/{organization_name.replace(' ', '-')}",
            )

    def hierarchy_factory():
        nonlocal hierarchy_factory_calls
        hierarchy_factory_calls += 1
        return _FakeHierarchyInferenceClient()

    def verification_factory():
        nonlocal verification_factory_calls
        verification_factory_calls += 1
        return _FakeVerificationClient()

    monkeypatch.setattr("backend.app.main._post_summary_client", lambda: _FakeSummaryClient())
    monkeypatch.setattr("backend.app.main._corporate_hierarchy_inference_client", hierarchy_factory)
    monkeypatch.setattr("backend.app.main._relation_verification_client", verification_factory)

    admin_conn = psycopg2.connect(seeded_db["dsn"])
    admin_conn.autocommit = True
    try:
        with admin_conn.cursor() as cur:
            post_ids = []
            for title in ("Reader summary auth", "Admin summary auth"):
                cur.execute(
                    "insert into source_post (author_account_id, corporate_entity_id, post_title, post_body, voc_type_code, visibility_code) "
                    "select author_account_id, corporate_entity_id, %s, %s, 'voc', 'public' "
                    "from source_post where post_id = %s returning post_id",
                    (title, "authorization evidence body", seeded_db["own_private_post_id"]),
                )
                post_ids.append(str(cur.fetchone()[0]))
            cur.execute(
                "select corporate_entity_id::text, parent_entity_id::text, corporate_entity_code, entity_name, entity_level_code "
                "from corporate_entity order by corporate_entity_id"
            )
            corporate_before = cur.fetchall()
            cur.execute(
                "select team_id::text, team_name, affiliated_organization_name "
                "from cataloged_team order by team_id"
            )
            teams_before = cur.fetchall()
    finally:
        admin_conn.close()

    headers = {"Authorization": f"Bearer {demo_analyst_token}"}
    reader = client.get(f"/api/posts/{post_ids[0]}/summary", headers=headers)
    assert reader.status_code == 200, reader.text
    assert hierarchy_factory_calls == 0
    assert verification_factory_calls == 0

    admin_conn = psycopg2.connect(seeded_db["dsn"])
    admin_conn.autocommit = True
    try:
        with admin_conn.cursor() as cur:
            cur.execute(
                "select corporate_entity_id::text, parent_entity_id::text, corporate_entity_code, entity_name, entity_level_code "
                "from corporate_entity order by corporate_entity_id"
            )
            assert cur.fetchall() == corporate_before
            cur.execute(
                "select team_id::text, team_name, affiliated_organization_name "
                "from cataloged_team order by team_id"
            )
            assert cur.fetchall() == teams_before
            cur.execute(
                "select cataloged_corporate_entity_id, cataloged_team_id from post_summary_role "
                "where post_id = %s order by role_ordinal",
                (post_ids[0],),
            )
            reader_bindings = cur.fetchall()
    finally:
        admin_conn.close()
    assert reader_bindings == [(None, None), (None, None)]

    _grant_post_admin(seeded_db["dsn"])
    admin = client.get(f"/api/posts/{post_ids[1]}/summary", headers=headers)
    assert admin.status_code == 200, admin.text
    assert hierarchy_factory_calls > 0
    assert verification_factory_calls > 0

    admin_conn = psycopg2.connect(seeded_db["dsn"])
    try:
        with admin_conn.cursor() as cur:
            cur.execute(
                "select count(*) from corporate_entity where entity_name = %s",
                (admin_org,),
            )
            assert cur.fetchone()[0] == 1
            cur.execute(
                "select count(*) from cataloged_team where team_name = %s and affiliated_organization_name = %s",
                (admin_team, admin_org),
            )
            assert cur.fetchone()[0] == 1
    finally:
        admin_conn.close()
'''
          api_path.write_text(api.replace(marker, regression + marker, 1))

          contract_path = Path('tests/test_ingestion_transaction_contracts.py')
          contracts = contract_path.read_text()

          def add_explicit_enrichment(function_name: str, source: str) -> str:
              start = source.index(f'def {function_name}')
              next_def = source.find('\ndef ', start + 4)
              end = len(source) if next_def == -1 else next_def
              section = source[start:end]
              needle = '''            str(uuid.uuid4()),
            summary,
        )'''
              if section.count(needle) != 1:
                  raise SystemExit(
                      f'expected one persist call in {function_name}, found {section.count(needle)}'
                  )
              section = section.replace(
                  needle,
                  '''            str(uuid.uuid4()),
            summary,
            allow_catalog_enrichment=True,
        )''',
                  1,
              )
              return source[:start] + section + source[end:]

          contracts = add_explicit_enrichment(
              'test_post_summary_replacement_mentions_and_edges_share_one_transaction', contracts
          )
          contracts = add_explicit_enrichment(
              'test_organization_enrichment_finishes_before_summary_transaction', contracts
          )
          contract_path.write_text(contracts)
          PY

      - name: Verify repaired test source
        shell: bash
        run: |
          python -m compileall -q backend/tests/test_api.py tests/test_ingestion_transaction_contracts.py
          git diff --check
          grep -n "test_post_read_summary_materialization_cannot_mutate_shared_catalogs" backend/tests/test_api.py
          grep -n "allow_catalog_enrichment=True" tests/test_ingestion_transaction_contracts.py

      - name: Commit regressions and remove temporary patcher
        shell: bash
        run: |
          rm .github/workflows/patch-summary-auth-integration-1078.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/tests/test_api.py tests/test_ingestion_transaction_contracts.py .github/workflows/patch-summary-auth-integration-1078.yml
          git commit -m 'test(security): prove summary catalog authorization (#1078)'
          git push origin HEAD:fix/summary-catalog-authorization-1078
