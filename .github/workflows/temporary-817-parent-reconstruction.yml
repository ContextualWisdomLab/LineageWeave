name: Temporary 817 parent reconstruction

on:
  push:
    branches:
      - "automation/817-parent-reconstruction-20260906"

permissions:
  contents: write

concurrency:
  group: temporary-817-parent-reconstruction
  cancel-in-progress: true

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact reconstruction branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: automation/817-parent-reconstruction-20260906
          fetch-depth: 0

      - name: Verify exact current parent and historical child
        shell: bash
        run: |
          set -euo pipefail
          parent=8ac4f2677ac90bbcc7609d87135f4efcae28d506
          product=aec85c32ccaf66140d5d3b0e2eaea365cf3becf5
          git fetch origin feat/leftover-map-list-item-coverage-v2420 feat/leftover-map-list-incomplete-post-v2430
          test "$(git rev-parse origin/feat/leftover-map-list-item-coverage-v2420)" = "$parent"
          test "$(git rev-parse origin/feat/leftover-map-list-incomplete-post-v2430)" = "$product"
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git diff --name-only "$parent"..HEAD)" = ".github/workflows/temporary-817-parent-reconstruction.yml"

      - name: Reapply only the v2.43 product delta and executable governance contract
        shell: bash
        run: |
          set -euo pipefail
          feature=ef30930271a729044af2f690df04f0b89f751ffd
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git cherry-pick --no-commit "$feature"
          python - <<'PY'
          from pathlib import Path
          Path("tests/test_adr_0286_governance.py").write_text(
              '''"""Governance regression for the draft ADR 0286 decision state."""\n\nfrom pathlib import Path\n\n\nADR_PATH = Path(__file__).parents[1] / "docs/adr/0286-leftover-map-list-incomplete-post.md"\n\n\ndef test_draft_adr_0286_remains_proposed() -> None:\n    """Keep the unmerged decision proposed until independent acceptance exists."""\n    text = ADR_PATH.read_text(encoding="utf-8")\n    assert "**Decision status:** Proposed" in text\n    assert "**Decision status:** Accepted" not in text\n''',
              encoding="utf-8",
          )
          PY

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Install locked dev dependencies
        run: uv sync --frozen --extra dev

      - name: Verify realistic release and governance RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          uv run --frozen python -m pytest -q tests/test_package_version.py >/tmp/release-red.log 2>&1
          release_status=$?
          uv run --frozen python -m pytest -q tests/test_adr_0286_governance.py >/tmp/governance-red.log 2>&1
          governance_status=$?
          set -e
          cat /tmp/release-red.log
          cat /tmp/governance-red.log
          test "$release_status" -ne 0
          test "$governance_status" -ne 0
          grep -q 'test_release_versions_are_synchronized' /tmp/release-red.log
          grep -q 'test_draft_adr_0286_remains_proposed' /tmp/governance-red.log

      - name: Apply minimal causal release and governance fix
        shell: python
        run: |
          import json
          import re
          import tomllib
          from pathlib import Path

          adr = Path("docs/adr/0286-leftover-map-list-incomplete-post.md")
          text = adr.read_text(encoding="utf-8")
          old = "**Decision status:** Accepted"
          if text.count(old) != 1:
              raise SystemExit(f"expected one ADR0286 Accepted marker, found {text.count(old)}")
          adr.write_text(text.replace(old, "**Decision status:** Proposed", 1), encoding="utf-8")

          init_path = Path("lineageweave/__init__.py")
          init_text = init_path.read_text(encoding="utf-8")
          init_text, count = re.subn(
              r'^__version__ = "[^"]+"$',
              '__version__ = "2.43.0"',
              init_text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("runtime version declaration missing")
          init_path.write_text(init_text, encoding="utf-8")

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          frontend = json.loads(Path("frontend/package.json").read_text(encoding="utf-8"))
          runtime = re.search(r'^__version__ = "([^"]+)"$', init_text, re.MULTILINE)
          versions = (project["project"]["version"], frontend["version"], runtime.group(1) if runtime else None)
          if versions != ("2.43.0", "2.43.0", "2.43.0"):
              raise SystemExit(f"release identity drift after reconstruction: {versions!r}")

      - name: Verify inherited parent authority remains present
        shell: python
        run: |
          from pathlib import Path

          i18n = Path("frontend/src/i18n.ts").read_text(encoding="utf-8")
          assert "tỷ phần phần dư được giải thích trên bản đồ phần dư {label}" in i18n
          assert "tỷ phần phần dư được giải thích e" in i18n
          assert "phần dư giải thích bản đồ phần dư {label}" not in i18n

          vi_test = Path("frontend/src/leftoverMapPlotVietnameseCopy.test.ts").read_text(encoding="utf-8")
          assert 'import { LEFTOVER_MAP_PLOT_CAPTION } from "./leftoverMapPlotLayout";' in vi_test
          assert "GRAPHIC_DISPLAY_COPY" not in vi_test

          for path in (
              "docs/adr/0283-leftover-map-plot-incomplete.md",
              "docs/adr/0284-leftover-map-plot-incomplete-item.md",
              "docs/adr/0285-leftover-map-list-item-coverage.md",
              "docs/adr/0286-leftover-map-list-incomplete-post.md",
          ):
              text = Path(path).read_text(encoding="utf-8")
              assert "**Decision status:** Proposed" in text
              assert "**Decision status:** Accepted" not in text

      - name: Verify exact GREEN for release and governance contracts
        run: uv run --frozen python -m pytest -q tests/test_package_version.py tests/test_adr_0285_governance.py tests/test_adr_0286_governance.py

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Verify v2.43 and inherited frontend contracts
        working-directory: frontend
        run: >-
          pnpm exec vitest run
          src/App.test.tsx
          src/i18n.test.ts
          src/leftoverMapCoverage.test.ts
          src/leftoverMapPlotLayout.test.ts
          src/leftoverMapPlotSmallCanvas.test.ts
          src/leftoverMapPlotVietnameseCopy.test.ts
          src/components/LeftoverMapPlot.test.tsx
          src/components/LeftoverPairList.test.tsx

      - name: Verify frontend lint
        working-directory: frontend
        run: pnpm exec oxlint

      - name: Commit clean reconstructed tree
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/temporary-817-parent-reconstruction.yml
          git diff --check
          rm "$workflow"
          git add -A
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/' | grep -v '^\.github/workflows/temporary-817-parent-reconstruction\.yml$' || true)"
          test "$(git diff --cached --name-status -- "$workflow")" = $'D\t.github/workflows/temporary-817-parent-reconstruction.yml'
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m "merge: reconstruct #817 on current #816 parent"
          git push origin HEAD:automation/817-parent-reconstruction-20260906
