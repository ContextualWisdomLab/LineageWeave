name: Apply adaptive contextual-orchestrator consumer default

on:
  push:
    branches:
      - agent/adaptive-orchestrator-default
    paths:
      - scripts/apply_adaptive_orchestrator_default.py
      - .github/workflows/apply-adaptive-orchestrator-default.yml

permissions:
  contents: write

concurrency:
  group: apply-adaptive-orchestrator-default-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply bounded source transformation
        run: python scripts/apply_adaptive_orchestrator_default.py

      - name: Compile production and contract test sources
        run: python -m compileall -q lineageweave tests/test_contextual_orchestrator_default_policy.py

      - name: Run dependency-free policy contract
        run: python tests/test_contextual_orchestrator_default_policy.py

      - name: Inspect patch
        run: git diff --check

      - name: Publish verified implementation commit
        env:
          TARGET_BRANCH: agent/adaptive-orchestrator-default
        run: |
          rm scripts/apply_adaptive_orchestrator_default.py
          rm .github/workflows/apply-adaptive-orchestrator-default.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "fix(ai): default consumers to adaptive orchestration"
          git push origin "HEAD:${TARGET_BRANCH}"
