name: Apply ontology semantic-path repair

on:
  push:
    branches:
      - feat/event-lineage-node-keeps-gnb-focus-v2170

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LINEAGEWEAVE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
      REPAIR_BRANCH: feat/event-lineage-node-keeps-gnb-focus-v2170
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: feat/event-lineage-node-keeps-gnb-focus-v2170
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install locked dependencies
        run: |
          corepack enable
          uv sync --frozen --extra dev --extra backend
          pnpm --dir frontend install --frozen-lockfile

      - name: Prove RED root cause
        shell: bash
        run: |
          set +e
          uv run --frozen python - <<'PY'
          from rdflib.namespace import RDFS
          from lineageweave.ontology import LW, load_ontology
          graph = load_ontology()
          assert (LW.mentions, RDFS.domain, LW.Person) in graph
          assert (LW.mentions, RDFS.range, LW.Post) in graph
          PY
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected pre-repair ontology mismatch was not reproduced." >&2
            exit 1
          fi

      - name: Apply minimal semantic repair
        run: python .github/scripts/apply_ontology_semantic_path.py

      - name: Verify focused GREEN contracts
        run: |
          uv run --frozen python -m pytest -q \
            tests/test_semantic_relationship_paths.py \
            tests/test_ontology.py \
            tests/test_knowledge_graph.py \
            tests/test_person_mention_projection.py
          pnpm --dir frontend exec vitest run src/components/RelatedSemanticPath.test.tsx

      - name: Verify full product suites
        run: |
          uv run --frozen python -m pytest -q
          pnpm --dir frontend run lint
          pnpm --dir frontend run test
          pnpm --dir frontend run build
          pnpm --dir frontend run build-storybook

      - name: Commit verified source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -- .github/scripts/apply_ontology_semantic_path.py \
            .github/workflows/apply-ontology-semantic-path.yml \
            .github/workflows/fix-264-ontology-semantic-path.yml

          git add -- \
            docs/ontology/lineageweave-kg.ttl \
            lineageweave/ontology.py \
            lineageweave/knowledge_graph.py \
            backend/app/knowledge_graph.py \
            frontend/src/api.ts \
            frontend/src/App.tsx \
            frontend/src/components/RelatedSemanticPath.tsx \
            frontend/src/components/RelatedSemanticPath.test.tsx \
            tests/test_ontology.py \
            tests/test_semantic_relationship_paths.py \
            docs/adr/0090-ontology-grounded-semantic-relationship-path.md \
            docs/doctoring/SEMANTIC_RELATIONSHIP_PATH_REFERENCES.md \
            CHANGELOG.d/2.17.0-ontology-semantic-path.md

          if git diff --cached --quiet; then
            echo "No verified repair changes to commit." >&2
            exit 1
          fi
          git commit -m "fix: expose ontology-grounded semantic relationship paths"
          git push origin "HEAD:${REPAIR_BRANCH}"
