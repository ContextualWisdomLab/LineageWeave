name: Repair MCP rate-limit SDK contract once

on:
  push:
    branches:
      - "feat/mcp-principal-rate-limit-v2132"
    paths:
      - ".github/workflows/repair-mcp-rate-limit-sdk-contract.yml"

permissions:
  contents: write

concurrency:
  group: repair-mcp-rate-limit-sdk-contract
  cancel-in-progress: false

jobs:
  repair:
    name: Verify structured principal quota errors
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:8-alpine@sha256:a038175878d66b9d274fbf8be73c0305e93798b83917647f167e18cef3c71eec
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: feat/mcp-principal-rate-limit-v2132
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Materialize the pinned SDK error constructor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/app/mcp_server.py")
          source = path.read_text(encoding="utf-8")
          replacements = (
              (
                  "from mcp.types import CallToolResult, ErrorData, ImageContent, TextContent, ToolAnnotations",
                  "from mcp.types import CallToolResult, ImageContent, TextContent, ToolAnnotations",
              ),
              (
                  '''            raise MCPError(
                      ErrorData(
                          code=GLOBAL_ASK_RATE_LIMIT_UNAVAILABLE_ERROR_CODE,
                          message="Global Ask distributed rate limit is unavailable",
                          data=_rate_limit_error_data(
                              "global_ask_rate_limit_unavailable",
                              resolved_settings.mcp_rate_limit_unavailable_retry_seconds,
                          ),
                      )
                  ) from exc
          ''',
                  '''            raise MCPError(
                      code=GLOBAL_ASK_RATE_LIMIT_UNAVAILABLE_ERROR_CODE,
                      message="Global Ask distributed rate limit is unavailable",
                      data=_rate_limit_error_data(
                          "global_ask_rate_limit_unavailable",
                          resolved_settings.mcp_rate_limit_unavailable_retry_seconds,
                      ),
                  ) from exc
          ''',
              ),
              (
                  '''            raise MCPError(
                      ErrorData(
                          code=GLOBAL_ASK_RATE_LIMIT_ERROR_CODE,
                          message="Global Ask rate limit exceeded",
                          data=_rate_limit_error_data(
                              "global_ask_rate_limited",
                              rate_decision.retry_after_seconds,
                          ),
                      )
                  )
          ''',
                  '''            raise MCPError(
                      code=GLOBAL_ASK_RATE_LIMIT_ERROR_CODE,
                      message="Global Ask rate limit exceeded",
                      data=_rate_limit_error_data(
                          "global_ask_rate_limited",
                          rate_decision.retry_after_seconds,
                      ),
                  )
          ''',
              ),
          )
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected one SDK-contract replacement, found {count}")
              source = source.replace(old, new)
          path.write_text(source, encoding="utf-8")
          PY

      - name: Verify focused and live Valkey contracts
        env:
          LINEAGEWEAVE_TEST_VALKEY_URL: redis://localhost:6379/15
        run: |
          uv sync --frozen --extra dev --extra backend
          uv run --frozen python -m pytest -q \
            tests/test_mcp_rate_limit.py \
            tests/test_config.py \
            tests/test_mcp_server.py \
            tests/test_mcp_global_ask.py
          uv run --frozen python -m compileall -q backend lineageweave tests
          git diff --check

      - name: Publish only the verified SDK and quota patch
        shell: bash
        run: |
          rm .github/workflows/repair-mcp-rate-limit-sdk-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(mcp): emit structured principal quota errors"
          git push origin HEAD:feat/mcp-principal-rate-limit-v2132
