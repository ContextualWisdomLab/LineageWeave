name: Temporary PR 1047 indentation repair

on:
  push:
    branches:
      - fix/post-chat-replay-scope

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: fix/post-chat-replay-scope
          fetch-depth: 0
      - name: Normalize replay query indentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast
          path = Path("backend/app/post_chat_ingestion.py")
          text = path.read_text()
          old = '''    rows = await conn.fetch(
    _POST_CHAT_VISIBLE_CAPTURED_SOURCE_SQL,
    sorted(current_scope.corporate_entity_ids),
    sorted(current_scope.process_unit_ids),
    list(source_post_ids),
)
'''
          new = '''    rows = await conn.fetch(
        _POST_CHAT_VISIBLE_CAPTURED_SOURCE_SQL,
        sorted(current_scope.corporate_entity_ids),
        sorted(current_scope.process_unit_ids),
        list(source_post_ids),
    )
'''
          if text.count(old) != 1:
              raise SystemExit("exact indentation target missing")
          text = text.replace(old, new, 1)
          ast.parse(text, filename=str(path))
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/post_chat_ingestion.py
          git diff --cached --check
          git commit -m "style(security): normalize replay SQL indentation"
          git push origin HEAD:fix/post-chat-replay-scope
