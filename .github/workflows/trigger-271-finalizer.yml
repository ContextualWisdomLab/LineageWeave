name: Trigger PR 271 finalizer

on:
  push:
    branches:
      - feat/tepp-project-history-ask-v2180
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the pinned finalizer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run finalize-271-tepp-project-history-v3.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref feat/tepp-project-history-ask-v2180
