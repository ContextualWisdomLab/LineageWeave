name: Repair PR 264 Knowledge Graph semantics

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: repair-pr-264-knowledge-semantics
  cancel-in-progress: false

jobs:
  red-green-fix:
    if: github.event.pull_request.number == 264 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LINEAGEWEAVE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout exact stacked branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: feat/event-lineage-node-keeps-gnb-focus-v2170
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Select pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Install the committed universal lock
        run: uv sync --frozen --extra dev --extra backend

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Detect an already-applied repair
        id: repair-state
        shell: bash
        run: |
          if test -f lineageweave/semantic_path.py && grep -q 'semantic_path' backend/app/knowledge_graph.py; then
            echo 'already=true' >> "$GITHUB_OUTPUT"
          else
            echo 'already=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize the bounded repair script
        run: |
          cat .github/scripts/fix_264_knowledge_semantics.py.gz.b64.* | base64 -d | gzip -d > /tmp/fix_264_knowledge_semantics.py
          python -m py_compile /tmp/fix_264_knowledge_semantics.py

      - name: RED - ontology drift and score-only related nodes are reproduced
        if: steps.repair-state.outputs.already != 'true'
        shell: bash
        run: |
          python /tmp/fix_264_knowledge_semantics.py red
          set +e
          uv run --frozen python -m pytest -q tests/test_knowledge_graph_semantic_contract.py > /tmp/python-red.log 2>&1
          python_rc=$?
          (cd frontend && pnpm exec vitest run src/semanticPath.test.ts) > /tmp/frontend-red.log 2>&1
          frontend_rc=$?
          set -e
          cat /tmp/python-red.log
          cat /tmp/frontend-red.log
          if [ "$python_rc" -eq 0 ] || [ "$frontend_rc" -eq 0 ]; then
            echo 'RED unexpectedly passed; refusing to patch without reproducing both missing contracts' >&2
            exit 1
          fi
          grep -Eq 'semantic_path_payload|semantic_path|cannot import name|ModuleNotFoundError|Failed to resolve|ENOENT' /tmp/python-red.log /tmp/frontend-red.log

      - name: GREEN - add typed ontology paths, provenance, and cutoff-safe navigation
        if: steps.repair-state.outputs.already != 'true'
        run: python /tmp/fix_264_knowledge_semantics.py green

      - name: Refresh and verify the committed universal lock
        run: |
          uv lock
          uv lock --check
          uv sync --frozen --extra dev --extra backend

      - name: Verify Python semantic contracts
        run: |
          uv run --frozen python -m pytest -q tests/test_ontology.py tests/test_knowledge_graph_semantic_contract.py tests/test_person_mention_projection.py
          uv run --frozen python -m pytest -q
          uv run --frozen python -m compileall -q lineageweave backend/app

      - name: Verify frontend buyer surface
        working-directory: frontend
        run: |
          pnpm exec vitest run src/semanticPath.test.ts src/analysisRunNavigation.test.ts src/App.test.tsx src/i18n.test.ts
          pnpm run lint
          pnpm run build
          pnpm run build-storybook

      - name: Commit only validated repair files
        shell: bash
        run: |
          rm -f .github/workflows/repair-264-knowledge-semantics.yml
          rm -f .github/workflows/apply-ontology-semantic-path.yml .github/workflows/fix-264-ontology-semantic-path.yml
          rm -f .github/scripts/apply_ontology_semantic_path.py .github/scripts/fix_pr264_semantic_path.py
          rm -f .github/scripts/fix_264_knowledge_semantics.py.gz.b64.*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ARCHITECTURE.md \
            CHANGELOG.md \
            CHANGELOG.d/2.18.0-knowledge-graph-semantic-paths.md \
            docs/adr/0090-knowledge-graph-semantic-paths.md \
            docs/doctoring/KNOWLEDGE_GRAPH_SEMANTICS_REFERENCES.md \
            docs/ontology/lineageweave-kg.ttl \
            lineageweave/ontology.py \
            lineageweave/semantic_path.py \
            backend/app/knowledge_graph.py \
            tests/test_ontology.py \
            tests/test_knowledge_graph_semantic_contract.py \
            tests/test_person_mention_projection.py \
            frontend/src/api.ts \
            frontend/src/App.tsx \
            frontend/src/i18n.ts \
            frontend/src/semanticPath.ts \
            frontend/src/semanticPath.test.ts \
            frontend/src/analysisRunNavigation.ts \
            frontend/src/analysisRunNavigation.test.ts \
            frontend/package.json \
            pyproject.toml \
            uv.lock
          git add -u .github/workflows .github/scripts
          git diff --cached --check
          git commit -m "feat(semantics): explain related-node knowledge paths"
          git pull --rebase origin feat/event-lineage-node-keeps-gnb-focus-v2170
          git push origin HEAD:feat/event-lineage-node-keeps-gnb-focus-v2170
