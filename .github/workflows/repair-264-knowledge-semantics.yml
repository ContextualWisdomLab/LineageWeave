name: Repair PR 264 Knowledge Graph semantics

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: repair-pr-264-knowledge-semantics
  cancel-in-progress: true

jobs:
  red-green-fix:
    if: github.event.pull_request.number == 264 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LINEAGEWEAVE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
      REPAIR_BRANCH: feat/event-lineage-node-keeps-gnb-focus-v2170
      REPAIR_BASE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout the exact PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Fetch the live foundational branch for ADR collision checks
        run: git fetch origin feat/analysis-run-name-evidence-lineage:refs/remotes/origin/feat/analysis-run-name-evidence-lineage

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Select pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Install the committed universal lock
        run: uv sync --frozen --extra dev --extra backend

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Detect an already-applied repair
        id: repair-state
        shell: bash
        run: |
          if test -f lineageweave/semantic_path.py && grep -q 'semantic_path' backend/app/knowledge_graph.py; then
            echo 'already=true' >> "$GITHUB_OUTPUT"
          else
            echo 'already=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize the bounded repair script
        run: |
          cat .github/scripts/fix_264_knowledge_semantics.py.gz.b64.* | base64 -d | gzip -d > /tmp/fix_264_knowledge_semantics.py
          python -m py_compile /tmp/fix_264_knowledge_semantics.py

      - name: RED - ontology drift and score-only related nodes are reproduced
        if: steps.repair-state.outputs.already != 'true'
        shell: bash
        run: |
          python /tmp/fix_264_knowledge_semantics.py red
          set +e
          uv run --frozen python -m pytest -q tests/test_knowledge_graph_semantic_contract.py > /tmp/python-red.log 2>&1
          python_rc=$?
          (cd frontend && pnpm exec vitest run src/semanticPath.test.ts) > /tmp/frontend-red.log 2>&1
          frontend_rc=$?
          set -e
          cat /tmp/python-red.log
          cat /tmp/frontend-red.log
          if [ "$python_rc" -eq 0 ] || [ "$frontend_rc" -eq 0 ]; then
            echo 'RED unexpectedly passed; refusing to patch without reproducing both missing contracts' >&2
            exit 1
          fi
          grep -Eq 'semantic_path_payload|semantic_path|cannot import name|ModuleNotFoundError|Failed to resolve|ENOENT' /tmp/python-red.log /tmp/frontend-red.log

      - name: GREEN - add typed ontology paths, provenance, and cutoff-safe navigation
        if: steps.repair-state.outputs.already != 'true'
        run: python /tmp/fix_264_knowledge_semantics.py green

      - name: Align PostgreSQL fixture migrations and ADR index hygiene
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          projection = Path('tests/test_person_mention_projection.py')
          text = projection.read_text(encoding='utf-8')
          old_constants = '''_POST_SUMMARY_CONTRACT_MIGRATION = (
              Path(__file__).resolve().parents[1] / "migrations" / "0040_post_summary_contract.sql"
          )
          '''
          new_constants = '''_SOURCE_STATE_PROVENANCE_MIGRATION = (
              Path(__file__).resolve().parents[1] / "migrations" / "0033_source_state_provenance.sql"
          )
          _NORMALIZED_BODY_SEARCH_MIGRATION = (
              Path(__file__).resolve().parents[1] / "migrations" / "0036_normalized_body_search.sql"
          )
          _POST_SUMMARY_CONTRACT_MIGRATION = (
              Path(__file__).resolve().parents[1] / "migrations" / "0040_post_summary_contract.sql"
          )
          '''
          if new_constants not in text:
              if text.count(old_constants) != 1:
                  raise SystemExit('projection fixture migration constants anchor drifted')
              text = text.replace(old_constants, new_constants, 1)

          old_apply = '''                cursor.execute(_MIGRATION_PATH.read_text(encoding="utf-8"))
                          cursor.execute(_SEMANTIC_PROJECT_MIGRATION.read_text(encoding="utf-8"))
                          cursor.execute(_POST_SUMMARY_CONTRACT_MIGRATION.read_text(encoding="utf-8"))
          '''
          new_apply = '''                cursor.execute(_MIGRATION_PATH.read_text(encoding="utf-8"))
                          cursor.execute(_SEMANTIC_PROJECT_MIGRATION.read_text(encoding="utf-8"))
                          cursor.execute(_SOURCE_STATE_PROVENANCE_MIGRATION.read_text(encoding="utf-8"))
                          # Production installs pg_trgm in an earlier search migration. This
                          # focused fixture creates the same prerequisite before applying the
                          # exact normalized-body migration consumed by hydration queries.
                          cursor.execute("create extension if not exists pg_trgm")
                          cursor.execute(_NORMALIZED_BODY_SEARCH_MIGRATION.read_text(encoding="utf-8"))
                          cursor.execute(_POST_SUMMARY_CONTRACT_MIGRATION.read_text(encoding="utf-8"))
          '''
          if new_apply not in text:
              if text.count(old_apply) != 1:
                  raise SystemExit('projection fixture migration application anchor drifted')
              text = text.replace(old_apply, new_apply, 1)
          projection.write_text(text, encoding='utf-8')

          hygiene = Path('tests/test_documentation_hygiene.py')
          text = hygiene.read_text(encoding='utf-8')
          old_paths = '''    paths = sorted(_ADR_DIRECTORY.glob("*.md"))
              assert paths, "the repository must contain architecture-decision records"
          '''
          new_paths = '''    readme = _ADR_DIRECTORY / "README.md"
              assert readme.exists(), "the ADR directory must retain its normative index"
              assert readme.read_text(encoding="utf-8").strip(), "the ADR index must not be empty"

              paths = sorted(path for path in _ADR_DIRECTORY.glob("*.md") if path != readme)
              assert paths, "the repository must contain numbered architecture-decision records"
          '''
          if new_paths not in text:
              if text.count(old_paths) != 1:
                  raise SystemExit('ADR hygiene path anchor drifted')
              text = text.replace(old_paths, new_paths, 1)
          hygiene.write_text(text, encoding='utf-8')
          PY

      - name: Keep the ADR number collision-free across the moving stack
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          generated = Path('docs/adr/0090-knowledge-graph-semantic-paths.md')
          if not generated.exists():
              raise SystemExit('expected generated ADR 0090 is missing')

          parent_listing = subprocess.run(
              [
                  'git', 'ls-tree', '-r', '--name-only',
                  'origin/feat/analysis-run-name-evidence-lineage', 'docs/adr',
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          parent_names = {Path(line).name for line in parent_listing}
          if generated.name not in parent_names:
              raise SystemExit(0)

          local_names = {path.name for path in Path('docs/adr').glob('*.md') if path != generated}
          numbers = []
          for name in parent_names | local_names:
              match = re.match(r'^(\d{4})-', name)
              if match:
                  numbers.append(int(match.group(1)))
          number = max(numbers, default=90) + 1
          new_name = f'{number:04d}-knowledge-graph-semantic-paths.md'
          target = generated.with_name(new_name)
          generated.rename(target)

          replacements = (
              ('ADR 0090', f'ADR {number:04d}'),
              ('0090-knowledge-graph-semantic-paths.md', new_name),
          )
          for path in (
              Path('ARCHITECTURE.md'),
              Path('CHANGELOG.md'),
              Path('CHANGELOG.d/2.18.0-knowledge-graph-semantic-paths.md'),
              Path('docs/doctoring/KNOWLEDGE_GRAPH_SEMANTICS_REFERENCES.md'),
              target,
          ):
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Refresh and verify the committed universal lock
        run: |
          uv lock
          uv lock --check
          uv sync --frozen --extra dev --extra backend

      - name: Verify Python semantic contracts
        run: |
          uv run --frozen python -m pytest -q tests/test_ontology.py tests/test_knowledge_graph_semantic_contract.py tests/test_person_mention_projection.py tests/test_documentation_hygiene.py
          uv run --frozen python -m pytest -q
          uv run --frozen python -m compileall -q lineageweave backend/app

      - name: Verify frontend buyer surface
        working-directory: frontend
        run: |
          pnpm exec vitest run src/semanticPath.test.ts src/analysisRunNavigation.test.ts src/App.test.tsx src/i18n.test.ts
          pnpm run lint
          pnpm run build
          pnpm run build-storybook

      - name: Commit only the exact-head validated repair
        shell: bash
        run: |
          rm -f .github/workflows/repair-264-knowledge-semantics.yml
          rm -f .github/workflows/apply-ontology-semantic-path.yml .github/workflows/fix-264-ontology-semantic-path.yml
          rm -f .github/scripts/apply_ontology_semantic_path.py .github/scripts/fix_pr264_semantic_path.py
          rm -f .github/scripts/fix_264_knowledge_semantics.py.gz.b64.*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ARCHITECTURE.md \
            CHANGELOG.md \
            CHANGELOG.d/2.18.0-knowledge-graph-semantic-paths.md \
            docs/adr/*-knowledge-graph-semantic-paths.md \
            docs/doctoring/KNOWLEDGE_GRAPH_SEMANTICS_REFERENCES.md \
            docs/ontology/lineageweave-kg.ttl \
            lineageweave/ontology.py \
            lineageweave/semantic_path.py \
            backend/app/knowledge_graph.py \
            tests/test_ontology.py \
            tests/test_knowledge_graph_semantic_contract.py \
            tests/test_person_mention_projection.py \
            tests/test_documentation_hygiene.py \
            frontend/src/api.ts \
            frontend/src/App.tsx \
            frontend/src/i18n.ts \
            frontend/src/semanticPath.ts \
            frontend/src/semanticPath.test.ts \
            frontend/src/analysisRunNavigation.ts \
            frontend/src/analysisRunNavigation.test.ts \
            frontend/package.json \
            pyproject.toml \
            uv.lock
          git add -u .github/workflows .github/scripts
          git diff --cached --check
          git commit -m "feat(semantics): explain related-node knowledge paths"
          test -z "$(git status --porcelain)" || {
            echo 'repair left uncommitted or untracked files' >&2
            git status --short
            exit 1
          }

          git fetch origin "${REPAIR_BRANCH}"
          remote_head="$(git rev-parse "origin/${REPAIR_BRANCH}")"
          if [ "$remote_head" != "$REPAIR_BASE_SHA" ]; then
            echo "PR head moved from ${REPAIR_BASE_SHA} to ${remote_head}; refusing to publish an unverified rebase." >&2
            exit 1
          fi
          git push origin "HEAD:${REPAIR_BRANCH}"
