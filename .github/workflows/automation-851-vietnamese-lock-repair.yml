name: automation-851-vietnamese-lock-repair

on:
  push:
    branches:
      - automation/851-vietnamese-lock-repair-20260911

permissions:
  contents: write

concurrency:
  group: automation-851-vietnamese-lock-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact staging branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify staging parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f7d1c1741598023eaac199efd0fd605304bb5945"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Repair Vietnamese explained-share copy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/i18n.ts")
          text = path.read_text()
          replacements = {
              '"leftover-map explained leftover share {label}": "phần dư giải thích bản đồ phần dư {label}"':
                  '"leftover-map explained leftover share {label}": "tỷ phần phần dư được giải thích trên bản đồ phần dư {label}"',
              'phần dư giải thích e, phần dư chưa giải thích s':
                  'tỷ phần phần dư được giải thích e, phần dư chưa giải thích s',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one occurrence, found {count}: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Regenerate repository lock
        shell: bash
        run: |
          set -euo pipefail
          uv lock
          uv lock --check
          python - <<'PY'
          from pathlib import Path
          import re

          lock = Path("uv.lock").read_text()
          match = re.search(r'\[\[package\]\]\nname = "lineageweave"\nversion = "([^"]+)"', lock)
          if not match:
              raise SystemExit("lineageweave package block missing from uv.lock")
          if match.group(1) != "2.68.0":
              raise SystemExit(f"uv.lock lineageweave version is {match.group(1)}, expected 2.68.0")
          PY

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Verify frontend causal repair
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          cd frontend
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm exec vitest run src/leftoverMapPlotVietnameseCopy.test.ts src/leftoverMapPlotLayout.test.ts src/components/LeftoverMapPlot.test.tsx

      - name: Commit workflow-free repaired tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/automation-851-vietnamese-lock-repair.yml
          git status --short
          test -z "$(git status --short | grep -v -E '^( M frontend/src/i18n.ts| M uv.lock| D .github/workflows/automation-851-vietnamese-lock-repair.yml)$' || true)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/i18n.ts uv.lock .github/workflows/automation-851-vietnamese-lock-repair.yml
          git commit -m "fix(reports): repair Vietnamese share copy and regenerate lock"
          git push origin HEAD:automation/851-vietnamese-lock-repair-20260911
