name: Refresh product technical gap baseline 2026-09-13 20:05 KST

on:
  push:
    branches:
      - codex/gap-loop-20260912

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact triggering head
        uses: actions/checkout@v5
        with:
          ref: codex/gap-loop-20260912
          fetch-depth: 0

      - name: Prepend current live-authority overlay
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/overlay.md <<'EOF'
          > Live-authority overlay: 2026-09-13 20:05 KST. Protected `main` remains
          > `83eba56149eb802cd63642c507c324c9976ec78e` pending the final double sweep.
          > Customer Master PR #1055 remains exact `50c4935eef1029467595f7004818643598b737c9`,
          > Ready only to preserve its still-running Strix `34746057545`; repository Tests
          > `34746058653`, Security `34746058657`, and SAST `34746058639` are GREEN, while
          > Required CodeQL/OpenCode/Noema remain terminal failures at their canonical
          > `.github#1929/#2106`, `.github#2045`, and `contextual-orchestrator#1106` owner
          > boundaries. Do not cancel Strix on elapsed time alone or churn the source head.
          >
          > A separate buyer-facing leftover-map lineage stack repair is now active at #859.
          > Exact #859 head `2550e8d88339e30297fa0aa19ffae77f9b78b73b` causally fixes the
          > eight stale comparison-only accessibility expectations (16 distance assertions)
          > to match the intentional localized comparison-graphic accessible name, without
          > changing report-mode assertions or production semantics. Its purpose-complete
          > repair workflow self-removed before the product head was published.
          >
          > Because #859 moved, ordinary non-force ancestry convergence was executed through
          > #860→#875, then both #875 forks (#876 and #877), plus reconstructed successors
          > #1033→#1034. Historical #878/#879 remain open delta carriers; their valid product
          > intent is preserved through those reconstructed successor branches rather than by
          > replaying stale full source/docs trees. No predecessor validation receipt transfers.
          >
          > #859 is Draft. The first fresh Tests identity `34752865986` ended at workflow level
          > with zero jobs, then convergence-PR activity produced a cancelled and a skipped Tests
          > identity on the same head. A subsequent unchanged-head Ready admission produced no
          > new workflow identities and was reverted to Draft; `.github#2045` now records this
          > additional Ready-reconciliation canary. Therefore the causal assertion repair is
          > present, but #859 is not GREEN or merge-ready until fresh exact-head repository,
          > security, browser/a11y/performance evidence and qualifying independent approval exist.
          >
          > #1057 remains the separate PostgreSQL + Keycloak + Valkey authenticated
          > bearer/JWKS/RBAC/ABAC topology owner. Draft #961 remains the package/runtime-version
          > source repair and #1056 remains immutable release/SBOM/provenance/reproducibility/
          > rollback acceptance. No release is admitted by this overlay. Older overlays below
          > are dated evidence only.
          EOF
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/product-technical-gap-baseline.md')
          text = path.read_text()
          title = '# Product & Technical Gap Baseline\n'
          if not text.startswith(title):
              raise SystemExit('unexpected baseline title')
          overlay = Path('/tmp/overlay.md').read_text().strip() + '\n\n\n'
          marker = '> Live-authority overlay: 2026-09-13 20:05 KST.'
          if marker in text:
              raise SystemExit('overlay already present')
          path.write_text(title + '\n\n' + overlay + text[len(title):].lstrip('\n'))
          PY
          git diff --check
          test "$(git diff --name-only)" = "docs/product-technical-gap-baseline.md"

      - name: Remove purpose-complete refresh workflow
        shell: bash
        run: rm .github/workflows/refresh-gap-baseline-20260913-2005.yml

      - name: Commit and fast-forward publish exact refresh
        shell: bash
        env:
          BRANCH: codex/gap-loop-20260912
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/${BRANCH}" | cut -f1)"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "branch moved: expected $GITHUB_SHA, found $remote_sha" >&2
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/product-technical-gap-baseline.md .github/workflows/refresh-gap-baseline-20260913-2005.yml
          git commit -m "docs(gaps): refresh 20:05 live authority"
          git push origin "HEAD:${BRANCH}"
