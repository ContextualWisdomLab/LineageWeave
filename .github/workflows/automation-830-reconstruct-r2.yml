name: Reconstruct #830 on exact #829

on:
  push:
    branches:
      - automation/830-current-829-reconstruct-r2-20260907-2013

permissions:
  contents: write

concurrency:
  group: reconstruct-830-r2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LINEAGEWEAVE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Verify exact current predecessor and transient-only setup
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0e4fd5815686120ec66203cb6848834b56bdf289 HEAD
          test "$(git merge-base 0e4fd5815686120ec66203cb6848834b56bdf289 HEAD)" = "0e4fd5815686120ec66203cb6848834b56bdf289"
          git diff --name-only 0e4fd5815686120ec66203cb6848834b56bdf289..HEAD | sort > /tmp/setup-paths
          printf '%s\n' .github/workflows/automation-830-reconstruct-r2.yml scripts/automation_830_reconstruct_r2.py | sort > /tmp/expected-setup-paths
          diff -u /tmp/expected-setup-paths /tmp/setup-paths

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Select pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Install frozen frontend graph
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Realistic current-parent RED
        shell: bash
        run: |
          set -euo pipefail
          python scripts/automation_830_reconstruct_r2.py red
          set +e
          (cd frontend && pnpm exec vitest run src/leftoverMapCompareAxis.reconstruction-red.test.ts) > /tmp/830-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/830-red.log
          test "$rc" -ne 0
          grep -q "leftoverMapCompareAxisSingular" /tmp/830-red.log
          python scripts/automation_830_reconstruct_r2.py cleanup-red

      - name: Apply minimal current-parent causal fix
        run: python scripts/automation_830_reconstruct_r2.py apply

      - name: Regenerate universal lock after package version bump
        run: uv lock

      - name: Install committed universal graph
        run: uv sync --frozen --extra dev --extra backend

      - name: Focused GREEN
        shell: bash
        run: |
          set -euo pipefail
          (cd frontend && pnpm exec vitest run src/leftoverMapCompareAxis.test.ts src/App.test.tsx)
          uv run --frozen python -m pytest -q backend/tests/test_api.py::test_seed_period_report_surfaces_on_get_reports

      - name: Exact reconstructed GREEN
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python -m pytest -q
          (cd frontend && pnpm run lint)
          (cd frontend && pnpm run test)
          (cd frontend && pnpm run build)
          (cd frontend && pnpm run build-storybook)

      - name: Verify bounded product diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e frontend/src/leftoverMapCompareAxis.reconstruction-red.test.ts
          python scripts/automation_830_reconstruct_r2.py verify

      - name: Remove purpose-complete tooling and publish clean staging commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/automation-830-reconstruct-r2.yml scripts/automation_830_reconstruct_r2.py
          git add -A
          test -z "$(git diff --cached --name-only | grep -E '^(\.github/workflows/automation-830|scripts/automation_830)' || true)"
          git config user.name "LineageWeave automation"
          git config user.email "lineageweave-automation@users.noreply.github.com"
          git commit -m "feat(reports): reconstruct grouping comparison axis singular on current stack"
          git push origin HEAD:automation/830-current-829-reconstruct-r2-20260907-2013
