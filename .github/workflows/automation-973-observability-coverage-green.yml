name: automation-973-observability-coverage-green
on:
  push:
    branches: [automation/973-observability-coverage-green-20260907-1457]
permissions:
  contents: read
jobs:
  exact-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 2
      - name: Verify exact #973 product parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "182d3c9d4c5f2a8ab2d63e77b8a9ced663a183f6"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/automation-973-observability-coverage-green.yml"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.28"
          enable-cache: false
      - name: Install frozen dev backend graph
        run: uv sync --frozen --extra dev --extra backend
      - name: Exact observability GREEN
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen coverage erase
          uv run --frozen coverage run --branch --source=lineageweave.observability -m pytest -q tests/test_observability.py tests/test_observability_telemetry.py tests/test_server_diagnostics.py
          uv run --frozen coverage report --show-missing --fail-under=100 lineageweave/observability.py
          uv run --frozen python -m compileall -q lineageweave backend tests
