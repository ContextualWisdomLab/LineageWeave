name: automation-967-fast-mlsirm-v091

on:
  push:
    branches:
      - automation/967-fast-mlsirm-v091-20260907-0950

permissions:
  contents: write

concurrency:
  group: automation-967-fast-mlsirm-v091
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LINEAGEWEAVE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout exact automation branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify protected-main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 83eba56149eb802cd63642c507c324c9976ec78e HEAD
          test "$(git show -s --format=%P 785b7f82a4323cb1d556e65abec047f37628532e)" = "83eba56149eb802cd63642c507c324c9976ec78e"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Install dev-only test boundary
        run: uv sync --frozen --extra dev

      - name: Reproduce stale-owner-pin RED
        shell: bash
        run: |
          set -euo pipefail
          if uv run --frozen python -m pytest -q tests/test_fast_mlsirm_release_dependency.py; then
            echo "expected stale fast-mlsirm owner pin to fail the new consumer contract" >&2
            exit 1
          fi

      - name: Apply minimal released-owner pin and regenerate lock
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          old = "fast-mlsirm @ git+https://github.com/ContextualWisdomLab/fast-mlsirm.git@d025b7d237d8db7ca97a5611606c6285d5870895"
          new = "fast-mlsirm @ git+https://github.com/ContextualWisdomLab/fast-mlsirm.git@09f762ded35786dd1078222a4577ff09d649816f"
          if text.count(old) != 1:
              raise SystemExit("expected exactly one stale fast-mlsirm dependency declaration")
          text = text.replace(old, new)
          text = text.replace(
              "# No PyPI release yet; pinned to a specific commit, same pattern as rankweave. Ships a\n",
              "# Immutable owner release v0.9.1 has no GitHub binary assets; pin its exact\n# release-target commit for reproducible source builds. Ships a\n",
          )
          path.write_text(text, encoding="utf-8")
          PY
          uv lock

      - name: Verify regenerated lock identity before install
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "d025b7d237d8db7ca97a5611606c6285d5870895" pyproject.toml uv.lock
          grep -F 'version = "0.9.1"' uv.lock
          grep -F '09f762ded35786dd1078222a4577ff09d649816f' uv.lock

      - name: Select pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Install exact frozen backend dependency graph
        run: uv sync --frozen --extra dev --extra backend

      - name: Consumer dependency contract GREEN
        run: uv run --frozen python -m pytest -q tests/test_fast_mlsirm_release_dependency.py

      - name: Full backend and Python GREEN
        run: uv run --frozen python -m pytest -q

      - name: Verify owner boundary and clean diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git grep -l '09f762ded35786dd1078222a4577ff09d649816f' -- pyproject.toml uv.lock tests/test_fast_mlsirm_release_dependency.py | wc -l)" -eq 3
          test -z "$(git grep -l 'd025b7d237d8db7ca97a5611606c6285d5870895' -- pyproject.toml uv.lock tests/test_fast_mlsirm_release_dependency.py ':!tests/test_fast_mlsirm_release_dependency.py' || true)"

      - name: Remove temporary workflow and publish workflow-free staging tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/automation-967-fast-mlsirm-v091.yml
          git add pyproject.toml uv.lock tests/test_fast_mlsirm_release_dependency.py .github/workflows/automation-967-fast-mlsirm-v091.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "deps: consume released fast-mlsirm v0.9.1 owner commit"
          test -z "$(git status --porcelain)"
          git push origin HEAD:automation/967-fast-mlsirm-v091-20260907-0950
