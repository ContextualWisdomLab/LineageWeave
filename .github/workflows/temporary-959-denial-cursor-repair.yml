name: Temporary 959 denial cursor repair

on:
  push:
    branches:
      - "automation/959-denial-cursor-repair-20260906"

permissions:
  contents: write

concurrency:
  group: temporary-959-denial-cursor-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: automation/959-denial-cursor-repair-20260906
          fetch-depth: 0

      - name: Verify exact product head
        shell: bash
        run: |
          set -euo pipefail
          product=c2c3c3c4116bb0e609170a8fd56fece3f227ceaa
          git fetch origin codex/loop-gap-20260906-audit
          test "$(git rev-parse origin/codex/loop-gap-20260906-audit)" = "$product"
          git merge-base --is-ancestor "$product" HEAD
          test "$(git diff --name-only "$product"..HEAD)" = ".github/workflows/temporary-959-denial-cursor-repair.yml"

      - name: Add continuation-denial credential-refresh regression
        shell: python
        run: |
          from pathlib import Path

          path = Path("frontend/src/components/OntologyExplorer.test.tsx")
          text = path.read_text(encoding="utf-8")
          anchor = '  it.each(["ready", undefined] as const)("does not restore a denied supplied payload on status-only recovery (%s)", (recoveredStatus) => {'
          if text.count(anchor) != 1:
              raise SystemExit(f"expected one test insertion anchor, found {text.count(anchor)}")
          regression = '''  it.each([403, 404])("restarts at the first page after continuation denial and credential refresh (%s)", async (status) => {\n    const fetchNeighborhood = vi.mocked(fetchOntologyNeighborhood);\n    fetchNeighborhood.mockReset();\n    fetchNeighborhood\n      .mockResolvedValueOnce(neighborhood({ truncated: true, next_cursor: "page-2" }))\n      .mockRejectedValueOnce(new BackendError("/api/ontology/neighborhood", status))\n      .mockResolvedValueOnce(neighborhood({ next_cursor: null }));\n\n    const { rerender } = render(\n      <OntologyExplorer accessToken="synthetic-token-a" focusNodeType="node_post" focusNodeId={POST_ID} />,\n    );\n\n    await userEvent.click(await screen.findByRole("button", { name: "Load next relation page" }));\n    expect(\n      await screen.findByText("Related information is unavailable for this record. Open a visible post next."),\n    ).toBeInTheDocument();\n    await waitFor(() => expect(fetchNeighborhood).toHaveBeenCalledTimes(2));\n\n    rerender(\n      <OntologyExplorer accessToken="synthetic-token-b" focusNodeType="node_post" focusNodeId={POST_ID} />,\n    );\n    await waitFor(() => expect(fetchNeighborhood).toHaveBeenCalledTimes(3));\n    expect(fetchNeighborhood).toHaveBeenNthCalledWith(\n      3,\n      "synthetic-token-b",\n      expect.objectContaining({ cursor: undefined }),\n    );\n    expect(await screen.findByRole("button", { name: "Select node: Post Demo public post" })).toBeInTheDocument();\n  });\n\n'''
          path.write_text(text.replace(anchor, regression + anchor, 1), encoding="utf-8")

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Verify realistic stale-cursor RED
        shell: bash
        working-directory: frontend
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run src/components/OntologyExplorer.test.tsx -t 'restarts at the first page after continuation denial and credential refresh' >/tmp/cursor-red.log 2>&1
          status=$?
          set -e
          cat /tmp/cursor-red.log
          test "$status" -ne 0
          grep -q 'restarts at the first page after continuation denial and credential refresh' /tmp/cursor-red.log

      - name: Apply minimal denial-cursor recovery fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("frontend/src/components/OntologyExplorer.tsx")
          text = path.read_text(encoding="utf-8")

          state_anchor = '  const deniedPayloads = useRef(new WeakSet<OntologyNeighborhoodPayload>());\n'
          if text.count(state_anchor) != 1:
              raise SystemExit(f"expected one denied payload ref anchor, found {text.count(state_anchor)}")
          denied_ref = '''  const deniedLiveRequest = useRef<{\n    accessToken: string;\n    focusNodeType: string;\n    focusNodeId: string;\n    knowledgeCutoff?: string;\n  } | null>(null);\n'''
          text = text.replace(state_anchor, state_anchor + denied_ref, 1)

          fetch_anchor = '''    if (!accessToken) {\n      setLoaded(null);\n      setCursor(undefined);\n      clearSelection();\n      setStatus(providedStatus ?? "empty");\n      return;\n    }\n    let cancelled = false;\n'''
          if text.count(fetch_anchor) != 1:
              raise SystemExit(f"expected one live fetch anchor, found {text.count(fetch_anchor)}")
          guarded = '''    if (!accessToken) {\n      setLoaded(null);\n      setCursor(undefined);\n      clearSelection();\n      setStatus(providedStatus ?? "empty");\n      return;\n    }\n    const deniedRequest = deniedLiveRequest.current;\n    if (\n      deniedRequest?.accessToken === accessToken &&\n      deniedRequest.focusNodeType === focusType &&\n      deniedRequest.focusNodeId === focusId &&\n      deniedRequest.knowledgeCutoff === knowledgeCutoff\n    ) {\n      setLoaded(null);\n      setStatus("denied");\n      return;\n    }\n    let cancelled = false;\n'''
          text = text.replace(fetch_anchor, guarded, 1)

          success_anchor = '''      .then((payload) => {\n        if (cancelled) return;\n        setLoaded((current) =>\n'''
          if text.count(success_anchor) != 1:
              raise SystemExit(f"expected one live success anchor, found {text.count(success_anchor)}")
          text = text.replace(
              success_anchor,
              '''      .then((payload) => {\n        if (cancelled) return;\n        deniedLiveRequest.current = null;\n        setLoaded((current) =>\n''',
              1,
          )

          denial_anchor = '''        if (error instanceof BackendError && (error.status === 403 || error.status === 404)) {\n          setLoaded(null);\n          clearSelection();\n          setStatus("denied");\n          return;\n        }\n'''
          if text.count(denial_anchor) != 1:
              raise SystemExit(f"expected one denial catch block, found {text.count(denial_anchor)}")
          text = text.replace(
              denial_anchor,
              '''        if (error instanceof BackendError && (error.status === 403 || error.status === 404)) {\n          deniedLiveRequest.current = {\n            accessToken,\n            focusNodeType: focusType,\n            focusNodeId: focusId,\n            knowledgeCutoff,\n          };\n          setCursor(undefined);\n          setLoaded(null);\n          clearSelection();\n          setStatus("denied");\n          return;\n        }\n''',
              1,
          )
          path.write_text(text, encoding="utf-8")

      - name: Verify focused denial GREEN
        working-directory: frontend
        run: >-
          pnpm exec vitest run src/components/OntologyExplorer.test.tsx
          -t 'restarts at the first page after continuation denial and credential refresh|discards prior evidence and exports after continuation denial|retries a failed continuation page with the same cursor|does not restore a denied supplied payload on status-only recovery'

      - name: Verify OntologyExplorer file GREEN
        working-directory: frontend
        run: pnpm exec vitest run src/components/OntologyExplorer.test.tsx

      - name: Verify frontend lint
        working-directory: frontend
        run: pnpm exec oxlint

      - name: Verify production build
        working-directory: frontend
        run: pnpm run build

      - name: Commit clean repaired tree
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/temporary-959-denial-cursor-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          rm "$workflow"
          git add -A
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/' | grep -v '^\.github/workflows/temporary-959-denial-cursor-repair\.yml$' || true)"
          test "$(git diff --cached --name-status -- "$workflow")" = $'D\t.github/workflows/temporary-959-denial-cursor-repair.yml'
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m "fix(ontology): restart after continuation denial with refreshed credential"
          git push origin HEAD:automation/959-denial-cursor-repair-20260906
