name: Apply project lifecycle history on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-project-lifecycle-history-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  red-green-project-history:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/project-lifecycle-history'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LINEAGEWEAVE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
      REPAIR_BRANCH: feat/project-lifecycle-history
      REPAIR_BASE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact contributor head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Materialize bounded patcher
        shell: bash
        run: |
          cat .github/repair/project_history_payload.b64.* | base64 -d | gzip -d > /tmp/apply_project_lifecycle_history.py
          python -m py_compile /tmp/apply_project_lifecycle_history.py

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Select pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Install Python dependencies
        run: uv sync --frozen --extra dev --extra backend

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: RED - reproduce absent lifecycle contracts
        shell: bash
        run: |
          python /tmp/apply_project_lifecycle_history.py red
          set +e
          uv run --frozen python -m pytest -q tests/test_project_history.py > /tmp/project-history-python-red.log 2>&1
          python_rc=$?
          (cd frontend && pnpm exec vitest run src/components/ProjectHistoryTimeline.test.tsx) > /tmp/project-history-frontend-red.log 2>&1
          frontend_rc=$?
          set -e
          cat /tmp/project-history-python-red.log
          cat /tmp/project-history-frontend-red.log
          if [ "$python_rc" -eq 0 ] || [ "$frontend_rc" -eq 0 ]; then
            echo "RED unexpectedly passed; refusing to publish an unproven change" >&2
            exit 1
          fi
          grep -Eq "ModuleNotFoundError|No module named.*project_history" /tmp/project-history-python-red.log
          grep -Eq "Failed to resolve import|Cannot find module|ProjectHistoryTimeline|ProjectHistory" /tmp/project-history-frontend-red.log
          git reset --hard HEAD
          git clean -fd

      - name: GREEN - materialize normalized authority, API, and Buyer surface
        run: python /tmp/apply_project_lifecycle_history.py green

      - name: Refresh and verify universal lock
        run: |
          uv lock
          uv lock --check
          uv sync --frozen --extra dev --extra backend

      - name: Verify focused Python and real PostgreSQL contracts
        run: |
          uv run --frozen python -m pytest -q \
            tests/test_project_history.py \
            tests/test_project_history_backend.py \
            tests/test_project_history_postgres.py \
            tests/test_project_history_schema.py \
            tests/test_project_history_ontology.py

      - name: Require 100 percent changed-module statement and branch coverage
        run: |
          uv run coverage erase
          uv run coverage run --branch -m pytest -q \
            tests/test_project_history.py \
            tests/test_project_history_backend.py \
            tests/test_project_history_postgres.py
          uv run coverage report \
            --include='lineageweave/project_history.py,backend/app/project_history.py' \
            --fail-under=100

      - name: Verify full Python repository and semantic profile
        run: |
          uv run --frozen python -m pytest -q
          uv run --frozen python -m compileall -q lineageweave backend/app scripts
          uv run --frozen python - <<'PY'
          import ast
          from pathlib import Path
          from rdflib import Graph

          for path_name in ('lineageweave/project_history.py', 'backend/app/project_history.py'):
              module = ast.parse(Path(path_name).read_text(encoding='utf-8'))
              missing = [
                  node.name
                  for node in module.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef))
                  and not node.name.startswith('_')
                  and ast.get_docstring(node) is None
              ]
              if missing:
                  raise SystemExit(f'{path_name} missing public docstrings: {missing}')
          Graph().parse('docs/ontology/project-history-profile.ttl', format='turtle')
          PY

      - name: Verify Buyer component, accessibility, build, and Storybook
        working-directory: frontend
        run: |
          pnpm exec vitest run src/components/ProjectHistoryTimeline.test.tsx
          pnpm run test
          pnpm run lint
          pnpm run build
          pnpm run build-storybook

      - name: Commit only exact-head verified product changes
        shell: bash
        run: |
          rm -rf frontend/dist frontend/storybook-static
          rm -f .github/workflows/apply-project-lifecycle-history.yml
          rm -f .github/workflows/apply-project-lifecycle-history-pr.yml
          rm -f .github/repair/project_history_payload.b64.*

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            lineageweave/project_history.py \
            backend/app/project_history.py \
            backend/app/main.py \
            migrations/0050_project_history_lifecycle.sql \
            migrations/rollback/0050_project_history_lifecycle.sql \
            docker/postgres-init/Dockerfile \
            docker/postgres-init/migrate.sh \
            scripts/seed_project_history.py \
            Makefile \
            tests/test_project_history.py \
            tests/test_project_history_backend.py \
            tests/test_project_history_postgres.py \
            tests/test_project_history_schema.py \
            tests/test_project_history_ontology.py \
            frontend/src/api.ts \
            frontend/src/App.tsx \
            frontend/src/components/ProjectHistoryTimeline.tsx \
            frontend/src/components/ProjectHistoryTimeline.css \
            frontend/src/components/ProjectHistoryTimeline.test.tsx \
            frontend/src/components/ProjectHistoryTimeline.stories.tsx \
            pyproject.toml \
            uv.lock \
            frontend/package.json \
            CHANGELOG.md \
            CHANGELOG.d/2.20.0-project-lifecycle-history.md \
            ARCHITECTURE.md \
            docs/adr/README.md \
            docs/adr/0100-project-lifecycle-history.md \
            docs/doctoring/PROJECT_LIFECYCLE_HISTORY_REFERENCES.md \
            docs/ontology/project-history-profile.ttl \
            docs/project-lifecycle-history.md \
            docs/storybook-inventory.md
          git add -u -- \
            .github/workflows/apply-project-lifecycle-history.yml \
            .github/workflows/apply-project-lifecycle-history-pr.yml \
            .github/repair/project_history_payload.b64.00 \
            .github/repair/project_history_payload.b64.01 \
            .github/repair/project_history_payload.b64.02 \
            .github/repair/project_history_payload.b64.03
          git diff --cached --check
          git commit -m "feat(projects): add evidence-bound lifecycle history"
          test -z "$(git status --porcelain)" || {
            git status --short
            exit 1
          }

          git fetch origin "${REPAIR_BRANCH}"
          remote_head="$(git rev-parse "origin/${REPAIR_BRANCH}")"
          if [ "$remote_head" != "$REPAIR_BASE_SHA" ]; then
            echo "branch moved from ${REPAIR_BASE_SHA} to ${remote_head}; refusing unverified publication" >&2
            exit 1
          fi
          git push origin "HEAD:${REPAIR_BRANCH}"
