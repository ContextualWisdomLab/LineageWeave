name: Apply Global Ask semantic retrieval v2.18.1

on:
  pull_request:
    branches:
      - "agent/authenticated-global-ask-mcp-v2180"
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: apply-global-ask-semantic-retrieval-v2181-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply and verify semantic-only retrieval
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Select pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Install committed dependencies
        run: uv sync --frozen --extra dev --extra backend

      - name: Add the semantic-only regression
        run: python .github/scripts/apply_global_ask_semantic_retrieval_2181.py test-only

      - name: Prove the regression is red
        run: |
          set +e
          uv run --frozen python -m pytest -q \
            tests/test_global_ask_sources.py::test_global_sources_discover_posts_from_persisted_semantic_evidence \
            > /tmp/global-ask-red.log 2>&1
          status=$?
          set -e
          cat /tmp/global-ask-red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected semantic-only retrieval to fail before implementation." >&2
            exit 1
          fi
          grep -F "test_global_sources_discover_posts_from_persisted_semantic_evidence" \
            /tmp/global-ask-red.log

      - name: Apply the bounded production implementation
        run: python .github/scripts/apply_global_ask_semantic_retrieval_2181.py apply

      - name: Verify browser, MCP, and adjacent evidence contracts
        run: |
          uv run --frozen python -m pytest -q \
            tests/test_global_ask_sources.py \
            tests/test_mcp_server.py \
            tests/test_post_chat.py \
            tests/test_post_chat_ingestion.py \
            tests/test_semantic_hints.py \
            tests/test_semantic_keyman_context.py \
            tests/test_semantic_project_evidence.py
          uv run --frozen python -m compileall -q backend lineageweave tests
          git diff --check

      - name: Remove one-shot implementation files and publish
        run: |
          rm .github/workflows/apply-global-ask-semantic-retrieval-v2181.yml
          rm .github/scripts/apply_global_ask_semantic_retrieval_2181.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: retrieve Global Ask semantic evidence (v2.18.1)"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
