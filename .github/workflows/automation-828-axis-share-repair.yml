name: "Ephemeral #828 axis-share accessibility repair"

on:
  push:
    branches:
      - automation/828-axis-share-repair-harness-20260908-0800

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact harness head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: automation/828-axis-share-repair-harness-20260908-0800

      - name: Apply the minimum current-source repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("frontend/src/App.tsx")
          source = app.read_text(encoding="utf-8")
          import_line = "  LEFTOVER_MAP_COMPARE_AXIS_SHARE_LABEL,\n"
          aria_line = "                    aria-label={t(LEFTOVER_MAP_COMPARE_AXIS_SHARE_LABEL)}\n"
          if source.count(import_line) != 1:
              raise SystemExit("axis-share label import drifted")
          if source.count(aria_line) != 1:
              raise SystemExit("axis-share generic aria-label drifted")
          source = source.replace(import_line, "", 1).replace(aria_line, "", 1)
          app.write_text(source, encoding="utf-8")

          test = Path("frontend/src/App.test.tsx")
          test_source = test.read_text(encoding="utf-8")
          old = '''    expect(
                within(screen.getByLabelText("Grouping comparison")).getAllByLabelText(
                  "Leftover map comparison axis share",
                ),
              ).toHaveLength(4);
              expect(
                within(screen.getByLabelText("Grouping comparison")).getAllByLabelText(
                  "Leftover map comparison axis share",
                )[0],
              ).toHaveTextContent("leftover map comparison axis 1 0%");
          '''
          # Dedent the source literal to the exact four/six/eight-space JSX test indentation.
          old = "\n".join(line[8:] if line.startswith("        ") else line for line in old.splitlines()) + "\n"
          new = '''    expect(
                within(screen.getByLabelText("Grouping comparison")).getByText(
                  "leftover map comparison axis 1 0%",
                ),
              ).toBeInTheDocument();
          '''
          new = "\n".join(line[8:] if line.startswith("        ") else line for line in new.splitlines()) + "\n"
          if test_source.count(old) != 1:
              raise SystemExit("axis-share frontend regression drifted")
          test.write_text(test_source.replace(old, new, 1), encoding="utf-8")

          repaired = app.read_text(encoding="utf-8")
          marker = "const comparisonAxisShare = leftoverMapCompareAxisShare(axis);"
          if marker not in repaired:
              raise SystemExit("axis-share render marker missing")
          share_block = repaired.split(marker, 1)[1].split("</span>", 1)[0]
          if "aria-label=" in share_block:
              raise SystemExit("generic axis-share badge still carries aria-label")
          PY

      - name: Remove this execution harness and advance the harness branch non-force
        shell: bash
        run: |
          git config user.name "LineageWeave automation"
          git config user.email "automation@users.noreply.github.com"
          git rm -- .github/workflows/automation-828-axis-share-repair.yml
          git add frontend/src/App.tsx frontend/src/App.test.tsx
          git commit -m "fix(a11y): keep axis-share text unnamed on generic span"
          git push origin HEAD:automation/828-axis-share-repair-harness-20260908-0800
