name: Bounded gap baseline refresh

on:
  push:
    branches:
      - codex/gap-loop-20260912
    paths:
      - .github/workflows/automation-1041-gap-refresh-0648.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact pushed branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: codex/gap-loop-20260912
          fetch-depth: 0
          persist-credentials: true

      - name: Refresh only the live overlay and remove this workflow
        env:
          OVERLAY_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path("docs/product-technical-gap-baseline.md")
          text = path.read_text(encoding="utf-8")
          title = "# Product & Technical Gap Baseline\n\n"
          marker = "> Exact-head loop overlay: 2026-08-29 13:20 KST."
          if not text.startswith(title) or marker not in text:
              raise SystemExit("unexpected baseline shape")
          overlay = base64.b64decode(os.environ["OVERLAY_B64"]).decode("utf-8")
          path.write_text(title + overlay + text[text.index(marker):], encoding="utf-8")
          PY
          git diff --check
          git rm .github/workflows/automation-1041-gap-refresh-0648.yml
          git add docs/product-technical-gap-baseline.md
          git config user.name "LineageWeave maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(gaps): refresh terminal Strix security evidence"
          git push origin HEAD:codex/gap-loop-20260912
