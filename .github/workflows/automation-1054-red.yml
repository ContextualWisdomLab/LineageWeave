name: Report authorization RED

on:
  push:
    branches:
      - fix/report-aggregate-whole-population-auth
    paths:
      - .github/workflows/automation-1054-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false
      - name: Select pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - name: Install committed lock
        run: uv sync --frozen --extra dev --extra backend
      - name: Reproduce mixed-visibility report disclosure
        run: uv run --frozen python -m pytest -q tests/test_period_report_whole_population_authorization.py
