name: automation-828-current-827-diagnostic-r1
on:
  push:
    branches: [automation/828-current-827-diagnostic-r1-20260907-1425]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 10
      - name: Verify exact #827 and bounded harness
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0f9e9c8db37948041f39b4e68e4bbd808fa83752 HEAD
          unexpected="$(git diff --name-only 0f9e9c8db37948041f39b4e68e4bbd808fa83752..HEAD | grep -Ev '^\.github/workflows/automation-828-current-827-diagnostic-r1\.yml$' || true)"
          test -z "$unexpected"
      - name: Reapply historical origin without committing
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin e79137611f0d3041ad836c21e49a95bf7ef1001e
          set +e
          git cherry-pick --no-commit e79137611f0d3041ad836c21e49a95bf7ef1001e >/tmp/828-apply.log 2>&1
          status=$?
          set -e
          cat /tmp/828-apply.log
          echo "APPLY_STATUS=$status"
          echo "CONFLICTS_BEGIN"
          git diff --name-only --diff-filter=U || true
          echo "CONFLICTS_END"
          echo "STAGED_BEGIN"
          git diff --cached --name-only || true
          echo "STAGED_END"
          if [ "$status" -eq 0 ]; then
            git diff --cached --check
            test "$(git diff --cached --name-only | wc -l)" -gt 0
          fi
      - name: Detect stale identity and authority if apply is clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet --diff-filter=U; then
            if grep -R -n -E 'version = "2\.50\.0"|__version__ = "2\.50\.0"|ADR 0293|ADR0293' pyproject.toml lineageweave frontend docs/adr CHANGELOG.md CHANGELOG.d 2>/dev/null; then
              echo 'Historical identity/ADR authority requires reconstruction; do not promote this tree.'
            fi
          fi
