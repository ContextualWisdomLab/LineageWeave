          red = red.replace(old, new, 1)
          old = '''        ("post-1", "What happened?", "live scoped answer", ["post-1"])
              ]'''
          new = '''        ("post-1", "What happened?", "live scoped answer", ["post-1"], ["post-1"])
              ]'''
