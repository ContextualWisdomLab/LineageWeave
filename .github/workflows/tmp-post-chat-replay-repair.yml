          tests = tests.replace(old, new, 1)
          old = '''        persist_post_chat(conn, "post-1", "  What   happened? ", "A synthetic answer.", ["post-a", "post-a", "post-b"])
              )'''
          new = '''        persist_post_chat(
                  conn,
                  "post-1",
                  "  What   happened? ",
                  "A synthetic answer.",
                  ["post-a", "post-a", "post-b"],
                  source_post_ids=["post-1", "post-a", "post-b"],
