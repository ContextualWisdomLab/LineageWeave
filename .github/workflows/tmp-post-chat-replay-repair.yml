          red_path = Path('tests/test_post_chat_replay_authorization.py')
          red = red_path.read_text()
          old = '''    persisted_calls: list[tuple[str, str, str, list[str]]] = []'''
          new = '''    persisted_calls: list[tuple[str, str, str, list[str], list[str]]] = []'''
          red = red.replace(old, new, 1)
          old = '''        persisted_calls.append(
                  (
                      str(post_id),
