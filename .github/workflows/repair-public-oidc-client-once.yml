name: Repair public OIDC client once

on:
  push:
    branches:
      - fix/eliminate-public-client-ropc-20260918
    paths:
      - .github/workflows/repair-public-oidc-client-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: fix/eliminate-public-client-ropc-20260918
          fetch-depth: 2

      - name: Guard one-shot ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "44ab2f7202341b533e657714b8f97cd3e0021c8f"

      - name: Apply bounded realm repair
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("docker/keycloak/realm-export.json")
          realm = json.loads(path.read_text(encoding="utf-8"))
          matches = [c for c in realm["clients"] if c.get("clientId") == "lineageweave-frontend"]
          if len(matches) != 1:
              raise SystemExit(f"expected one lineageweave-frontend client, got {len(matches)}")
          client = matches[0]
          if client.get("publicClient") is not True or client.get("standardFlowEnabled") is not True:
              raise SystemExit("unexpected public Authorization Code client shape")
          if client.get("directAccessGrantsEnabled") is not True:
              raise SystemExit("expected predecessor directAccessGrantsEnabled=true")
          if client.get("serviceAccountsEnabled") is not False:
              raise SystemExit("unexpected service-account setting")
          if client.get("attributes", {}).get("pkce.code.challenge.method") not in (None, ""):
              raise SystemExit("expected predecessor PKCE requirement to be absent")

          client["directAccessGrantsEnabled"] = False
          attributes = client.setdefault("attributes", {})
          attributes["pkce.code.challenge.method"] = "S256"
          path.write_text(json.dumps(realm, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

      - name: Verify security contract
        run: uv run --locked --extra dev pytest -q tests/test_oidc_security_contract.py

      - name: Verify bounded diff and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "docker/keycloak/realm-export.json"
          rm .github/workflows/repair-public-oidc-client-once.yml
          git diff --exit-code -- tests/test_oidc_security_contract.py
          git status --short

      - name: Commit causal repair and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker/keycloak/realm-export.json .github/workflows/repair-public-oidc-client-once.yml
          git commit -m "fix(auth): require PKCE and disable public direct grants"
          git push origin HEAD:fix/eliminate-public-client-ropc-20260918
