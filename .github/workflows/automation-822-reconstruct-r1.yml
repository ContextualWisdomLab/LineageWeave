name: automation-822-current-821-reconstruction-r1

on:
  push:
    branches:
      - automation/822-current-821-reconstruction-r1-20260907-0750

permissions:
  contents: write

concurrency:
  group: automation-822-current-821-reconstruction-r1
  cancel-in-progress: true

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    env:
      EXPECTED_PARENT: 93eaa40f34098678fd53da4dbdccb1782dfd41a7
      HISTORICAL_FEATURE: 6726353a13798c0d1566821de9885f1783ebe35f
      STAGING_BRANCH: automation/822-product-staging-r1-20260907-0750
    steps:
      - name: Checkout exact repository history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Verify exact parent and reapply historical item-coverage delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git cat-file -e "$HISTORICAL_FEATURE^{commit}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$STAGING_BRANCH" "$EXPECTED_PARENT"

          if ! git cherry-pick "$HISTORICAL_FEATURE"; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            test "${#conflicts[@]}" -gt 0
            printf 'Resolving historical/current-parent overlaps in favor of exact #821 before semantic reapplication:\n%s\n' "${conflicts[*]}"
            for path in "${conflicts[@]}"; do
              git checkout --ours -- "$path"
              git add "$path"
            done
            if git diff --cached --quiet; then
              git cherry-pick --skip
            else
              GIT_EDITOR=true git cherry-pick --continue
            fi
          fi

          # Rebase every overlapping authority/source file on exact #821, then apply only #822 semantics.
          git checkout "$EXPECTED_PARENT" -- \
            AGENTS.md ARCHITECTURE.md CHANGELOG.md CLAUDE.md \
            docs/product-technical-gap-baseline.md docs/storybook-inventory.md \
            frontend/package.json frontend/src/App.test.tsx frontend/src/App.tsx \
            frontend/src/components/LeftoverPairList.tsx frontend/src/i18n.test.ts frontend/src/i18n.ts \
            frontend/src/leftoverMapCoverage.test.ts frontend/src/leftoverMapCoverage.ts \
            frontend/src/leftoverMapPlotLayout.ts pyproject.toml lineageweave/__init__.py

          git show "$HISTORICAL_FEATURE:docs/adr/0290-leftover-map-compare-item-coverage.md" > /tmp/item-adr.md
          git show "$HISTORICAL_FEATURE:CHANGELOG.d/2.47.0-leftover-map-compare-item-coverage.md" > /tmp/item-fragment.md
          rm -f docs/adr/0290-leftover-map-compare-item-coverage.md CHANGELOG.d/2.47.0-leftover-map-compare-item-coverage.md

          cat > tests/test_adr_0291_governance.py <<'PY'
          """Governance regression for grouping-comparison item coverage."""

          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]


          def test_grouping_comparison_item_coverage_uses_distinct_proposed_adr_0291() -> None:
              """Keep #822 distinct from #821 ADR 0290 and Proposed while Draft."""
              post_coverage = ROOT / "docs/adr/0290-leftover-map-compare-coverage.md"
              old_collision = ROOT / "docs/adr/0290-leftover-map-compare-item-coverage.md"
              item_coverage = ROOT / "docs/adr/0291-leftover-map-compare-item-coverage.md"
              assert post_coverage.exists()
              assert not old_collision.exists()
              text = item_coverage.read_text(encoding="utf-8")
              assert text.startswith("# ADR 0291 —")
              assert "**Decision status:** Proposed" in text
              assert "**Decision status:** Accepted" not in text
          PY

      - name: Reproduce identity-governance RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          uv run pytest -q tests/test_adr_0291_governance.py
          rc=$?
          set -e
          test "$rc" -ne 0

      - name: Apply minimal v2.48 identity and item-coverage composition fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected marker missing in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          def insert_before(path: str, marker: str, addition: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if addition.strip() in text:
                  return
              if marker not in text:
                  raise SystemExit(f"insert marker missing in {path}: {marker!r}")
              p.write_text(text.replace(marker, addition + marker, 1), encoding="utf-8")

          # Distinct successor decision: exact parent #821 owns ADR 0290 / v2.47.0.
          adr = Path("/tmp/item-adr.md").read_text(encoding="utf-8")
          adr = adr.replace("# ADR 0290 —", "# ADR 0291 —", 1)
          adr = adr.replace("**Decision status:** Accepted", "**Decision status:** Proposed", 1)
          adr = adr.replace("ADR 0290", "ADR 0291")
          adr = adr.replace("uses **0290**", "uses **0291**")
          adr = adr.replace("ADR 0289](0289-leftover-map-compare-coverage.md)", "ADR 0290](0290-leftover-map-compare-coverage.md)")
          adr = adr.replace("ADR 0289 already captions", "ADR 0290 already captions")
          adr = adr.replace("coverage on the grouping comparison strip (0289)", "coverage on the grouping comparison strip (0290)")
          adr = adr.replace(
              "Hidden posts stay hidden.",
              "Hidden posts stay hidden. Persisted item coverage is returned only when the caller can see the full persisted grouping population; partial-visibility groupings omit the entire persisted coverage aggregate instead of disclosing a hidden denominator or recomputing psychometric coverage from the visible subset.",
          )
          Path("docs/adr/0291-leftover-map-compare-item-coverage.md").write_text(adr, encoding="utf-8")

          fragment = Path("/tmp/item-fragment.md").read_text(encoding="utf-8")
          fragment = fragment.replace("2.47.0", "2.48.0").replace("ADR 0290", "ADR 0291")
          fragment += "\n- Authorization boundary: item coverage is shown only when the caller-visible population equals the persisted grouping population; partial-visibility rows omit the persisted coverage aggregate and never recompute a subset denominator.\n"
          Path("CHANGELOG.d/2.48.0-leftover-map-compare-item-coverage.md").write_text(fragment, encoding="utf-8")

          replace_once("pyproject.toml", 'version = "2.47.0"', 'version = "2.48.0"')
          replace_once("frontend/package.json", '"version": "2.47.0"', '"version": "2.48.0"')
          replace_once("lineageweave/__init__.py", '__version__ = "2.47.0"', '__version__ = "2.48.0"')

          replace_once("AGENTS.md", "/ 0288 / 0289 / 0290) are computed", "/ 0288 / 0289 / 0290 / 0291) are computed")
          insert_before(
              "AGENTS.md",
              "When `R`, `R̂`, `U`, `x`,\n",
              "ADR 0291 captions the grouping comparison strip with persisted leftover-map item complete-case coverage through leftoverMapItemCoverageCounts only when the caller can see the full persisted grouping population. Partial-visibility rows inherit ADR 0290's fail-closed coverage boundary and never recompute psychometric coverage from visible members, leftover pairs, or plotted criterion markers.\n",
          )
          replace_once("ARCHITECTURE.md", "/ 0288 / 0289 / 0290) persist", "/ 0288 / 0289 / 0290 / 0291) persist")
          insert_before(
              "ARCHITECTURE.md",
              "Click a post marker or a pair button\n",
              "ADR 0291 captions grouping-comparison persisted item complete-case coverage through leftoverMapItemCoverageCounts only under ADR 0290's full-visible-grouping authorization boundary.\n",
          )
          replace_once(
              "ARCHITECTURE.md",
              "plus persisted leftover-map post complete-case coverage (ADR 0290) only when the caller-visible member population equals the persisted grouping population;",
              "plus persisted leftover-map post complete-case coverage (ADR 0290) and item complete-case coverage (ADR 0291) only when the caller-visible member population equals the persisted grouping population;",
          )
          replace_once("CLAUDE.md", "/ 0288 / 0289 / 0290), occupational", "/ 0288 / 0289 / 0290 / 0291), occupational")

          p = Path("frontend/src/leftoverMapCoverage.ts")
          text = p.read_text(encoding="utf-8")
          text = text.replace("/ ADR 0288 / ADR 0290).", "/ ADR 0288 / ADR 0290 / ADR 0291).")
          text = text.replace(
              'export const LEFTOVER_MAP_COMPARE_COVERAGE_LABEL = "Leftover map comparison coverage";\n',
              'export const LEFTOVER_MAP_COMPARE_COVERAGE_LABEL = "Leftover map comparison coverage";\n\nexport const LEFTOVER_MAP_COMPARE_ITEM_COVERAGE_LABEL = "Leftover map comparison item coverage";\n',
              1,
          )
          p.write_text(text, encoding="utf-8")

          p = Path("frontend/src/App.tsx")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              "  LEFTOVER_MAP_COMPARE_COVERAGE_LABEL,\n  LEFTOVER_MAP_LIST_COVERAGE_LABEL,",
              "  LEFTOVER_MAP_COMPARE_COVERAGE_LABEL,\n  LEFTOVER_MAP_COMPARE_ITEM_COVERAGE_LABEL,\n  LEFTOVER_MAP_LIST_COVERAGE_LABEL,",
              1,
          )
          text = text.replace(
              "            const comparisonCoverageCounts = leftoverMapCoverageCounts(row.leftover_map_coverage);\n            return (",
              "            const comparisonCoverageCounts = leftoverMapCoverageCounts(row.leftover_map_coverage);\n            const comparisonItemCoverageCounts = leftoverMapItemCoverageCounts(row.leftover_map_coverage);\n            return (",
              1,
          )
          marker = "              {row.leftover_pairs && row.leftover_pairs.length > 0 && (\n"
          addition = (
              "              {comparisonItemCoverageCounts !== null ? (\n"
              "                <p className=\"post-meta\" role=\"note\" aria-label={t(LEFTOVER_MAP_COMPARE_ITEM_COVERAGE_LABEL)}>\n"
              "                  {tf(LEFTOVER_MAP_PLOT_ITEM_COVERAGE, comparisonItemCoverageCounts)}\n"
              "                </p>\n"
              "              ) : null}\n"
          )
          if addition not in text:
              if marker not in text:
                  raise SystemExit("App grouping comparison insertion marker missing")
              text = text.replace(marker, addition + marker, 1)
          p.write_text(text, encoding="utf-8")

          p = Path("frontend/src/App.test.tsx")
          text = p.read_text(encoding="utf-8")
          marker = (
              '    expect(\n'
              '      within(screen.getByLabelText("Grouping comparison")).queryByLabelText("Leftover map item coverage"),\n'
              '    ).not.toBeInTheDocument();\n'
          )
          addition = (
              '    expect(\n'
              '      within(screen.getByLabelText("Grouping comparison")).getAllByLabelText(\n'
              '        "Leftover map comparison item coverage",\n'
              '      ),\n'
              '    ).toHaveLength(2);\n'
              '    expect(\n'
              '      within(screen.getByLabelText("Grouping comparison")).getAllByLabelText(\n'
              '        "Leftover map comparison item coverage",\n'
              '      )[0],\n'
              '    ).toHaveTextContent("Leftover map used 2 of 2 scored criteria (complete-case)");\n'
          )
          if addition not in text:
              if marker not in text:
                  raise SystemExit("App test insertion marker missing")
              text = text.replace(marker, marker + addition, 1)
          p.write_text(text, encoding="utf-8")

          translations = {
              '    "Leftover map comparison coverage": "잔여 지도 비교 포함 범위",\n': '    "Leftover map comparison item coverage": "잔여 지도 비교 기준 포함 범위",\n',
              '    "Leftover map comparison coverage": "残差地图比较覆盖范围",\n': '    "Leftover map comparison item coverage": "残差地图比较准则覆盖范围",\n',
              '    "Leftover map comparison coverage": "残差マップの比較対象範囲",\n': '    "Leftover map comparison item coverage": "残差マップの比較基準対象範囲",\n',
              '    "Leftover map comparison coverage": "Phạm vi so sánh bản đồ phần dư",\n': '    "Leftover map comparison item coverage": "Phạm vi so sánh tiêu chí bản đồ phần dư",\n',
          }
          p = Path("frontend/src/i18n.ts")
          text = p.read_text(encoding="utf-8")
          for marker, addition in translations.items():
              if addition not in text:
                  if marker not in text:
                      raise SystemExit(f"i18n marker missing: {marker!r}")
                  text = text.replace(marker, marker + addition, 1)
          p.write_text(text, encoding="utf-8")

          p = Path("frontend/src/i18n.test.ts")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              '    "Leftover map comparison coverage",\n',
              '    "Leftover map comparison coverage",\n    "Leftover map comparison item coverage",\n',
              1,
          )
          test_marker = '  it.each([\n    ["ko", "잔여 지도 그림 기준 포함 범위"],\n'
          test_addition = '''  it.each([\n    ["ko", "잔여 지도 비교 기준 포함 범위"],\n    ["zh", "残差地图比较准则覆盖范围"],\n    ["ja", "残差マップの比較基準対象範囲"],\n    ["vi", "Phạm vi so sánh tiêu chí bản đồ phần dư"],\n  ] as const)("formats leftover map comparison item coverage label in %s", (locale, expected) => {\n    setLocale(locale);\n    expect(t("Leftover map comparison item coverage")).toBe(expected);\n  });\n\n'''
          if test_addition not in text:
              if test_marker not in text:
                  raise SystemExit("i18n test marker missing")
              text = text.replace(test_marker, test_addition + test_marker, 1)
          p.write_text(text, encoding="utf-8")

          p = Path("frontend/src/leftoverMapCoverage.test.ts")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              "  LEFTOVER_MAP_COMPARE_COVERAGE_LABEL,\n",
              "  LEFTOVER_MAP_COMPARE_COVERAGE_LABEL,\n  LEFTOVER_MAP_COMPARE_ITEM_COVERAGE_LABEL,\n",
              1,
          )
          marker = '}\n\n describe("leftoverMapIncompletePostCount"'
          # Use the historical suite boundary if formatting differs.
          addition = '''\n  it("keeps the grouping comparison item coverage label distinct from pair-list and graphic item labels", () => {\n    expect(LEFTOVER_MAP_COMPARE_ITEM_COVERAGE_LABEL).toBe("Leftover map comparison item coverage");\n    expect(LEFTOVER_MAP_COMPARE_ITEM_COVERAGE_LABEL).not.toBe(LEFTOVER_MAP_LIST_ITEM_COVERAGE_LABEL);\n    expect(LEFTOVER_MAP_COMPARE_ITEM_COVERAGE_LABEL).not.toBe(LEFTOVER_MAP_PLOT_ITEM_COVERAGE_LABEL);\n  });\n'''
          suite_marker = '\n});\n\ndescribe("leftoverMapIncompletePostCount"'
          if addition.strip() not in text:
              if suite_marker not in text:
                  raise SystemExit("coverage test suite marker missing")
              text = text.replace(suite_marker, addition + suite_marker, 1)
          p.write_text(text, encoding="utf-8")

          p = Path("frontend/src/components/LeftoverPairList.tsx")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              "ADR 0290\n * names persisted leftover-map post complete-case coverage on the grouping\n * comparison strip, not this pair list. Every badge still",
              "ADR 0290\n * names persisted leftover-map post complete-case coverage on the grouping\n * comparison strip, not this pair list. ADR 0291 names persisted leftover-map\n * item complete-case coverage on the grouping comparison strip, not this pair\n * list. Every badge still",
              1,
          )
          p.write_text(text, encoding="utf-8")

          p = Path("frontend/src/leftoverMapPlotLayout.ts")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              "grouping comparison complete-case coverage\n *  (ADR 0290) caption the pair list or the grouping comparison strip,",
              "grouping comparison complete-case coverage (ADR 0290), and grouping comparison item\n *  complete-case coverage (ADR 0291) caption the pair list or the grouping comparison strip,",
              1,
          )
          p.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          entry = "- Grouping comparison rows now name persisted leftover-map item complete-case coverage (ADR 0291 / v2.48.0) only when the caller can see the full persisted grouping population; partial-visibility rows omit the aggregate rather than leaking a denominator or recomputing subset coverage.\n\n"
          if entry not in text:
              text = text.replace("### Added\n\n", "### Added\n\n" + entry, 1)
              changelog.write_text(text, encoding="utf-8")

          inventory = Path("docs/storybook-inventory.md")
          lines = inventory.read_text(encoding="utf-8").splitlines()
          for i, line in enumerate(lines):
              if line.startswith("| `Reports/LeftoverPairList` |"):
                  phrase = " The grouping comparison strip also names persisted item complete-case coverage only for fully visible grouping populations."
                  if phrase.strip() not in line:
                      marker = " | `LeftoverPairList`, `LeftoverMapPlot`"
                      if marker not in line:
                          raise SystemExit("Storybook inventory module marker missing")
                      lines[i] = line.replace(marker, phrase + marker, 1)
                  break
          else:
              raise SystemExit("Storybook inventory row missing")
          inventory.write_text("\n".join(lines) + "\n", encoding="utf-8")

          baseline = Path("docs/product-technical-gap-baseline.md")
          text = baseline.read_text(encoding="utf-8")
          note = "> 2026-09-07 #822 reconstruction: exact #821 `93eaa40f...` owns ADR 0290/v2.47.0 and the full-visible-grouping coverage boundary. Preserve historical item-coverage composition as ADR 0291/v2.48.0; partial-visibility rows omit the shared persisted coverage aggregate. #963 remains owner of broader current-vs-historical baseline governance.\n>\n"
          if note not in text:
              text = text.replace("# Product & Technical Gap Baseline\n\n", "# Product & Technical Gap Baseline\n\n" + note, 1)
              baseline.write_text(text, encoding="utf-8")
          PY

      - name: Exact reconstructed GREEN
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen
          uv run pytest -q tests/test_adr_0290_governance.py tests/test_adr_0291_governance.py tests/test_compare_coverage_visibility.py tests/test_package_version.py
          npm --prefix frontend ci
          npm --prefix frontend exec -- vitest run src/leftoverMapCoverage.test.ts src/i18n.test.ts src/App.test.tsx
          npm --prefix frontend exec -- oxlint src
          npm --prefix frontend run build
          npm --prefix frontend run build-storybook
          python - <<'PY'
          from pathlib import Path
          assert not Path("docs/adr/0290-leftover-map-compare-item-coverage.md").exists()
          assert Path("docs/adr/0290-leftover-map-compare-coverage.md").exists()
          assert Path("docs/adr/0291-leftover-map-compare-item-coverage.md").exists()
          assert 'version = "2.48.0"' in Path("pyproject.toml").read_text()
          assert '"version": "2.48.0"' in Path("frontend/package.json").read_text()
          assert '__version__ = "2.48.0"' in Path("lineageweave/__init__.py").read_text()
          assert "leftoverMapItemCoverageCounts(row.leftover_map_coverage)" in Path("frontend/src/App.tsx").read_text()
          PY

      - name: Commit workflow-free clean staging tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/automation-822-reconstruct-r1.yml
          git add -A
          git status --short
          git commit -m "feat(reports): reconstruct comparison item coverage as v2.48.0"
          test -z "$(git status --porcelain)"
          git log -1 --format='staging commit=%H tree=%T parents=%P'
          git diff --name-status "$EXPECTED_PARENT" HEAD
          git push origin "HEAD:refs/heads/$STAGING_BRANCH"
