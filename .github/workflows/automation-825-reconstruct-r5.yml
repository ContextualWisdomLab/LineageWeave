          )

          translations = {
              '    "Leftover map comparison incomplete posts": "잔여 지도 비교 불완전 글",\n': '    "Leftover map comparison incomplete posts": "잔여 지도 비교 불완전 글",\n    "Leftover map comparison incomplete items": "잔여 지도 비교 불완전 기준",\n',
