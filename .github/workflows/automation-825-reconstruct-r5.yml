          text = p.read_text(encoding="utf-8")
          old = "The grouping comparison strip also names persisted item complete-case coverage only for fully visible grouping populations."
          new = "The grouping comparison strip also names persisted item complete-case coverage, incomplete-post count, and incomplete-item count only for fully visible grouping populations; partial visibility omits those persisted grouping aggregates rather than recomputing them from the visible subset."
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit("storybook comparison marker mismatch")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Release identity for the serialized successor.
          replace_once("pyproject.toml", 'version = "2.50.0"', 'version = "2.51.0"')
          replace_once("frontend/package.json", '"version": "2.50.0"', '"version": "2.51.0"')
          replace_once("lineageweave/__init__.py", '__version__ = "2.50.0"', '__version__ = "2.51.0"')

          # Current architecture/register statements. Do not rewrite the broader dated gap
          # baseline here; #963 owns its current-vs-historical authority repair.
          p = Path("AGENTS.md")
          text = p.read_text(encoding="utf-8")
          marker = "ADR 0293 captions the grouping comparison strip with persisted leftover-map incomplete-post count only under the same full-visible-grouping authorization boundary. Partial-visibility groupings omit the aggregate and never derive dropped posts from the visible subset or scored-minus-used. Persisted valid dropped `0` remains visible.\n"
          add = marker + "ADR 0294 captions persisted leftover-map incomplete-item count on the grouping comparison strip under the same full-visible-grouping boundary. Partial visibility omits the aggregate; never recompute a psychometric dropped-item count from visible members, pairs, or markers. Persisted valid dropped `0` remains visible.\n"
          if "ADR 0294 captions persisted leftover-map incomplete-item count" not in text:
              if text.count(marker) != 1: raise SystemExit("AGENTS ADR0293 marker mismatch")
              text = text.replace(marker, add, 1)
              text = text.replace("/ 0291 / 0292 / 0293) are computed", "/ 0291 / 0292 / 0293 / 0294) are computed", 1)
              p.write_text(text, encoding="utf-8")

          p = Path("ARCHITECTURE.md")
          text = p.read_text(encoding="utf-8")
          marker = "ADR 0293 captions grouping-comparison persisted incomplete-post count only for a fully caller-visible persisted grouping; partial visibility omits the aggregate rather than disclosing or recomputing a hidden-population count.\n"
          add = marker + "ADR 0294 captions grouping-comparison persisted incomplete-item count only for a fully caller-visible persisted grouping; partial visibility omits it rather than disclosing or recomputing a hidden-population criterion count.\n"
          if "ADR 0294 captions grouping-comparison persisted incomplete-item count" not in text:
              if text.count(marker) != 1: raise SystemExit("ARCHITECTURE ADR0293 marker mismatch")
              text = text.replace(marker, add, 1)
              text = text.replace("/ 0291 / 0292 / 0293) persist", "/ 0291 / 0292 / 0293 / 0294) persist", 1)
              p.write_text(text, encoding="utf-8")

          p = Path("CLAUDE.md")
          text = p.read_text(encoding="utf-8")
          if "/ 0294), occupational" not in text:
              marker = "/ 0291 / 0292 / 0293), occupational"
              if text.count(marker) != 1: raise SystemExit("CLAUDE ADR sequence marker mismatch")
              p.write_text(text.replace(marker, "/ 0291 / 0292 / 0293 / 0294), occupational", 1), encoding="utf-8")

          p = Path("CHANGELOG.md")
          text = p.read_text(encoding="utf-8")
          entry = "- Grouping comparison rows now show persisted leftover-map incomplete-item count through `leftoverMapIncompleteItemCount` (ADR 0294 / v2.51.0) only for a fully caller-visible persisted grouping. Partial visibility omits the aggregate; valid persisted zero remains visible, and the UI never derives dropped criteria from scored-minus-used or visible-subset evidence.\n\n"
          if entry not in text:
              marker = "### Added\n\n"
              if text.count(marker) < 1: raise SystemExit("CHANGELOG Added marker missing")
              p.write_text(text.replace(marker, marker + entry, 1), encoding="utf-8")
          PY

          cat > docs/adr/0294-leftover-map-compare-incomplete-item.md <<'EOF'
          # ADR 0294 — Name leftover-map incomplete item coverage on the grouping comparison strip

          **Decision status:** Proposed
          **Date:** 2026-09-07

          ## Context

          `report_leftover_map_coverage.incomplete_item_count` is persisted by the existing
          measurement/report boundary. ADR 0290 exposes grouping-comparison post complete-case
          coverage, ADR 0291 exposes item complete-case coverage, ADR 0292 names persisted
          singular values on leftover-axis badges, and ADR 0293 exposes grouping-comparison
          incomplete-post count. The historical implementation of this increment used the
          collided identity ADR 0292/v2.49.0; that identity is evidence only.

          A buyer comparing groupings still needs to know when scored criteria were excluded
          from the complete-case Gabriel factorization. Omitting that fact can make sparse
          criteria disappear from the comparison while leaving the visible used/scored item
          count ambiguous.

          ## Decision

          LineageWeave may caption persisted grouping-comparison incomplete-item count through
          the existing `leftoverMapIncompleteItemCount(row.leftover_map_coverage)` helper and
          the distinct accessible name `Leftover map comparison incomplete items`. Missing,
          non-integer, negative, or item-complete-case-inconsistent counts omit only this note;
          persisted valid zero remains visible. Do not derive dropped criteria from
          scored-minus-used, pair count, plotted markers, distance, rank, axis count, or another
          aggregate.

          This aggregate inherits ADR 0290's authorization boundary: it is available only when
          the caller can see the full persisted grouping population. If ABAC hides any grouping
          member, `row.leftover_map_coverage` remains absent and the UI omits the aggregate. Do
          not recompute psychometric coverage or dropped-item counts from the visible subset.

          This is presentation of an existing persisted fact. No SQL, schema, psychometric
          kernel, theta, leftover score, or alternate measurement authority is added.

          ## Alternatives rejected

          Deriving `scored_item_count - map_item_count` in the UI is rejected because it turns a
          persisted evidence contract into client-side measurement. Reading the underlying table
          directly is rejected because it bypasses the authorized compare API. Reusing pair-list
          or graphic labels is rejected because those are different surfaces and accessible
          identities.

          ## Consequences

          Fully visible grouping rows can name persisted dropped criteria next to the existing
          post/item coverage and incomplete-post notes. Partially visible rows fail closed and
          reveal neither the full-population denominator nor a subset-recomputed surrogate.
          ADR 0294 stays Proposed while the PR is Draft and can become Accepted only with the
          normal protected-branch merge/release evidence.

          ## References

          Gabriel, K. R. (1971). The biplot graphic display of matrices with application to
          principal component analysis. *Biometrika, 58*(3), 453–467.
          https://doi.org/10.1093/biomet/58.3.453

          Jeon, M., Jin, I. H., Schweinberger, M., & Baugh, S. (2021). Mapping unobserved
          item–respondent interactions: A latent space item response model with interaction map.
          *Psychometrika, 86*(2), 378–403. https://doi.org/10.1007/s11336-021-09762-5
          EOF
          sed -i 's/^          //' docs/adr/0294-leftover-map-compare-incomplete-item.md

          cat > CHANGELOG.d/2.51.0-leftover-map-compare-incomplete-item.md <<'EOF'
          ## 2.51.0 — Leftover-map incomplete item coverage on grouping comparison

          - Grouping comparison rows name persisted incomplete-item count through
            `leftoverMapIncompleteItemCount` (ADR 0294) with the distinct accessible label
            `Leftover map comparison incomplete items`. Missing or invalid counts are omitted;
            persisted zero remains visible. The aggregate is exposed only for a fully
            caller-visible persisted grouping and is never recomputed from the visible subset.
            No SQL, new measurement authority, leftover score, or theta is introduced.
          EOF
          sed -i 's/^          //' CHANGELOG.d/2.51.0-leftover-map-compare-incomplete-item.md

          cat > tests/test_adr_0294_governance.py <<'PY'
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]

          def test_incomplete_item_comparison_uses_unique_proposed_adr_0294() -> None:
              expected = {
                  290: "0290-leftover-map-compare-coverage.md",
                  291: "0291-leftover-map-compare-item-coverage.md",
                  292: "0292-leftover-map-axis-singular.md",
                  293: "0293-leftover-map-compare-incomplete-post.md",
                  294: "0294-leftover-map-compare-incomplete-item.md",
              }
              for number, filename in expected.items():
                  matches = list((ROOT / "docs/adr").glob(f"{number:04d}-*.md"))
                  assert len(matches) == 1, (number, matches)
                  assert matches[0].name == filename
              text = (ROOT / "docs/adr/0294-leftover-map-compare-incomplete-item.md").read_text(encoding="utf-8")
              assert text.startswith("# ADR 0294 —")
              assert "**Decision status:** Proposed" in text
              assert "**Decision status:** Accepted" not in text
              assert "full persisted grouping population" in text
              assert "visible subset" in text
              assert "No SQL" in text
          PY
      - name: Install RED dependencies
        run: uv sync --frozen --extra dev
      - name: RED proves ADR/release identity is missing before causal repair
