    branches: [automation/825-current-824-reconstruction-r5-20260907-1225]
permissions:
  contents: write
concurrency:
  group: automation-825-current-824-reconstruction-r5
  cancel-in-progress: true
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    env:
      EXPECTED_PARENT: 499d653ed6e9206249e3f3a07518ad3fc01f14bd
      HISTORICAL_PARENT: 8b2ed956b2ba66e3aa2d149b701c242e3b016dd9
      HISTORICAL_FEATURE: bca6baabd917478bf4f6b688ec2755cde95e3575
      STAGING_BRANCH: automation/825-product-staging-r5-20260907-1225
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
