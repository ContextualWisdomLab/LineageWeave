          git switch -C "$STAGING_BRANCH" "$EXPECTED_PARENT"
      - name: Reconstruct only the valid incomplete-item comparison delta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, sentinel: str | None = None) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if sentinel is not None and sentinel in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one marker, found {text.count(old)}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Existing helper already validates persisted incomplete-item counts; this increment only
          # gives the grouping-comparison presentation a distinct, accessible identity.
          replace_once(
              "frontend/src/leftoverMapCoverage.ts",
              'export const LEFTOVER_MAP_COMPARE_INCOMPLETE_POST_LABEL = "Leftover map comparison incomplete posts";\n',
              'export const LEFTOVER_MAP_COMPARE_INCOMPLETE_POST_LABEL = "Leftover map comparison incomplete posts";\n\nexport const LEFTOVER_MAP_COMPARE_INCOMPLETE_ITEM_LABEL = "Leftover map comparison incomplete items";\n',
              "LEFTOVER_MAP_COMPARE_INCOMPLETE_ITEM_LABEL",
          )

          replace_once(
              "frontend/src/App.tsx",
              "  LEFTOVER_MAP_COMPARE_INCOMPLETE_POST_LABEL,\n",
              "  LEFTOVER_MAP_COMPARE_INCOMPLETE_POST_LABEL,\n  LEFTOVER_MAP_COMPARE_INCOMPLETE_ITEM_LABEL,\n",
              "LEFTOVER_MAP_COMPARE_INCOMPLETE_ITEM_LABEL,",
          )
          replace_once(
              "frontend/src/App.tsx",
              "            const comparisonIncompletePostCount = leftoverMapIncompletePostCount(row.leftover_map_coverage);\n",
              "            const comparisonIncompletePostCount = leftoverMapIncompletePostCount(row.leftover_map_coverage);\n            const comparisonIncompleteItemCount = leftoverMapIncompleteItemCount(row.leftover_map_coverage);\n",
              "const comparisonIncompleteItemCount = leftoverMapIncompleteItemCount",
          )
          replace_once(
              "frontend/src/App.tsx",
              '              {comparisonIncompletePostCount !== null ? (\n                <p className="post-meta" role="note" aria-label={t(LEFTOVER_MAP_COMPARE_INCOMPLETE_POST_LABEL)}>\n                  {tf(LEFTOVER_MAP_PLOT_INCOMPLETE_POST, comparisonIncompletePostCount)}\n                </p>\n              ) : null}\n',
              '              {comparisonIncompletePostCount !== null ? (\n                <p className="post-meta" role="note" aria-label={t(LEFTOVER_MAP_COMPARE_INCOMPLETE_POST_LABEL)}>\n                  {tf(LEFTOVER_MAP_PLOT_INCOMPLETE_POST, comparisonIncompletePostCount)}\n                </p>\n              ) : null}\n              {comparisonIncompleteItemCount !== null ? (\n                <p className="post-meta" role="note" aria-label={t(LEFTOVER_MAP_COMPARE_INCOMPLETE_ITEM_LABEL)}>\n                  {tf(LEFTOVER_MAP_PLOT_INCOMPLETE_ITEM, comparisonIncompleteItemCount)}\n                </p>\n              ) : null}\n',
