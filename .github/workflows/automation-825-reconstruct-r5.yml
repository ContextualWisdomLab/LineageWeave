          adr=Path('docs/adr/0294-leftover-map-compare-incomplete-item.md').read_text(encoding='utf-8')
          assert '**Decision status:** Proposed' in adr and 'visible subset' in adr
          PY
          test -z "$(git diff --name-only "$EXPECTED_PARENT" | grep '^.github/workflows/' || true)"
