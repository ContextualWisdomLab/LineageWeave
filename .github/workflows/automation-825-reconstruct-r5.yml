          git add -A
          git commit -m "feat(reports): reconstruct comparison incomplete-item coverage as v2.51.0"
          test -z "$(git status --porcelain)"
          git log -1 --format='staging commit=%H tree=%T parents=%P' | tee -a "$GITHUB_STEP_SUMMARY"
          echo '### Product delta' >> "$GITHUB_STEP_SUMMARY"
          git diff --name-status "$EXPECTED_PARENT" HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          git push origin "HEAD:refs/heads/$STAGING_BRANCH"
