name: automation-825-conflict-evidence-r4

on:
  push:
    branches:
      - automation/825-conflict-evidence-r4-20260907-1218

permissions:
  contents: read

jobs:
  inspect-conflicts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact current parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "499d653ed6e9206249e3f3a07518ad3fc01f14bd"
      - name: Capture historical delta conflict evidence
        shell: bash
        run: |
          set -u
          git config user.name "LineageWeave automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git cherry-pick --no-commit bca6baabd917478bf4f6b688ec2755cde95e3575; then
            {
              echo '## #825 historical delta application'
              echo 'HISTORICAL_DELTA_APPLIES_CLEANLY'
              echo '### Changed paths'
              git diff --name-status
            } >> "$GITHUB_STEP_SUMMARY"
            git diff --check
            exit 0
          fi
          {
            echo '## #825 historical delta conflict evidence'
            echo '### Unmerged paths'
            git diff --name-status --diff-filter=U
            echo '### Working-tree status'
            git status --short
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
