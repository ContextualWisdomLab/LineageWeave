name: Inspect PR 258 current-main conflicts

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.pull_request.number == 258 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: feat/analysis-run-name-evidence-lineage
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch protected main and attempt a real three-way merge
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          echo "HEAD=$(git rev-parse HEAD)"
          echo "MAIN=$(git rev-parse origin/main)"
          echo "MERGE_BASE=$(git merge-base HEAD origin/main)"
          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e
          echo "MERGE_RC=$rc"
          echo "=== UNMERGED PATHS ==="
          git diff --name-only --diff-filter=U | sort
          echo "=== STATUS ==="
          git status --short
          if [ "$rc" -ne 0 ]; then
            exit 1
          fi
          git merge --abort
