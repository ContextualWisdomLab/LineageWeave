name: automation 831 cross-share repair

on:
  push:
    branches:
      - feat/leftover-map-compare-cross-share-v2530

permissions:
  contents: write

concurrency:
  group: automation-831-cross-share-repair-v9
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify serialized predecessor and product blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "662bb9e87cde99eb5ab567a93fdb451201a37a90"
          test "$(git rev-parse HEAD:frontend/src/App.tsx)" = "e959ea7515286f976b9bade9247c17ae604f2608"
          test "$(git rev-parse HEAD:backend/app/report_ingestion.py)" = "b4bfb3187b8b85afa7f944a82e5e1664728b3c90"

      - name: Apply bounded source repair
        run: |
          python scripts/automation_831_cross_share_repair.py
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Install locked Python and Rust environment
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          uv sync --frozen --extra dev --extra backend

      - name: Prove backend and source contracts GREEN
        run: |
          uv run --frozen python -m pytest -q backend/tests/test_period_comparison_cross_share.py
          uv run --frozen python -c 'import runpy; n=runpy.run_path("tests/test_grouping_comparison_cross_share_contract.py"); n["test_grouping_comparison_projects_persisted_cross_share_into_one_accessible_action"](); n["test_cross_share_formatter_remains_fail_closed_and_unclamped"]()'

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"

      - name: Validate frontend candidate
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run test
          pnpm run build
          pnpm run build-storybook

      - name: Commit GREEN and remove one-shot repair assets
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/automation-831-cross-share-repair.yml scripts/automation_831_cross_share_repair.py
          git add frontend/src/App.tsx backend/app/report_ingestion.py backend/tests/test_period_comparison_cross_share.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(reports): transport and project comparison cross share"
          git push origin HEAD:feat/leftover-map-compare-cross-share-v2530
