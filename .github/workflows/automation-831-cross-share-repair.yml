name: automation 831 cross-share repair

on:
  push:
    branches:
      - feat/leftover-map-compare-cross-share-v2530

permissions:
  contents: write

concurrency:
  group: automation-831-cross-share-repair-v5
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 7

      - name: Verify serialized predecessor and unchanged product sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b7ebc9fa4ef464f8e8c36766a7477b70ee618be5"
          git merge-base --is-ancestor 856464d69bdf989c6e47bd1f6e3126fc839ce229 HEAD
          test "$(git rev-parse HEAD:frontend/src/App.tsx)" = "$(git rev-parse 856464d69bdf989c6e47bd1f6e3126fc839ce229:frontend/src/App.tsx)"
          test "$(git rev-parse HEAD:backend/app/report_ingestion.py)" = "$(git rev-parse 856464d69bdf989c6e47bd1f6e3126fc839ce229:backend/app/report_ingestion.py)"

      - name: Apply persisted transport and comparison projection repair
        shell: bash
        run: |
          set -euo pipefail
          cat > backend/tests/test_period_comparison_cross_share.py <<'PY'
          """Regression for persisted cross-share transport on the comparison read model."""

          from __future__ import annotations

          import asyncio
          from typing import Any

          from backend.app import report_ingestion


          class _ComparisonConnection:
              """Minimal asyncpg-shaped fixture for one comparison grouping."""

              def __init__(self) -> None:
                  self.leftover_query = ""

              async def fetch(self, query: str, *_args: Any) -> list[dict[str, Any]]:
                  if "from report_period_score" in query:
                      return [{"grouping_kind": "process_unit", "grouping_key": "PU-1", "mean_theta": 0.25, "post_count": 4, "link_method": "fixture"}]
                  if "from report_member_score" in query:
                      return []
                  if "from report_leftover_pair" in query:
                      self.leftover_query = query
                      return [
                          {
                              "grouping_kind": "process_unit",
                              "grouping_key": "PU-1",
                              "pair_kind": pair_kind,
                              "post_id": f"post-{index}",
                              "criterion_code": "criterion-a",
                              "leftover_distance": 1.0,
                              "leftover_residual": -0.5,
                              "leftover_map_reconstruction": None,
                              "leftover_map_unexplained_share": None,
                              "leftover_map_cross_share": cross_share,
                              "post_title": f"Post {index}",
                              "visibility_code": "public",
                              "corporate_entity_id": f"entity-{index}",
                              "has_real_source_context": True,
                          }
                          for index, (pair_kind, cross_share) in enumerate(
                              (("closest", 0.12), ("farthest", 0.0), ("closest", -0.25), ("farthest", None)),
                              start=1,
                          )
                      ]
                  if "from report_leftover_map_coverage" in query or "from report_leftover_map_axis" in query:
                      return []
                  raise AssertionError(f"unexpected query: {query}")


          def test_period_comparison_transports_persisted_cross_share(monkeypatch) -> None:
              """Finite signed, zero, and null x values survive the persisted pair boundary."""

              async def _label(_conn: Any, _kind: str, _key: str) -> str:
                  return "Process unit 1"

              monkeypatch.setattr(report_ingestion, "resolve_grouping_label", _label)
              connection = _ComparisonConnection()
              payload = asyncio.run(report_ingestion.fetch_period_comparison(connection, "2026-W02"))
              assert "lp.leftover_map_cross_share" in connection.leftover_query
              assert [pair["leftover_map_cross_share"] for pair in payload[0]["leftover_pairs"]] == [0.12, 0.0, -0.25, None]
          PY

          python - <<'PY'
          from pathlib import Path
          import re

          app_path = Path("frontend/src/App.tsx")
          app = app_path.read_text(encoding="utf-8")

          import_anchor = '''import {
            formatLeftoverMapUnexplainedShare,
            LEFTOVER_MAP_COMPARE_UNEXPLAINED_SHARE_LABEL,
          } from "./leftoverMapUnexplainedShare";
          import {
            leftoverMapCompareAxisShare,'''
          import_value = '''import {
            formatLeftoverMapUnexplainedShare,
            LEFTOVER_MAP_COMPARE_UNEXPLAINED_SHARE_LABEL,
          } from "./leftoverMapUnexplainedShare";
          import { formatLeftoverMapCrossShare } from "./leftoverMapCrossShare";
          import {
            leftoverMapCompareAxisShare,'''
          if app.count(import_anchor) != 1:
              raise SystemExit(f"import anchor count={app.count(import_anchor)}")
          app = app.replace(import_anchor, import_value, 1)

          declaration = re.compile(
              r'(\s+const unexplainedShare = formatLeftoverMapUnexplainedShare\(\n'
              r'\s+pair\.leftover_map_unexplained_share,\n'
              r'\s+\);\n)'
              r'(\s+const pairAccessibleName = )'
          )
          app, count = declaration.subn(
              r'\1                    const crossShare = formatLeftoverMapCrossShare(\n'
              r'                      pair.leftover_map_cross_share,\n'
              r'                    );\n\2',
              app,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"declaration anchor count={count}")

          accessible = re.compile(
              r'(?P<u>\$\{\n\s+unexplainedShare\n\s+\? ` · \$\{t\(LEFTOVER_MAP_COMPARE_UNEXPLAINED_SHARE_LABEL\)\} \$\{unexplainedShare\}`\n\s+: ""\n\s+\})(?P<end>`;)'
          )
          app, count = accessible.subn(r'\g<u>${crossShare ? ` · ${crossShare}` : ""}\g<end>', app, count=1)
          if count != 1:
              raise SystemExit(f"accessible-name anchor count={count}")

          pair_start = app.index("const pairAccessibleName =")
          pair_prefix, pair_tail = app[:pair_start], app[pair_start:]
          badge = re.compile(
              r'(?P<u>\s+\{unexplainedShare \? \(\n'
              r'\s+<span className="post-badge" aria-hidden="true">\n'
              r'\s+\{unexplainedShare\}\n'
              r'\s+</span>\n'
              r'\s+\) : null\}\n)'
              r'(?P<close>\s+</button>)'
          )
          pair_tail, count = badge.subn(
              r'\g<u>                          {crossShare ? (\n'
              r'                            <span className="post-badge" aria-hidden="true">\n'
              r'                              {crossShare}\n'
              r'                            </span>\n'
              r'                          ) : null}\n\g<close>',
              pair_tail,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"badge anchor count={count}")
          app = pair_prefix + pair_tail
          if "LEFTOVER_MAP_COMPARE_CROSS_SHARE_LABEL" in app:
              raise SystemExit("forbidden static comparison cross-share label authority")
          app_path.write_text(app, encoding="utf-8")

          backend_path = Path("backend/app/report_ingestion.py")
          backend = backend_path.read_text(encoding="utf-8")
          query_anchor = '''               lp.leftover_map_reconstruction, lp.leftover_map_unexplained_share,
               p.post_title, p.visibility_code, p.corporate_entity_id,'''
          query_value = '''               lp.leftover_map_reconstruction, lp.leftover_map_unexplained_share,
               lp.leftover_map_cross_share,
               p.post_title, p.visibility_code, p.corporate_entity_id,'''
          if backend.count(query_anchor) != 1:
              raise SystemExit(f"backend select anchor count={backend.count(query_anchor)}")
          backend = backend.replace(query_anchor, query_value, 1)

          payload_anchor = '''                        "leftover_map_unexplained_share": (
                            None
                            if pair["leftover_map_unexplained_share"] is None
                            else float(pair["leftover_map_unexplained_share"])
                        ),
                        "visibility_code": pair["visibility_code"],'''
          payload_value = '''                        "leftover_map_unexplained_share": (
                            None
                            if pair["leftover_map_unexplained_share"] is None
                            else float(pair["leftover_map_unexplained_share"])
                        ),
                        "leftover_map_cross_share": (
                            None
                            if pair["leftover_map_cross_share"] is None
                            else float(pair["leftover_map_cross_share"])
                        ),
                        "visibility_code": pair["visibility_code"],'''
          if backend.count(payload_anchor) != 1:
              raise SystemExit(f"backend payload anchor count={backend.count(payload_anchor)}")
          backend_path.write_text(backend.replace(payload_anchor, payload_value, 1), encoding="utf-8")
          PY
          git diff --check

      - name: Set up Python and locked dependencies
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Install locked Python/Rust environment
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          uv sync --frozen --extra dev --extra backend

      - name: Prove causal GREEN contracts
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python -m pytest -q backend/tests/test_period_comparison_cross_share.py
          uv run --frozen python - <<'PY'
          import runpy
          ns = runpy.run_path("tests/test_grouping_comparison_cross_share_contract.py")
          ns["test_grouping_comparison_projects_persisted_cross_share_into_one_accessible_action"]()
          ns["test_cross_share_formatter_remains_fail_closed_and_unclamped"]()
          PY

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Validate frontend candidate
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run test
          pnpm run build
          pnpm run build-storybook

      - name: Commit GREEN repair, remove temporary workflow, and push non-force
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/automation-831-cross-share-repair.yml
          git add frontend/src/App.tsx backend/app/report_ingestion.py backend/tests/test_period_comparison_cross_share.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(reports): transport and project comparison cross share"
          git push origin HEAD:feat/leftover-map-compare-cross-share-v2530
