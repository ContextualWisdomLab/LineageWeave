name: Temporary 811 foundation convergence

on:
  push:
    branches:
      - "automation/811-foundation-convergence-20260906"

permissions:
  contents: write

concurrency:
  group: temporary-811-foundation-convergence
  cancel-in-progress: true

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact #811 staging branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: automation/811-foundation-convergence-20260906
          fetch-depth: 0

      - name: Verify exact #802 foundation and resolve known successor conflicts
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/leftover-map-segment-explained-share-v2300
          parent=32f1cda10a2a1a6cabd64a3ae6f59bd6f0b20fd6
          actual="$(git rev-parse origin/feat/leftover-map-segment-explained-share-v2300)"
          test "$actual" = "$parent"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          git merge --no-commit --no-ff "$parent"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U | sort | tr '\n' ' ' | sed 's/ $//')"
            expected="docs/product-technical-gap-baseline.md frontend/src/i18n.test.ts frontend/src/i18n.ts frontend/src/leftoverMapPlotLayout.ts lineageweave/__init__.py"
            if [ "$conflicts" != "$expected" ]; then
              echo "::error title=Unexpected exact #811/#802 conflicts::$conflicts"
              exit 42
            fi
            # #811 is the v2.37 successor composition for the i18n/layout/runtime
            # surfaces. #802 is the foundation authority for the shared gap baseline.
            git checkout --ours frontend/src/i18n.test.ts frontend/src/i18n.ts frontend/src/leftoverMapPlotLayout.ts lineageweave/__init__.py
            git checkout --theirs docs/product-technical-gap-baseline.md
            git add frontend/src/i18n.test.ts frontend/src/i18n.ts frontend/src/leftoverMapPlotLayout.ts lineageweave/__init__.py docs/product-technical-gap-baseline.md
          fi

      - name: Keep the gap baseline code-current after convergence
        shell: python
        run: |
          from pathlib import Path

          path = Path("docs/product-technical-gap-baseline.md")
          text = path.read_text(encoding="utf-8")
          heading = "# Product & Technical Gap Baseline\n"
          if not text.startswith(heading):
              raise SystemExit("product gap baseline heading changed unexpectedly")
          note = (
              "\n> Exact-head convergence note: the v2.37 leftover-map successor composition "
              "keeps the #802 explained-share foundation while retaining persisted "
              "unexplained-share, cross-share, unexplained-U, residual-R, observed-Y, "
              "expected-E, and rank captions plus the Vietnamese explained-share "
              "terminology regression. This branch remains review-gated; no predecessor "
              "check or approval is inherited.\n"
          )
          if "Exact-head convergence note: the v2.37 leftover-map successor composition" not in text:
              text = heading + note + text[len(heading):]
          path.write_text(text, encoding="utf-8")

      - name: Verify v2.37 successor identity survives foundation convergence
        shell: python
        run: |
          import json
          import re
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          frontend = json.loads(Path("frontend/package.json").read_text(encoding="utf-8"))
          init_text = Path("lineageweave/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__ = "([^"]+)"$', init_text, re.MULTILINE)
          if match is None:
              raise SystemExit("lineageweave.__version__ declaration missing")
          versions = (project["project"]["version"], frontend["version"], match.group(1))
          if versions != ("2.37.0", "2.37.0", "2.37.0"):
              raise SystemExit(f"release identity drift after foundation convergence: {versions!r}")

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run successor and foundation contracts
        working-directory: frontend
        run: |
          pnpm exec vitest run \
            src/leftoverMapPlotVietnameseCopy.test.ts \
            src/i18n.test.ts \
            src/leftoverMapPlotLayout.test.ts \
            src/leftoverMapPlotSmallCanvas.test.ts \
            src/components/LeftoverMapPlot.test.tsx

      - name: Commit clean two-parent tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm .github/workflows/temporary-811-foundation-convergence.yml
          git add -A
          test -f .git/MERGE_HEAD
          git commit -m "merge: converge #811 with #802 foundation"
          git push origin HEAD:automation/811-foundation-convergence-20260906
