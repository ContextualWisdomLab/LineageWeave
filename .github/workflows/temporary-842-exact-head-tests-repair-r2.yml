name: Temporary 842 exact-head tests repair r2

on:
  push:
    branches:
      - "automation/842-exact-head-tests-repair-r2-20260906"

permissions:
  contents: write

concurrency:
  group: temporary-842-exact-head-tests-repair-r2
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: automation/842-exact-head-tests-repair-r2-20260906
          fetch-depth: 0

      - name: Verify exact product ancestry and isolated harness delta
        shell: bash
        run: |
          set -euo pipefail
          product=f013dfb53b255e8e0be1dfb783cb41dca7eeb83e
          test "$(git rev-parse HEAD^)" = "$product"
          test "$(git diff --name-only "$product"..HEAD)" = ".github/workflows/temporary-842-exact-head-tests-repair-r2.yml"
          grep -q '^\*\*Decision status:\*\* Proposed$' docs/adr/0368-leftover-map-compare-axis-share.md

      - name: Apply reviewed source patches by content context
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 66bccfbc670188ce46e22b0f0ec345942a5e50b6 8c16fa26ee3e97381a547a5b2e2eca8eed691ff2
          git diff 66bccfbc670188ce46e22b0f0ec345942a5e50b6^ 66bccfbc670188ce46e22b0f0ec345942a5e50b6 -- frontend/src/leftoverMapPlotLayout.ts > /tmp/layout.patch
          git apply --check /tmp/layout.patch
          git apply /tmp/layout.patch
          git diff 8c16fa26ee3e97381a547a5b2e2eca8eed691ff2^ 8c16fa26ee3e97381a547a5b2e2eca8eed691ff2 -- frontend/src/i18n.ts frontend/src/i18n.test.ts > /tmp/vi.patch
          git apply --check /tmp/vi.patch
          git apply /tmp/vi.patch
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Bind Vietnamese regression to production caption and sync runtime version
        shell: python
        run: |
          from pathlib import Path

          vi_test = Path("frontend/src/leftoverMapPlotVietnameseCopy.test.ts")
          text = vi_test.read_text(encoding="utf-8")
          old_header = '''import { setLocale, tf } from "./i18n";\n\nconst GRAPHIC_DISPLAY_COPY =\n  "Leftover map after IRT main effects. Axis ticks name persisted leftover-map coordinates. Pair segments name leftover-map distance d, leftover-map reconstruction R̂, leftover-map explained leftover share e, leftover-map unexplained leftover share s, leftover-map cross share x, leftover-map unexplained leftover U, leftover residual R, leftover observed Y, leftover expected E, and leftover-map rank. Click a post marker to open that post. The plot does not invent a leftover score.";'''
          new_header = '''import { setLocale, tf } from "./i18n";\nimport { LEFTOVER_MAP_PLOT_CAPTION } from "./leftoverMapPlotLayout";'''
          if text.count(old_header) != 1:
              raise SystemExit("expected one stale duplicated Vietnamese caption fixture")
          text = text.replace(old_header, new_header, 1)
          if text.count("tf(GRAPHIC_DISPLAY_COPY, {})") != 1:
              raise SystemExit("expected one stale GRAPHIC_DISPLAY_COPY use")
          vi_test.write_text(
              text.replace("tf(GRAPHIC_DISPLAY_COPY, {})", "tf(LEFTOVER_MAP_PLOT_CAPTION, {})", 1),
              encoding="utf-8",
          )

          runtime = Path("lineageweave/__init__.py")
          text = runtime.read_text(encoding="utf-8")
          if text.count('__version__ = "2.41.0"') != 1:
              raise SystemExit("expected one stale runtime version 2.41.0")
          runtime.write_text(text.replace('__version__ = "2.41.0"', '__version__ = "2.61.0"', 1), encoding="utf-8")

      - name: Verify causal repair boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^\*\*Decision status:\*\* Proposed$' docs/adr/0368-leftover-map-compare-axis-share.md
          grep -q '__version__ = "2.61.0"' lineageweave/__init__.py
          grep -q 'version = "2.61.0"' pyproject.toml
          grep -q '"version": "2.61.0"' frontend/package.json
          grep -q 'SEGMENT_LABEL_TOP_INSET = 12' frontend/src/leftoverMapPlotLayout.ts
          grep -q 'leftoverMapCaptionSpacing(height, captionCount)' frontend/src/leftoverMapPlotLayout.ts
          grep -q 'tỷ phần phần dư được giải thích trên bản đồ phần dư {label}' frontend/src/i18n.ts
          grep -q 'LEFTOVER_MAP_PLOT_CAPTION' frontend/src/leftoverMapPlotVietnameseCopy.test.ts
          ! grep -q 'GRAPHIC_DISPLAY_COPY' frontend/src/leftoverMapPlotVietnameseCopy.test.ts
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Validate synchronized package provenance
        run: |
          uv sync --frozen --extra dev
          uv run --frozen python -m pytest -q tests/test_package_version.py

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Validate exact failed frontend contracts and full frontend suite
        working-directory: frontend
        run: |
          pnpm exec vitest run \
            src/leftoverMapPlotSmallCanvas.test.ts \
            src/leftoverMapPlotVietnameseCopy.test.ts \
            src/i18n.test.ts \
            src/leftoverMapPlotLayout.test.ts \
            src/components/LeftoverMapPlot.test.tsx
          pnpm run lint
          pnpm run test
          pnpm run build
          pnpm run build-storybook

      - name: Commit clean repaired product tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm .github/workflows/temporary-842-exact-head-tests-repair-r2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/temporary-842-exact-head-tests-repair-r2.yml$' || true)"
          git commit -m "fix(reports): restore axis-share inherited test contracts"
          git push origin HEAD:automation/842-exact-head-tests-repair-r2-20260906
