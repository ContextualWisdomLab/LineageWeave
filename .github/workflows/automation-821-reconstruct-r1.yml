name: automation-821-current-820-reconstruction-r1

on:
  push:
    branches:
      - automation/821-current-820-reconstruction-r1-20260907-0612

permissions:
  contents: write

concurrency:
  group: automation-821-current-820-reconstruction-r1
  cancel-in-progress: true

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      EXPECTED_PARENT: 503d043e165e0ae4c6b5c8cca4366c114c74ef2d
      HISTORICAL_FEATURE: 11a785533ba52e6b1c6854203818902e38736dc5
      STAGING_BRANCH: automation/821-product-staging-r1-20260907-0612
      LINEAGEWEAVE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout exact repository history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Verify exact parent and reconstruct historical product delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git cat-file -e "$HISTORICAL_FEATURE^{commit}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$STAGING_BRANCH" "$EXPECTED_PARENT"

          if ! git cherry-pick "$HISTORICAL_FEATURE"; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            test "${#conflicts[@]}" -gt 0
            printf 'Resolving current-parent conflicts in favor of #820 before explicit semantic reapplication:\n%s\n' "${conflicts[*]}"
            for path in "${conflicts[@]}"; do
              git checkout --ours -- "$path"
              git add "$path"
            done
            if git diff --cached --quiet; then
              git cherry-pick --skip
            else
              GIT_EDITOR=true git cherry-pick --continue
            fi
          fi

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected marker missing in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          def insert_once(path: str, marker: str, addition: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if addition.strip() in text:
                  return
              if marker not in text:
                  raise SystemExit(f"insert marker missing in {path}: {marker!r}")
              p.write_text(text.replace(marker, addition + marker, 1), encoding="utf-8")

          # Distinct successor identity: #820 owns ADR 0289 / v2.46.0.
          old_adr = Path("docs/adr/0289-leftover-map-compare-coverage.md")
          new_adr = Path("docs/adr/0290-leftover-map-compare-coverage.md")
          if not old_adr.exists():
              raise SystemExit("historical grouping-comparison ADR was not reapplied")
          old_adr.rename(new_adr)
          text = new_adr.read_text(encoding="utf-8")
          text = text.replace("ADR 0289", "ADR 0290")
          text = text.replace("**Decision status:** Accepted", "**Decision status:** Proposed")
          text = text.replace("uses **0289**", "uses **0290**")
          text = text.replace(
              "**Date:** 2026-08-30\n\n",
              "**Date:** 2026-08-30\n\nParent decision: [ADR 0289](0289-leftover-map-plot-singular.md) names persisted leftover-map singular values on the graphic display; this comparison-coverage decision is independent of that axis-caption contract.\n\n",
              1,
          )
          text = text.replace(
              "Coverage is aggregate and non-identifying: ABAC that hides leftover pairs does not hide persisted coverage counts.",
              "Persisted coverage is returned only when the caller can see the full persisted grouping population. If any grouping member is hidden by ABAC, omit the comparison coverage aggregate instead of disclosing the full-population denominator or recomputing psychometric coverage from the visible subset.",
          )
          text = text.replace(
              "Hidden posts stay hidden.",
              "Hidden posts stay hidden; partial-visibility groupings omit the comparison coverage aggregate rather than disclosing or recomputing it.",
          )
          new_adr.write_text(text, encoding="utf-8")

          old_fragment = Path("CHANGELOG.d/2.46.0-leftover-map-compare-coverage.md")
          new_fragment = Path("CHANGELOG.d/2.47.0-leftover-map-compare-coverage.md")
          if not old_fragment.exists():
              raise SystemExit("historical comparison changelog fragment was not reapplied")
          old_fragment.rename(new_fragment)
          fragment = new_fragment.read_text(encoding="utf-8")
          fragment = fragment.replace("2.46.0", "2.47.0").replace("ADR 0289", "ADR 0290")
          fragment += "\n- Authorization boundary: when ABAC hides any member of the persisted grouping, omit comparison `leftover_map_coverage` instead of exposing the full-group denominator or recomputing coverage from the visible subset.\n"
          new_fragment.write_text(fragment, encoding="utf-8")

          # Release identity is synchronized across package/frontend/runtime.
          replace_once("pyproject.toml", 'version = "2.46.0"', 'version = "2.47.0"')
          replace_once("frontend/package.json", '"version": "2.46.0"', '"version": "2.47.0"')
          replace_once("lineageweave/__init__.py", '__version__ = "2.46.0"', '__version__ = "2.47.0"')

          # Shared authority keeps #820 ADR 0289 and appends the new ADR 0290.
          replace_once("AGENTS.md", "/ 0288 / 0289) are computed", "/ 0288 / 0289 / 0290) are computed")
          insert_once(
              "AGENTS.md",
              "When `R`, `R̂`, `U`, `x`,\n",
              "ADR 0290 captions the grouping comparison strip with persisted leftover-map post complete-case coverage only when the caller can see the full persisted grouping population. Partial-visibility groupings omit that aggregate; never reconstruct the psychometric denominator from visible members, leftover pairs, or plotted markers.\n",
          )
          replace_once("ARCHITECTURE.md", "/ 0288 / 0289) persist", "/ 0288 / 0289 / 0290) persist")
          insert_once(
              "ARCHITECTURE.md",
              "Click a post marker or a pair button\n",
              "ADR 0290 captions the grouping comparison strip with persisted leftover-map post complete-case coverage under a full-visible-grouping rule; partial-visibility groupings fail closed that aggregate to avoid disclosing a hidden population denominator.\n",
          )
          replace_once(
              "ARCHITECTURE.md",
              "and carries the same ABAC-filtered leftover pairs (ADR 0149);",
              "and carries the same ABAC-filtered leftover pairs (ADR 0149) plus persisted leftover-map post complete-case coverage (ADR 0290) only when the caller-visible member population equals the persisted grouping population;",
          )
          replace_once("CLAUDE.md", "/ 0288 / 0289), occupational", "/ 0288 / 0289 / 0290), occupational")

          # Historical coverage helper references its new decision number without rewriting #820's singular-value ADR 0289.
          p = Path("frontend/src/leftoverMapCoverage.ts")
          coverage = p.read_text(encoding="utf-8")
          coverage = coverage.replace("/ ADR 0288 / ADR 0289).", "/ ADR 0288 / ADR 0290).")
          p.write_text(coverage, encoding="utf-8")

          p = Path("frontend/src/components/LeftoverPairList.tsx")
          pair_list = p.read_text(encoding="utf-8")
          pair_list = pair_list.replace(
              "ADR 0289\n * names persisted leftover-map post complete-case coverage on the grouping",
              "ADR 0290\n * names persisted leftover-map post complete-case coverage on the grouping",
          )
          p.write_text(pair_list, encoding="utf-8")

          p = Path("frontend/src/leftoverMapPlotLayout.ts")
          layout = p.read_text(encoding="utf-8")
          layout = layout.replace(
              "grouping comparison complete-case coverage\n *  (ADR 0289)",
              "grouping comparison complete-case coverage\n *  (ADR 0290)",
          )
          p.write_text(layout, encoding="utf-8")

          # Keep the main changelog concise and code-current; do not import the historical operational overlay.
          changelog = Path("CHANGELOG.md")
          ctext = changelog.read_text(encoding="utf-8")
          entry = (
              "- Grouping comparison rows now expose persisted leftover-map post complete-case coverage through `leftoverMapCoverageCounts` (ADR 0290 / v2.47.0) only for fully visible grouping populations. Partial-visibility rows omit the aggregate instead of leaking the full-group denominator or recomputing psychometric coverage from the visible subset.\n\n"
          )
          if entry not in ctext:
              marker = "### Added\n\n"
              if marker not in ctext:
                  raise SystemExit("CHANGELOG Added section missing")
              ctext = ctext.replace(marker, marker + entry, 1)
              changelog.write_text(ctext, encoding="utf-8")

          inventory = Path("docs/storybook-inventory.md")
          lines = inventory.read_text(encoding="utf-8").splitlines()
          for i, line in enumerate(lines):
              if line.startswith("| `Reports/LeftoverPairList` |"):
                  if "grouping comparison strip" not in line:
                      marker = " | `LeftoverPairList`, `LeftoverMapPlot`"
                      if marker not in line:
                          raise SystemExit("Storybook inventory module marker missing")
                      line = line.replace(
                          marker,
                          " The grouping comparison strip names persisted leftover-map post complete-case coverage only for fully visible grouping populations; partial-visibility rows omit that aggregate. " + marker,
                          1,
                      )
                      lines[i] = line
                  break
          else:
              raise SystemExit("Storybook LeftoverPairList row missing")
          inventory.write_text("\n".join(lines) + "\n", encoding="utf-8")

          baseline = Path("docs/product-technical-gap-baseline.md")
          btext = baseline.read_text(encoding="utf-8")
          note = (
              "> #821 current-parent reconstruction: preserve grouping-comparison leftover-map post complete-case coverage from historical `11a78553...` on exact #820 `503d043e...`, but move the decision to ADR 0290 / v2.47.0 and fail closed persisted coverage whenever ABAC hides any grouping member. Review 5126637582 is the authorization RED authority; #963 still owns the broader current-vs-historical baseline cleanup.\n>\n"
          )
          if note not in btext:
              btext = btext.replace("# Product & Technical Gap Baseline\n\n", "# Product & Technical Gap Baseline\n\n" + note, 1)
              baseline.write_text(btext, encoding="utf-8")

          # Required semantic markers: fail if a current-parent conflict silently dropped product behavior.
          markers = {
              "backend/app/report_ingestion.py": '"leftover_map_coverage": _leftover_map_coverage_payload',
              "backend/tests/test_api.py": 'leftover_compare_coverage',
              "frontend/src/App.tsx": 'comparisonCoverageCounts',
              "frontend/src/App.test.tsx": 'Leftover map comparison coverage',
              "frontend/src/api.ts": 'leftover_map_coverage?: LeftoverMapCoverage | null',
              "frontend/src/i18n.ts": '"Leftover map comparison coverage"',
              "frontend/src/i18n.test.ts": 'formats leftover map comparison coverage label',
              "frontend/src/leftoverMapCoverage.ts": 'LEFTOVER_MAP_COMPARE_COVERAGE_LABEL',
              "frontend/src/leftoverMapCoverage.test.ts": 'keeps the grouping comparison coverage label distinct',
          }
          for path, marker in markers.items():
              if marker not in Path(path).read_text(encoding="utf-8"):
                  raise SystemExit(f"historical product delta missing after reconstruction: {path}: {marker}")

          Path("tests/test_adr_0290_governance.py").write_text(
              '''"""Governance regression for reconstructed grouping-comparison coverage."""\n\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\n\n\ndef test_grouping_comparison_coverage_uses_distinct_proposed_adr_0290() -> None:\n    """Keep #821 off #820's ADR 0289 and Proposed until independent acceptance."""\n    singular = ROOT / "docs/adr/0289-leftover-map-plot-singular.md"\n    old_collision = ROOT / "docs/adr/0289-leftover-map-compare-coverage.md"\n    coverage = ROOT / "docs/adr/0290-leftover-map-compare-coverage.md"\n    assert singular.exists()\n    assert not old_collision.exists()\n    text = coverage.read_text(encoding="utf-8")\n    assert text.startswith("# ADR 0290 —")\n    assert "**Decision status:** Proposed" in text\n    assert "**Decision status:** Accepted" not in text\n''',
              encoding="utf-8",
          )

          Path("tests/test_compare_coverage_visibility.py").write_text(
              '''"""Authorization regression for grouping-comparison leftover-map coverage."""\n\nfrom __future__ import annotations\n\nimport pytest\n\nfrom backend.app import main\nfrom backend.app.auth import CurrentAccount\n\n\nclass _Acquire:\n    """Return one inert connection through an async pool context."""\n\n    async def __aenter__(self) -> object:\n        return object()\n\n    async def __aexit__(self, *_args: object) -> bool:\n        return False\n\n\nclass _Pool:\n    """Provide the minimal pool protocol used by the compare handler."""\n\n    def acquire(self) -> _Acquire:\n        return _Acquire()\n\n\ndef _account() -> CurrentAccount:\n    """Authorize one private entity/process-unit scope and report reads."""\n    return CurrentAccount(\n        "account-1",\n        "subject-1",\n        "Analyst",\n        None,\n        frozenset({"entity-visible"}),\n        frozenset({"unit-visible"}),\n        frozenset({"post_read"}),\n    )\n\n\n@pytest.mark.anyio\nasync def test_compare_omits_full_group_coverage_when_population_is_partly_hidden(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    """Never disclose persisted coverage denominators computed with inaccessible members."""\n\n    async def _fetch_period_comparison(_conn: object, _period_code: str) -> list[dict[str, object]]:\n        return [\n            {\n                "grouping_kind": "corporate_entity",\n                "grouping_key": "group-1",\n                "grouping_label": "Group 1",\n                "mean_theta": 0.25,\n                "post_count": 2,\n                "link_method": "anchor",\n                "members": [\n                    {\n                        "visibility_code": "private",\n                        "corporate_entity_id": "entity-visible",\n                        "process_unit_id": "unit-visible",\n                        "has_real_source_context": True,\n                    },\n                    {\n                        "visibility_code": "private",\n                        "corporate_entity_id": "entity-hidden",\n                        "process_unit_id": "unit-hidden",\n                        "has_real_source_context": True,\n                    },\n                ],\n                "leftover_pairs": [],\n                "leftover_map_coverage": {\n                    "map_post_count": 2,\n                    "scored_post_count": 2,\n                    "map_item_count": 3,\n                    "scored_item_count": 3,\n                    "incomplete_post_count": 0,\n                    "incomplete_item_count": 0,\n                },\n            }\n        ]\n\n    async def _has_real_source_context(_conn: object, _entity_ids: list[str]) -> bool:\n        return False\n\n    monkeypatch.setattr(main, "fetch_period_comparison", _fetch_period_comparison)\n    monkeypatch.setattr(main, "has_real_source_context", _has_real_source_context)\n\n    result = await main.compare_period_groupings("2026-W35", _account(), _Pool())\n\n    assert len(result["groupings"]) == 1\n    grouping = result["groupings"][0]\n    assert grouping["post_count"] == 1\n    assert grouping["leftover_map_coverage"] is None\n''',
              encoding="utf-8",
          )
          PY

          git status --short

      - name: Install committed dependency graphs
        run: |
          corepack enable
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          uv sync --frozen --extra dev --extra backend
          (cd frontend && pnpm install --frozen-lockfile)

      - name: Reproduce authorization RED before production fix
        shell: bash
        run: |
          set -euo pipefail
          if uv run --frozen python -m pytest -q tests/test_compare_coverage_visibility.py; then
            echo "expected partial-visibility coverage leak RED, but test passed before the fix" >&2
            exit 1
          fi
          echo "RED reproduced: persisted full-group coverage remained visible under partial ABAC visibility"

      - name: Apply minimal full-visible-grouping causal fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("backend/app/main.py")
          text = p.read_text(encoding="utf-8")
          old = '                "members": [],\n                "leftover_pairs": leftover_pairs,\n                "post_count": len(members),\n'
          new = '                "members": [],\n                "leftover_pairs": leftover_pairs,\n                "leftover_map_coverage": (\n                    row.get("leftover_map_coverage")\n                    if len(members) == len(row["members"])\n                    else None\n                ),\n                "post_count": len(members),\n'
          if old not in text:
              raise SystemExit("compare response assembly marker moved; fail closed rather than guessing")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Exact reconstructed GREEN
        run: |
          set -euo pipefail
          uv run --frozen python -m pytest -q tests/test_compare_coverage_visibility.py tests/test_adr_0290_governance.py tests/test_package_version.py
          uv run --frozen python -m pytest -q
          cd frontend
          pnpm run lint
          pnpm run test
          pnpm run build
          pnpm run build-storybook

      - name: Commit workflow-free clean staging tree
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/automation-821-reconstruct-r1.yml
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "feat(reports): reconstruct comparison coverage as v2.47.0"
          test -z "$(git status --porcelain)"
          git log -1 --format='staging commit=%H tree=%T parents=%P'
          git diff --name-status "$EXPECTED_PARENT" HEAD
          git push origin "HEAD:refs/heads/$STAGING_BRANCH"
