name: Temporary PR 1047 source visibility lock repair

on:
  push:
    branches:
      - fix/post-chat-replay-scope

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: fix/post-chat-replay-scope
          fetch-depth: 0

      - name: Hold source visibility stable during replay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast

          ingestion_path = Path("backend/app/post_chat_ingestion.py")
          ingestion = ingestion_path.read_text()
          old = '    "for key share"\n).format(\n'
          new = '    "for share"\n).format(\n'
          if ingestion.count(old) != 1:
              raise SystemExit("captured-source row-lock target missing")
          ingestion = ingestion.replace(old, new, 1)
          ast.parse(ingestion, filename=str(ingestion_path))
          ingestion_path.write_text(ingestion)

          test_path = Path("tests/test_post_chat_authorization_migration_postgres.py")
          test = test_path.read_text()
          source_old = "            create table source_post (\n                post_id uuid primary key\n            );\n"
          source_new = "            create table source_post (\n                post_id uuid primary key,\n                visibility_code text not null default 'private'\n            );\n"
          if test.count(source_old) != 1:
              raise SystemExit("minimal source_post schema target missing")
          test = test.replace(source_old, source_new, 1)
          marker = "test_replay_source_share_blocks_concurrent_visibility_change"
          if marker in test:
              raise SystemExit("source visibility concurrency regression already exists")
          lines = [
              "",
              "",
              "def test_replay_source_share_blocks_concurrent_visibility_change(",
              "    isolated_postgres_schema,",
              ") -> None:",
              "    \"\"\"Source authorization remains stable until the short replay transaction ends.\"\"\"",
              "    conn = isolated_postgres_schema",
              "    _create_minimal_parent_schema(conn)",
              "    source_post_id = str(uuid.uuid4())",
              "    with conn.cursor() as cursor:",
              "        cursor.execute(\"select current_schema()\")",
              "        schema_name = cursor.fetchone()[0]",
              "        cursor.execute(\"insert into source_post (post_id) values (%s)\", (source_post_id,))",
              "",
              "    conn.autocommit = False",
              "    writer = psycopg2.connect(_POSTGRES_DSN)",
              "    writer.autocommit = False",
              "    try:",
              "        with conn.cursor() as reader_cursor:",
              "            reader_cursor.execute(",
              "                \"select post_id from source_post where post_id = %s for share\",",
              "                (source_post_id,),",
              "            )",
              "            assert str(reader_cursor.fetchone()[0]) == source_post_id",
              "",
              "        with writer.cursor() as writer_cursor:",
              "            writer_cursor.execute(f'set search_path to \"{schema_name}\"')",
              "            writer_cursor.execute(\"set local lock_timeout = '250ms'\")",
              "            with pytest.raises(psycopg2.errors.LockNotAvailable):",
              "                writer_cursor.execute(",
              "                    \"update source_post set visibility_code = 'public' where post_id = %s\",",
              "                    (source_post_id,),",
              "                )",
              "        writer.rollback()",
              "    finally:",
              "        conn.rollback()",
              "        conn.autocommit = True",
              "        writer.close()",
              "",
          ]
          test += "\n".join(lines)
          ast.parse(test, filename=str(test_path))
          test_path.write_text(test)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/post_chat_ingestion.py tests/test_post_chat_authorization_migration_postgres.py
          git diff --cached --check
          git commit -m "fix(security): hold replay source visibility stable"
          git push origin HEAD:fix/post-chat-replay-scope
