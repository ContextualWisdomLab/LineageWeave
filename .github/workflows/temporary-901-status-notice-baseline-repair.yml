name: Temporary 901 StatusNotice baseline repair

on:
  push:
    branches:
      - "automation/901-status-notice-baseline-repair-20260906"

permissions:
  contents: write

concurrency:
  group: temporary-901-status-notice-baseline-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: automation/901-status-notice-baseline-repair-20260906
          fetch-depth: 0

      - name: Replace only the stale ADR 0134 row
        shell: python
        run: |
          from pathlib import Path

          path = Path("docs/product-technical-gap-baseline.md")
          old = '| ADR 0134 token-backed exception messages | Partial: sanitized next-action failures exist, but no shared token-backed exception component or complete Storybook error inventory exists | Migrate one existing unavailable flow to one shared accessible alert and verify its success, unavailable, and retry states |'
          new = '| ADR 0134 token-backed exception messages | Partial: protected `main` delivers shared `StatusNotice` under ADR 0220 for token-backed success/unavailable/retry states, but complete Storybook/browser/a11y error-state evidence remains incomplete | Reuse `StatusNotice` as the single status-message authority; add the missing Storybook/browser/a11y success, unavailable, retry, and permission-state evidence rather than creating a second exception component |'
          text = path.read_text(encoding="utf-8")
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one stale ADR 0134 row, found {text.count(old)}")
          if new in text:
              raise SystemExit("replacement row already exists")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Run focused contract without adding dependencies
        shell: python
        run: |
          import runpy
          namespace = runpy.run_path("tests/test_gap_baseline_status_notice_contract.py")
          namespace["test_adr_0134_gap_row_acknowledges_shared_status_notice_delivery"]()

      - name: Verify one-row causal delta
        run: |
          git diff --check
          test "$(git diff --numstat -- docs/product-technical-gap-baseline.md | awk '{print $1 ":" $2}')" = "1:1"
          test -z "$(git diff --name-only | grep -v '^docs/product-technical-gap-baseline.md$' || true)"

      - name: Commit clean product tree
        run: |
          rm .github/workflows/temporary-901-status-notice-baseline-repair.yml
          git diff --check
          test "$(git diff --numstat -- docs/product-technical-gap-baseline.md | awk '{print $1 ":" $2}')" = "1:1"
          test "$(git diff --name-only | grep -v '^.github/workflows/temporary-901-status-notice-baseline-repair.yml$' | sort)" = "docs/product-technical-gap-baseline.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/product-technical-gap-baseline.md .github/workflows/temporary-901-status-notice-baseline-repair.yml
          git commit -m "docs(gaps): acknowledge shared StatusNotice delivery"
          git push origin HEAD:automation/901-status-notice-baseline-repair-20260906
