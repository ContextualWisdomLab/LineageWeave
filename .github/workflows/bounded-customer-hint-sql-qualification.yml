name: Bounded customer hint SQL qualification

on:
  push:
    branches:
      - fix/customer-hint-resolution-ownership

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/customer-hint-resolution-ownership
          persist-credentials: false
      - name: Patch and validate
        run: |
          python scripts/bounded_customer_hint_sql_qualification.py
          python -m compileall -q backend/app/main.py
          git diff --check
      - name: Commit bounded repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm scripts/bounded_customer_hint_sql_qualification.py
          rm .github/workflows/bounded-customer-hint-sql-qualification.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/main.py scripts/bounded_customer_hint_sql_qualification.py .github/workflows/bounded-customer-hint-sql-qualification.yml
          git commit -m 'fix(customer-master): qualify joined source hint columns'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:fix/customer-hint-resolution-ownership
