name: automation-822-current-821-reconstruction-r9

on:
  push:
    branches:
      - automation/822-current-821-reconstruction-r9-20260907-0830

permissions:
  contents: write

concurrency:
  group: automation-822-current-821-reconstruction-r9
  cancel-in-progress: true

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    env:
      EXPECTED_PARENT: 93eaa40f34098678fd53da4dbdccb1782dfd41a7
      HISTORICAL_FEATURE: 6726353a13798c0d1566821de9885f1783ebe35f
      STAGING_BRANCH: automation/822-product-staging-r9-20260907-0830
      R1_WORKFLOW_COMMIT: 34c479088f15bdf021fcd2de298e04f552cb27b0
    steps:
      - name: Checkout exact repository history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Recover reviewed r1 reapply and fix scripts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git cat-file -e "$R1_WORKFLOW_COMMIT^{commit}"
          git show "$R1_WORKFLOW_COMMIT:.github/workflows/automation-822-reconstruct-r1.yml" > /tmp/r1.yml
          python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/r1.yml').read_text(encoding='utf-8').splitlines()
          def extract(name: str, output: str) -> None:
              marker = f'      - name: {name}'
              start = lines.index(marker)
              run_index = next(i for i in range(start + 1, len(lines)) if lines[i] == '        run: |')
              body: list[str] = []
              for line in lines[run_index + 1:]:
                  if line.startswith('      - name: '):
                      break
                  if line.startswith('          '):
                      body.append(line[10:])
                  elif line == '':
                      body.append('')
                  else:
                      raise SystemExit(f'unexpected indentation in {name}: {line!r}')
              Path(output).write_text('\n'.join(body) + '\n', encoding='utf-8')
          extract('Verify exact parent and reapply historical item-coverage delta', '/tmp/reapply.sh')
          extract('Apply minimal v2.48 identity and item-coverage composition fix', '/tmp/fix.sh')
          PY

      - name: Reconstruct historical item coverage on exact parent
        shell: bash
        run: bash /tmp/reapply.sh

      - name: Reproduce real ADR identity RED
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev
          set +e
          uv run --no-sync pytest -q tests/test_adr_0291_governance.py
          rc=$?
          set -e
          test "$rc" -eq 1

      - name: Apply reviewed minimal v2.48 fix
        shell: bash
        run: bash /tmp/fix.sh

      - name: Select repository-pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          test "$(rustc --version | awk '{print $2}')" = "1.97.1"

      - name: Install Python GREEN dependencies
        shell: bash
        run: uv sync --frozen --extra dev --extra backend

      - name: Enable canonical frontend package manager
        shell: bash
        run: corepack enable

      - name: Install frontend GREEN dependencies
        shell: bash
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: GREEN ADR governance
        shell: bash
        run: uv run --no-sync pytest -q tests/test_adr_0290_governance.py tests/test_adr_0291_governance.py

      - name: GREEN grouping authorization coverage
        shell: bash
        run: uv run --no-sync pytest -q tests/test_compare_coverage_visibility.py

      - name: GREEN release identity
        shell: bash
        run: uv run --no-sync pytest -q tests/test_package_version.py

      - name: GREEN frontend item coverage composition
        shell: bash
        working-directory: frontend
        run: pnpm exec vitest run src/leftoverMapCoverage.test.ts src/i18n.test.ts src/App.test.tsx

      - name: GREEN frontend lint
        shell: bash
        working-directory: frontend
        run: pnpm exec oxlint src

      - name: GREEN frontend production build
        shell: bash
        working-directory: frontend
        run: pnpm run build

      - name: GREEN Storybook build
        shell: bash
        working-directory: frontend
        run: pnpm run build-storybook

      - name: Verify reconstructed authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          assert not Path('docs/adr/0290-leftover-map-compare-item-coverage.md').exists()
          assert Path('docs/adr/0290-leftover-map-compare-coverage.md').exists()
          assert Path('docs/adr/0291-leftover-map-compare-item-coverage.md').exists()
          assert 'version = "2.48.0"' in Path('pyproject.toml').read_text()
          assert '"version": "2.48.0"' in Path('frontend/package.json').read_text()
          assert '__version__ = "2.48.0"' in Path('lineageweave/__init__.py').read_text()
          assert 'leftoverMapItemCoverageCounts(row.leftover_map_coverage)' in Path('frontend/src/App.tsx').read_text()
          PY

      - name: Commit workflow-free clean staging tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -z "$(git diff --name-only "$EXPECTED_PARENT" | grep '^.github/workflows/automation-822' || true)"
          git add -A
          git status --short
          git commit -m "feat(reports): reconstruct comparison item coverage as v2.48.0"
          test -z "$(git status --porcelain)"
          git log -1 --format='staging commit=%H tree=%T parents=%P'
          git diff --name-status "$EXPECTED_PARENT" HEAD
          git push origin "HEAD:refs/heads/$STAGING_BRANCH"
