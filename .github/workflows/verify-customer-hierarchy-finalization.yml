name: Verify customer hierarchy finalization

on:
  push:
    branches: [feat/analysis-run-name-evidence-lineage]
    paths:
      - scripts/finalize_customer_hierarchy_evidence.py
      - .github/workflows/verify-customer-hierarchy-finalization.yml

permissions:
  contents: write

concurrency:
  group: verify-customer-hierarchy-finalization
  cancel-in-progress: true

jobs:
  verify-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c7710ff06683c1dc102d2f262c25cc36c819530a # v7
        with:
          version: "0.9.27"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify ontology and documentation contracts
        run: |
          uv sync --frozen --extra dev --extra backend
          uv run --frozen python -m pytest -q \
            tests/test_ontology.py \
            tests/test_ontology_interoperability.py \
            tests/test_documentation_hygiene.py

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Verify focused customer hierarchy
        working-directory: frontend
        run: pnpm exec vitest run src/customerMasterTree.test.ts src/components/CustomerMasterTree.test.tsx

      - name: Verify complete frontend and Storybook
        working-directory: frontend
        run: |
          pnpm run lint
          pnpm run test
          pnpm run build
          pnpm run build-storybook

      - name: Check source hygiene
        run: git diff --check

      - name: Finalize baseline and remove one-shot machinery
        run: |
          python scripts/finalize_customer_hierarchy_evidence.py
          rm scripts/finalize_customer_hierarchy_evidence.py
          rm .github/workflows/verify-customer-hierarchy-finalization.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/product-technical-gap-baseline.md \
            scripts/finalize_customer_hierarchy_evidence.py \
            .github/workflows/verify-customer-hierarchy-finalization.yml
          git commit -m "docs: finalize customer hierarchy evidence"

      - name: Push without overwriting concurrent work
        run: git push origin HEAD:feat/analysis-run-name-evidence-lineage
