name: Temporary product gap baseline convergence

on:
  push:
    branches:
      - "automation/gap-baseline-current-20260906"

permissions:
  contents: write

concurrency:
  group: temporary-gap-baseline-current
  cancel-in-progress: true

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact documentation lane
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: automation/gap-baseline-current-20260906
          fetch-depth: 0

      - name: Verify exact protected main
        shell: bash
        run: |
          set -euo pipefail
          base=83eba56149eb802cd63642c507c324c9976ec78e
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$base"
          git merge-base --is-ancestor "$base" HEAD
          test "$(git diff --name-only "$base"..HEAD)" = ".github/workflows/temporary-gap-baseline-current.yml"

      - name: Replace stale top authority with dated current snapshot
        shell: python
        run: |
          from pathlib import Path

          path = Path("docs/product-technical-gap-baseline.md")
          text = path.read_text(encoding="utf-8")
          title = "# Product & Technical Gap Baseline\n"
          if not text.startswith(title):
              raise SystemExit("baseline title missing")
          old_prefix = "> Exact-head loop overlay: 2026-08-29 13:20 KST."
          if old_prefix not in text[:2000]:
              raise SystemExit("expected stale top overlay is no longer current; abort rather than overwrite concurrent authority")
          snapshot = (
              "\n> Current authority snapshot: 2026-09-06. Protected `main` is\n"
              "> `83eba56149eb802cd63642c507c324c9976ec78e`. Python package and frontend\n"
              "> metadata both declare v2.28.0, while protected runtime identity still\n"
              "> declares v2.20.0; Draft PR #961 owns the minimal release-provenance repair\n"
              "> and invariant test. No repository tag currently exists, so v2.28.0 is not\n"
              "> represented here as an immutable released artifact.\n"
              ">\n"
              "> Leftover-map stack authority is also moving: #811 advanced non-force to\n"
              "> `4dcd789385f67c76a4e479194f566f35bb5d2d76`; #812 must converge that\n"
              "> foundation before #813–#819 local repair evidence can become final stack\n"
              "> authority. #820/#821 retain distinct valid product deltas but historically\n"
              "> collide on ADR 0289 / v2.46.0; after upstream convergence, #820 keeps that\n"
              "> identity and #821 must be reconstructed as an explicit child with a unique\n"
              "> ADR/release identity. Historical dated overlays below are evidence snapshots,\n"
              "> not current branch/merge/release authority.\n"
          )
          path.write_text(title + snapshot + text[len(title):], encoding="utf-8")

      - name: Verify documentation boundaries
        shell: python
        run: |
          from pathlib import Path
          text = Path("docs/product-technical-gap-baseline.md").read_text(encoding="utf-8")
          assert text.startswith("# Product & Technical Gap Baseline\n\n> Current authority snapshot: 2026-09-06.")
          assert "Draft PR #961 owns the minimal release-provenance repair" in text
          assert "#820/#821 retain distinct valid product deltas" in text
          assert "Historical dated overlays below are evidence snapshots" in text

      - name: Commit workflow-free documentation tree
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/temporary-gap-baseline-current.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          rm "$workflow"
          git add -A
          test "$(git diff --cached --name-only | grep -v '^\.github/workflows/temporary-gap-baseline-current\.yml$')" = "docs/product-technical-gap-baseline.md"
          test "$(git diff --cached --name-status -- "$workflow")" = $'D\t.github/workflows/temporary-gap-baseline-current.yml'
          git diff --cached --check
          git commit -m "docs(product): refresh exact-head gap baseline authority"
          git push origin HEAD:automation/gap-baseline-current-20260906
