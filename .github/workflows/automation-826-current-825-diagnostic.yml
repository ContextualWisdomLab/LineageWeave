name: automation-826-current-825-diagnostic
on:
  push:
    branches: [automation/826-current-825-diagnostic-20260907-1343]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Verify exact current parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b73b10e3079e77f3e62235b2b709dc8a3f450292"
      - name: Replay unique historical delta without committing
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "LineageWeave automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git cherry-pick --no-commit a4bf239f1cf07ea29bd49b28300f252be0ca7a19
          rc=$?
          echo "CHERRY_PICK_RC=$rc"
          echo "--- status ---"
          git status --short
          echo "--- unmerged ---"
          git diff --name-only --diff-filter=U
          echo "--- staged files ---"
          git diff --cached --name-only
          exit "$rc"
