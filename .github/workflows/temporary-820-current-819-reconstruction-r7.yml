name: Temporary 820 current-819 reconstruction r7

on:
  push:
    branches:
      - "automation/820-current-819-reconstruction-r7-20260907"

permissions:
  contents: write

concurrency:
  group: temporary-820-current-819-reconstruction-r7
  cancel-in-progress: true

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact reconstruction branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: automation/820-current-819-reconstruction-r7-20260907
          fetch-depth: 0

      - name: Verify exact inputs and merge current parent
        shell: bash
        run: |
          set -euo pipefail
          product=b7222713a69acdf3d32bbce992001a2433946d21
          parent=f37ca315e3c48fa37bbcafe96e46c5d7dab991b7
          workflow=.github/workflows/temporary-820-current-819-reconstruction-r7.yml
          helper=.github/tmp/temporary_820_reconstruct.py
          git fetch origin feat/leftover-map-plot-singular-v2460 feat/leftover-map-list-post-coverage-helper-v2450
          test "$(git rev-parse origin/feat/leftover-map-plot-singular-v2460)" = "$product"
          test "$(git rev-parse origin/feat/leftover-map-list-post-coverage-helper-v2450)" = "$parent"
          actual="$(git diff --name-only "$product"..HEAD | sort)"
          expected="$(printf '%s\n%s\n' "$helper" "$workflow" | sort)"
          test "$actual" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          git merge --no-commit --no-ff "$parent"
          status=$?
          set -e
          test "$status" -ne 0
          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          expected_conflicts=$'docs/product-technical-gap-baseline.md\nfrontend/src/components/LeftoverMapPlot.test.tsx'
          test "$conflicts" = "$expected_conflicts"
          git checkout --theirs docs/product-technical-gap-baseline.md
          git checkout --ours frontend/src/components/LeftoverMapPlot.test.tsx
          python "$helper" prepare
          git add docs/product-technical-gap-baseline.md frontend/src/components/LeftoverMapPlot.test.tsx tests/test_adr_0289_governance.py
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Install locked Python dependencies
        run: uv sync --frozen --extra dev

      - name: Verify release and governance RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          uv run --frozen python -m pytest -q tests/test_package_version.py >/tmp/release-red.log 2>&1
          release_status=$?
          uv run --frozen python -m pytest -q tests/test_adr_0289_governance.py >/tmp/governance-red.log 2>&1
          governance_status=$?
          set -e
          cat /tmp/release-red.log
          cat /tmp/governance-red.log
          test "$release_status" -ne 0
          test "$governance_status" -ne 0
          grep -q test_release_versions_are_synchronized /tmp/release-red.log
          grep -q test_draft_adr_0289_remains_proposed /tmp/governance-red.log

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript RED
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec tsc -b >/tmp/ts-red.log 2>&1
          status=$?
          set -e
          cat /tmp/ts-red.log
          test "$status" -ne 0
          grep -Fq LeftoverMapPlot.tsx /tmp/ts-red.log
          grep -Fq "string | null" /tmp/ts-red.log

      - name: Apply minimal causal fixes
        run: python .github/tmp/temporary_820_reconstruct.py fix

      - name: Verify Python GREEN
        run: uv run --frozen python -m pytest -q tests/test_package_version.py tests/test_adr_0288_governance.py tests/test_adr_0289_governance.py

      - name: Verify TypeScript GREEN
        working-directory: frontend
        run: pnpm exec tsc -b

      - name: Verify frontend contracts
        working-directory: frontend
        run: >-
          pnpm exec vitest run
          src/App.test.tsx
          src/i18n.test.ts
          src/leftoverMapCoverage.test.ts
          src/leftoverMapPlotAxisSingular.test.ts
          src/leftoverMapPlotLayout.test.ts
          src/leftoverMapPlotSmallCanvas.test.ts
          src/leftoverMapPlotVietnameseCopy.test.ts
          src/components/LeftoverMapPlot.test.tsx
          src/components/LeftoverPairList.test.tsx

      - name: Verify lint and production build
        working-directory: frontend
        run: |
          pnpm exec oxlint
          pnpm exec vite build

      - name: Verify Storybook build
        working-directory: frontend
        run: pnpm run build-storybook

      - name: Promote workflow-free two-parent product commit
        shell: bash
        run: |
          set -euo pipefail
          product=b7222713a69acdf3d32bbce992001a2433946d21
          parent=f37ca315e3c48fa37bbcafe96e46c5d7dab991b7
          product_branch=feat/leftover-map-plot-singular-v2460
          parent_branch=feat/leftover-map-list-post-coverage-helper-v2450
          workflow=.github/workflows/temporary-820-current-819-reconstruction-r7.yml
          helper=.github/tmp/temporary_820_reconstruct.py
          git diff --check
          git diff --cached --check
          rm "$workflow" "$helper"
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          test -z "$(git ls-files "$workflow" "$helper")"
          tree="$(git write-tree)"
          git fetch origin "$product_branch" "$parent_branch"
          test "$(git rev-parse origin/$product_branch)" = "$product"
          test "$(git rev-parse origin/$parent_branch)" = "$parent"
          commit="$(printf '%s\n' 'merge: reconstruct #820 on exact current #819' | git commit-tree "$tree" -p "$product" -p "$parent")"
          test "$(git show -s --format=%P "$commit")" = "$product $parent"
          test "$(git show -s --format=%T "$commit")" = "$tree"
          git push origin "$commit:refs/heads/$product_branch"
          echo "PRODUCT_COMMIT=$commit"
          echo "PRODUCT_TREE=$tree"
