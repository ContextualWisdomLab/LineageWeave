name: Finalize PR 271 TEPP project history

on:
  push:
    branches:
      - feat/tepp-project-history-ask-v2180

permissions:
  contents: write

concurrency:
  group: finalize-pr271-tepp-project-history
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LINEAGEWEAVE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Apply exact bounded implementation
        run: python scripts/finalize_pr271_tepp_history.py

      - name: Install locked Python dependencies
        run: uv sync --frozen --extra dev --extra backend

      - name: Verify focused TEPP contracts
        run: |
          uv run --frozen python -m pytest \
            tests/test_tepp_project_history.py \
            tests/test_tepp_project_history_ingestion.py -q
          uv run --frozen python -m compileall -q \
            lineageweave/tepp_project_history.py \
            backend/app/tepp_project_history.py \
            backend/app/main.py

      - name: Verify full Python suite
        run: uv run --frozen python -m pytest -q

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Verify frontend, production bundle, and Storybook
        working-directory: frontend
        run: |
          pnpm run lint
          pnpm run test
          pnpm run build
          pnpm run build-storybook

      - name: Publish only the verified product delta
        env:
          BRANCH_NAME: feat/tepp-project-history-ask-v2180
        run: |
          rm -f scripts/finalize_pr271_tepp_history.py
          rm -f scripts/repair_pr271_tepp_project_history.py
          rm -f .github/workflows/finalize-271-tepp-project-history.yml
          rm -f .github/workflows/repair-271-tepp-project-history.yml
          rm -f .github/workflows/repair-271-tepp-history-finish.yml
          rm -f .github/workflows/repair-271-tepp-history-types.yml
          rm -f .repair_paths
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u | while IFS= read -r path; do
            [ -n "$path" ] && git add -- "$path"
          done
          git diff --cached --check
          git commit -m "feat: render TEPP project history across Buyer Ask surfaces"
          git push origin "HEAD:${BRANCH_NAME}"
