name: One-shot TEPP project-history recovery

on:
  push:
    branches:
      - feat/tepp-project-history-recovery-v2210

permissions:
  contents: write

concurrency:
  group: one-shot-tepp-project-history-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LINEAGEWEAVE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: feat/tepp-project-history-recovery-v2210
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Select pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Install locked Python dependencies
        run: uv sync --frozen --extra dev --extra backend

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Confirm RED Python route contract
        run: |
          if uv run --frozen python -m pytest -q tests/test_tepp_project_history_recovery.py; then
            echo "Expected the route integration contract to fail before applying the recovery." >&2
            exit 1
          fi

      - name: Confirm RED canonical-timeline contract
        working-directory: frontend
        run: |
          if pnpm exec vitest run src/components/ProjectHistoryTimeline.tepp.test.tsx; then
            echo "Expected the canonical timeline to omit TEPP evidence before applying the recovery." >&2
            exit 1
          fi

      - name: Apply exact-context recovery
        run: python tools/apply_tepp_project_history_recovery.py

      - name: Verify focused Python contracts
        run: >-
          uv run --frozen python -m pytest -q
          tests/test_tepp_project_history_recovery.py
          tests/test_project_history_api_contract.py
          tests/test_documentation_hygiene.py

      - name: Verify Python syntax
        run: uv run --frozen python -m compileall -q lineageweave backend tests

      - name: Verify focused frontend contracts
        working-directory: frontend
        run: >-
          pnpm exec vitest run
          src/components/TeppProjectHistoryEvidence.test.tsx
          src/components/ProjectHistoryTimeline.tepp.test.tsx
          src/components/ProjectHistoryTimeline.test.tsx

      - name: Verify frontend lint and production builds
        working-directory: frontend
        run: |
          pnpm run lint
          pnpm run build
          pnpm run build-storybook

      - name: Remove one-shot machinery and check patch hygiene
        run: |
          rm .github/workflows/one-shot-tepp-project-history-recovery.yml
          rm tools/apply_tepp_project_history_recovery.py
          git diff --check

      - name: Commit verified recovery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: recover TEPP validation on canonical project history"
          git push origin HEAD:feat/tepp-project-history-recovery-v2210
