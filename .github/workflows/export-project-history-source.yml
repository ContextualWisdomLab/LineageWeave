name: Export project history source

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: export-project-history-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  export-source:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/project-history-timeline-v2184-r3'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact contributor head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Archive tracked source without repository metadata
        shell: bash
        run: |
          git ls-files -z | tar --null -T - -czf /tmp/lineageweave-project-history-source.tgz
          sha256sum /tmp/lineageweave-project-history-source.tgz > /tmp/lineageweave-project-history-source.tgz.sha256

      - name: Upload exact source artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4.6.2
        with:
          name: lineageweave-project-history-source-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/lineageweave-project-history-source.tgz
            /tmp/lineageweave-project-history-source.tgz.sha256
          if-no-files-found: error
          retention-days: 1
