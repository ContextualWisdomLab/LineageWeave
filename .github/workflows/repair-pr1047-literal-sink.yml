name: Repair PR1047 literal SQL sink

on:
  push:
    branches:
      - fix/post-chat-replay-scope
    paths:
      - .github/workflows/repair-pr1047-literal-sink.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-chat-replay-scope
          fetch-depth: 0
      - name: Apply causal owner-boundary repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import runpy

          eligibility_path = Path('backend/app/post_eligibility.py')
          ingestion_path = Path('backend/app/post_chat_ingestion.py')
          eligibility_test_path = Path('tests/test_post_eligibility.py')

          namespace = runpy.run_path(str(eligibility_path))
          visibility = namespace['source_post_scope_sql']('source_post')
          eligibility = namespace['SOURCE_POST_ELIGIBILITY_SQL'].format(alias='source_post')
          query = (
              'select source_post.post_id::text as post_id '
              'from source_post '
              'where source_post.post_id = any($3::uuid[]) '
              f'and {visibility} '
              f'and {eligibility} '
              'order by source_post.post_id '
              'for share'
          )

          eligibility_source = eligibility_path.read_text(encoding='utf-8')
          if 'from typing import Any\n' not in eligibility_source:
              eligibility_source = eligibility_source.replace(
                  'from collections.abc import Collection, Mapping\n',
                  'from collections.abc import Collection, Mapping\nfrom typing import Any\n',
                  1,
              )
          helper_marker = 'async def fetch_visible_eligible_source_post_ids_for_share('
          if helper_marker in eligibility_source:
              raise SystemExit('owner helper already exists; refusing ambiguous rewrite')
          helper = f'''\n\nasync def fetch_visible_eligible_source_post_ids_for_share(\n    conn: Any,\n    corporate_entity_ids: Collection[str],\n    process_unit_ids: Collection[str],\n    source_post_ids: Collection[str],\n) -> frozenset[str]:\n    \"\"\"Lock and return captured sources still visible and buyer-eligible.\n\n    This repository operation owns the SQL-level authorization boundary so\n    replay consumers do not copy ABAC/eligibility SQL. The query is deliberately\n    literal at the asyncpg sink; request identities remain bind parameters.\n    \"\"\"\n    if not source_post_ids:\n        return frozenset()\n    rows = await conn.fetch(\n        {query!r},\n        sorted(corporate_entity_ids),\n        sorted(process_unit_ids),\n        sorted(set(source_post_ids)),\n    )\n    return frozenset(str(row[\"post_id\"]) for row in rows)\n'''
          eligibility_source += helper
          eligibility_path.write_text(eligibility_source, encoding='utf-8')

          ingestion_source = ingestion_path.read_text(encoding='utf-8')
          old_import = 'from .post_eligibility import SOURCE_POST_ELIGIBILITY_SQL, source_post_scope_sql\n'
          new_import = '''from .post_eligibility import (\n    SOURCE_POST_ELIGIBILITY_SQL,\n    fetch_visible_eligible_source_post_ids_for_share,\n)\n'''
          if old_import not in ingestion_source:
              raise SystemExit('expected post_eligibility import not found')
          ingestion_source = ingestion_source.replace(old_import, new_import, 1)

          old_query_block = '''_POST_CHAT_VISIBLE_CAPTURED_SOURCE_SQL = (\n    \"select source_post.post_id::text as post_id \"\n    \"from source_post \"\n    \"where source_post.post_id = any($3::uuid[]) \"\n    \"and {visibility} \"\n    \"and {eligibility} \"\n    \"order by source_post.post_id \"\n    \"for share\"\n).format(\n    visibility=source_post_scope_sql(\"source_post\"),\n    eligibility=SOURCE_POST_ELIGIBILITY_SQL.format(alias=\"source_post\"),\n)\n\n\n'''
          if old_query_block not in ingestion_source:
              raise SystemExit('expected replay query block not found')
          ingestion_source = ingestion_source.replace(old_query_block, '', 1)

          old_function = '''async def _captured_sources_are_visible(\n    conn: asyncpg.Connection,\n    source_post_ids: tuple[str, ...],\n    current_scope: PostChatAuthorizationScope,\n) -> bool:\n    \"\"\"Reauthorize every captured source during a short replay transaction.\"\"\"\n    if not source_post_ids:\n        return False\n    statement = await conn.prepare(_POST_CHAT_VISIBLE_CAPTURED_SOURCE_SQL)\n    rows = await statement.fetch(\n        sorted(current_scope.corporate_entity_ids),\n        sorted(current_scope.process_unit_ids),\n        list(source_post_ids),\n    )\n    return {{str(row[\"post_id\"]) for row in rows}} == set(source_post_ids)\n'''
          new_function = '''async def _captured_sources_are_visible(\n    conn: asyncpg.Connection,\n    source_post_ids: tuple[str, ...],\n    current_scope: PostChatAuthorizationScope,\n) -> bool:\n    \"\"\"Reauthorize every captured source through the shared repository boundary.\"\"\"\n    visible_source_post_ids = await fetch_visible_eligible_source_post_ids_for_share(\n        conn,\n        current_scope.corporate_entity_ids,\n        current_scope.process_unit_ids,\n        source_post_ids,\n    )\n    return visible_source_post_ids == frozenset(source_post_ids)\n'''
          if old_function not in ingestion_source:
              raise SystemExit('expected replay authorization function not found')
          ingestion_source = ingestion_source.replace(old_function, new_function, 1)
          ingestion_path.write_text(ingestion_source, encoding='utf-8')

          test_source = eligibility_test_path.read_text(encoding='utf-8')
          if not test_source.startswith('import inspect\n'):
              test_source = 'import inspect\n\n' + test_source
          import_anchor = '    SOURCE_POST_ELIGIBILITY_SQL,\n'
          if import_anchor not in test_source:
              raise SystemExit('expected eligibility import anchor not found')
          test_source = test_source.replace(
              import_anchor,
              import_anchor
              + '    fetch_visible_eligible_source_post_ids_for_share,\n'
              + '    source_post_scope_sql,\n',
              1,
          )
          test_name = 'test_locked_replay_query_tracks_shared_visibility_and_eligibility_contract'
          if test_name in test_source:
              raise SystemExit('replay owner-query contract test already exists')
          test_source += '''\n\ndef test_locked_replay_query_tracks_shared_visibility_and_eligibility_contract() -> None:\n    \"\"\"The literal asyncpg sink must stay equivalent to shared source-post policy.\"\"\"\n    helper_source = \" \".join(\n        inspect.getsource(fetch_visible_eligible_source_post_ids_for_share).split()\n    )\n    visibility = \" \".join(source_post_scope_sql(\"source_post\").split())\n    eligibility = \" \".join(\n        SOURCE_POST_ELIGIBILITY_SQL.format(alias=\"source_post\").split()\n    )\n    assert visibility in helper_source\n    assert eligibility in helper_source\n    assert \"for share\" in helper_source.lower()\n'''
          eligibility_test_path.write_text(test_source, encoding='utf-8')
          PY
      - name: Verify surgical diff
        shell: bash
        run: |
          python -m py_compile backend/app/post_eligibility.py backend/app/post_chat_ingestion.py tests/test_post_eligibility.py
          git diff --check
          git diff -- backend/app/post_eligibility.py backend/app/post_chat_ingestion.py tests/test_post_eligibility.py
      - name: Commit repair and remove purpose-complete workflow
        shell: bash
        run: |
          rm .github/workflows/repair-pr1047-literal-sink.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/post_eligibility.py backend/app/post_chat_ingestion.py tests/test_post_eligibility.py .github/workflows/repair-pr1047-literal-sink.yml
          git diff --cached --check
          git commit -m 'fix(security): keep replay SQL in eligibility owner'
          git push origin HEAD:fix/post-chat-replay-scope
