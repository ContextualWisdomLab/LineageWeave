# Exact-current-parent test-first implementation for LineageWeave #278.
name: Project History RED to GREEN

on:
  push:
    branches:
      - feat/project-history-timeline-v2184-r2
    paths:
      - .github/workflows/project-history-red-green.yml
      - .github/scripts/project_history_patch.py.gz.b64.*

permissions:
  contents: write

concurrency:
  group: project-history-red-green-v2184-r2
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LINEAGEWEAVE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
      EXPECTED_PARENT_SHA: 4d6494d60f483b65efe2d9b8649f56366400fe83
      EXPECTED_PARENT_REF: refs/heads/feat/event-lineage-node-keeps-gnb-focus-v2170
      PATCH_SHA256: aca6e0effc9993bafdeefca85601fde4a0505077510d49b8f5a272eb9dc3d753

    steps:
      - name: Checkout exact implementation branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: feat/project-history-timeline-v2184-r2
          fetch-depth: 0
          persist-credentials: true

      - name: Verify the exact moving-stack parent and reconstruct the helper
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/project-history-timeline-v2184-r2
          git merge --ff-only origin/feat/project-history-timeline-v2184-r2
          remote_parent="$(git ls-remote origin "$EXPECTED_PARENT_REF" | cut -f1)"
          test "$remote_parent" = "$EXPECTED_PARENT_SHA"
          test "$(git merge-base "$EXPECTED_PARENT_SHA" HEAD)" = "$EXPECTED_PARENT_SHA"
          cat .github/scripts/project_history_patch.py.gz.b64.* \
            | base64 --decode \
            | gzip --decompress > /tmp/apply_project_history.py
          printf '%s  %s\n' "$PATCH_SHA256" /tmp/apply_project_history.py \
            | sha256sum --check
          python -m py_compile /tmp/apply_project_history.py

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Select pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install exact dependencies
        run: |
          uv sync --frozen --extra dev --extra backend
          corepack enable
          pnpm --dir frontend install --frozen-lockfile

      - name: Commit the failing Buyer contracts
        id: red
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/apply_project_history.py red
          git config user.name "CWL Project History Agent"
          git config user.email "actions@users.noreply.github.com"
          git add \
            tests/test_project_history.py \
            tests/test_project_history_routes.py \
            tests/test_project_history_postgres.py \
            frontend/src/components/ProjectHistoryTimeline.test.tsx \
            frontend/src/ProjectHistoryPanel.test.tsx \
            frontend/src/projectHistoryI18n.test.ts \
            frontend/src/components/BuyerNav.test.tsx
          git commit -m "test(buyer): specify project lifecycle history"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Confirm RED on the committed contracts
        shell: bash
        run: |
          set -uo pipefail
          set +e
          uv run --frozen python -m pytest -q \
            tests/test_project_history.py \
            tests/test_project_history_routes.py \
            tests/test_project_history_postgres.py \
            2>&1 | tee /tmp/project-history-red-backend.log
          backend_status=${PIPESTATUS[0]}

          pnpm --dir frontend run test -- \
            ProjectHistoryTimeline \
            ProjectHistoryPanel \
            BuyerNav \
            projectHistoryI18n \
            2>&1 | tee /tmp/project-history-red-frontend.log
          frontend_status=${PIPESTATUS[0]}
          set -e

          test "$backend_status" -ne 0
          test "$frontend_status" -ne 0
          grep -Eq "project_history|ProjectHistory|Project history" \
            /tmp/project-history-red-backend.log \
            /tmp/project-history-red-frontend.log
          echo "RED commit ${{ steps.red.outputs.sha }} reproduced both missing contracts."

      - name: Apply the narrow GREEN implementation
        run: |
          set -euo pipefail
          python /tmp/apply_project_history.py green
          uv lock --offline
          uv sync --frozen --extra dev --extra backend
          uv run --frozen python -m compileall -q backend lineageweave tests
          git diff --check

      - name: Verify focused backend contracts and 100 percent branch coverage
        run: |
          set -euo pipefail
          uv run --frozen coverage erase
          uv run --frozen coverage run --branch -m pytest -q tests/test_project_history.py
          uv run --frozen coverage report \
            --include=backend/app/project_history.py \
            --fail-under=100
          uv run --frozen python -m pytest -q \
            tests/test_project_history_routes.py \
            tests/test_project_history_postgres.py

      - name: Verify the complete PostgreSQL and Python suite
        run: uv run --frozen python -m pytest -q

      - name: Verify the Buyer frontend and Storybook
        working-directory: frontend
        run: |
          pnpm run lint
          pnpm run test
          pnpm run build
          pnpm run build-storybook

      - name: Verify release and one-shot hygiene
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'version = "2.18.4"' pyproject.toml
          grep -F '"version": "2.18.4"' frontend/package.json
          test "$(find docs/adr -maxdepth 1 -name '*-project-history-timeline.md' | wc -l)" -eq 1
          grep -F "related_history_not_causal" backend/app/project_history.py
          grep -F "source_post_created_at_fallback" backend/app/project_history.py
          grep -F "Project history" frontend/src/components/BuyerNav.tsx
          test -z "$(git status --porcelain --untracked-files=no | grep -F 'PROJECT_HISTORY_ADR' || true)"

      - name: Commit the verified production slice and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          remote_parent="$(git ls-remote origin "$EXPECTED_PARENT_REF" | cut -f1)"
          test "$remote_parent" = "$EXPECTED_PARENT_SHA"
          git rm .github/workflows/project-history-red-green.yml
          git rm .github/scripts/project_history_patch.py.gz.b64.*
          git add -A
          git commit -m "feat(buyer): add project lifecycle history timeline"
          git pull --rebase origin feat/project-history-timeline-v2184-r2
          git push origin HEAD:feat/project-history-timeline-v2184-r2
