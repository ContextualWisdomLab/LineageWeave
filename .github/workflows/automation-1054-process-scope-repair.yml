name: Report leftover process-scope repair

on:
  push:
    branches: [fix/report-aggregate-whole-population-auth]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: fix/report-aggregate-whole-population-auth
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Select pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Install committed lock
        run: uv sync --frozen --extra dev --extra backend

      - name: Prove missing comparison process scope is RED
        run: |
          set +e
          uv run --frozen python -m pytest -q \
            tests/test_period_report_whole_population_authorization.py::test_period_report_comparison_preserves_leftover_process_scope
          red_status=$?
          set -e
          if [ "$red_status" -eq 0 ]; then
            echo "Expected comparison leftover process-scope regression to fail before repair"
            exit 1
          fi

      - name: Add process-unit identity to comparison leftover evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/app/report_ingestion.py")
          text = path.read_text()
          old_select = (
              "               p.post_title, p.visibility_code, p.corporate_entity_id,\n"
              "               ({_SOURCE_CONTEXT_PRESENT_SQL}) as has_real_source_context\n"
              "        from report_leftover_pair lp\n"
          )
          new_select = (
              "               p.post_title, p.visibility_code, p.corporate_entity_id,\n"
              "               p.process_unit_id,\n"
              "               ({_SOURCE_CONTEXT_PRESENT_SQL}) as has_real_source_context\n"
              "        from report_leftover_pair lp\n"
          )
          if text.count(old_select) != 1:
              raise SystemExit(f"comparison leftover SELECT anchor count={text.count(old_select)}")
          text = text.replace(old_select, new_select, 1)
          old_payload = (
              '                        "corporate_entity_id": str(pair["corporate_entity_id"]),\n'
              '                        "has_real_source_context": bool(pair["has_real_source_context"]),\n'
          )
          new_payload = (
              '                        "corporate_entity_id": str(pair["corporate_entity_id"]),\n'
              '                        "process_unit_id": (\n'
              '                            None\n'
              '                            if pair["process_unit_id"] is None\n'
              '                            else str(pair["process_unit_id"])\n'
              '                        ),\n'
              '                        "has_real_source_context": bool(pair["has_real_source_context"]),\n'
          )
          marker = text.index("async def fetch_period_comparison(")
          suffix = text[marker:]
          if suffix.count(old_payload) != 1:
              raise SystemExit(f"comparison leftover payload anchor count={suffix.count(old_payload)}")
          suffix = suffix.replace(old_payload, new_payload, 1)
          path.write_text(text[:marker] + suffix)
          PY

      - name: Prove whole report authorization suite GREEN
        run: uv run --frozen python -m pytest -q tests/test_period_report_whole_population_authorization.py

      - name: Compile touched Python
        run: uv run --frozen python -m compileall -q backend/app/report_ingestion.py tests/test_period_report_whole_population_authorization.py

      - name: Publish ordinary repair commit and remove purpose-complete workflow
        env:
          TARGET_BRANCH: fix/report-aggregate-whole-population-auth
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/automation-1054-process-scope-repair.yml
          git add backend/app/report_ingestion.py
          git diff --cached --check
          git commit -m "fix(security): preserve report leftover process scope"
          git push origin "HEAD:${TARGET_BRANCH}"
