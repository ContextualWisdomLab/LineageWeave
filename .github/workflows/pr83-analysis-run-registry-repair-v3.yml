name: PR 83 analysis-run registry repair v3

on:
  push:
    branches:
      - feat/analysis-run-registry-v079
    paths:
      - .github/workflows/pr83-analysis-run-registry-repair-v3.yml

permissions: {}

concurrency:
  group: pr83-analysis-run-registry-repair-v3
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LINEAGEWEAVE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout exact stacked branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: feat/analysis-run-registry-v079
          fetch-depth: 0
          persist-credentials: true

      - name: Reject stale or reordered execution
        env:
          EXPECTED_PARENT_SHA: 248c93f534668f670b68786c235acbf268b13b1b
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Install committed development dependencies
        run: uv sync --frozen --extra dev

      - name: Require PostgreSQL instead of accepting a skipped contract
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U postgres && exit 0
            sleep 2
          done
          exit 1

      - name: Add RED regressions
        run: uv run --frozen python scripts/pr83_analysis_run_registry_repair.py tests

      - name: Prove the old schema fails the new contracts
        run: |
          set -euo pipefail
          set +e
          uv run --frozen python -m pytest -q \
            tests/test_analysis_run_registry_schema.py \
            -k 'snapshot_temporal_boundary_blocks_future_information or snapshot_counts_freeze_when_a_run_references_them or status_event_records_system_time_and_rejects_future_occurrence' \
            > /tmp/pr83-red.log 2>&1
          status=$?
          set -e
          cat /tmp/pr83-red.log
          test "$status" -ne 0
          grep -Eq 'maximum_available_time|recorded_at|UndefinedColumn|does not exist' /tmp/pr83-red.log

      - name: Apply the minimal GREEN implementation
        run: uv run --frozen python scripts/pr83_analysis_run_registry_repair.py implementation

      - name: Verify focused PostgreSQL and documentation contracts
        run: |
          set -euo pipefail
          uv run --frozen python -m pytest -q tests/test_analysis_run_registry_schema.py
          uv run --frozen python -m pytest -q tests/test_documentation_hygiene.py
          uv run --frozen python -m compileall -q lineageweave backend tests
          git diff --check

      - name: Commit verified product changes and remove transient repair code
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/pr83-analysis-run-registry-repair.yml \
            .github/workflows/pr83-analysis-run-registry-repair-v2.yml \
            .github/workflows/pr83-analysis-run-registry-repair-v3.yml \
            scripts/pr83_analysis_run_registry_repair.py
          git add -A
          git diff --cached --check
          git config user.name "opencode-agent[bot]"
          git config user.email "1549082+opencode-agent[bot]@users.noreply.github.com"
          git commit -m "fix(db): freeze temporal analysis evidence (v0.79.0)"
          git push origin HEAD:feat/analysis-run-registry-v079
