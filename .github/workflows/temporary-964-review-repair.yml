name: Temporary 964 review repair

on:
  push:
    branches:
      - "automation/964-review-repair-20260906"

permissions:
  contents: write

concurrency:
  group: temporary-964-review-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: automation/964-review-repair-20260906
          fetch-depth: 0

      - name: Verify exact product head before mutation
        shell: bash
        run: |
          set -euo pipefail
          product=529d616e34d959715d2ece7a59bb99c8acbb5a4a
          workflow=.github/workflows/temporary-964-review-repair.yml
          git fetch origin fix/load-observation-evidence-20260906
          test "$(git rev-parse origin/fix/load-observation-evidence-20260906)" = "$product"
          git merge-base --is-ancestor "$product" HEAD
          test "$(git diff --name-only "$product"..HEAD)" = "$workflow"

      - name: Add review regressions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("frontend/src/k6Diagnostics.test.ts")
          text = path.read_text()
          marker = "\n});\n"
          assert text.endswith(marker)
          tests = r'''

            it("contains a null MCP envelope without exposing response content", () => {
              expect(() => harness("k6_mcp_e2e.js").result({
                status: 200, body: "data: null",
              })).toThrow(/^MCP response envelope was invalid: HTTP 200$/);
            });

            it("contains an empty MCP envelope with a status-only diagnostic", () => {
              expect(() => harness("k6_mcp_e2e.js").result({
                status: 200, body: "data: {}",
              })).toThrow(/^MCP response omitted result: HTTP 200$/);
            });

            it("contains a null MCP tool result with a status-only diagnostic", () => {
              expect(() => harness("k6_mcp_e2e.js").structured({
                status: 200, body: 'data: {"result":null}',
              })).toThrow(/^MCP tool result was invalid: HTTP 200$/);
            });
          '''
          path.write_text(text[:-len(marker)] + tests + marker)
          PY

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install locked frontend dependencies
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Demonstrate realistic RED
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          if pnpm exec vitest run src/k6Diagnostics.test.ts; then
            echo "expected new MCP shape regressions to fail before production repair" >&2
            exit 1
          fi

      - name: Apply minimal MCP shape and markdown repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          script = Path("scripts/k6_mcp_e2e.js")
          text = script.read_text()
          result_anchor = '  if (envelope.error) fail(`MCP request failed: HTTP ${response.status}`);\n  return envelope.result;'
          result_repair = '''  if (!envelope || typeof envelope !== "object" || Array.isArray(envelope)) {
            fail(`MCP response envelope was invalid: HTTP ${response.status}`);
          }
          if (envelope.error) fail(`MCP request failed: HTTP ${response.status}`);
          if (!("result" in envelope)) {
            fail(`MCP response omitted result: HTTP ${response.status}`);
          }
          return envelope.result;'''
          assert result_anchor in text
          text = text.replace(result_anchor, result_repair, 1)

          structured_anchor = '  const toolResult = result(response);\n  if (toolResult.isError) fail(`MCP tool failed: HTTP ${response.status}`);\n  return toolResult.structuredContent;'
          structured_repair = '''  const toolResult = result(response);
          if (!toolResult || typeof toolResult !== "object" || Array.isArray(toolResult)) {
            fail(`MCP tool result was invalid: HTTP ${response.status}`);
          }
          if (toolResult.isError) fail(`MCP tool failed: HTTP ${response.status}`);
          if (!("structuredContent" in toolResult)) {
            fail(`MCP tool result omitted structured content: HTTP ${response.status}`);
          }
          return toolResult.structuredContent;'''
          assert structured_anchor in text
          text = text.replace(structured_anchor, structured_repair, 1)
          script.write_text(text)

          baseline = Path("docs/product-technical-gap-baseline.md")
          lines = baseline.read_text().splitlines(keepends=True)
          replacements = {"#914's exact-head OpenCode": "PR #914 exact-head OpenCode", "#780's cancelled CodeQL": "PR #780 cancelled CodeQL"}
          seen = {prefix: 0 for prefix in replacements}
          out = []
          for line in lines:
            for prefix, replacement in replacements.items():
              if line.startswith(prefix):
                line = replacement + line[len(prefix):]
                seen[prefix] += 1
            out.append(line)
          assert seen == {"#914's exact-head OpenCode": 1, "#780's cancelled CodeQL": 1}, seen
          baseline.write_text("".join(out))
          PY

      - name: Verify GREEN and confidentiality boundary
        working-directory: frontend
        run: pnpm exec vitest run src/k6Diagnostics.test.ts

      - name: Verify lint and production build
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec oxlint
          pnpm run build

      - name: Verify markdown repair
        shell: bash
        run: |
          set -euo pipefail
          ! grep -n '^#914' docs/product-technical-gap-baseline.md
          ! grep -n '^#780' docs/product-technical-gap-baseline.md
          grep -q '^PR #914 exact-head OpenCode' docs/product-technical-gap-baseline.md
          grep -q '^PR #780 cancelled CodeQL' docs/product-technical-gap-baseline.md

      - name: Commit workflow-free repair tree
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/temporary-964-review-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          rm "$workflow"
          git add -A
          test "$(git diff --cached --name-status -- "$workflow")" = $'D\t.github/workflows/temporary-964-review-repair.yml'
          test "$(git diff --cached --name-only | grep -v '^\.github/workflows/temporary-964-review-repair\.yml$' | sort)" = $'docs/product-technical-gap-baseline.md\nfrontend/src/k6Diagnostics.test.ts\nscripts/k6_mcp_e2e.js'
          git commit -m "fix(k6): validate MCP diagnostic envelopes"
          git push origin HEAD:automation/964-review-repair-20260906
