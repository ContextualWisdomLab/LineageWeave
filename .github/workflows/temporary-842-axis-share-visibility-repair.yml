name: Temporary 842 axis-share visibility and ADR repair

on:
  push:
    branches:
      - "automation/842-axis-share-visibility-repair-20260906"

permissions:
  contents: write

concurrency:
  group: temporary-842-axis-share-visibility-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: automation/842-axis-share-visibility-repair-20260906
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Install committed backend test dependencies
        run: uv sync --frozen --extra dev --extra backend

      - name: Apply exact mixed-visibility fail-closed repair
        shell: python
        run: |
          from pathlib import Path

          path = Path("backend/app/main.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          old = [
              "        visible.append(",
              "            {",
              "                **row,",
              "                \"members\": [],",
              "                \"leftover_pairs\": leftover_pairs,",
              "                \"post_count\": len(members),",
              "            }",
              "        )",
          ]
          new = [
              "        visible.append(",
              "            {",
              "                **row,",
              "                \"members\": [],",
              "                \"leftover_pairs\": leftover_pairs,",
              "                \"leftover_map_axes\": (",
              "                    row.get(\"leftover_map_axes\", [])",
              "                    if len(members) == len(row[\"members\"])",
              "                    else []",
              "                ),",
              "                \"post_count\": len(members),",
              "            }",
              "        )",
          ]
          matches = [index for index in range(len(lines) - len(old) + 1) if lines[index:index + len(old)] == old]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one compare response block, found {len(matches)}")
          index = matches[0]
          lines[index:index + len(old)] = new
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")

      - name: Move axis-share decision to unclaimed Proposed ADR 0368
        shell: python
        run: |
          from pathlib import Path

          old_adr = Path("docs/adr/0304-leftover-map-compare-axis-share.md")
          new_adr = Path("docs/adr/0368-leftover-map-compare-axis-share.md")
          if not old_adr.exists() or new_adr.exists():
              raise SystemExit("expected colliding ADR 0304 source and no ADR 0368 target")
          content = old_adr.read_text(encoding="utf-8")
          if not content.startswith("# ADR 0304 —"):
              raise SystemExit("unexpected axis-share ADR header")
          if content.count("**Decision status:** Accepted") != 1:
              raise SystemExit("expected one premature Accepted status")
          content = content.replace("# ADR 0304 —", "# ADR 0368 —", 1)
          content = content.replace("**Decision status:** Accepted", "**Decision status:** Proposed", 1)
          content = content.replace("ADR 0304", "ADR 0368")
          new_adr.write_text(content, encoding="utf-8")
          old_adr.unlink()

          reference_files = [
              Path("AGENTS.md"),
              Path("ARCHITECTURE.md"),
              Path("CHANGELOG.d/2.61.0-leftover-map-compare-axis-share.md"),
              Path("CHANGELOG.md"),
              Path("docs/adr/0148-leftover-map-axis-share.md"),
              Path("docs/product-technical-gap-baseline.md"),
              Path("docs/storybook-inventory.md"),
              Path("frontend/src/leftoverMapCompareAxis.ts"),
              Path("frontend/src/components/LeftoverPairList.tsx"),
              Path("frontend/src/leftoverMapPlotLayout.ts"),
          ]
          for path in reference_files:
              text = path.read_text(encoding="utf-8")
              text = text.replace("0304-leftover-map-compare-axis-share", "0368-leftover-map-compare-axis-share")
              text = text.replace("ADR 0304", "ADR 0368")
              path.write_text(text, encoding="utf-8")

          claude = Path("CLAUDE.md")
          text = claude.read_text(encoding="utf-8")
          marker = "/ 0304), occupational construct catalog search"
          if text.count(marker) != 1:
              raise SystemExit(f"expected one CLAUDE numeric authority marker, found {text.count(marker)}")
          claude.write_text(text.replace(marker, "/ 0368), occupational construct catalog search"), encoding="utf-8")

          test = Path("tests/test_compare_axis_share_adr_authority.py")
          if test.exists():
              raise SystemExit("ADR authority regression already exists on product head")
          test.write_text(
              '"""Governance contract for grouping-comparison axis-share ADR identity."""\n\n'
              'from pathlib import Path\n\n\n'
              '_ROOT = Path(__file__).parents[1]\n'
              '_AXIS_ADR = _ROOT / "docs" / "adr" / "0368-leftover-map-compare-axis-share.md"\n'
              '_COLLIDING_ADR = _ROOT / "docs" / "adr" / "0304-leftover-map-compare-axis-share.md"\n\n\n'
              'def test_axis_share_uses_unclaimed_proposed_adr_identity() -> None:\n'
              '    """Keep the axis-share decision distinct from sibling ADR 0304."""\n'
              '    assert _AXIS_ADR.exists()\n'
              '    assert not _COLLIDING_ADR.exists()\n\n'
              '    text = _AXIS_ADR.read_text(encoding="utf-8")\n'
              '    assert text.startswith("# ADR 0368")\n'
              '    assert "**Decision status:** Proposed" in text\n'
              '    assert "**Decision status:** Accepted" not in text\n\n\n'
              'def test_axis_share_owned_references_follow_adr_0368() -> None:\n'
              '    """Do not leave branch-local axis-share authority split across ADR ids."""\n'
              '    expected = {\n'
              '        "docs/adr/0148-leftover-map-axis-share.md": "0368-leftover-map-compare-axis-share.md",\n'
              '        "frontend/src/leftoverMapCompareAxis.ts": "ADR 0368",\n'
              '        "frontend/src/components/LeftoverPairList.tsx": "ADR 0368",\n'
              '        "frontend/src/leftoverMapPlotLayout.ts": "ADR 0368",\n'
              '    }\n'
              '    for relative_path, marker in expected.items():\n'
              '        content = (_ROOT / relative_path).read_text(encoding="utf-8")\n'
              '        assert marker in content, relative_path\n',
              encoding="utf-8",
          )

          excluded = {
              test,
              Path(".github/workflows/temporary-842-axis-share-visibility-repair.yml"),
          }
          leftovers = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or path in excluded or ".git" in path.parts or ".venv" in path.parts:
                  continue
              if path.suffix.lower() not in {".md", ".py", ".ts", ".tsx", ".json", ".toml"}:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if "0304-leftover-map-compare-axis-share" in text:
                  leftovers.append(f"{path}: stale axis-share ADR path")
          if leftovers:
              raise SystemExit("\n".join(leftovers))

      - name: Run authorization and ADR RED-to-GREEN contracts
        run: |
          uv run --frozen python -m pytest -q \
            tests/test_compare_axis_share_visibility.py \
            tests/test_compare_axis_share_adr_authority.py

      - name: Check changed source
        run: |
          uv run --frozen python -m py_compile backend/app/main.py
          git diff --check

      - name: Commit clean product tree
        run: |
          rm .github/workflows/temporary-842-axis-share-visibility-repair.yml
          test ! -e docs/adr/0304-leftover-map-compare-axis-share.md
          test -e docs/adr/0368-leftover-map-compare-axis-share.md
          test -e tests/test_compare_axis_share_adr_authority.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(reports): repair axis-share visibility and ADR authority"
          git push origin HEAD:automation/842-axis-share-visibility-repair-20260906
