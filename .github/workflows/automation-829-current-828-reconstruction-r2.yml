name: automation-829-current-828-reconstruction-r2
on:
  push:
    branches: [automation/829-current-828-reconstruction-r2-20260907-1620]
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LINEAGEWEAVE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
      PARENT: 7b6dbbb99a09d0523bce43c6872bbd9fa382a43a
      OLD_HEAD: 118500f73251eaaf717d5329b8fb6d9895196fe7
      PRODUCT_BRANCH: feat/leftover-map-compare-unexplained-share-v2520
      R1_BRANCH: automation/829-current-828-reconstruction-r1-20260907-1605
      R1_WORKFLOW: .github/workflows/automation-829-current-828-reconstruction-r1.yml
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Verify exact parent and live product head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PARENT"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/automation-829-current-828-reconstruction-r2.yml"
          test "$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | cut -f1)" = "$OLD_HEAD"
          git fetch origin "$R1_BRANCH:refs/remotes/origin/$R1_BRANCH"
      - name: Reconstruct valid delta with current-parent i18n anchors
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "LineageWeave automation"
          git config user.email "lineageweave-automation@users.noreply.github.com"
          git checkout -B reconstructed "$PARENT"
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          branch = "automation/829-current-828-reconstruction-r1-20260907-1605"
          workflow = ".github/workflows/automation-829-current-828-reconstruction-r1.yml"
          source = subprocess.check_output(
              ["git", "show", f"refs/remotes/origin/{branch}:{workflow}"], text=True
          )
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          script = textwrap.dedent(source[start:end])
          old_start = script.index(
              "# Preserve the current five-locale compatibility copy without claiming it as canonical ledger authority."
          )
          old_end = script.index(
              "# Allocate the next current serialized identity only after live authority showed ADR0369 unclaimed.",
              old_start,
          )
          replacement = '''# Preserve current five-locale compatibility copy by semantic key rather than stale translated anchors.\n          i18n = Path("frontend/src/i18n.ts")\n          source_lines = i18n.read_text(encoding="utf-8").splitlines()\n          translations = [\n              "잔여 지도 비교 미설명 잔여 점유율",\n              "残差地图比较未解释残差份额",\n              "残差マップの比較未説明残差割合",\n              "Phần dư chưa giải thích so sánh bản đồ phần dư",\n          ]\n          output = []\n          occurrence = 0\n          for line in source_lines:\n              output.append(line)\n              if '"Leftover map comparison explained leftover share":' not in line:\n                  continue\n              if occurrence >= len(translations):\n                  raise SystemExit("unexpected extra comparison explained-share locale row")\n              indent = line[: len(line) - len(line.lstrip())]\n              output.append(\n                  f'{indent}"Leftover map comparison unexplained leftover share": "{translations[occurrence]}",'\n              )\n              occurrence += 1\n          if occurrence != 4:\n              raise SystemExit(f"expected four current locale rows, found {occurrence}")\n          i18n.write_text("\\n".join(output) + "\\n", encoding="utf-8")\n          replace_once(\n              "frontend/src/i18n.test.ts",\n              '    "Leftover map comparison explained leftover share",',\n              '    "Leftover map comparison explained leftover share",\\n    "Leftover map comparison unexplained leftover share",',\n          )\n\n          '''
          script = script[:old_start] + replacement + script[old_end:]
          Path("/tmp/reconstruct_829.py").write_text(script, encoding="utf-8")
          PY
          python /tmp/reconstruct_829.py
          git add -A
          git diff --cached --check
          grep -q '^# ADR 0369 ' docs/adr/0369-leftover-map-compare-unexplained-share.md
          grep -q '^\*\*Decision status:\*\* Proposed' docs/adr/0369-leftover-map-compare-unexplained-share.md
          test "$(grep -c '"'"'Leftover map comparison unexplained leftover share'"'"' frontend/src/i18n.ts)" -eq 4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.28"
          enable-cache: false
      - name: Select pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
      - name: Install frozen graphs
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --extra backend
          cd frontend
          corepack enable
          pnpm install --frozen-lockfile
      - name: Realistic accessibility RED on reconstructed historical behavior
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          set +e
          pnpm exec vitest run src/App.test.tsx -t "shows the grouping comparison strip and switches grouping on click" > /tmp/829-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/829-red.log
          test "$rc" -ne 0
          grep -q 'Unable to find an accessible element with the role "button" and name' /tmp/829-red.log
          python - <<'PY'
          from pathlib import Path
          text = Path('src/App.tsx').read_text(encoding='utf-8')
          start = text.index('const pairAccessibleName =')
          end = text.index('return (', start)
          block = text[start:end]
          if 'unexplainedShare' in block:
              raise SystemExit('RED invalid: parent accessible name already includes unexplained share')
          if 'aria-label={t(LEFTOVER_MAP_COMPARE_UNEXPLAINED_SHARE_LABEL)}' not in text:
              raise SystemExit('RED invalid: child-only historical label was not reconstructed')
          PY
      - name: Minimal causal accessibility fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/App.tsx')
          text = p.read_text(encoding='utf-8')
          old = '''                    }${\n                      explainedShare\n                        ? ` · ${t(LEFTOVER_MAP_COMPARE_EXPLAINED_SHARE_LABEL)} ${explainedShare}`\n                        : ""\n                    }`;'''
          new = '''                    }${\n                      explainedShare\n                        ? ` · ${t(LEFTOVER_MAP_COMPARE_EXPLAINED_SHARE_LABEL)} ${explainedShare}`\n                        : ""\n                    }${\n                      unexplainedShare\n                        ? ` · ${t(LEFTOVER_MAP_COMPARE_UNEXPLAINED_SHARE_LABEL)} ${unexplainedShare}`\n                        : ""\n                    }`;'''
          if old not in text:
              raise SystemExit('current-parent accessible-name composition anchor changed')
          text = text.replace(old, new, 1)
          old_badge = '''                            <span\n                              className="post-badge"\n                              aria-label={t(LEFTOVER_MAP_COMPARE_UNEXPLAINED_SHARE_LABEL)}\n                            >'''
          if old_badge not in text:
              raise SystemExit('historical child badge anchor changed')
          text = text.replace(old_badge, '                            <span className="post-badge" aria-hidden="true">', 1)
          p.write_text(text, encoding='utf-8')
          PY
          cd frontend
          pnpm exec vitest run src/App.test.tsx -t "shows the grouping comparison strip and switches grouping on click"
      - name: Exact reconstructed GREEN
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python -m pytest -q
          cd frontend
          pnpm run lint
          pnpm run test
          pnpm run build
          pnpm run build-storybook
      - name: Verify authority and promote product branch non-force
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python -m compileall -q lineageweave backend tests
          runtime_version="$(uv run --frozen python - <<'PY'
          import lineageweave
          print(lineageweave.__version__)
          PY
          )"
          distribution_version="$(uv run --frozen python - <<'PY'
          import importlib.metadata
          print(importlib.metadata.version('lineageweave'))
          PY
          )"
          project_version="$(python - <<'PY'
          import tomllib
          print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])
          PY
          )"
          test "$runtime_version" = "2.55.0"
          test "$distribution_version" = "2.55.0"
          test "$project_version" = "2.55.0"
          grep -q '"version": "2.55.0"' frontend/package.json
          grep -q '^# ADR 0369 ' docs/adr/0369-leftover-map-compare-unexplained-share.md
          grep -q '^\*\*Decision status:\*\* Proposed' docs/adr/0369-leftover-map-compare-unexplained-share.md
          test -z "$(grep -n '^>$' docs/product-technical-gap-baseline.md || true)"
          git diff --check "$PARENT"
          git add -A
          tree="$(git write-tree)"
          test "$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | cut -f1)" = "$OLD_HEAD"
          product_commit="$(printf '%s\n\n%s\n' 'feat(reports): reconstruct grouping comparison unexplained share on current stack' 'Preserve valid historical #829 delta on exact #828, repair actionable naming, and allocate ADR0369/v2.55.0 without rewriting history.' | git commit-tree "$tree" -p "$OLD_HEAD" -p "$PARENT")"
          git push origin "$product_commit:refs/heads/$PRODUCT_BRANCH"
