name: Hourly LineageWeave Commercialization Loop

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lineageweave-hourly-commercialization-loop
  cancel-in-progress: false

jobs:
  inspect-pr-queue:
    permissions:
      actions: write
      checks: read
      contents: write
      id-token: write
      pull-requests: write
    uses: ContextualWisdomLab/.github/.github/workflows/pr-review-merge-scheduler.yml@6eb06cdd08c79a06f7b390069d4ffa49e2eb7dba
    with:
      base_branch: main
      max_prs: "50"
      trigger_reviews: true
      review_dispatch_limit: "-1"
      branch_update_limit: "-1"
      enable_auto_merge: true
      merge_mode: direct_or_auto
      update_branches: true
    secrets: inherit

  repair-review-feedback:
    needs: inspect-pr-queue
    if: ${{ always() }}
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read
      statuses: read
    uses: ContextualWisdomLab/.github/.github/workflows/pr-review-fix-scheduler.yml@6eb06cdd08c79a06f7b390069d4ffa49e2eb7dba
    with:
      target_repository: ContextualWisdomLab/LineageWeave
      base_branch: main
      max_prs: "50"
      max_dispatches: "50"
      retry_hours: "1"
      canonical_ref: 6eb06cdd08c79a06f7b390069d4ffa49e2eb7dba
    secrets: inherit

  revalidate-pr-queue:
    needs: repair-review-feedback
    if: ${{ always() }}
    permissions:
      actions: write
      checks: read
      contents: write
      id-token: write
      pull-requests: write
    uses: ContextualWisdomLab/.github/.github/workflows/pr-review-merge-scheduler.yml@6eb06cdd08c79a06f7b390069d4ffa49e2eb7dba
    with:
      base_branch: main
      max_prs: "50"
      trigger_reviews: true
      review_dispatch_limit: "-1"
      branch_update_limit: "-1"
      enable_auto_merge: true
      merge_mode: direct_or_auto
      update_branches: true
    secrets: inherit

  develop-next-product-gap:
    needs: [inspect-pr-queue, repair-review-feedback, revalidate-pr-queue]
    if: >-
      ${{
        always() &&
        needs.inspect-pr-queue.result == 'success' &&
        needs.repair-review-feedback.result == 'success' &&
        needs.revalidate-pr-queue.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TARGET_REPOSITORY: ContextualWisdomLab/LineageWeave
      BASE_BRANCH: main
      PRODUCT_UX_SPEC: docs/superpowers/specs/2026-08-14-db-grounded-product-ux-design.md
      OPENCODE_VERSION: "1.17.13"
      OPENCODE_SHA256: 157afa289d1a8d9372de0ce19ac726119b937a1f6b201808d46f06e4e59bb348
      OPENCODE_MODEL_CANDIDATES: >-
        nvidia/nvidia/llama-3.3-nemotron-super-49b-v1.5
        nvidia/nvidia/nemotron-3-super-120b-a12b
        nvidia/deepseek-ai/deepseek-v4-pro
      OPENCODE_RED_TIMEOUT_SECONDS: "1200"
      OPENCODE_IMPLEMENT_TIMEOUT_SECONDS: "5400"
      MAX_AUTONOMOUS_CHANGED_FILES: "35"
      MAX_AUTONOMOUS_FILE_BYTES: "524288"
      MAX_AUTONOMOUS_TOTAL_BYTES: "1572864"
      LINEAGEWEAVE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Determine whether product development may start
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NVIDIA_API_KEY:-}" ]; then
            echo "::warning::NVIDIA_NIM_API_KEY is not configured; product development remains fail-closed."
            echo "eligible=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          open_pr_count="$(
            gh api "/repos/${TARGET_REPOSITORY}/pulls?state=open&per_page=1" \
              --jq 'length'
          )"
          if [ "$open_pr_count" -ne 0 ]; then
            echo "An open pull request owns the queue; review, repair, checks, and merge stay ahead of new development."
            echo "eligible=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          echo "eligible=true" >>"$GITHUB_OUTPUT"

      - name: Check out the protected default branch
        if: steps.gate.outputs.eligible == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        if: steps.gate.outputs.eligible == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Set up locked Python dependency manager
        if: steps.gate.outputs.eligible == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Pin the project virtual environment path
        if: steps.gate.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          echo "UV_PROJECT_ENVIRONMENT=${RUNNER_TEMP}/lineageweave-venv" >>"$GITHUB_ENV"

      - name: Select the repository-pinned Rust toolchain
        if: steps.gate.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Set up Node
        if: steps.gate.outputs.eligible == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"

      - name: Install the committed dependency locks
        if: steps.gate.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --extra backend
          chmod -R a+rX "$UV_PROJECT_ENVIRONMENT"
          corepack enable
          pnpm --dir frontend install --frozen-lockfile
          echo "AUTOMATION_BASE_SHA=$(git rev-parse HEAD)" >>"$GITHUB_ENV"
          {
            echo "/opencode.json"
            echo "/.agent-python-red-output.txt"
            echo "/.agent-frontend-red-output.txt"
            echo "/PR_MESSAGE.md"
          } >>"$GITHUB_WORKSPACE/.git/info/exclude"

      - name: Verify the trusted base before authoring
        if: steps.gate.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTOMATION_BASE_SHA"
          uv run --frozen python -m pytest -q
          pnpm --dir frontend run lint
          pnpm --dir frontend run test
          pnpm --dir frontend run build
          python -m compileall -q lineageweave backend tests

      - name: Install the pinned OpenCode CLI
        if: steps.gate.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/opencode-linux-x64.tar.gz"
          install_dir="${RUNNER_TEMP}/opencode/bin"
          mkdir -p "$install_dir"
          curl -fsSL \
            -o "$archive" \
            "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          printf '%s  %s\n' "$OPENCODE_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          install -m 0755 "${RUNNER_TEMP}/opencode" "$install_dir/opencode"
          "$install_dir/opencode" --version
          echo "$install_dir" >>"$GITHUB_PATH"

      - name: Configure test-first authoring permissions
        if: steps.gate.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          cat >"$GITHUB_WORKSPACE/opencode.json" <<'CONFIG'
          {
            "$schema": "https://opencode.ai/config.json",
            "enabled_providers": ["nvidia"],
            "model": "nvidia/nvidia/llama-3.3-nemotron-super-49b-v1.5",
            "lsp": false,
            "permission": {
              "read": {
                "*": "allow",
                ".git/**": "deny",
                "opencode.json": "deny",
                ".env": "deny",
                ".env.*": "deny"
              },
              "edit": {
                "*": "deny",
                "tests/**": "allow",
                "backend/tests/**": "allow",
                "frontend/src/**/*.test.ts": "allow",
                "frontend/src/**/*.test.tsx": "allow",
                "docs/superpowers/specs/**": "allow"
              },
              "bash": "deny",
              "webfetch": "deny",
              "websearch": "deny",
              "external_directory": "deny",
              "task": "deny",
              "skill": "deny",
              "question": "deny",
              "lsp": "deny",
              "doom_loop": "deny"
            }
          }
          CONFIG

      - name: Author one bounded design supplement and failing regression
        if: steps.gate.outputs.eligible == 'true'
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
        run: |
          set -euo pipefail
          prompt="$(cat <<'PROMPT'
          Work only from the trusted files on the checked-out LineageWeave main
          branch. Do not inspect GitHub issues, pull requests, external pages,
          environment variables, credentials, or paths outside the repository.

          Read docs/superpowers/specs/2026-08-14-db-grounded-product-ux-design.md
          first. Select exactly one highest-impact buyer-visible gap needed to
          implement that approved DB-grounded product design. Prefer the earliest
          incomplete vertical slice in this order: Records and direct lineage;
          record detail and cited evidence; analytical entity catalog; calendar
          and calibrated reports; accounts and access; roles and read-only system
          policy. The existing PostgreSQL cardinalities, API authorization rules,
          synthetic-data boundary, and compact-navigation-versus-PROV-O boundary
          are authoritative. Never invent account status, invitations, access
          audit history, affiliation-scoped roles, causal lineage semantics,
          lineage-change history, or editable ABAC behavior unless the same
          bounded increment first adds the normalized persistence, API contract,
          and tests that make the claim true.

          Write one concise design supplement under docs/superpowers/specs/ and
          write the failing regression tests first. During this red phase edit
          only tests/, backend/tests/, frontend test files, and
          docs/superpowers/specs/. Do not modify production code, migrations,
          package metadata, CHANGELOG, workflows, security policy, or ownership
          files. Use realistic synthetic fixtures. A UI increment must test
          keyboard-operable semantics and user-visible next-action copy. An API
          or persistence increment must test RBAC then row-level affiliation
          filtering and fail-closed validation. Do not write PR_MESSAGE.md yet.
          PROMPT
          )"

          status=1
          for model in $OPENCODE_MODEL_CANDIDATES; do
            echo "::group::OpenCode red phase — $model"
            if timeout --kill-after=30s "${OPENCODE_RED_TIMEOUT_SECONDS}s" \
              env -u GH_TOKEN -u GITHUB_TOKEN \
              -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
              HOME="${RUNNER_TEMP}/opencode-home-red" \
              opencode run "$prompt" --model "$model"; then
              status=0
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            echo "::warning::Model $model failed in the red phase; restoring the trusted base."
            git reset --hard "$AUTOMATION_BASE_SHA"
            git clean -fd
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::Every NVIDIA model failed during test-first authoring."
            exit 1
          fi

      - name: Enforce red-phase scope and observe a genuine failure
        if: steps.gate.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          rm -f opencode.json
          git clean -fdX -e frontend/node_modules/

          python - <<'PY'
          from __future__ import annotations

          import os
          import stat
          import subprocess
          from pathlib import Path

          max_files = int(os.environ["MAX_AUTONOMOUS_CHANGED_FILES"])
          max_file_bytes = int(os.environ["MAX_AUTONOMOUS_FILE_BYTES"])
          max_total_bytes = int(os.environ["MAX_AUTONOMOUS_TOTAL_BYTES"])
          records = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "-z"]
          ).split(b"\0")
          paths: list[str] = []
          total_bytes = 0
          index = 0
          while index < len(records):
              record = records[index]
              index += 1
              if not record:
                  continue
              status_text = record[:2].decode("ascii")
              path_text = record[3:].decode("utf-8")
              if any(marker in status_text for marker in ("R", "C", "D", "U")):
                  raise SystemExit(
                      f"red phase may not rename, copy, delete, or conflict: {path_text}"
                  )
              path = Path(path_text)
              info = path.lstat()
              if stat.S_ISLNK(info.st_mode) or not stat.S_ISREG(info.st_mode):
                  raise SystemExit(f"red phase produced a non-regular file: {path_text}")
              data = path.read_bytes()
              data.decode("utf-8", errors="strict")
              if b"\0" in data:
                  raise SystemExit(f"red phase file contains a NUL byte: {path_text}")
              if info.st_size > max_file_bytes:
                  raise SystemExit(f"red phase file exceeds the per-file budget: {path_text}")
              paths.append(path_text)
              total_bytes += info.st_size

          if not paths:
              raise SystemExit("red phase produced no files")
          if len(paths) > max_files or total_bytes > max_total_bytes:
              raise SystemExit("red phase exceeded the autonomous diff budget")
          def is_allowed_red_path(path_text: str) -> bool:
              """Return whether one red-phase path is test or design evidence."""
              if path_text.startswith(
                  ("tests/", "backend/tests/", "docs/superpowers/specs/")
              ):
                  return True
              return path_text.startswith("frontend/src/") and path_text.endswith(
                  (".test.ts", ".test.tsx")
              )

          forbidden = [path for path in paths if not is_allowed_red_path(path)]
          if forbidden:
              raise SystemExit(f"red phase changed files outside its scope: {forbidden!r}")
          if not any(
              path.startswith(("tests/", "backend/tests/"))
              or path.endswith((".test.ts", ".test.tsx"))
              for path in paths
          ):
              raise SystemExit("red phase did not add or modify a regression test")
          if not any(path.startswith("docs/superpowers/specs/") for path in paths):
              raise SystemExit("red phase did not write a design supplement")
          PY

          set +e
          uv run --frozen python -m pytest -q \
            >"$GITHUB_WORKSPACE/.agent-python-red-output.txt" 2>&1
          python_status=$?
          pnpm --dir frontend run test \
            >"$GITHUB_WORKSPACE/.agent-frontend-red-output.txt" 2>&1
          frontend_status=$?
          set -e

          if [ "$python_status" -gt 1 ] || [ "$frontend_status" -gt 1 ]; then
            cat .agent-python-red-output.txt
            cat .agent-frontend-red-output.txt
            echo "::error::A test runner failed for an infrastructure reason instead of a genuine assertion failure."
            exit 1
          fi
          if [ "$python_status" -eq 0 ] && [ "$frontend_status" -eq 0 ]; then
            echo "::error::The red phase did not produce a failing regression."
            exit 1
          fi
          if [ "$python_status" -eq 1 ] && ! grep -Eq "FAILED|failed" .agent-python-red-output.txt; then
            cat .agent-python-red-output.txt
            echo "::error::Python red output did not contain a failed test."
            exit 1
          fi
          if [ "$frontend_status" -eq 1 ] && ! grep -Eq "FAIL|failed" .agent-frontend-red-output.txt; then
            cat .agent-frontend-red-output.txt
            echo "::error::Frontend red output did not contain a failed test."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests backend/tests frontend/src docs/superpowers/specs
          git -c core.hooksPath=/dev/null commit \
            -m "test(red): define the next DB-grounded product gap"
          echo "AUTOMATION_RED_SHA=$(git rev-parse HEAD)" >>"$GITHUB_ENV"

      - name: Configure implementation permissions
        if: steps.gate.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          cat >"$GITHUB_WORKSPACE/opencode.json" <<'CONFIG'
          {
            "$schema": "https://opencode.ai/config.json",
            "enabled_providers": ["nvidia"],
            "model": "nvidia/nvidia/llama-3.3-nemotron-super-49b-v1.5",
            "lsp": false,
            "permission": {
              "read": {
                "*": "allow",
                ".git/**": "deny",
                "opencode.json": "deny",
                ".env": "deny",
                ".env.*": "deny",
                ".agent-python-red-output.txt": "allow",
                ".agent-frontend-red-output.txt": "allow"
              },
              "edit": {
                "*": "allow",
                ".github/**": "deny",
                ".git/**": "deny",
                "AGENTS.md": "deny",
                "CLAUDE.md": "deny",
                "CODEOWNERS": "deny",
                "SECURITY.md": "deny",
                ".env": "deny",
                ".env.*": "deny",
                "opencode.json": "deny",
                ".agent-python-red-output.txt": "deny",
                ".agent-frontend-red-output.txt": "deny"
              },
              "bash": "deny",
              "webfetch": "deny",
              "websearch": "deny",
              "external_directory": "deny",
              "task": "deny",
              "skill": "deny",
              "question": "deny",
              "lsp": "deny",
              "doom_loop": "deny"
            }
          }
          CONFIG

      - name: Implement the bounded vertical slice
        if: steps.gate.outputs.eligible == 'true'
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
        run: |
          set -euo pipefail
          prompt="$(cat <<'PROMPT'
          Implement the single approved design supplement and failing regression
          already present in the LineageWeave workspace. Read
          .agent-python-red-output.txt and .agent-frontend-red-output.txt for the
          exact red evidence. Do not inspect GitHub issues, pull requests,
          external pages, environment variables, credentials, or paths outside
          the repository.

          Make the smallest coherent production change that turns the red tests
          green and advances the canonical DB-grounded product UX. Preserve:
          source_post as evidence; direct post_lineage_edge versus indirect
          Knowledge Graph links; account affiliations separate from global role
          assignments; RBAC before row-level affiliation filtering; analytical
          AUTO-* corporate entities separate from access assignment; synthetic
          shipped data; standards-complete PROV-O separate from the compact
          product graph; third-normal-form persistence; two-or-more-word
          snake_case database objects; contextual-orchestrator's existing
          pluggable-client and unavailable-channel behavior; and 100% docstrings
          and owned-surface coverage for every new production module.

          For UI work, follow the canonical design spec and its Figma reference,
          preserve keyboard and screen-reader semantics, and make every
          explanation tell the user what action is available next. For DB/API
          work, add upgrade and fresh-install paths together, fail closed, and
          test real PostgreSQL behavior where applicable. Do not add unsupported
          account status, invitation, access audit, affiliation-scoped role,
          causality, lineage-change-history, or editable-ABAC claims.

          Update relevant architecture/operations documentation and create one
          CHANGELOG.d/*.md fragment. Do not change workflows, security policy,
          ownership files, or dependency sources. Write PR_MESSAGE.md with a concise PR title on the
          first line and a body describing buyer impact, data/API compatibility,
          test evidence, and exact validation commands. Do not commit, push,
          approve, merge, publish, or release; the workflow owns those steps.
          PROMPT
          )"

          status=1
          for model in $OPENCODE_MODEL_CANDIDATES; do
            echo "::group::OpenCode implementation phase — $model"
            if timeout --kill-after=30s "${OPENCODE_IMPLEMENT_TIMEOUT_SECONDS}s" \
              env -u GH_TOKEN -u GITHUB_TOKEN \
              -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
              HOME="${RUNNER_TEMP}/opencode-home-implementation" \
              opencode run "$prompt" --model "$model"; then
              status=0
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            echo "::warning::Model $model failed during implementation; restoring the verified red state."
            git reset --hard "$AUTOMATION_RED_SHA"
            git clean -fd
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::Every NVIDIA model failed during implementation."
            exit 1
          fi

      - name: Enforce the autonomous implementation boundary
        if: steps.gate.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          pr_message_backup="${RUNNER_TEMP}/agent-pr-message.md"
          if [ -f PR_MESSAGE.md ]; then
            cp PR_MESSAGE.md "$pr_message_backup"
          fi
          rm -f opencode.json .agent-python-red-output.txt .agent-frontend-red-output.txt
          git clean -fdX -e frontend/node_modules/
          if [ -f "$pr_message_backup" ]; then
            cp "$pr_message_backup" PR_MESSAGE.md
          fi

          python - <<'PY'
          from __future__ import annotations

          import os
          import stat
          import subprocess
          from pathlib import Path

          base_sha = os.environ["AUTOMATION_BASE_SHA"]
          max_files = int(os.environ["MAX_AUTONOMOUS_CHANGED_FILES"])
          max_file_bytes = int(os.environ["MAX_AUTONOMOUS_FILE_BYTES"])
          max_total_bytes = int(os.environ["MAX_AUTONOMOUS_TOTAL_BYTES"])

          raw = subprocess.check_output(
              ["git", "diff", "--name-status", "-z", base_sha]
          ).split(b"\0")
          changed: dict[str, str] = {}
          index = 0
          while index < len(raw):
              status_bytes = raw[index]
              index += 1
              if not status_bytes:
                  continue
              status_text = status_bytes.decode("ascii")
              if status_text.startswith(("R", "C")):
                  old_path = raw[index].decode("utf-8")
                  new_path = raw[index + 1].decode("utf-8")
                  raise SystemExit(
                      f"autonomous changes may not rename or copy files: {old_path} -> {new_path}"
                  )
              path_text = raw[index].decode("utf-8")
              index += 1
              status_code = status_text[0]
              if status_code not in {"A", "M"}:
                  raise SystemExit(
                      f"autonomous status {status_text} is forbidden: {path_text}"
                  )
              changed[path_text] = status_code

          for value in subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard", "-z"]
          ).split(b"\0"):
              if value:
                  changed[value.decode("utf-8")] = "?"

          if not changed:
              raise SystemExit("implementation produced no changes")
          if len(changed) > max_files:
              raise SystemExit(
                  f"autonomous change count {len(changed)} exceeds {max_files}"
              )

          forbidden_exact = {
              ".gitmodules",
              "AGENTS.md",
              "CLAUDE.md",
              "CODEOWNERS",
              "SECURITY.md",
          }
          forbidden_prefixes = (".github/", ".git/", "docker/keycloak/")
          allowed_exact = {
              "README.md",
              "ARCHITECTURE.md",
              "pyproject.toml",
              "uv.lock",
              "frontend/package.json",
              "frontend/pnpm-lock.yaml",
              "PR_MESSAGE.md",
          }
          allowed_prefixes = (
              "lineageweave/",
              "backend/app/",
              "backend/tests/",
              "frontend/src/",
              "migrations/",
              "tests/",
              "docs/",
              "CHANGELOG.d/",
          )
          allowed_suffixes = {
              ".css",
              ".html",
              ".json",
              ".md",
              ".py",
              ".sql",
              ".toml",
              ".ts",
              ".tsx",
              ".txt",
              ".yaml",
              ".yml",
          }

          def is_frontend_test_path(path_text: str) -> bool:
              """Return whether a frontend path is regression evidence, not product code."""
              return path_text.startswith("frontend/src/") and path_text.endswith(
                  (".test.ts", ".test.tsx")
              )

          def is_test_path(path_text: str) -> bool:
              """Return whether a path contributes regression evidence."""
              return path_text.startswith(("tests/", "backend/tests/")) or (
                  is_frontend_test_path(path_text)
              )

          def is_production_path(path_text: str) -> bool:
              """Return whether a path changes product code or database schema."""
              if path_text.startswith(("lineageweave/", "backend/app/", "migrations/")):
                  return True
              return path_text.startswith("frontend/src/") and not is_frontend_test_path(
                  path_text
              )

          total_bytes = 0
          production_changed = False
          test_changed = False
          for path_text in sorted(changed):
              path = Path(path_text)
              if path.is_absolute() or ".." in path.parts:
                  raise SystemExit(f"invalid changed path: {path_text}")
              if (
                  path_text in forbidden_exact
                  or path_text.startswith(forbidden_prefixes)
                  or path.name.startswith(".env")
              ):
                  raise SystemExit(f"protected path changed: {path_text}")
              if (
                  path_text not in allowed_exact
                  and not path_text.startswith(allowed_prefixes)
              ):
                  raise SystemExit(f"path is outside autonomous scope: {path_text}")
              if path_text != "PR_MESSAGE.md" and path.suffix not in allowed_suffixes:
                  raise SystemExit(f"unsupported path changed: {path_text}")
              if is_production_path(path_text):
                  production_changed = True
              if is_test_path(path_text):
                  test_changed = True

              info = path.lstat()
              if stat.S_ISLNK(info.st_mode) or not stat.S_ISREG(info.st_mode):
                  raise SystemExit(f"non-regular file changed: {path_text}")
              if info.st_size > max_file_bytes:
                  raise SystemExit(f"{path_text} exceeds the per-file byte budget")
              data = path.read_bytes()
              if b"\0" in data:
                  raise SystemExit(f"NUL byte found in {path_text}")
              data.decode("utf-8", errors="strict")
              total_bytes += info.st_size

          if not production_changed:
              raise SystemExit("buyer-visible increment must change production code or schema")
          if not test_changed:
              raise SystemExit("autonomous increment must include regression tests")
          if not any(path.startswith("docs/superpowers/specs/") for path in changed):
              raise SystemExit("autonomous increment must include a design supplement")
          if not any(path.startswith("CHANGELOG.d/") for path in changed):
              raise SystemExit("autonomous increment must include a changelog fragment")
          if "PR_MESSAGE.md" not in changed:
              raise SystemExit("implementation must write PR_MESSAGE.md")
          if total_bytes > max_total_bytes:
              raise SystemExit(
                  f"autonomous byte total {total_bytes} exceeds {max_total_bytes}"
              )
          PY

      - name: Validate the proposal in an isolated copy without network
        if: steps.gate.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          validation_workspace="${RUNNER_TEMP}/lineageweave-validation-${GITHUB_RUN_ID}"
          validation_home="${RUNNER_TEMP}/lineageweave-validation-home-${GITHUB_RUN_ID}"
          validation_script="${RUNNER_TEMP}/lineageweave-validation-${GITHUB_RUN_ID}.sh"
          sudo rm -rf "$validation_workspace" "$validation_home" "$validation_script"
          mkdir -p "$validation_workspace" "$validation_home"
          cp -a "$GITHUB_WORKSPACE/." "$validation_workspace/"
          rm -rf "$validation_workspace/.git"
          cat >"$validation_script" <<'VALIDATE'
          set -euo pipefail
          cd "$WORKSPACE"
          uv run --frozen python -m pytest -q
          uv run --frozen python -m compileall -q lineageweave backend tests
          pnpm --dir frontend run lint
          pnpm --dir frontend run test
          pnpm --dir frontend run build
          VALIDATE
          chmod 0555 "$validation_script"

          sandbox_uid="$(id -u nobody)"
          sandbox_gid="$(id -g nobody)"
          sudo chown -R "$sandbox_uid:$sandbox_gid" "$validation_workspace" "$validation_home"
          validation_sandbox=(
            sudo unshare --net --pid --fork --mount-proc
            setpriv
            --reuid="$sandbox_uid"
            --regid="$sandbox_gid"
            --clear-groups
            --no-new-privs
            --bounding-set=-all
            --inh-caps=-all
            --ambient-caps=-all
          )
          tool_path="$(dirname "$(command -v uv)")":"$(dirname "$(command -v pnpm)")":/usr/local/bin:/usr/bin:/bin
          validation_environment=(
            env -i
            "PATH=$tool_path"
            "HOME=$validation_home"
            "WORKSPACE=$validation_workspace"
            "UV_NO_SYNC=1"
            "UV_PROJECT_ENVIRONMENT=$UV_PROJECT_ENVIRONMENT"
            "PYTHONDONTWRITEBYTECODE=1"
            "CI=true"
            bash
            --noprofile
            --norc
            "$validation_script"
          )
          "${validation_sandbox[@]}" "${validation_environment[@]}"

      - name: Recheck queue and base before acquiring write authority
        id: mutation_preflight
        if: steps.gate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          open_pr_count="$(
            gh api "/repos/${TARGET_REPOSITORY}/pulls?state=open&per_page=1" \
              --jq 'length'
          )"
          if [ "$open_pr_count" -ne 0 ]; then
            echo "Another pull request acquired the queue before token exchange."
            echo "eligible=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          current_base_sha="$(
            gh api "/repos/${TARGET_REPOSITORY}/commits/${BASE_BRANCH}" --jq '.sha'
          )"
          if [ "$current_base_sha" != "$AUTOMATION_BASE_SHA" ]; then
            echo "The base branch moved during authoring; the stale proposal will be discarded."
            echo "eligible=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          echo "eligible=true" >>"$GITHUB_OUTPUT"

      - name: Exchange an OpenCode app token for the generated PR
        id: generated_pr_token
        if: steps.mutation_preflight.outputs.eligible == 'true'
        env:
          OIDC_AUDIENCE: opencode-github-action
          OPENCODE_API_BASE_URL: https://api.opencode.ai
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || \
            [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::OIDC request environment is unavailable."
            exit 1
          fi
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          separator="&"
          case "$request_url" in
            *\?*) ;;
            *) separator="?" ;;
          esac
          oidc_response="$(
            curl -fsS \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${request_url}${separator}audience=${OIDC_AUDIENCE}"
          )"
          oidc_token="$(jq -r '.value // empty' <<<"$oidc_response")"
          if [ -z "$oidc_token" ]; then
            echo "::error::OIDC token response was empty."
            exit 1
          fi
          token_response="$(
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              "${OPENCODE_API_BASE_URL}/exchange_github_app_token"
          )"
          app_token="$(jq -r '.token // empty' <<<"$token_response")"
          if [ -z "$app_token" ]; then
            echo "::error::OpenCode GitHub App token response was empty."
            exit 1
          fi
          echo "::add-mask::$app_token"
          echo "token=$app_token" >>"$GITHUB_OUTPUT"

      - name: Open exactly one protected pull request
        if: steps.mutation_preflight.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ steps.generated_pr_token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Generated PR app token is unavailable."
            exit 1
          fi

          open_pr_count="$(
            gh api "/repos/${TARGET_REPOSITORY}/pulls?state=open&per_page=1" \
              --jq 'length'
          )"
          if [ "$open_pr_count" -ne 0 ]; then
            echo "Another pull request acquired the queue; discarding this proposal."
            exit 0
          fi

          current_base_sha="$(
            gh api "/repos/${TARGET_REPOSITORY}/commits/${BASE_BRANCH}" --jq '.sha'
          )"
          if [ "$current_base_sha" != "$AUTOMATION_BASE_SHA" ]; then
            echo "The base branch moved during authoring; discarding this stale proposal."
            exit 0
          fi

          title="LineageWeave DB-grounded product increment"
          body_file="${RUNNER_TEMP}/pr-body.md"
          if [ -f PR_MESSAGE.md ]; then
            python - <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path

          source = Path("PR_MESSAGE.md").read_text(encoding="utf-8")
          lines = source.splitlines()
          candidate = lines[0].lstrip("#").strip() if lines else ""
          if (
              10 <= len(candidate) <= 120
              and not candidate.startswith("-")
              and all(character.isprintable() for character in candidate)
          ):
              title = candidate
          else:
              title = "LineageWeave DB-grounded product increment"
          body = "\n".join(lines[1:]).strip()
          if not body:
              body = "Autonomous NVIDIA NIM increment; see the design supplement and changelog fragment."
          if len(body.encode("utf-8")) > 20_000:
              raise SystemExit("PR body exceeds 20,000 UTF-8 bytes")
          Path(os.environ["RUNNER_TEMP"], "pr-title.txt").write_text(
              title,
              encoding="utf-8",
          )
          Path(os.environ["RUNNER_TEMP"], "pr-body.md").write_text(
              body + "\n",
              encoding="utf-8",
          )
          PY
            title="$(cat "${RUNNER_TEMP}/pr-title.txt")"
            rm -f PR_MESSAGE.md
          else
            echo "Autonomous NVIDIA NIM increment; see the design supplement and changelog fragment." \
              >"$body_file"
          fi

          git reset --soft "$AUTOMATION_BASE_SHA"
          branch="nim-agent/db-grounded-product-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git -c core.hooksPath=/dev/null commit -m "$title"
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPOSITORY}.git" \
            "HEAD:refs/heads/${branch}"
          gh pr create \
            --repo "$TARGET_REPOSITORY" \
            --base "$BASE_BRANCH" \
            --head "$branch" \
            --title "$title" \
            --body-file "$body_file"
