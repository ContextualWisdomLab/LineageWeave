name: Implement Global Ask multimodal response once

on:
  push:
    branches:
      - feat/analysis-run-name-evidence-lineage
    paths:
      - .github/workflows/global-ask-multimodal-one-shot.yml

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact buyer branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: feat/analysis-run-name-evidence-lineage
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Select pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Apply RED tests and GREEN implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement anchor, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          Path("backend/app/global_ask_media.py").write_text('''"""Bounded image blocks for evidence-grounded Global Ask responses.

Images are reconstructed only from the original body of already-authorized,
actually-cited source posts. The helper never searches another post, never
calls a provider, and never treats an uncited image as answer evidence.
"""

from __future__ import annotations

import base64
from dataclasses import dataclass
from typing import Any, Literal, Sequence

from lineageweave.chunking import chunk_by_dom

MAX_GLOBAL_ASK_IMAGE_COUNT = 3
MAX_GLOBAL_ASK_IMAGE_BYTES = 2 * 1024 * 1024
MAX_GLOBAL_ASK_TOTAL_IMAGE_BYTES = 4 * 1024 * 1024
_ALLOWED_IMAGE_MIME_TYPES = frozenset(
    {"image/png", "image/jpeg", "image/webp", "image/gif"}
)


@dataclass(frozen=True)
class GlobalAskContentBlock:
    """One text or inline-image block rendered by REST and MCP clients."""

    type: Literal["text", "image"]
    text: str | None = None
    post_id: str | None = None
    unit_index: int | None = None
    mime_type: str | None = None
    data_base64: str | None = None
    alt_text: str | None = None
    caption: str | None = None


async def load_global_ask_content_blocks(
    conn: Any,
    answer_text: str,
    cited_post_ids: Sequence[str],
) -> tuple[GlobalAskContentBlock, ...]:
    """Return text first, then at most three bounded images from cited posts."""
    blocks: list[GlobalAskContentBlock] = [
        GlobalAskContentBlock(type="text", text=answer_text)
    ]
    ordered_post_ids = list(dict.fromkeys(cited_post_ids))
    if not ordered_post_ids:
        return tuple(blocks)

    rows = await conn.fetch(
        """
        select post_id, post_title, post_body
          from source_post
         where post_id = any($1::uuid[])
         order by array_position($1::uuid[], post_id)
        """,
        ordered_post_ids,
    )
    total_bytes = 0
    image_count = 0
    for row in rows:
        post_id = str(row["post_id"])
        post_title = str(row["post_title"] or "Source post")
        body = str(row["post_body"] or "")
        for chunk in chunk_by_dom(body):
            if chunk.unit_type != "image" or chunk.image_data is None:
                continue
            mime_type = chunk.label.casefold()
            if mime_type not in _ALLOWED_IMAGE_MIME_TYPES:
                continue
            byte_length = len(chunk.image_data)
            if byte_length == 0 or byte_length > MAX_GLOBAL_ASK_IMAGE_BYTES:
                continue
            if total_bytes + byte_length > MAX_GLOBAL_ASK_TOTAL_IMAGE_BYTES:
                return tuple(blocks)
            blocks.append(
                GlobalAskContentBlock(
                    type="image",
                    post_id=post_id,
                    unit_index=chunk.index,
                    mime_type=mime_type,
                    data_base64=base64.b64encode(chunk.image_data).decode("ascii"),
                    alt_text=f"{post_title} — source image {chunk.index + 1}",
                    caption=post_title,
                )
            )
            total_bytes += byte_length
            image_count += 1
            if image_count == MAX_GLOBAL_ASK_IMAGE_COUNT:
                return tuple(blocks)
    return tuple(blocks)
''', encoding="utf-8")

          Path("tests/test_global_ask_media.py").write_text('''"""Unit regressions for cited Global Ask image blocks."""

from __future__ import annotations

import base64

import pytest

from backend.app.global_ask_media import load_global_ask_content_blocks


class _Connection:
    def __init__(self, rows):
        self.rows = rows
        self.requested_ids = None

    async def fetch(self, _sql: str, post_ids: list[str]):
        self.requested_ids = post_ids
        return self.rows


@pytest.mark.asyncio
async def test_loads_text_and_only_cited_inline_raster_images() -> None:
    connection = _Connection(
        [
            {
                "post_id": "11111111-1111-1111-1111-111111111111",
                "post_title": "Project history screen",
                "post_body": (
                    '<p>timeline</p><img src="data:image/png;base64,'
                    + base64.b64encode(b"png-bytes").decode("ascii")
                    + '">'
                ),
            }
        ]
    )

    blocks = await load_global_ask_content_blocks(
        connection,
        "Here is the project timeline.",
        ["11111111-1111-1111-1111-111111111111"],
    )

    assert connection.requested_ids == ["11111111-1111-1111-1111-111111111111"]
    assert [block.type for block in blocks] == ["text", "image"]
    assert blocks[0].text == "Here is the project timeline."
    assert blocks[1].mime_type == "image/png"
    assert base64.b64decode(blocks[1].data_base64 or "") == b"png-bytes"
    assert blocks[1].post_id == "11111111-1111-1111-1111-111111111111"


@pytest.mark.asyncio
async def test_skips_active_svg_and_bounds_image_count() -> None:
    png = base64.b64encode(b"png").decode("ascii")
    svg = base64.b64encode(b"<svg/>").decode("ascii")
    body = '<img src="data:image/svg+xml;base64,' + svg + '">'
    body += "".join(f'<img src="data:image/png;base64,{png}">' for _ in range(5))
    connection = _Connection(
        [
            {
                "post_id": "22222222-2222-2222-2222-222222222222",
                "post_title": "Bounded images",
                "post_body": body,
            }
        ]
    )

    blocks = await load_global_ask_content_blocks(
        connection,
        "Show the images.",
        ["22222222-2222-2222-2222-222222222222"],
    )

    assert [block.type for block in blocks] == ["text", "image", "image", "image"]
    assert all(block.mime_type == "image/png" for block in blocks[1:])


@pytest.mark.asyncio
async def test_no_citations_returns_text_without_querying_posts() -> None:
    connection = _Connection([])
    blocks = await load_global_ask_content_blocks(connection, "No cited image.", [])
    assert blocks[0].text == "No cited image."
    assert len(blocks) == 1
    assert connection.requested_ids is None
''', encoding="utf-8")

