from __future__ import annotations

import base64

import pytest

from backend.app import main
from backend.app.auth import CurrentAccount
from lineageweave.post_chat import ChatAnswer, ChatSourceDocument


class _Acquire:
    def __init__(self, connection):
        self.connection = connection

    async def __aenter__(self):
        return self.connection

    async def __aexit__(self, *_args):
        return False


class _Pool:
    def __init__(self, connection):
        self.connection = connection

    def acquire(self):
        return _Acquire(self.connection)


class _Connection:
    async def fetch(self, _sql: str, _post_ids: list[str]):
        return [
            {
                "post_id": "11111111-1111-1111-1111-111111111111",
                "post_title": "Project history screen",
                "post_body": (
                    '<img src="data:image/png;base64,'
                    + base64.b64encode(b"project-screen").decode("ascii")
                    + '">'
                ),
            }
        ]


class _ChatClient:
    available = True

    def answer(self, _question: str, _sources: list[ChatSourceDocument]) -> ChatAnswer:
        return ChatAnswer(
            "The project timeline screen connects award through rebid.",
            ("11111111-1111-1111-1111-111111111111",),
        )


@pytest.mark.asyncio
async def test_global_ask_rest_response_contains_renderable_cited_image(
    monkeypatch: pytest.MonkeyPatch,
) -> None:
    async def gather(*_args, **_kwargs):
        return [
            ChatSourceDocument(
                "11111111-1111-1111-1111-111111111111",
                "Project history screen",
                "Timeline evidence",
            )
        ]

    monkeypatch.setattr(main, "_post_chat_client", lambda: _ChatClient())
    monkeypatch.setattr(main, "gather_global_chat_sources", gather)
    account = CurrentAccount(
        user_account_id="account-1",
        external_subject_id="subject-1",
        display_name="Analyst",
        corporate_entity_ids=frozenset(),
        permission_codes=frozenset({"post_read"}),
        preferred_locale="en",
    )

    response = await main.ask_agent(
        main.GlobalAskRequest(question="Show the project history screen."),
        account,
        _Pool(_Connection()),
    )

    assert response["answer_text"].startswith("The project timeline")
    assert [block["type"] for block in response["content_blocks"]] == ["text", "image"]
    assert response["content_blocks"][1]["mime_type"] == "image/png"
    assert base64.b64decode(response["content_blocks"][1]["data_base64"]) == b"project-screen"
