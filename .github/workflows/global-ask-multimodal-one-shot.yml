          Path("frontend/src/components/AskAgentContent.tsx").write_text('''import type { AskAgentContentBlock } from "../api";

const SAFE_IMAGE_MIME_TYPES = new Set([
  "image/png",
  "image/jpeg",
  "image/webp",
  "image/gif",
]);

export function AskAgentContent({
  blocks,
  fallbackText,
}: {
  blocks?: AskAgentContentBlock[];
  fallbackText?: string;
}) {
  const renderedBlocks: AskAgentContentBlock[] =
    blocks && blocks.length > 0
      ? blocks
      : fallbackText
        ? [{ type: "text", text: fallbackText }]
        : [];

  if (renderedBlocks.length === 0) return null;

  return (
    <div className="ask-agent-content">
      {renderedBlocks.map((block, index) => {
        if (block.type === "text") {
          return block.text ? <p key={`text:${index}`}>{block.text}</p> : null;
        }
        if (!SAFE_IMAGE_MIME_TYPES.has(block.mime_type) || !block.data_base64) {
          return null;
        }
        const altText = block.alt_text || block.caption || "Source image";
        return (
          <figure
            className="ask-agent-media"
            key={`image:${block.post_id}:${block.unit_index}`}
          >
            <img
              src={`data:${block.mime_type};base64,${block.data_base64}`}
              alt={altText}
              loading="lazy"
              decoding="async"
            />
            {block.caption ? <figcaption>{block.caption}</figcaption> : null}
          </figure>
        );
      })}
    </div>
  );
}
''', encoding="utf-8")

