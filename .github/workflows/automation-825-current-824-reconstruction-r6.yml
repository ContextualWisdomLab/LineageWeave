name: automation-825-current-824-reconstruction-r6
on:
  push:
    branches: [automation/825-current-824-reconstruction-r6-20260907-1256]
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 2
      - name: Verify exact current parent
        run: test "$(git rev-parse HEAD^)" = "499d653ed6e9206249e3f3a07518ad3fc01f14bd"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
      - name: Install frontend lock
        run: corepack enable && cd frontend && pnpm install --frozen-lockfile
      - name: Install regression and UI repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          def one(path, old, new):
              p=Path(path); text=p.read_text()
              count=text.count(old)
              if count != 1: raise SystemExit(f'{path}: anchor count {count}: {old[:80]!r}')
              p.write_text(text.replace(old,new,1))

          p=Path('frontend/src/App.test.tsx'); text=p.read_text()
          anchor='''    expect(\n      within(screen.getByLabelText("Grouping comparison")).queryByLabelText("Leftover map incomplete items"),\n    ).not.toBeInTheDocument();\n'''
          addition='''    expect(\n      within(screen.getByLabelText("Grouping comparison")).getAllByLabelText(\n        "Leftover map comparison incomplete items",\n      ),\n    ).toHaveLength(2);\n    expect(\n      within(screen.getByLabelText("Grouping comparison")).getAllByLabelText(\n        "Leftover map comparison incomplete items",\n      )[0],\n    ).toHaveTextContent("Leftover map dropped 0 incomplete criteria");\n    expect(\n      within(screen.getByLabelText("Grouping comparison")).getAllByLabelText(\n        "Leftover map comparison incomplete items",\n      )[1],\n    ).toHaveTextContent("Leftover map dropped 1 incomplete criteria");\n    expect(\n      within(screen.getByLabelText("Grouping comparison")).queryByLabelText(\n        "Leftover-map graphic incomplete items",\n      ),\n    ).not.toBeInTheDocument();\n'''
          if text.count(anchor)!=1: raise SystemExit(f'App.test anchor count {text.count(anchor)}')
          p.write_text(text.replace(anchor,anchor+addition,1))

          one('frontend/src/leftoverMapCoverage.ts',
              'export const LEFTOVER_MAP_COMPARE_INCOMPLETE_POST_LABEL = "Leftover map comparison incomplete posts";\n',
              'export const LEFTOVER_MAP_COMPARE_INCOMPLETE_POST_LABEL = "Leftover map comparison incomplete posts";\n\nexport const LEFTOVER_MAP_COMPARE_INCOMPLETE_ITEM_LABEL = "Leftover map comparison incomplete items";\n')
          one('frontend/src/leftoverMapCoverage.ts','ADR 0288 / ADR 0290 / ADR 0291).','ADR 0288 / ADR 0290 / ADR 0291 / ADR 0294).')
          one('frontend/src/App.tsx',
              '  LEFTOVER_MAP_COMPARE_INCOMPLETE_POST_LABEL,\n  LEFTOVER_MAP_LIST_COVERAGE_LABEL,',
              '  LEFTOVER_MAP_COMPARE_INCOMPLETE_POST_LABEL,\n  LEFTOVER_MAP_COMPARE_INCOMPLETE_ITEM_LABEL,\n  LEFTOVER_MAP_LIST_COVERAGE_LABEL,')
          one('frontend/src/App.tsx',
              '''            const comparisonIncompletePostCount = leftoverMapIncompletePostCount(\n              row.leftover_map_coverage,\n            );\n            return (''',
              '''            const comparisonIncompletePostCount = leftoverMapIncompletePostCount(\n              row.leftover_map_coverage,\n            );\n            const comparisonIncompleteItemCount = leftoverMapIncompleteItemCount(\n              row.leftover_map_coverage,\n            );\n            return (''')
          one('frontend/src/App.tsx',
              '''              {comparisonIncompletePostCount !== null ? (\n                <p className="post-meta" role="note" aria-label={t(LEFTOVER_MAP_COMPARE_INCOMPLETE_POST_LABEL)}>\n                  {tf(LEFTOVER_MAP_PLOT_INCOMPLETE_POST, comparisonIncompletePostCount)}\n                </p>\n              ) : null}\n              {row.leftover_pairs && row.leftover_pairs.length > 0 && (''',
              '''              {comparisonIncompletePostCount !== null ? (\n                <p className="post-meta" role="note" aria-label={t(LEFTOVER_MAP_COMPARE_INCOMPLETE_POST_LABEL)}>\n                  {tf(LEFTOVER_MAP_PLOT_INCOMPLETE_POST, comparisonIncompletePostCount)}\n                </p>\n              ) : null}\n              {comparisonIncompleteItemCount !== null ? (\n                <p className="post-meta" role="note" aria-label={t(LEFTOVER_MAP_COMPARE_INCOMPLETE_ITEM_LABEL)}>\n                  {tf(LEFTOVER_MAP_PLOT_INCOMPLETE_ITEM, comparisonIncompleteItemCount)}\n                </p>\n              ) : null}\n              {row.leftover_pairs && row.leftover_pairs.length > 0 && (''')
          PY
          git diff --check
      - name: UI GREEN
        working-directory: frontend
        run: pnpm exec vitest run src/App.test.tsx -t "shows the grouping comparison strip and switches grouping on click"
      - name: Apply i18n repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/src/i18n.ts'); text=p.read_text()
          pairs=[
          ('"Leftover map comparison incomplete posts": "잔여 지도 비교 불완전 글",','"Leftover map comparison incomplete posts": "잔여 지도 비교 불완전 글",\n    "Leftover map comparison incomplete items": "잔여 지도 비교 불완전 기준",'),
          ('"Leftover map comparison incomplete posts": "残差地图比较不完整帖文",','"Leftover map comparison incomplete posts": "残差地图比较不完整帖文",\n    "Leftover map comparison incomplete items": "残差地图比较不完整准则",'),
          ('"Leftover map comparison incomplete posts": "残差マップの比較不完全投稿",','"Leftover map comparison incomplete posts": "残差マップの比較不完全投稿",\n    "Leftover map comparison incomplete items": "残差マップの比較不完全基準",'),
          ('"Leftover map comparison incomplete posts": "Bài không đầy đủ so sánh trên bản đồ phần dư",','"Leftover map comparison incomplete posts": "Bài không đầy đủ so sánh trên bản đồ phần dư",\n    "Leftover map comparison incomplete items": "Tiêu chí không đầy đủ so sánh trên bản đồ phần dư",')]
          for old,new in pairs:
              c=text.count(old)
              if c!=1: raise SystemExit(f'i18n.ts anchor count {c}: {old}')
              text=text.replace(old,new,1)
          p.write_text(text)

          p=Path('frontend/src/i18n.test.ts'); text=p.read_text()
          old='    "Leftover map comparison incomplete posts",\n    "Leftover-map graphic item coverage",'
          if text.count(old)!=1: raise SystemExit('i18n.test required-label anchor drift')
          text=text.replace(old,'    "Leftover map comparison incomplete posts",\n    "Leftover map comparison incomplete items",\n    "Leftover-map graphic item coverage",',1)
          old='''  it.each([\n    ["ko", "잔여 지도 그림 기준 포함 범위"],'''
          if text.count(old)!=1: raise SystemExit(f'i18n.test locale anchor count {text.count(old)}')
          new='''  it.each([\n    ["ko", "잔여 지도 비교 불완전 기준"],\n    ["zh", "残差地图比较不完整准则"],\n    ["ja", "残差マップの比較不完全基準"],\n    ["vi", "Tiêu chí không đầy đủ so sánh trên bản đồ phần dư"],\n  ] as const)("formats leftover map comparison incomplete items label in %s", (locale, expected) => {\n    setLocale(locale);\n    expect(t("Leftover map comparison incomplete items")).toBe(expected);\n  });\n\n  it.each([\n    ["ko", "잔여 지도 그림 기준 포함 범위"],'''
          p.write_text(text.replace(old,new,1))
          PY
          git diff --check
      - name: i18n GREEN
        working-directory: frontend
        run: pnpm exec vitest run src/i18n.test.ts src/leftoverMapCoverage.test.ts
      - name: Apply release identity and governance repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          def one(path,old,new):
              p=Path(path); text=p.read_text(); c=text.count(old)
              if c!=1: raise SystemExit(f'{path}: anchor count {c}: {old!r}')
              p.write_text(text.replace(old,new,1))
          one('pyproject.toml','version = "2.50.0"','version = "2.51.0"')
          one('lineageweave/__init__.py','__version__ = "2.50.0"','__version__ = "2.51.0"')
          p=Path('frontend/package.json'); package=json.loads(p.read_text())
          if package['version']!='2.50.0': raise SystemExit('frontend version drift')
          package['version']='2.51.0'; p.write_text(json.dumps(package,indent=2,ensure_ascii=False)+'\n')
          entry='- Grouping comparison rows now show persisted leftover-map incomplete-item count through `leftoverMapIncompleteItemCount` (ADR 0294 / v2.51.0) only for fully caller-visible persisted groupings. Partial visibility remains omitted by the API; valid zero stays visible, and the UI never derives dropped criteria from scored-minus-used.\n\n'
          one('CHANGELOG.md','### Added\n\n','### Added\n\n'+entry)
          Path('CHANGELOG.d/2.51.0-leftover-map-compare-incomplete-item.md').write_text('''## 2.51.0 — Grouping comparison incomplete-item coverage\n\n- Show persisted leftover-map incomplete-item coverage on grouping comparison rows with a distinct accessible label (ADR 0294).\n- Preserve API authorization: partial-visibility groupings have no full-population coverage object; the client does not reconstruct or recompute psychometric coverage.\n- Persisted zero remains visible; invalid or contradictory counts are omitted.\n''')
          Path('docs/adr/0294-leftover-map-compare-incomplete-item.md').write_text('''# ADR 0294 — Grouping comparison incomplete-item coverage\n\n**Decision status:** Proposed\n\n## Problem\nThe grouping comparison strip omits the persisted incomplete-item count even though the full persisted grouping read model already carries authorization-filtered coverage.\n\n## Decision\nRender `leftoverMapIncompleteItemCount(row.leftover_map_coverage)` with the distinct accessible label `Leftover map comparison incomplete items`. Reuse the persisted-count validator. Do not derive the count from scored-minus-used, pair count, plotted criteria, or any other client-side proxy.\n\nOnly a full persisted grouping authorized by the API may carry the coverage object. Partial visibility must keep coverage absent; the frontend must not reconstruct a hidden full-population denominator or recompute psychometrics from the visible subset. Valid persisted zero remains visible. Missing, negative, non-integer, or contradictory counts fail closed.\n\nThis ADR remains Proposed while the PR is Draft. Accepted status requires current-head hosted tests, rendered keyboard/accessibility evidence, canonical eight-locale translation-ledger convergence, independent approval, and normal protected-branch merge.\n''')
          Path('tests/test_adr_0294_governance.py').write_text('''from pathlib import Path\nROOT=Path(__file__).resolve().parents[1]\ndef test_incomplete_item_comparison_uses_distinct_proposed_adr_0294() -> None:\n    assert (ROOT/'docs/adr/0293-leftover-map-compare-incomplete-post.md').exists()\n    p=ROOT/'docs/adr/0294-leftover-map-compare-incomplete-item.md'\n    assert p.exists()\n    text=p.read_text(encoding='utf-8')\n    assert text.startswith('# ADR 0294 —')\n    assert '**Decision status:** Proposed' in text\n    assert '**Decision status:** Accepted' not in text\n    assert 'full persisted grouping' in text and 'Partial visibility' in text\n''')
          blocks={
            'AGENTS.md':'ADR 0294 keeps grouping-comparison incomplete-item coverage in the LineageWeave read-model boundary: consume only authorization-filtered persisted coverage for a full grouping, omit partial visibility, and never recompute psychometrics in the client.',
            'ARCHITECTURE.md':'ADR 0294 adds persisted incomplete-item coverage to grouping comparison presentation while the API remains the full-group visibility authority; the frontend formats only an admitted persisted count.',
            'CLAUDE.md':'ADR 0294 is the Proposed grouping-comparison incomplete-item presentation contract; preserve server-side full-group visibility gating and do not infer dropped criteria in the frontend.',
            'docs/product-technical-gap-baseline.md':'### 2026-09-07 — #825 current-parent reconstruction candidate\n\nExact parent `#824@499d653ed6e9206249e3f3a07518ad3fc01f14bd` lacks the grouping-comparison incomplete-item note while carrying authorization-filtered persisted coverage. ADR 0294 / v2.51.0 adds that buyer-visible read-model presentation and regression. Candidate evidence is not protected-main/release evidence; current-head browser/a11y, canonical eight-locale ledger consumption, independent review, and normal protected merge remain outstanding.'}
          for path,block in blocks.items():
              p=Path(path); text=p.read_text()
              if block not in text: p.write_text(text.rstrip()+'\n\n'+block+'\n')
          PY
          git diff --check
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.28"
          enable-cache: false
      - name: Release identity and governance GREEN
        run: uv run --frozen python -m pytest -q tests/test_adr_0290_governance.py tests/test_adr_0291_governance.py tests/test_adr_0292_governance.py tests/test_adr_0293_governance.py tests/test_adr_0294_governance.py tests/test_package_version.py
      - name: Frontend lint build Storybook GREEN
        working-directory: frontend
        run: pnpm run lint && pnpm run build && pnpm run build-storybook
      - name: Emit workflow-free clean staging commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/automation-825-current-824-reconstruction-r6.yml
          git diff --check
          git config user.name "LineageWeave automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(reports): restore incomplete-item comparison coverage (v2.51.0)"
          test -z "$(git ls-tree -r --name-only HEAD | grep '^.github/workflows/automation-825-current-824-reconstruction-r6.yml$' || true)"
          git push origin HEAD:automation/825-current-824-reconstruction-r6-20260907-1256
          echo "CLEAN_STAGING_COMMIT=$(git rev-parse HEAD)"
          echo "CLEAN_STAGING_TREE=$(git rev-parse HEAD^{tree})"
