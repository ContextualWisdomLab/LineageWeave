name: Ask ownership-fenced liveness repair

on:
  push:
    branches:
      - automation/979-ownership-liveness-r1-20260908

permissions:
  contents: write

concurrency:
  group: ask-ownership-liveness-r1
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LINEAGEWEAVE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
      PRODUCT_BRANCH: feat/ask-ownership-fenced-liveness-20260907
      RED_HEAD: 4a33f0e12804c36c163b831d4a214eaabc33af9f
    steps:
      - name: Checkout repair authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Verify exact source authority
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$RED_HEAD" HEAD
          remote_head="$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | cut -f1)"
          test "$remote_head" = "$RED_HEAD"
          git diff --name-only "$RED_HEAD" HEAD | sort > /tmp/authority-files
          printf '%s\n' '.github/workflows/ask-liveness-repair.yml' 'scripts/_ask_liveness_repair.py' | sort > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/authority-files

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Select pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Install frozen dependency graph
        run: uv sync --frozen --extra dev --extra backend

      - name: Reproduce elapsed-deadline RED
        shell: bash
        run: |
          set +e
          uv run --frozen python -m pytest -vv tests/test_global_ask_elapsed_deadline.py > /tmp/ask-red.log 2>&1
          status=$?
          set -e
          cat /tmp/ask-red.log
          test "$status" -ne 0
          grep -F "test_live_heartbeat_operation_is_not_cancelled_by_elapsed_time" /tmp/ask-red.log
          grep -F "1 failed" /tmp/ask-red.log

      - name: Apply minimal causal repair
        run: python scripts/_ask_liveness_repair.py

      - name: Focused ownership-liveness GREEN
        run: |
          uv run --frozen python -m pytest -q tests/test_global_ask_elapsed_deadline.py tests/test_global_ask_claim_cancellation.py tests/test_global_ask_queue.py tests/test_global_ask_liveness_postgres.py backend/tests/test_config.py
          uv run --frozen ruff check backend/app/config.py backend/app/global_ask_queue.py backend/tests/test_config.py tests/test_global_ask_elapsed_deadline.py tests/test_global_ask_claim_cancellation.py tests/test_global_ask_queue.py tests/test_global_ask_liveness_postgres.py
          uv run --frozen ruff format --check backend/app/config.py backend/app/global_ask_queue.py backend/tests/test_config.py tests/test_global_ask_elapsed_deadline.py tests/test_global_ask_claim_cancellation.py tests/test_global_ask_queue.py tests/test_global_ask_liveness_postgres.py

      - name: Full PostgreSQL-backed GREEN
        run: uv run --frozen python -m pytest -q

      - name: Publish workflow-free product head non-force
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | cut -f1)" = "$RED_HEAD"
          rm .github/workflows/ask-liveness-repair.yml scripts/_ask_liveness_repair.py
          test ! -e .github/workflows/ask-liveness-repair.yml
          test ! -e scripts/_ask_liveness_repair.py
          git config user.name "LineageWeave automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(ask): use ownership-fenced liveness"
          git push origin "HEAD:refs/heads/$PRODUCT_BRANCH"
