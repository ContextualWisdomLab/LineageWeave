          cat > docs/adr/0371-global-ask-ownership-fenced-liveness.md <<EOF
          # ADR 0371 — Ownership-fenced liveness for Global Ask jobs

          **Decision status:** Proposed

          ## Problem
          Global Ask work can legitimately outlive a fixed model-execution timer. The previous worker coupled three different concerns: an optional contextual-orchestrator transport timeout, a hard 600-second LineageWeave execution deadline, and orphan recovery derived from that deadline. After claim-generation CAS settlement and heartbeat renewal were introduced, the hard execution deadline could still cancel a healthy reasoning/stream/tool operation solely because wall-clock time elapsed.

          ## Constraints
          - LineageWeave owns durable Ask task state, claim/recovery fencing, cancellation propagation, and bounded buyer-visible settlement; contextual-orchestrator owns provider/model transport policy.
          - Omitted transport timeout remains null. An explicit operator transport timeout is finite and positive but does not define worker liveness.
          - User/process cancellation, provider failure/end, administrator transport policy, lost worker ownership, and successful completion remain distinct outcomes.
          - A stale owner may never settle after recovery has advanced the claim generation.
          - Repository artifacts remain synthetic and non-identifying.

          ## Alternatives
          1. **Keep a fixed 600-second execution deadline.** Rejected: elapsed time is not evidence that a heartbeat-renewing worker or its model/tool operation is dead, and Python's timeout context cancels the current task when the deadline expires.
          2. **Delegate recovery to provider/model timeout policy.** Rejected: it duplicates contextual-orchestrator authority and cannot detect a crashed LineageWeave worker.
          3. **Use claim-generation CAS plus heartbeat freshness.** Chosen: `updated_at` is the current execution generation, renewed every recovery interval. Recovery requires three consecutive missed heartbeat intervals before a running row may return to `queued`; settlement remains compare-and-set on the retained generation.

          ## Decision
          Remove LineageWeave's elapsed execution deadline from `process_global_ask_job`. A healthy operation may continue while its claim heartbeat renews. Recovery uses heartbeat staleness, not expected model duration. The default optional orchestrator transport timeout remains null; an explicit finite positive timeout is an operator transport setting independent of the worker lease.

          The three-missed-heartbeat grace is intentionally conservative relative to the 30-second recovery/heartbeat cadence: one delayed sweep cannot steal a live generation, while a dead worker is recoverable after sustained liveness loss. Changing cadence or grace is a LineageWeave operability decision and requires the same lease tests.

          ## Failure, cancellation, and rollback
          Native `CancelledError` propagates through the owner and cancels/gathers its child operation. Provider `TimeoutError` remains a bounded unavailable failure rather than a synthetic worker-deadline result. If this lease policy causes false reclaims, rollback is to increase the missed-heartbeat grace while preserving CAS fencing; do not restore elapsed model termination. A previous owner whose generation was reclaimed remains unable to overwrite the queued/successor state.

          ## Verification and traceability
          Exact RED commit: `4a33f0e12804c36c163b831d4a214eaabc33af9f`. Purpose run `${GITHUB_RUN_ID}` first executes that test unchanged and requires the elapsed-deadline regression to fail before applying this decision. The same run then executes the focused queue/config tests, a real PostgreSQL claim/recovery/CAS regression, and the complete PostgreSQL-backed repository suite on the frozen dependency graph before it may publish the workflow-free product tree.

          Python Software Foundation. (2026). *Coroutines and tasks: Timeouts*. Python documentation. https://docs.python.org/3/library/asyncio-task.html#timeouts
          EOF

          cat > CHANGELOG.d/ask-ownership-fenced-liveness.md <<'EOF'
