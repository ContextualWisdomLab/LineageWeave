                  self.job_ids.append(fields["global_ask_job_id"])
                  return "1-0"


          def _postgres_available() -> bool:
              try:
                  connection = psycopg2.connect(_ADMIN_DSN, connect_timeout=2)
                  connection.close()
                  return True
              except psycopg2.OperationalError:
