          """PostgreSQL integration for Global Ask claim-heartbeat recovery fencing."""

          from __future__ import annotations

          import asyncio
          import os
          import uuid
          from pathlib import Path
          from urllib.parse import urlsplit, urlunsplit

          import asyncpg
          import psycopg2
          import pytest

          from backend.app import global_ask_queue

