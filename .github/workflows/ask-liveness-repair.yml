name: Ask ownership-fenced liveness repair

on:
  push:
    branches:
      - automation/979-ownership-liveness-r1-20260908

permissions:
  contents: write

concurrency:
  group: ask-ownership-liveness-r1
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LINEAGEWEAVE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
      PRODUCT_BRANCH: feat/ask-ownership-fenced-liveness-20260907
      RED_HEAD: 4a33f0e12804c36c163b831d4a214eaabc33af9f
    steps:
      - name: Checkout repair authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Verify exact source authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$RED_HEAD"
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$changed" = ".github/workflows/ask-liveness-repair.yml"
          remote_head="$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | cut -f1)"
          test "$remote_head" = "$RED_HEAD"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Select pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Install frozen dependency graph
        run: uv sync --frozen --extra dev --extra backend

      - name: Reproduce elapsed-deadline RED
        shell: bash
        run: |
          set +e
          uv run --frozen python -m pytest -vv tests/test_global_ask_elapsed_deadline.py > /tmp/ask-red.log 2>&1
          status=$?
          set -e
          cat /tmp/ask-red.log
          test "$status" -ne 0
          grep -F "test_live_heartbeat_operation_is_not_cancelled_by_elapsed_time" /tmp/ask-red.log
          grep -F "1 failed" /tmp/ask-red.log

      - name: Apply minimal causal liveness repair and decision record
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def must_replace(text: str, old: str, new: str, *, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one exact match, got {count}")
              return text.replace(old, new, 1)

          queue_path = Path("backend/app/global_ask_queue.py")
          text = queue_path.read_text()
          text = must_replace(
              text,
              "from .config import GLOBAL_ASK_JOB_DEADLINE_SECONDS\n",
              "",
              label="remove worker deadline import",
          )
          old_policy = '''_RECOVERY_INTERVAL_SECONDS = 30.0
# Hard ceiling on one job's answer computation. Without it a hung
# orchestrator round-trip kept a job `running` indefinitely (observed:
# 17+ minutes) and, before concurrent processing, stalled every job
# behind it. Shared through config so the client-timeout validation and
# this reaper can never disagree.
JOB_DEADLINE_SECONDS = GLOBAL_ASK_JOB_DEADLINE_SECONDS
# A `running` row older than this is an orphan: a live worker's deadline
# settles every job within JOB_DEADLINE_SECONDS, so one sweep interval of
# slack past that is enough — recovering sooner shortens how long a
# crashed worker's job stays invisible to a polling reader.
_ORPHAN_RUNNING_AFTER_SECONDS = JOB_DEADLINE_SECONDS + 60
# Wake-up stream cap, mirroring the post-content stream: the durable rows
# are the source of truth, so trimming old wake-ups loses nothing.
