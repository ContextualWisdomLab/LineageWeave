      - name: Verify GREEN backend, API, database, and frontend contracts
        run: |
          uv run --frozen python -m pytest -q tests/test_global_ask_public_integration.py tests/test_global_ask_retrieval.py tests/test_global_ask_semantic_indexes.py tests/test_claim_verification.py backend/tests/test_global_ask_public_verification.py tests/test_global_ask_sources.py
          uv run --frozen python -m compileall -q backend lineageweave tests
          pnpm --dir frontend exec vitest run src/globalAskVerification.test.ts src/AskAgentPanel.test.tsx src/components/GlobalAskVerificationPanel.test.tsx
          pnpm --dir frontend run lint
          pnpm --dir frontend run build
          git diff --check

      - name: Publish only the verified product changes
        shell: bash
        run: |
          rm .github/workflows/apply-global-ask-public-verification-v2200.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
