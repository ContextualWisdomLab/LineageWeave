name: Apply Global Ask public verification v2.20.0

on:
  pull_request:
    branches:
      - "feat/event-lineage-node-keeps-gnb-focus-v2170"
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: apply-global-ask-public-verification-v2200-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply and verify the direct Global Ask integration
    if: >-
      github.event.pull_request.number == 276 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact pull request branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install committed dependencies
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          uv sync --frozen --extra dev --extra backend
          corepack enable
          pnpm --dir frontend install --frozen-lockfile

      - name: Prove the production integration is RED
        shell: bash
        run: |
          set +e
          uv run --frozen python -m pytest -q tests/test_global_ask_public_integration.py backend/tests/test_global_ask_public_verification.py > /tmp/global-ask-python-red.log 2>&1
          python_status=$?
          pnpm --dir frontend exec vitest run src/globalAskVerification.test.ts src/AskAgentPanel.test.tsx > /tmp/global-ask-frontend-red.log 2>&1
          frontend_status=$?
          set -e
          cat /tmp/global-ask-python-red.log
          cat /tmp/global-ask-frontend-red.log
          test "$python_status" -ne 0
          test "$frontend_status" -ne 0
          grep -E "test_semantic_nomination_returns_only_relevant_authorized_egress_sources|test_global_ask_external_verification_is_backward_compatible_opt_in" /tmp/global-ask-python-red.log
          grep -E "globalAskVerification|AskAgentPanel public verification" /tmp/global-ask-frontend-red.log

      - name: Materialize the reviewed direct patch
        shell: bash
        env:
          EXPECTED_PATCH_SHA256: "44f2f06bff6a5397daec10720848ee9789eb96fcc89c91221cce5bc029a39355"
