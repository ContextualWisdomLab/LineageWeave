name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Full test suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LINEAGEWEAVE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Select pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Install the committed universal lock
        run: uv sync --frozen --extra dev --extra backend

      - name: Run full test suite against PostgreSQL
        run: uv run --frozen python -m pytest -q

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm run lint

      - name: Test
        working-directory: frontend
        run: pnpm run test

      - name: Build
        working-directory: frontend
        run: pnpm run build

      - name: Build Storybook
        working-directory: frontend
        run: pnpm run build-storybook

  repair_oidc_fallback:
    name: Repair OIDC return fallback with red-green evidence
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/analysis-run-name-evidence-lineage'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the exact contributor head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install the committed frontend lock
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          test "$(pnpm --version)" = "9.15.9"
          pnpm --dir frontend install --frozen-lockfile

      - name: Add the regression test first and prove RED
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path("frontend/src/App.test.tsx")
          text = test_path.read_text(encoding="utf-8")
          import_anchor = 'import { setLocale } from "./i18n";\n'
          import_replacement = import_anchor + 'import { OIDC_RETURN_URL_STORAGE_KEY } from "./oidcReturnUrl";\n'
          if import_replacement not in text:
              if import_anchor not in text:
                  raise SystemExit("refusing unknown App.test.tsx import shape")
              text = text.replace(import_anchor, import_replacement, 1)
          before_anchor = '  signoutRedirect.mockReset();\n'
          before_replacement = before_anchor + '  window.sessionStorage.clear();\n  window.localStorage.clear();\n'
          if before_replacement not in text:
              if before_anchor not in text:
                  raise SystemExit("refusing unknown App.test.tsx setup shape")
              text = text.replace(before_anchor, before_replacement, 1)
          old_test = '''  it("shows a login button that starts the real OIDC redirect", async () => {
    render(<App showLabPanels />);
    const button = screen.getByRole("button", { name: /log in/i });
    await userEvent.click(button);
    expect(signinRedirect).toHaveBeenCalledTimes(1);
    expect(signinRedirect).toHaveBeenCalledWith(
      expect.objectContaining({
        state: expect.objectContaining({ returnUrl: expect.stringMatching(/^\\//) }),
      }),
    );
  });'''
          new_test = '''  it("shows a login button that preserves the full OIDC return target", async () => {
    window.history.replaceState({}, "", "/customers?post=post-123#evidence");
    render(<App showLabPanels />);
    const button = screen.getByRole("button", { name: /log in/i });
    await userEvent.click(button);
    expect(signinRedirect).toHaveBeenCalledTimes(1);
    expect(signinRedirect).toHaveBeenCalledWith(
      expect.objectContaining({
        state: { returnUrl: "/customers?post=post-123#evidence" },
      }),
    );
    expect(window.sessionStorage.getItem(OIDC_RETURN_URL_STORAGE_KEY)).toBe(
      "/customers?post=post-123#evidence",
    );
    expect(window.localStorage.getItem(OIDC_RETURN_URL_STORAGE_KEY)).toBe(
      "/customers?post=post-123#evidence",
    );
  });'''
          if new_test not in text:
              if old_test not in text:
                  raise SystemExit("refusing unknown unauthenticated App test shape")
              text = text.replace(old_test, new_test, 1)
          test_path.write_text(text, encoding="utf-8")
          PY
          set +e
          pnpm --dir frontend run test -- App.test.tsx -t "preserves the full OIDC return target" > /tmp/oidc-red.log 2>&1
          red_status=$?
          set -e
          cat /tmp/oidc-red.log
          if [ "$red_status" -eq 0 ]; then
            echo "Regression test unexpectedly passed before the product repair" >&2
            exit 1
          fi

      - name: Apply the smallest product repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path("frontend/src/App.tsx")
          text = app_path.read_text(encoding="utf-8")
          import_anchor = '} from "./i18n";\nimport "./App.css";\n'
          import_replacement = '} from "./i18n";\nimport { rememberOidcReturnUrl, returnUrlFromLocation } from "./oidcReturnUrl";\nimport "./App.css";\n'
          if import_replacement not in text:
              if import_anchor not in text:
                  raise SystemExit("refusing unknown App.tsx import boundary")
              text = text.replace(import_anchor, import_replacement, 1)
          old_handler = '''              <button className="btn-primary" onClick={() => {
                const returnUrl = window.location.pathname + window.location.search;
                void auth.signinRedirect({ state: { returnUrl } });
              }}>'''
          new_handler = '''              <button className="btn-primary" onClick={() => {
                const returnUrl = returnUrlFromLocation();
                rememberOidcReturnUrl(returnUrl);
                void auth.signinRedirect({ state: { returnUrl } });
              }}>'''
          if new_handler not in text:
              if old_handler not in text:
                  raise SystemExit("refusing unknown App.tsx login handler shape")
              text = text.replace(old_handler, new_handler, 1)
          app_path.write_text(text, encoding="utf-8")
          Path("CHANGELOG.d/2.12.6-oidc-return-fallback.md").write_text(
              "## Fixed\n\n- Preserve the complete safe browser return target in OIDC state, session storage, and local storage so provider state loss cannot strand users after login.\n",
              encoding="utf-8",
          )
          PY

      - name: Prove GREEN and run the full frontend gate
        shell: bash
        run: |
          pnpm --dir frontend run test -- App.test.tsx -t "preserves the full OIDC return target"
          pnpm --dir frontend run lint
          pnpm --dir frontend run test
          pnpm --dir frontend run build
          pnpm --dir frontend run build-storybook

      - name: Restore workflow, remove the temporary helper, and publish
        shell: bash
        run: |
          git show HEAD^:.github/workflows/tests.yml > .github/workflows/tests.yml
          rm -f .github/workflows/repair-pr-258-oidc-fallback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve the OIDC return fallback"
          git push origin HEAD:feat/analysis-run-name-evidence-lineage
