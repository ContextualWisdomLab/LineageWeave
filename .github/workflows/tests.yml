name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Full test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned Rust toolchain
        # Same pin as backend/Dockerfile: fast-mlsirm's PyO3/maturin
        # core has no wheel, so pip install -e ".[backend]" compiles it.
        # Pin the rust-toolchain action by commit SHA so CI does not pipe
        # https://sh.rustup.rs into a shell (Strix CRITICAL on that pattern).
        # SHA is dtolnay/rust-toolchain@master as of 2026-08-05; the action
        # then installs toolchain 1.97.1. There is no rust-toolchain tag
        # named 1.97.1.
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,backend]"

      - name: Run full test suite
        run: python -m pytest -q

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          # Matches frontend/mise.toml's pin (setup-node doesn't parse mise.toml).
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm run lint

      - name: Test
        working-directory: frontend
        run: pnpm run test

      - name: Build
        working-directory: frontend
        run: pnpm run build
