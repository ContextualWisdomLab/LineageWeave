name: Tests

'on':
  push:
    branches:
      - feat/event-lineage-node-keeps-gnb-focus-v2170
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-pr-264-cutoff-context
  cancel-in-progress: false

jobs:
  repair:
    name: Repair target-specific cutoff context
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: feat/event-lineage-node-keeps-gnb-focus-v2170
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Write the RED regression
        run: python .github/scripts/fix_pr264_cutoff.py red

      - name: Prove the RED regression fails
        shell: bash
        run: |
          set +e
          pnpm --dir frontend exec vitest run src/analysisRunNavigation.test.ts > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo "The regression unexpectedly passed before the production fix." >&2
            exit 1
          fi
          grep -Eq 'analysisRunNavigation|Cannot find|Failed to resolve|ENOENT' /tmp/red.log

      - name: Apply the narrow GREEN fix
        run: python .github/scripts/fix_pr264_cutoff.py apply

      - name: Verify focused and complete frontend contracts
        working-directory: frontend
        run: |
          pnpm exec vitest run src/analysisRunNavigation.test.ts src/App.test.tsx
          pnpm run lint
          pnpm run test
          pnpm run build
          pnpm run build-storybook

      - name: Restore canonical workflows and publish the verified fix
        shell: bash
        run: |
          git show '0aaf992fab65a2e1ad6d41d5de8a7cad1825e04c:.github/workflows/tests.yml' > .github/workflows/tests.yml
          rm -f .github/workflows/fix-264-cutoff-context.yml
          rm -f .github/workflows/fix-264-ontology-semantic-path.yml
          rm -f .github/scripts/fix_pr264_cutoff.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.tsx frontend/src/App.test.tsx frontend/src/analysisRunNavigation.ts frontend/src/analysisRunNavigation.test.ts .github/workflows/tests.yml .github/workflows/fix-264-cutoff-context.yml .github/workflows/fix-264-ontology-semantic-path.yml .github/scripts/fix_pr264_cutoff.py
          git diff --cached --check
          git commit -m "fix(ui): preserve analysis-run cutoff across DAG navigation"
          git push origin HEAD:feat/event-lineage-node-keeps-gnb-focus-v2170
