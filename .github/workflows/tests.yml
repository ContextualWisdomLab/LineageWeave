name: Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read

concurrency:
  # A merged pull request can report the base ref on ``closed``. Keying PR
  # events by number lets that close run cancel an older queued synchronize
  # run for the same PR instead of consuming runners after the PR is closed.
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: Full test suite
    if: github.event_name != 'pull_request' || (github.event.action != 'closed' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LINEAGEWEAVE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Select pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Install the committed universal lock
        run: uv sync --frozen --extra dev --extra backend

      - name: Run full test suite against PostgreSQL
        run: uv run --frozen python -m pytest -q

  frontend:
    name: Frontend lint, test, build, browser acceptance
    if: github.event_name != 'pull_request' || (github.event.action != 'closed' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm run lint

      - name: Test
        working-directory: frontend
        run: pnpm run test

      - name: Build
        working-directory: frontend
        run: pnpm run build

      - name: Build Storybook
        working-directory: frontend
        run: pnpm run build-storybook

      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Start authenticated product stack
        run: |
          touch "$HOME/.env"
          docker compose --env-file "$HOME/.env" up -d --build --wait
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              http://localhost:18080/realms/master/.well-known/openid-configuration \
              >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Keycloak did not become ready" >&2
          exit 1

      - name: Seed synthetic authenticated product data
        run: |
          # The seed utility intentionally keeps psycopg2 in the dev extra. Install
          # it only in this disposable seed container, not the backend runtime image.
          docker compose --env-file "$HOME/.env" run --rm --no-deps \
            -v "$PWD/scripts:/app/scripts:ro" \
            -v "$PWD/migrations:/app/migrations:ro" \
            backend uv run --frozen --extra backend --extra dev python /app/scripts/seed_demo_data.py \
              --postgres-dsn postgresql://lineageweave:lineageweave_dev_only@postgres:5432/lineageweave \
              --keycloak-base-url http://keycloak:8080 \
              --keycloak-admin-password admin_dev_only \
              --valkey-url redis://valkey:6379/0 \
              --backend-base-url http://backend:8000

      - name: Pin signed cross-share browser fixture
        run: |
          docker compose --env-file "$HOME/.env" exec -T postgres \
            psql -X -v ON_ERROR_STOP=1 -U lineageweave -d lineageweave \
            -c "update report_leftover_pair set leftover_map_cross_share = -0.24;"

      - name: Run authenticated grouping-comparison browser acceptance
        working-directory: frontend
        run: pnpm exec playwright test grouping-comparison-cross-share.spec.ts --project=chromium

      - name: Retain Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: playwright-grouping-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/test-results
          if-no-files-found: warn
          retention-days: 7

      - name: Capture product stack logs on browser failure
        if: failure()
        run: |
          touch "$HOME/.env"
          docker compose --env-file "$HOME/.env" logs --no-color --tail=400

      - name: Tear down product stack
        if: always()
        run: |
          touch "$HOME/.env"
          docker compose --env-file "$HOME/.env" down -v --remove-orphans
