name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install locked-environment runner
        run: python -m pip install --disable-pip-version-check --no-cache-dir "uv==0.12.0"

      - name: Install the locked development environment
        run: uv sync --frozen --dev

      - name: Run the full Python contract suite
        run: uv run --frozen pytest -q

      - name: Compile shipped Python modules
        run: python -m py_compile lineageweave.py lineageweave_embeddings.py lineageweave_server.py

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"

      - name: Install frontend dependencies
        run: npm ci --prefix web

      - name: Run frontend coverage and build
        run: |
          npm run coverage --prefix web
          npm run build --prefix web
