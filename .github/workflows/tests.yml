name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair_analysis_run_dag_context:
    name: Repair target-specific cutoff context
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'feat/event-lineage-node-keeps-gnb-focus-v2170'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: feat/event-lineage-node-keeps-gnb-focus-v2170
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Add the target-specific cutoff regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/App.test.tsx")
          text = path.read_text()
          old = '''    const linkedPosts = screen.getAllByLabelText("Open post: Linked post");
              await userEvent.click(linkedPosts[linkedPosts.length - 1]);
              await waitFor(() =>
                expect(screen.getByText("The evidence panel should show exactly this text.")).toBeInTheDocument(),
              );
              expect(screen.queryByRole("status", { name: "Live body warning" })).not.toBeInTheDocument();

              await userEvent.click(screen.getByRole("button", { name: "Close" }));
          '''
          new = '''    const linkedPosts = screen.getAllByLabelText("Open post: Linked post");
              await userEvent.click(linkedPosts[linkedPosts.length - 1]);
              await waitFor(() =>
                expect(screen.getByText("The evidence panel should show exactly this text.")).toBeInTheDocument(),
              );
              expect(screen.queryByRole("status", { name: "Live body warning" })).not.toBeInTheDocument();

              const publicPosts = screen.getAllByLabelText("Open post: Public post");
              await userEvent.click(publicPosts[publicPosts.length - 1]);
              await waitFor(() => expect(screen.getByText("The full body text.")).toBeInTheDocument());
              expect(screen.getByRole("status", { name: "Live body warning" })).toHaveTextContent(
                "This is the live body, not a cutoff snapshot. Compare it with this 2026-01-12 run before you treat it as reconstructed evidence.",
              );
              expect(screen.getByRole("heading", { name: "Body this run knew" })).toBeInTheDocument();
              expect(screen.getByText("The cutoff body this run knew.")).toBeInTheDocument();

              await userEvent.click(screen.getByRole("button", { name: "Close" }));
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one regression insertion point, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Prove the regression fails before the fix
        working-directory: frontend
        run: |
          set +e
          pnpm exec vitest run src/App.test.tsx -t "warns that a cutoff-rewritten title opens the live body, not a snapshot" > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected the new regression to fail before the production fix." >&2
            exit 1
          fi
          grep -F "Live body warning" /tmp/red.log

      - name: Preserve the analysis run while walking the DAG
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/App.tsx")
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              '''type SelectPostOptions = {
            liveAfterCutoff?: boolean;
            knowledgeCutoff?: string;
            fromReportMember?: boolean;
          ''',
              '''type SelectPostOptions = {
            liveAfterCutoff?: boolean;
            knowledgeCutoff?: string;
            analysisRun?: AnalysisRun;
            fromReportMember?: boolean;
          ''',
              "SelectPostOptions",
          )
          replace_once(
              '''  return {
              liveAfterCutoff: Boolean(post?.live_after_cutoff),
              knowledgeCutoff: run.knowledge_cutoff,
            };
          ''',
              '''  return {
              liveAfterCutoff: Boolean(post?.live_after_cutoff),
              knowledgeCutoff: run.knowledge_cutoff,
              analysisRun: run,
            };
          ''',
              "analysisRunPostOpenOptions",
          )
          replace_once(
              '''  const [selectedPostId, setSelectedPostId] = useState<string | null>(null);
            const [openedAfterCutoff, setOpenedAfterCutoff] = useState(false);
            const [openedCutoffIso, setOpenedCutoffIso] = useState<string | null>(null);
          ''',
              '''  const [selectedPostId, setSelectedPostId] = useState<string | null>(null);
            const [openedAfterCutoff, setOpenedAfterCutoff] = useState(false);
            const [openedCutoffIso, setOpenedCutoffIso] = useState<string | null>(null);
            const [openedAnalysisRun, setOpenedAnalysisRun] = useState<AnalysisRun | null>(null);
          ''',
              "analysis run state",
          )
          replace_once(
              '''    setOpenedAfterCutoff(Boolean(options?.liveAfterCutoff));
              setOpenedCutoffIso(options?.knowledgeCutoff ?? null);
              setOpenedFromReportMember(Boolean(options?.fromReportMember));
          ''',
              '''    setOpenedAfterCutoff(Boolean(options?.liveAfterCutoff));
              setOpenedCutoffIso(options?.knowledgeCutoff ?? null);
              setOpenedAnalysisRun(options?.analysisRun ?? null);
              setOpenedFromReportMember(Boolean(options?.fromReportMember));
          ''',
              "selectPost analysis run state",
          )
          replace_once(
              '''    setOpenedAfterCutoff(false);
              setOpenedCutoffIso(null);
              setOpenedFromReportMember(false);
          ''',
              '''    setOpenedAfterCutoff(false);
              setOpenedCutoffIso(null);
              setOpenedAnalysisRun(null);
              setOpenedFromReportMember(false);
          ''',
              "closeSelectedPost analysis run state",
          )
          replace_once(
              '''          onSelectPost={(postId) =>
                    selectPost(postId, {
                      fromReportMember: openedFromReportMember,
                      fromWeeklyVoc: openedFromWeeklyVoc,
                      fromCalendar: openedFromCalendar,
                      fromCustomerMaster: openedFromCustomerMaster,
                      fromAskAgent: openedFromAskAgent,
                    })
                  }
          ''',
              '''          onSelectPost={(postId) =>
                    selectPost(postId, {
                      ...(openedAnalysisRun
                        ? analysisRunPostOpenOptions(openedAnalysisRun, postId)
                        : {}),
                      fromReportMember: openedFromReportMember,
                      fromWeeklyVoc: openedFromWeeklyVoc,
                      fromCalendar: openedFromCalendar,
                      fromCustomerMaster: openedFromCustomerMaster,
                      fromAskAgent: openedFromAskAgent,
                    })
                  }
          ''',
              "PostDetailPopup DAG callback",
          )

          path.write_text(text)
          PY

      - name: Verify the focused regression
        working-directory: frontend
        run: pnpm exec vitest run src/App.test.tsx -t "warns that a cutoff-rewritten title opens the live body, not a snapshot"

      - name: Run complete frontend validation
        working-directory: frontend
        run: |
          pnpm run lint
          pnpm run test
          pnpm run build
          pnpm run build-storybook

      - name: Restore canonical workflows and publish the fix
        run: |
          git show "${BASE_SHA}:.github/workflows/tests.yml" > .github/workflows/tests.yml
          rm -f .github/workflows/repair-analysis-run-dag-context.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.tsx frontend/src/App.test.tsx .github/workflows/tests.yml .github/workflows/repair-analysis-run-dag-context.yml
          git diff --cached --check
          git commit -m "fix: preserve analysis cutoff across DAG navigation"
          git push origin HEAD:feat/event-lineage-node-keeps-gnb-focus-v2170

  pytest:
    name: Full test suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LINEAGEWEAVE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Select pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Install the committed universal lock
        run: uv sync --frozen --extra dev --extra backend

      - name: Run full test suite against PostgreSQL
        run: uv run --frozen python -m pytest -q

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm run lint

      - name: Test
        working-directory: frontend
        run: pnpm run test

      - name: Build
        working-directory: frontend
        run: pnpm run build

      - name: Build Storybook
        working-directory: frontend
        run: pnpm run build-storybook
