                  + '''

## Global Ask multimodal response

Global Ask returns a text-first bounded block list. Image blocks are decoded
from the original body only after a post is both present in the caller's
ABAC-filtered source bundle and cited by the answer. The response accepts PNG,
JPEG, WebP, and GIF only; it excludes SVG/active media, caps each image at 2
MiB, caps the total at 4 MiB, and returns at most three images. The Buyer UI
renders the block list directly and retains `answer_text` as a compatibility
fallback. See `docs/doctoring/GLOBAL_ASK_MULTIMODAL_REFERENCES.md`.
''',
