name: Repair Global Ask multimodal response once

on:
  push:
    branches:
      - feat/analysis-run-name-evidence-lineage
    paths:
      - .github/workflows/global-ask-multimodal-repair.yml

permissions:
  contents: write

concurrency:
  group: global-ask-multimodal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Buyer branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: feat/analysis-run-name-evidence-lineage
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Select pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install current locked environments
        run: |
          uv sync --frozen --extra dev --extra backend
          cd frontend
          pnpm install --frozen-lockfile

      - name: Write RED regressions
        run: |
          cat > tests/test_global_ask_media.py <<'PY'
          """Unit regressions for cited Global Ask image blocks."""

          from __future__ import annotations

          import base64

          import pytest

          from backend.app.global_ask_media import load_global_ask_content_blocks


          class _Connection:
              def __init__(self, rows):
                  self.rows = rows
                  self.requested_ids = None

              async def fetch(self, _sql: str, post_ids):
                  self.requested_ids = post_ids
                  return self.rows


          @pytest.mark.asyncio
          async def test_loads_text_and_only_cited_inline_raster_images() -> None:
              connection = _Connection(
                  [
                      {
                          "post_id": "11111111-1111-1111-1111-111111111111",
                          "post_title": "Project history screen",
                          "post_body": (
                              '<p>timeline</p><img src="data:image/png;base64,'
                              + base64.b64encode(b"png-bytes").decode("ascii")
                              + '">'
                          ),
                      }
                  ]
              )

              blocks = await load_global_ask_content_blocks(
                  connection,
                  "Here is the project timeline.",
                  ["11111111-1111-1111-1111-111111111111"],
              )

              assert len(connection.requested_ids) == 1
              assert str(connection.requested_ids[0]) == "11111111-1111-1111-1111-111111111111"
              assert [block.type for block in blocks] == ["text", "image"]
              assert blocks[0].text == "Here is the project timeline."
              assert blocks[1].mime_type == "image/png"
              assert base64.b64decode(blocks[1].data_base64 or "") == b"png-bytes"
              assert blocks[1].post_id == "11111111-1111-1111-1111-111111111111"


          @pytest.mark.asyncio
          async def test_skips_active_svg_and_bounds_image_count() -> None:
              png = base64.b64encode(b"png").decode("ascii")
              svg = base64.b64encode(b"<svg/>").decode("ascii")
              body = '<img src="data:image/svg+xml;base64,' + svg + '">'
              body += "".join(f'<img src="data:image/png;base64,{png}">' for _ in range(5))
              connection = _Connection(
                  [
                      {
                          "post_id": "22222222-2222-2222-2222-222222222222",
                          "post_title": "Bounded images",
                          "post_body": body,
                      }
                  ]
              )

              blocks = await load_global_ask_content_blocks(
                  connection,
                  "Show the images.",
                  ["22222222-2222-2222-2222-222222222222"],
              )

              assert [block.type for block in blocks] == ["text", "image", "image", "image"]
              assert all(block.mime_type == "image/png" for block in blocks[1:])


          @pytest.mark.asyncio
          async def test_drops_invalid_or_uncited_post_identifiers_without_querying_them() -> None:
              connection = _Connection([])
              blocks = await load_global_ask_content_blocks(
                  connection,
                  "No cited image.",
                  ["not-a-post-id"],
              )
              assert blocks[0].text == "No cited image."
              assert len(blocks) == 1
              assert connection.requested_ids is None
          PY

          cat > tests/test_global_ask_rich_response.py <<'PY'
          """REST Global Ask contract regression for text plus cited images."""

          from __future__ import annotations

          import base64

          import pytest

          from backend.app import main
          from backend.app.auth import CurrentAccount
          from lineageweave.post_chat import ChatAnswer, ChatSourceDocument


          class _Acquire:
              def __init__(self, connection):
                  self.connection = connection

              async def __aenter__(self):
                  return self.connection

              async def __aexit__(self, *_args):
                  return False


          class _Pool:
              def __init__(self, connection):
                  self.connection = connection

              def acquire(self):
                  return _Acquire(self.connection)


          class _Connection:
              async def fetch(self, _sql: str, _post_ids):
                  return [
                      {
                          "post_id": "11111111-1111-1111-1111-111111111111",
                          "post_title": "Project history screen",
                          "post_body": (
                              '<img src="data:image/png;base64,'
                              + base64.b64encode(b"project-screen").decode("ascii")
                              + '">'
                          ),
                      }
                  ]


          class _ChatClient:
              available = True

              def answer(self, _question: str, _sources: list[ChatSourceDocument]) -> ChatAnswer:
                  return ChatAnswer(
                      "The project timeline screen connects award through rebid.",
                      ("11111111-1111-1111-1111-111111111111",),
                  )


          @pytest.mark.asyncio
          async def test_global_ask_rest_response_contains_renderable_cited_image(
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              async def gather(*_args, **_kwargs):
                  return [
                      ChatSourceDocument(
                          "11111111-1111-1111-1111-111111111111",
                          "Project history screen",
                          "Timeline evidence",
                      )
                  ]

              monkeypatch.setattr(main, "_post_chat_client", lambda: _ChatClient())
              monkeypatch.setattr(main, "gather_global_chat_sources", gather)
              account = CurrentAccount(
                  user_account_id="account-1",
                  external_subject_id="subject-1",
                  display_name="Analyst",
                  preferred_locale="en",
                  corporate_entity_ids=frozenset(),
                  permission_codes=frozenset({"post_read"}),
              )

              response = await main.ask_agent(
                  main.GlobalAskRequest(question="Show the project history screen."),
                  account,
                  _Pool(_Connection()),
              )

              assert response["answer_text"].startswith("The project timeline")
              assert [block["type"] for block in response["content_blocks"]] == ["text", "image"]
              assert response["content_blocks"][1]["mime_type"] == "image/png"
              assert base64.b64decode(response["content_blocks"][1]["data_base64"]) == b"project-screen"
          PY

