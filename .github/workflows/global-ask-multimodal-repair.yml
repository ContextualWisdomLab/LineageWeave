          replace_once("pyproject.toml", 'version = "2.12.6"\n', 'version = "2.12.7"\n')

          Path("CHANGELOG.d/2.12.7-global-ask-multimodal.md").write_text('''# 2.12.7 — Global Ask cited images

## Added

- Buyer Global Ask now returns a text-first `content_blocks` response and up
  to three inline raster images reconstructed from the original bodies of
