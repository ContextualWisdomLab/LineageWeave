The response contract keeps text and image content distinguishable, emits a
short text alternative for every rendered image, and accepts only bounded
raster `data:` payloads reconstructed from authorized cited source posts.

## References (APA 7th)

Masinter, L. (1998). *The “data” URL scheme* (RFC 2397). RFC Editor.
https://doi.org/10.17487/RFC2397

World Wide Web Consortium. (2023). *Web Content Accessibility Guidelines
(WCAG) 2.2*. https://www.w3.org/TR/WCAG22/
''', encoding="utf-8")

