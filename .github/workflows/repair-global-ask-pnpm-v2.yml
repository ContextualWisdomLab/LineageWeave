name: Repair Global Ask pnpm provisioning v2

on:
  push:
    branches:
      - "feat/global-ask-public-claim-verification-v2200"
    paths:
      - ".github/workflows/repair-global-ask-pnpm-v2.yml"

permissions:
  contents: write

concurrency:
  group: repair-global-ask-pnpm-v2200
  cancel-in-progress: true

jobs:
  repair:
    name: Pin repository pnpm and remove repair scaffolding
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: feat/global-ask-public-claim-verification-v2200
          fetch-depth: 0
          persist-credentials: true

      - name: Repair the direct integration workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-global-ask-public-verification-v2200.yml')
          if workflow.exists():
              text = workflow.read_text(encoding='utf-8')
              actor_guard = (
                  "      github.event.pull_request.head.repo.full_name == github.repository &&\n"
                  "      github.actor != 'github-actions[bot]'"
              )
              if actor_guard in text:
                  text = text.replace(
                      actor_guard,
                      "      github.event.pull_request.head.repo.full_name == github.repository",
                      1,
                  )
              install_old = (
                  "          corepack enable\n"
                  "          pnpm --dir frontend install --frozen-lockfile"
              )
              install_new = (
                  "          corepack enable\n"
                  "          corepack prepare pnpm@9.15.9 --activate\n"
                  "          test \"$(pnpm --version)\" = \"9.15.9\"\n"
                  "          pnpm --dir frontend install --frozen-lockfile"
              )
              if install_old in text:
                  text = text.replace(install_old, install_new, 1)
              if "corepack prepare pnpm@9.15.9 --activate" not in text:
                  raise SystemExit('pnpm 9.15.9 activation is absent after repair')
              if "github.actor != 'github-actions[bot]'" in text:
                  raise SystemExit('bot actor guard is still present after repair')
              workflow.write_text(text, encoding='utf-8')

          for path in (
              Path('.github/workflows/repair-global-ask-pnpm.yml'),
              Path('.github/workflows/repair-global-ask-pnpm-v2.yml'),
          ):
              path.unlink(missing_ok=True)
          PY

      - name: Publish only the workflow repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: pin Global Ask pnpm provisioning"
          git push origin HEAD:feat/global-ask-public-claim-verification-v2200
