name: automation-999-i18n-fixture-repair

on:
  push:
    branches:
      - automation/851-vietnamese-lock-repair-20260911

permissions:
  contents: write

concurrency:
  group: automation-999-i18n-fixture-repair
  cancel-in-progress: false

jobs:
  red-green:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact staging branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify exact repaired-source parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "222e14c2a61db7224b1b575f23cde2c0d648bfa1"

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          cd frontend
          pnpm install --frozen-lockfile

      - name: Reproduce stale-fixture RED
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          set +e
          pnpm exec vitest run src/i18n.test.ts > /tmp/i18n-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/i18n-red.log
          test "$rc" -ne 0
          grep -F "3 failed" /tmp/i18n-red.log
          grep -F "tỷ phần phần dư được giải thích e" /tmp/i18n-red.log
          grep -F "tỷ phần phần dư được giải thích trên đồ họa so sánh bản đồ phần dư" /tmp/i18n-red.log
          grep -F "tỷ phần phần dư được giải thích trên bản đồ phần dư" /tmp/i18n-red.log

      - name: Align exact Vietnamese fixture expectations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/i18n.test.ts")
          text = path.read_text()
          replacements = {
              "tái dựng bản đồ phần dư R̂, phần dư giải thích e, phần dư chưa giải thích s":
                  "tái dựng bản đồ phần dư R̂, tỷ phần phần dư được giải thích e, phần dư chưa giải thích s",
              '["vi", "phần dư giải thích đồ họa so sánh bản đồ phần dư R̂²/R² 0.76"]':
                  '["vi", "tỷ phần phần dư được giải thích trên đồ họa so sánh bản đồ phần dư R̂²/R² 0.76"]',
              '["vi", "phần dư giải thích bản đồ phần dư R̂²/R² 0.76"]':
                  '["vi", "tỷ phần phần dư được giải thích trên bản đồ phần dư R̂²/R² 0.76"]',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one stale fixture, found {count}: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Verify coherent GREEN
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          pnpm run lint
          pnpm exec vitest run src/i18n.test.ts src/leftoverMapPlotVietnameseCopy.test.ts src/leftoverMapPlotLayout.test.ts src/components/LeftoverMapPlot.test.tsx

      - name: Commit workflow-free repaired tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/automation-999-i18n-fixture-repair.yml
          git status --short
          test -z "$(git status --short | grep -v -E '^( M frontend/src/i18n.test.ts| D .github/workflows/automation-999-i18n-fixture-repair.yml)$' || true)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/i18n.test.ts .github/workflows/automation-999-i18n-fixture-repair.yml
          git commit -m "test(i18n): align Vietnamese share fixtures with product copy"
          git push origin HEAD:automation/851-vietnamese-lock-repair-20260911
