name: Execute summary catalog authorization 1078

on:
  push:
    branches:
      - fix/summary-catalog-authorization-1078

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'fix(security): gate summary catalog enrichment') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/summary-catalog-authorization-1078
          fetch-depth: 0

      - name: Reproduce protected-main authorization RED
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          main = Path('backend/app/main.py').read_text()
          ingestion = Path('backend/app/post_summary_ingestion.py').read_text()
          endpoint = main.split('@app.get("/api/posts/{post_id}/summary")', 1)[1].split('\n@app.', 1)[0]
          assert 'hierarchy_inference_client=_corporate_hierarchy_inference_client(),' in endpoint
          assert 'verification_client=_relation_verification_client(),' in endpoint
          assert 'cataloged_team_id = await upsert_team(' in ingestion
          print('RED: post_read summary materialization can mutate shared catalogs')
          PY

      - name: Apply minimal fail-closed capability repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one target, found {count}')
              target.write_text(text.replace(old, new, 1))

          main_path = Path('backend/app/main.py')
          main = main_path.read_text()
          marker = '@app.get("/api/posts/{post_id}/summary")\nasync def read_post_summary('
          if main.count(marker) != 1:
              raise SystemExit('summary endpoint marker moved')
          helper = '''async def _persist_post_summary_for_account(\n    conn: asyncpg.Connection,\n    post_id: str,\n    summary: Any,\n    *,\n    post_body: str,\n    account: CurrentAccount,\n) -> dict[str, Any]:\n    """Persist post-owned summary evidence without granting catalog-write authority."""\n    allow_catalog_enrichment = account.has_permission(_POST_ADMIN)\n    hierarchy_inference_client = (\n        _corporate_hierarchy_inference_client()\n        if allow_catalog_enrichment\n        else NullCorporateHierarchyInferenceClient()\n    )\n    verification_client = (\n        _relation_verification_client()\n        if allow_catalog_enrichment\n        else NullRelationVerificationClient()\n    )\n    return await persist_post_summary(\n        conn,\n        post_id,\n        summary,\n        post_body=post_body,\n        hierarchy_inference_client=hierarchy_inference_client,\n        verification_client=verification_client,\n        allow_catalog_enrichment=allow_catalog_enrichment,\n    )\n\n\n'''
          main = main.replace(marker, helper + marker, 1)
          old_call = '''                payload = await persist_post_summary(\n                    conn,\n                    post_id,\n                    summary,\n                    post_body=normalized_body,\n                    hierarchy_inference_client=_corporate_hierarchy_inference_client(),\n                    verification_client=_relation_verification_client(),\n                )'''
          new_call = '''                payload = await _persist_post_summary_for_account(\n                    conn,\n                    post_id,\n                    summary,\n                    post_body=normalized_body,\n                    account=account,\n                )'''
          if main.count(old_call) != 1:
              raise SystemExit('summary persistence call moved')
          main_path.write_text(main.replace(old_call, new_call, 1))

          replace_once(
              'backend/app/post_summary_ingestion.py',
              '''    hierarchy_inference_client: CorporateHierarchyInferenceClient | None = None,\n    verification_client: RelationVerificationClient | None = None,\n) -> dict[str, Any]:''',
              '''    hierarchy_inference_client: CorporateHierarchyInferenceClient | None = None,\n    verification_client: RelationVerificationClient | None = None,\n    allow_catalog_enrichment: bool = False,\n) -> dict[str, Any]:''',
          )
          replace_once(
              'backend/app/post_summary_ingestion.py',
              '''    hierarchy_inference_client = (\n        hierarchy_inference_client or NullCorporateHierarchyInferenceClient()\n    )\n    verification_client = verification_client or NullRelationVerificationClient()\n''',
              '''    if allow_catalog_enrichment:\n        hierarchy_inference_client = (\n            hierarchy_inference_client or NullCorporateHierarchyInferenceClient()\n        )\n        verification_client = verification_client or NullRelationVerificationClient()\n    else:\n        hierarchy_inference_client = NullCorporateHierarchyInferenceClient()\n        verification_client = NullRelationVerificationClient()\n''',
          )
          replace_once(
              'backend/app/post_summary_ingestion.py',
              '''        await _replace_summary_projection(\n            conn,\n            post_id,\n            summary,\n            candidates,\n            resolved_organization_ids,\n        )''',
              '''        await _replace_summary_projection(\n            conn,\n            post_id,\n            summary,\n            candidates,\n            resolved_organization_ids,\n            allow_catalog_enrichment=allow_catalog_enrichment,\n        )''',
          )

          ingestion_path = Path('backend/app/post_summary_ingestion.py')
          ingestion = ingestion_path.read_text()
          old_signature = '''async def _replace_summary_projection(\n    conn: asyncpg.Connection,\n    post_id: str,\n    summary: PostSummary,\n    candidates: list[Any],\n    resolved_organization_ids: dict[int, str],\n) -> None:'''
          new_signature = '''async def _replace_summary_projection(\n    conn: asyncpg.Connection,\n    post_id: str,\n    summary: PostSummary,\n    candidates: list[Any],\n    resolved_organization_ids: dict[int, str],\n    *,\n    allow_catalog_enrichment: bool,\n) -> None:'''
          if ingestion.count(old_signature) != 1:
              raise SystemExit('summary projection signature moved')
          ingestion = ingestion.replace(old_signature, new_signature, 1)
          helper_marker = 'async def _replace_summary_projection('
          team_helper = '''async def _resolve_summary_team_id(\n    conn: asyncpg.Connection,\n    team_name: str,\n    affiliated_organization_name: str | None,\n    candidates: list[Any],\n    *,\n    allow_catalog_enrichment: bool,\n) -> str | None:\n    """Reuse an existing team for readers; only explicit enrichment may upsert."""\n    if allow_catalog_enrichment:\n        return await upsert_team(conn, team_name, affiliated_organization_name, candidates)\n    row = await conn.fetchrow(\n        "select team_id from cataloged_team "\n        "where team_name = $1 "\n        "and affiliated_organization_name is not distinct from $2",\n        team_name,\n        affiliated_organization_name,\n    )\n    return None if row is None else str(row["team_id"])\n\n\n'''
          if ingestion.count(helper_marker) != 1:
              raise SystemExit('team helper insertion marker moved')
          ingestion = ingestion.replace(helper_marker, team_helper + helper_marker, 1)
          old_team = '''        if role.actor_type_code == ACTOR_TYPE_TEAM:\n            cataloged_team_id = await upsert_team(\n                conn,\n                role.actor_name,\n                role.affiliated_organization_name,\n                candidates,\n            )'''
          new_team = '''        if role.actor_type_code == ACTOR_TYPE_TEAM:\n            cataloged_team_id = await _resolve_summary_team_id(\n                conn,\n                role.actor_name,\n                role.affiliated_organization_name,\n                candidates,\n                allow_catalog_enrichment=allow_catalog_enrichment,\n            )'''
          if ingestion.count(old_team) != 1:
              raise SystemExit('team upsert block moved')
          ingestion_path.write_text(ingestion.replace(old_team, new_team, 1))

          backfill = Path('scripts/backfill_post_summaries.py')
          backfill_text = backfill.read_text()
          old_backfill = '''                        hierarchy_inference_client=NullCorporateHierarchyInferenceClient(),\n                        verification_client=NullRelationVerificationClient(),\n                    )'''
          new_backfill = '''                        hierarchy_inference_client=NullCorporateHierarchyInferenceClient(),\n                        verification_client=NullRelationVerificationClient(),\n                        allow_catalog_enrichment=False,\n                    )'''
          if backfill_text.count(old_backfill) != 1:
              raise SystemExit('backfill summary call moved')
          backfill.write_text(backfill_text.replace(old_backfill, new_backfill, 1))

          test_path = Path('tests/test_summary_catalog_authorization.py')
          if test_path.exists():
              raise SystemExit('authorization test already exists')
          test_path.write_text('''"""Authorization contracts for summary-driven shared-catalog enrichment."""\n\nfrom __future__ import annotations\n\nimport asyncio\nfrom types import SimpleNamespace\n\nfrom backend.app import main\nfrom backend.app.auth import CurrentAccount\nfrom backend.app import post_summary_ingestion as summary_ingestion\n\n\ndef _account(*permissions: str) -> CurrentAccount:\n    return CurrentAccount(\n        user_account_id="synthetic-account",\n        external_subject_id="synthetic-subject",\n        display_name="Synthetic Reader",\n        preferred_locale="ko",\n        corporate_entity_ids=frozenset({"synthetic-corp"}),\n        process_unit_ids=frozenset({"synthetic-pu"}),\n        permission_codes=frozenset(permissions),\n    )\n\n\ndef test_reader_never_constructs_shared_catalog_clients(monkeypatch) -> None:\n    captured: dict[str, object] = {}\n    async def fake_persist(*_args, **kwargs):\n        captured.update(kwargs)\n        return {"post_id": "synthetic-post"}\n    def forbidden():\n        raise AssertionError("post_read must not construct mutation-capable clients")\n    monkeypatch.setattr(main, "persist_post_summary", fake_persist)\n    monkeypatch.setattr(main, "_corporate_hierarchy_inference_client", forbidden)\n    monkeypatch.setattr(main, "_relation_verification_client", forbidden)\n    asyncio.run(main._persist_post_summary_for_account(\n        object(), "synthetic-post", object(), post_body="evidence", account=_account("post_read")\n    ))\n    assert captured["allow_catalog_enrichment"] is False\n    assert captured["hierarchy_inference_client"].available is False\n    assert captured["verification_client"].available is False\n\n\ndef test_admin_retains_explicit_enrichment_capability(monkeypatch) -> None:\n    captured: dict[str, object] = {}\n    hierarchy = SimpleNamespace(available=True)\n    verification = SimpleNamespace(available=True)\n    async def fake_persist(*_args, **kwargs):\n        captured.update(kwargs)\n        return {"post_id": "synthetic-post"}\n    monkeypatch.setattr(main, "persist_post_summary", fake_persist)\n    monkeypatch.setattr(main, "_corporate_hierarchy_inference_client", lambda: hierarchy)\n    monkeypatch.setattr(main, "_relation_verification_client", lambda: verification)\n    asyncio.run(main._persist_post_summary_for_account(\n        object(), "synthetic-post", object(), post_body="evidence", account=_account("post_read", "post_admin")\n    ))\n    assert captured["allow_catalog_enrichment"] is True\n    assert captured["hierarchy_inference_client"] is hierarchy\n    assert captured["verification_client"] is verification\n\n\ndef test_reader_team_resolution_is_lookup_only(monkeypatch) -> None:\n    class Connection:\n        async def fetchrow(self, query, *args):\n            assert query.startswith("select team_id from cataloged_team")\n            assert args == ("Synthetic Team", "Synthetic Org")\n            return {"team_id": "known-team"}\n    async def forbidden_upsert(*_args, **_kwargs):\n        raise AssertionError("post_read must not upsert cataloged_team")\n    monkeypatch.setattr(summary_ingestion, "upsert_team", forbidden_upsert)\n    team_id = asyncio.run(summary_ingestion._resolve_summary_team_id(\n        Connection(), "Synthetic Team", "Synthetic Org", [], allow_catalog_enrichment=False\n    ))\n    assert team_id == "known-team"\n\n\ndef test_admin_team_resolution_may_upsert(monkeypatch) -> None:\n    async def fake_upsert(_conn, team_name, affiliation, candidates):\n        assert (team_name, affiliation, candidates) == ("Synthetic Team", "Synthetic Org", [])\n        return "created-team"\n    monkeypatch.setattr(summary_ingestion, "upsert_team", fake_upsert)\n    team_id = asyncio.run(summary_ingestion._resolve_summary_team_id(\n        object(), "Synthetic Team", "Synthetic Org", [], allow_catalog_enrichment=True\n    ))\n    assert team_id == "created-team"\n''')

          adr = Path('docs/adr/0375-summary-read-catalog-authorization.md')
          if adr.exists():
              raise SystemExit('ADR 0375 collision')
          adr.write_text('''# ADR 0375 — Summary reads cannot grant shared-catalog write authority\n\n**Decision status:** Proposed\n**Date:** 2026-09-14\n\n## Problem\n\nA visible summary is readable under `post_read`, but the missing-summary materialization path also admitted hierarchy/relation clients and team upserts that can mutate shared `corporate_entity` and `cataloged_team` state. Strix exact-head run `34746057545` exposed the corporate path as CWE-862; code review found the same authority leak through team upsert.\n\n## Decision\n\nThe application boundary derives an explicit catalog-enrichment capability from `post_admin`. Without it, summary persistence forcibly substitutes Null hierarchy/relation clients and resolves teams with a parameterized read-only lookup. `allow_catalog_enrichment` defaults to `False`, so omitted capability never grants catalog writes. The operator backfill declares `False` explicitly because it already uses Null clients. `post_admin` keeps the existing verified enrichment behavior. Summary projection persistence itself remains available to `post_read`.\n\n## Alternatives rejected\n\nRequiring `post_admin` for the entire GET would break the read contract. Disabling summary persistence would remove useful idempotent materialization without fixing authority. A reader-local duplicate catalog would split canonical identity truth. Null clients alone are insufficient because the team upsert path would still mutate shared state.\n\n## Evidence and follow-up\n\nProtected `main@83eba56149eb802cd63642c507c324c9976ec78e` is the RED baseline. Focused domain tests cover reader/admin client admission and team lookup/upsert. The authenticated PostgreSQL + Keycloak + Valkey API regression remains required before acceptance, and Strix must be rerun on the repaired exact source head. #1077 remains a separate connection-lease/performance invariant.\n''')

          architecture = Path('ARCHITECTURE.md')
          text = architecture.read_text()
          heading = '## Summary shared-catalog authorization boundary (ADR 0375)'
          if heading not in text:
              architecture.write_text(text.rstrip() + '''\n\n## Summary shared-catalog authorization boundary (ADR 0375)\n\nSummary evidence is post-owned and readable under `post_read`; shared identity catalogs are not. The summary application service converts `post_admin` into an explicit enrichment capability. Reader materialization may bind known identities but cannot create corporate hierarchy state, admit mutation-capable hierarchy/relation clients, or upsert `cataloged_team`.\n''')

          changelog = Path('CHANGELOG.d/2.28.1-summary-catalog-authorization.md')
          if changelog.exists():
              raise SystemExit('changelog collision')
          changelog.write_text('''### Security\n\n- Prevent `post_read` summary materialization from mutating shared corporate/team catalogs; only explicit `post_admin` enrichment may create or update shared identity state (ADR 0375, #1078).\n''')
          PY

      - name: Verify focused source contract
        shell: bash
        run: |
          python -m compileall -q backend/app/main.py backend/app/post_summary_ingestion.py scripts/backfill_post_summaries.py tests/test_summary_catalog_authorization.py
          python - <<'PY'
          from pathlib import Path
          main = Path('backend/app/main.py').read_text()
          ingestion = Path('backend/app/post_summary_ingestion.py').read_text()
          tests = Path('tests/test_summary_catalog_authorization.py').read_text()
          endpoint = main.split('@app.get("/api/posts/{post_id}/summary")', 1)[1].split('\n@app.', 1)[0]
          assert '_persist_post_summary_for_account(' in endpoint
          assert 'hierarchy_inference_client=_corporate_hierarchy_inference_client(),' not in endpoint
          assert 'verification_client=_relation_verification_client(),' not in endpoint
          assert 'allow_catalog_enrichment: bool = False' in ingestion
          assert '_resolve_summary_team_id(' in ingestion
          assert 'allow_catalog_enrichment=False' in tests
          print('GREEN: low-privilege summary path is fail-closed for shared-catalog mutation')
          PY
          git diff --check

      - name: Commit causal repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/main.py backend/app/post_summary_ingestion.py scripts/backfill_post_summaries.py tests/test_summary_catalog_authorization.py docs/adr/0375-summary-read-catalog-authorization.md ARCHITECTURE.md CHANGELOG.d/2.28.1-summary-catalog-authorization.md
          git commit -m 'fix(security): gate summary catalog enrichment (#1078)'
          git push origin HEAD:fix/summary-catalog-authorization-1078
