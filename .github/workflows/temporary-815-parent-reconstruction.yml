name: Temporary 815 parent reconstruction

on:
  push:
    branches:
      - "automation/815-parent-reconstruction-20260906"

permissions:
  contents: write

concurrency:
  group: temporary-815-parent-reconstruction
  cancel-in-progress: true

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact reconstruction branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: automation/815-parent-reconstruction-20260906
          fetch-depth: 0

      - name: Verify exact current parent and child
        shell: bash
        run: |
          set -euo pipefail
          parent=7f96f013d6de50a80120a74b06e72bc4fc8c338d
          product=dd26eaf2169408af41e226164247949a29c69b6e
          git fetch origin feat/leftover-map-plot-incomplete-v2400 feat/leftover-map-plot-incomplete-item-v2410
          test "$(git rev-parse origin/feat/leftover-map-plot-incomplete-v2400)" = "$parent"
          test "$(git rev-parse origin/feat/leftover-map-plot-incomplete-item-v2410)" = "$product"
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git diff --name-only "$parent"..HEAD)" = ".github/workflows/temporary-815-parent-reconstruction.yml"

      - name: Reapply only the v2.41 product delta
        shell: bash
        run: |
          set -euo pipefail
          feature=63092ded55a7c7d65b0f6586980b20d0d30f587d
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git cherry-pick --no-commit -X theirs "$feature"
          git show 2570e99e9cd3f39eae063015031b21a9c4af4c2f:tests/test_package_version.py > tests/test_package_version.py
          git show dd26eaf2169408af41e226164247949a29c69b6e:tests/test_adr_0284_governance.py > tests/test_adr_0284_governance.py

      - name: Reconcile inherited authority and draft governance
        shell: python
        run: |
          import json
          import re
          import tomllib
          from pathlib import Path

          adr = Path("docs/adr/0284-leftover-map-plot-incomplete-item.md")
          text = adr.read_text(encoding="utf-8")
          old = "**Decision status:** Accepted"
          if text.count(old) != 1:
              raise SystemExit(f"expected one ADR0284 Accepted marker, found {text.count(old)}")
          adr.write_text(text.replace(old, "**Decision status:** Proposed", 1), encoding="utf-8")

          init_path = Path("lineageweave/__init__.py")
          init_text = init_path.read_text(encoding="utf-8")
          init_text, count = re.subn(r'^__version__ = "[^"]+"$', '__version__ = "2.41.0"', init_text, count=1, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit("runtime version declaration missing")
          init_path.write_text(init_text, encoding="utf-8")

          i18n = Path("frontend/src/i18n.ts")
          text = i18n.read_text(encoding="utf-8")
          replacements = {
              '"leftover-map explained leftover share {label}": "phần dư giải thích bản đồ phần dư {label}"':
                  '"leftover-map explained leftover share {label}": "tỷ phần phần dư được giải thích trên bản đồ phần dư {label}"',
              "Đoạn cặp ghi khoảng cách bản đồ phần dư d, tái dựng bản đồ phần dư R̂, phần dư giải thích e,":
                  "Đoạn cặp ghi khoảng cách bản đồ phần dư d, tái dựng bản đồ phần dư R̂, tỷ phần phần dư được giải thích e,",
          }
          for stale, current in replacements.items():
              text = text.replace(stale, current)
          i18n.write_text(text, encoding="utf-8")

          i18n_test = Path("frontend/src/i18n.test.ts")
          text = i18n_test.read_text(encoding="utf-8")
          text = text.replace(
              "Đoạn cặp ghi khoảng cách bản đồ phần dư d, tái dựng bản đồ phần dư R̂, phần dư giải thích e,",
              "Đoạn cặp ghi khoảng cách bản đồ phần dư d, tái dựng bản đồ phần dư R̂, tỷ phần phần dư được giải thích e,",
          )
          text = text.replace(
              '"phần dư giải thích bản đồ phần dư R̂²/R² 0.76"',
              '"tỷ phần phần dư được giải thích trên bản đồ phần dư R̂²/R² 0.76"',
          )
          i18n_test.write_text(text, encoding="utf-8")

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          frontend = json.loads(Path("frontend/package.json").read_text(encoding="utf-8"))
          runtime = re.search(r'^__version__ = "([^"]+)"$', init_text, re.MULTILINE)
          versions = (project["project"]["version"], frontend["version"], runtime.group(1) if runtime else None)
          if versions != ("2.41.0", "2.41.0", "2.41.0"):
              raise SystemExit(f"release identity drift after reconstruction: {versions!r}")

      - name: Verify inherited parent contracts remain present
        shell: python
        run: |
          from pathlib import Path
          i18n = Path("frontend/src/i18n.ts").read_text(encoding="utf-8")
          assert "tỷ phần phần dư được giải thích trên bản đồ phần dư {label}" in i18n
          assert "tỷ phần phần dư được giải thích e" in i18n
          assert "phần dư giải thích bản đồ phần dư {label}" not in i18n
          vi_test = Path("frontend/src/leftoverMapPlotVietnameseCopy.test.ts").read_text(encoding="utf-8")
          assert 'import { LEFTOVER_MAP_PLOT_CAPTION } from "./leftoverMapPlotLayout";' in vi_test
          assert "GRAPHIC_DISPLAY_COPY" not in vi_test
          adr = Path("docs/adr/0284-leftover-map-plot-incomplete-item.md").read_text(encoding="utf-8")
          assert "**Decision status:** Proposed" in adr
          assert "**Decision status:** Accepted" not in adr

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Install locked dev dependencies
        run: uv sync --frozen --extra dev

      - name: Verify Python governance and release identity
        run: uv run --frozen python -m pytest -q tests/test_adr_0284_governance.py tests/test_package_version.py

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Verify v2.41 and inherited frontend contracts
        working-directory: frontend
        run: >-
          pnpm exec vitest run
          src/App.test.tsx
          src/i18n.test.ts
          src/leftoverMapCoverage.test.ts
          src/leftoverMapPlotLayout.test.ts
          src/leftoverMapPlotSmallCanvas.test.ts
          src/leftoverMapPlotVietnameseCopy.test.ts
          src/components/LeftoverMapPlot.test.tsx
          src/components/LeftoverPairList.test.tsx

      - name: Verify frontend lint
        working-directory: frontend
        run: pnpm exec oxlint

      - name: Commit clean reconstructed tree
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/temporary-815-parent-reconstruction.yml
          git diff --check
          rm "$workflow"
          git add -A
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/' | grep -v '^\.github/workflows/temporary-815-parent-reconstruction\.yml$' || true)"
          test "$(git diff --cached --name-status -- "$workflow")" = $'D\t.github/workflows/temporary-815-parent-reconstruction.yml'
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m "merge: reconstruct #815 on current #814 parent"
          git push origin HEAD:automation/815-parent-reconstruction-20260906
