name: Apply Ask Agent evidence workspace

on:
  push:
    branches:
      - feat/ask-agent-evidence-workspace-v2180-r2
    paths:
      - .github/workflows/ask-agent-workspace-integration.yml
  pull_request:
    branches:
      - feat/event-lineage-node-keeps-gnb-focus-v2170
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ask-agent-workspace-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrate-and-verify:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'feat/ask-agent-evidence-workspace-v2180-r2')
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: feat/ask-agent-evidence-workspace-v2180-r2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply bounded integration patch
        env:
          PR_NUMBER: "353"
        run: python scripts/patch_ask_agent_workspace.py

      - name: Verify patch shape
        run: |
          git diff --check
          test -f frontend/src/components/AskAgentWorkspace.tsx
          test -f docs/adr/0126-ask-agent-evidence-workspace.md
          grep -F 'AskAgentWorkspace as AskAgentPanel' frontend/src/App.tsx
          grep -F '| #353 | Ask Agent evidence workspace' docs/product-technical-gap-baseline.md
          grep -F '`Ask/AskAgentWorkspace`' docs/storybook-inventory.md
          if grep -F 'function AskAgentPanel({' frontend/src/App.tsx; then
            echo 'Legacy inline AskAgentPanel remains' >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Pin and enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          test "$(pnpm --version)" = "9.15.9"

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run focused Ask Agent tests
        working-directory: frontend
        run: pnpm run test -- src/components/AskAgentWorkspace.test.tsx src/components/AskAgentWorkspace.styles.test.ts

      - name: Run frontend lint
        working-directory: frontend
        run: pnpm run lint

      - name: Run full frontend tests
        working-directory: frontend
        run: pnpm run test

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Build Storybook state inventory
        working-directory: frontend
        run: pnpm run build-storybook

      - name: Publish verified integration through a child pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATED_BRANCH: automation/ask-agent-workspace-integration-353
          TARGET_BRANCH: feat/ask-agent-evidence-workspace-v2180-r2
        run: |
          rm -rf frontend/dist frontend/storybook-static
          rm -f scripts/patch_ask_agent_workspace.py
          rm -f .github/workflows/ask-agent-workspace-integration.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: integrate verified Ask Agent evidence workspace'
          git push origin HEAD:"${GENERATED_BRANCH}"
          existing_pr="$(gh pr list --state open --head "${GENERATED_BRANCH}" --base "${TARGET_BRANCH}" --json number --jq '.[0].number // empty')"
          if [ -z "${existing_pr}" ]; then
            gh pr create \
              --base "${TARGET_BRANCH}" \
              --head "${GENERATED_BRANCH}" \
              --title 'chore: apply verified Ask Agent integration' \
              --body 'Generated only after the Ask Agent focused tests, complete 185-test frontend suite, zero-warning lint, production build, and Storybook build passed on the exact source head. This child PR exists because repository rules correctly require the generated source commit to enter the protected feature branch through a pull request.'
          fi
