name: Repair PR 281 TEPP project history

on:
  push:
    branches: [feat/tepp-project-history-buyer-surface-v2180]
  pull_request:
    branches: [feat/event-lineage-node-keeps-gnb-focus-v2170]
    types: [synchronize, edited]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-pr-281-tepp-project-history
  cancel-in-progress: true

jobs:
  integrate-and-verify:
    if: >-
      github.ref == 'refs/heads/feat/tepp-project-history-buyer-surface-v2180' ||
      (github.event_name == 'pull_request' && github.event.pull_request.number == 281 && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REPAIR_BRANCH: feat/tepp-project-history-buyer-surface-v2180
      REPAIR_BASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout the exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: ${{ env.REPAIR_BASE_SHA }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Install committed Python lock
        run: uv sync --frozen --extra dev --extra backend

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Apply the bounded endpoint and buyer-surface integration
        run: |
          python -m py_compile .github/scripts/fix_281_tepp_project_history.py
          python .github/scripts/fix_281_tepp_project_history.py
          git diff --check

      - name: Verify TEPP consumer contracts
        run: |
          uv run --frozen python -m pytest -q tests/test_tepp_project_history.py
          uv run --frozen python -m compileall -q lineageweave backend/app
          uv run --frozen python -m pytest -q

      - name: Verify accessible buyer surfaces
        working-directory: frontend
        run: |
          pnpm exec vitest run src/components/TeppProjectHistory.test.tsx src/App.test.tsx
          pnpm run lint
          pnpm run build
          pnpm run build-storybook

      - name: Commit only the exact-head validated integration
        shell: bash
        run: |
          rm -f .github/workflows/repair-281-tepp-project-history.yml
          rm -f .github/scripts/fix_281_tepp_project_history.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/main.py frontend/src/api.ts frontend/src/App.tsx
          git add -u .github/workflows .github/scripts
          git diff --cached --check
          git commit -m "feat: connect TEPP project histories to Buyer Ask surfaces"
          test -z "$(git status --porcelain)" || {
            echo 'repair left uncommitted or untracked files' >&2
            git status --short
            exit 1
          }
          git fetch origin "${REPAIR_BRANCH}"
          remote_head="$(git rev-parse "origin/${REPAIR_BRANCH}")"
          if [ "$remote_head" != "$REPAIR_BASE_SHA" ]; then
            echo "PR head moved from ${REPAIR_BASE_SHA} to ${remote_head}; refusing to publish an unverified integration." >&2
            exit 1
          fi
          git push origin "HEAD:${REPAIR_BRANCH}"
