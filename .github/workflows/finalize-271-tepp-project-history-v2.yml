name: Finalize PR 271 TEPP project history v2

on:
  push:
    branches:
      - feat/tepp-project-history-ask-v2180

permissions:
  contents: write

concurrency:
  group: repair-pr271-tepp-project-history
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout latest stacked head
        uses: actions/checkout@v4
        with:
          ref: feat/tepp-project-history-ask-v2180
          fetch-depth: 0
          persist-credentials: true

      - name: Record exact input head
        run: git rev-parse HEAD > /tmp/pr271_input_sha

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Pre-align the cutoff-aware timeline component
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/components/ProjectHistoryTimeline.tsx")
          text = path.read_text(encoding="utf-8")
          old = '''export function PostProjectHistory({
            accessToken,
            postId,
            onOpenPost,
          }: {
            accessToken: string;
            postId: string;
            onOpenPost: (postId: string) => void;
          }) {'''.replace("          ", "")
          new = '''export function PostProjectHistory({
            accessToken,
            postId,
            onOpenPost,
            knowledgeCutoff,
          }: {
            accessToken: string;
            postId: string;
            onOpenPost: (postId: string) => void;
            knowledgeCutoff?: string | null;
          }) {'''.replace("          ", "")
          if "knowledgeCutoff?: string | null;" not in text:
              if text.count(old) != 1:
                  raise SystemExit("PostProjectHistory signature drifted")
              text = text.replace(old, new, 1)
          text = text.replace(
              "fetchPostProjectHistory(accessToken, postId)",
              "fetchPostProjectHistory(accessToken, postId, knowledgeCutoff ?? undefined)",
          )
          component_start = text.index("export function PostProjectHistory(")
          component = text[component_start:]
          component = component.replace(
              "}, [accessToken, postId]);",
              "}, [accessToken, knowledgeCutoff, postId]);",
              1,
          )
          text = text[:component_start] + component
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply or confirm the bounded finalizer
        run: |
          if test -f scripts/finalize_pr271_tepp_history.py; then
            python scripts/finalize_pr271_tepp_history.py
          fi
          python - <<'PY'
          from pathlib import Path

          required = {
              Path("backend/app/main.py"): (
                  '/api/posts/{post_id}/project-history',
                  'tepp_project_history',
                  'project_history_for_post_ids',
              ),
              Path("frontend/src/api.ts"): (
                  'TeppProjectHistoryEnvelope',
                  'fetchPostProjectHistory',
              ),
              Path("frontend/src/App.tsx"): (
                  'PostProjectHistory',
                  'ProjectHistoryTimeline',
              ),
          }
          missing = [
              f"{path}: {marker}"
              for path, markers in required.items()
              for marker in markers
              if marker not in path.read_text(encoding="utf-8")
          ]
          if missing:
              raise SystemExit("Missing TEPP Buyer markers:\n" + "\n".join(missing))

          adr_dir = Path("docs/adr")
          if not list(adr_dir.glob("*-tepp-project-history-buyer-surface.md")):
              numbers = [
                  int(path.name[:4])
                  for path in adr_dir.glob("[0-9][0-9][0-9][0-9]-*.md")
              ]
              number = max(numbers, default=0) + 1
              path = adr_dir / f"{number:04d}-tepp-project-history-buyer-surface.md"
              path.write_text(
                  f"""# ADR {number:04d}: TEPP-owned project history on Buyer read and Ask surfaces

## Status

Accepted on this stacked branch. Landing remains gated by the TEPP and LineageWeave predecessor stacks.

## Context

LineageWeave owns source ingestion, RBAC/ABAC, Knowledge Graph evidence, Global Ask, and post-scoped Ask. It must not become a second temporal-reasoning authority or imply that observed sequence proves causation. Buyers nevertheless need a project-wide history when reading a post or evaluating an Ask answer.

## Decision

LineageWeave selects eligible posts with the exact same `source_project_code` that the current account may read and that were available at the selected knowledge cutoff. It sends only bounded event identities, persisted stage codes, UTC event and availability times, source-post identities, bounded evidence text, and opaque actor identities through TEPP's versioned `/v1/project-histories` contract.

TEPP validates and deterministically orders supplied evidence. The only accepted inference status is `temporal_association_only`. LineageWeave rejects unknown fields, changed evidence, out-of-bundle citations, incorrect participant counts, future leakage, and causal or psychometric authority.

The projection is exposed in post reading, individual post Ask, and Global Ask. No browser bearer token, review token, provider key, `TEPP_API_KEY`, or database credential crosses this boundary. Loopback HTTP is local-only; non-loopback deployments require HTTPS.

## Consequences

- Every timeline event opens its exact authorized source post.
- The read surface preserves an analysis-run knowledge cutoff through `as_of`.
- Missing stages, people, projects, confidence, theta, and causal conclusions remain missing.
- TEPP unavailability returns a typed state without fabricating a timeline or destroying the underlying post or Ask response.
- All Buyer entry points share one timeline component and one service contract.
""",
                  encoding="utf-8",
              )
          PY

      - name: Install locked Python dependencies
        run: uv sync --frozen --extra dev --extra backend

      - name: Verify backend contracts and complete suite
        run: |
          uv run --frozen python -m compileall -q \
            lineageweave/tepp_project_history.py \
            backend/app/tepp_project_history.py \
            backend/app/main.py
          uv run --frozen python -m pytest \
            tests/test_tepp_project_history.py \
            tests/test_tepp_project_history_ingestion.py -q
          uv run --frozen python -m pytest -q

      - name: Install and verify frontend
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run test
          pnpm run build
          pnpm run build-storybook

      - name: Refuse a stale-head publication
        env:
          BRANCH_NAME: feat/tepp-project-history-ask-v2180
        run: |
          expected="$(cat /tmp/pr271_input_sha)"
          remote="$(git ls-remote origin "refs/heads/${BRANCH_NAME}" | cut -f1)"
          test -n "$remote"
          test "$remote" = "$expected"

      - name: Commit only the verified product delta
        env:
          BRANCH_NAME: feat/tepp-project-history-ask-v2180
        run: |
          rm -f scripts/repair_pr271_tepp_project_history.py
          rm -f scripts/finalize_pr271_tepp_history.py
          rm -f .github/workflows/repair-271-tepp-project-history.yml
          rm -f .github/workflows/repair-271-tepp-history-finish.yml
          rm -f .github/workflows/repair-271-tepp-history-types.yml
          rm -f .github/workflows/finalize-271-tepp-project-history.yml
          rm -f .github/workflows/finalize-271-tepp-project-history-v2.yml
          rm -f .repair_paths

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          git add -- \
            .env.example \
            backend/app/main.py \
            backend/app/tepp_project_history.py \
            lineageweave/tepp_project_history.py \
            tests/test_tepp_project_history.py \
            tests/test_tepp_project_history_ingestion.py \
            frontend/src/api.ts \
            frontend/src/App.tsx \
            frontend/src/components/ProjectHistoryTimeline.tsx \
            frontend/src/components/ProjectHistoryTimeline.css \
            frontend/src/components/ProjectHistoryTimeline.test.tsx \
            frontend/src/components/ProjectHistoryTimeline.stories.tsx \
            CHANGELOG.d/2.18.0-tepp-project-history-ask.md \
            docs/adr/*-tepp-project-history-buyer-surface.md

          for path in \
            scripts/repair_pr271_tepp_project_history.py \
            scripts/finalize_pr271_tepp_history.py \
            .github/workflows/repair-271-tepp-project-history.yml \
            .github/workflows/repair-271-tepp-history-finish.yml \
            .github/workflows/repair-271-tepp-history-types.yml \
            .github/workflows/finalize-271-tepp-project-history.yml \
            .github/workflows/finalize-271-tepp-project-history-v2.yml; do
            git add -- "$path" 2>/dev/null || true
          done

          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat: deliver TEPP project histories across Buyer Ask surfaces"
          git push origin "HEAD:${BRANCH_NAME}"
