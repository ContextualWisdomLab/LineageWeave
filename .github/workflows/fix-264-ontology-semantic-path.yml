          write(
              "docs/adr/0076-ontology-grounded-semantic-relationship-path.md",
              '''# ADR 0076: Ontology-grounded semantic relationship paths

          ## Status

          Accepted

          ## Context

          The buyer related-node surface ranked evidence-gated knowledge-graph nodes with RWR, but returned only each node class and a numeric relevance score. The relationship predicates traversed from the selected person, team, organization, or post disappeared, so the UI could only say `Graph relation`. The ontology also declared `edge_mention` as `Post -> Person`, while the canonical relational projection stores `Person -> Post`.

          ## Decision

          - Keep the existing canonical `knowledge_graph_edge` direction.
          - Correct the OWL domain/range for `edge_mention` to `Person -> Post` and declare explicit `owl:inverseOf` properties for buyer-readable reverse traversal.
          - Compute a deterministic shortest semantic path over the same positive, ABAC/evidence-gated subgraph used by RWR. RWR still determines relevance; the path only explains the stored connectivity and is not a causal claim.
          - Return each hop's lookup code, traversal direction, ontology IRI, and ontology label. Unknown ontology terms remain absent rather than receiving guessed labels.
          - Render the path on related-post cards so the buyer can act on the relationship instead of seeing generic graph copy.

          ## Consequences

          The API remains additive. Existing consumers may ignore `semantic_path`. The relational database remains the system of record; OWL supplies controlled semantics and inverse labels. A later RDF 1.2 export may annotate individual edge assertions with provenance, but this slice does not claim RDF 1.2 conformance or create unsupported facts.
          ''',
          )
          write(
              "docs/doctoring/SEMANTIC_RELATIONSHIP_PATH_REFERENCES.md",
              '''# Semantic relationship path references

          ## Product traceability

          - `knowledge_graph_edge` is interpreted as a typed subject-predicate-object assertion whose canonical direction must match the OWL property's domain and range.
          - `owl:inverseOf` provides the relationship used when the buyer traverses a stored assertion in reverse.
          - `knowledge_graph_edge_evidence` continues to gate the visible subgraph; the semantic path never bypasses ABAC or invents provenance.
          - RDF 1.2 triple terms and annotations are tracked for a future interoperable statement-provenance export; this release keeps PostgreSQL as the authority.

          ## APA 7th references

          World Wide Web Consortium. (2012). *OWL 2 Web Ontology Language: Document overview (Second Edition).* https://www.w3.org/TR/owl2-overview/

          World Wide Web Consortium. (2013). *PROV-O: The PROV ontology.* https://www.w3.org/TR/prov-o/

          World Wide Web Consortium. (2026). *RDF 1.2 concepts and abstract data model* (Candidate Recommendation Snapshot, April 7, 2026). https://www.w3.org/TR/rdf12-concepts/
          ''',
          )
          write(
              "CHANGELOG.d/2.17.0-ontology-semantic-path.md",
              '''### Fixed

          - Aligned `edge_mention` OWL domain/range with the canonical Person-to-Post graph direction and added explicit inverse relationship terms.
          - Related knowledge-graph nodes now carry and render the deterministic ontology relationship path that explains why each buyer-visible node is connected.
          ''',
          )
          PY

      - name: Apply ontology and buyer-surface repair
        run: python "$RUNNER_TEMP/apply_semantic_patch.py"

      - name: Run focused GREEN verification
        run: |
          uv run --frozen python -m pytest -q \
            tests/test_semantic_relationship_paths.py \
            tests/test_ontology.py \
            tests/test_knowledge_graph.py \
            tests/test_person_mention_projection.py
          pnpm --dir frontend exec vitest run src/components/RelatedSemanticPath.test.tsx

      - name: Run full Python verification
        run: uv run --frozen python -m pytest -q

      - name: Run full frontend verification
        run: |
          pnpm --dir frontend run lint
          pnpm --dir frontend run test
          pnpm --dir frontend run build
          pnpm --dir frontend run build-storybook

      - name: Commit and push without overwriting concurrent fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit_current_tree() {
            rm -f .github/workflows/fix-264-ontology-semantic-path.yml
            git add -A
            if git diff --cached --quiet; then
              return 0
            fi
            git commit -m "fix: expose ontology-grounded semantic relationship paths"
          }

          commit_current_tree
          for attempt in 1 2 3; do
            if git push origin "HEAD:${REPAIR_BRANCH}"; then
              exit 0
            fi
            echo "Concurrent branch update detected; replaying the idempotent repair (attempt ${attempt})."
            git fetch origin "${REPAIR_BRANCH}"
            git reset --hard "origin/${REPAIR_BRANCH}"
            python "$RUNNER_TEMP/apply_semantic_patch.py"
            uv run --frozen python -m pytest -q \
              tests/test_semantic_relationship_paths.py \
              tests/test_ontology.py \
              tests/test_knowledge_graph.py \
              tests/test_person_mention_projection.py
            pnpm --dir frontend exec vitest run src/components/RelatedSemanticPath.test.tsx
            commit_current_tree
          done
          echo "Could not push after bounded concurrent-update retries." >&2
          exit 1
