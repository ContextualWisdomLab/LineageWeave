name: Temporary #830 finite-axis assertion repair

on:
  push:
    branches:
      - feat/leftover-map-compare-axis-singular-v2510

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temporary-axis-finite-830
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LINEAGEWEAVE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
      EXPECTED_PRODUCT_PARENT: 09a3a8fdf0f66821808c8859e5a0e76ec6d31eea
      PRODUCT_BRANCH: feat/leftover-map-compare-axis-singular-v2510
    steps:
      - name: Checkout exact workflow head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify exact authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PRODUCT_PARENT"
          live_head="$(gh api repos/${GITHUB_REPOSITORY}/pulls/830 --jq .head.sha)"
          test "$live_head" = "$GITHUB_SHA"
          test "$(git status --porcelain)" = ""

      - name: Apply finite-value assertion repair
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/tests/test_api.py")
          text = path.read_text()
          old_general = '    assert all(axis["leftover_singular_value"] >= 0 for axis in leftover_axes)\n'
          new_general = (
              '    assert all(\n'
              '        math.isfinite(axis["leftover_singular_value"])\n'
              '        and axis["leftover_singular_value"] >= 0\n'
              '        for axis in leftover_axes\n'
              '    )\n'
          )
          old_compare = (
              '    assert all(\n'
              '        axis["leftover_singular_value"] == axis["leftover_singular_value"]\n'
              '        and axis["leftover_singular_value"] >= 0\n'
              '        for axis in leftover_compare_axes\n'
              '    )\n'
          )
          new_compare = (
              '    assert all(\n'
              '        math.isfinite(axis["leftover_singular_value"])\n'
              '        and axis["leftover_singular_value"] >= 0\n'
              '        for axis in leftover_compare_axes\n'
              '    )\n'
          )
          if text.count(old_general) != 1:
              raise SystemExit("expected general singular assertion exactly once")
          if text.count(old_compare) != 1:
              raise SystemExit("expected comparison singular assertion exactly once")
          path.write_text(text.replace(old_general, new_general, 1).replace(old_compare, new_compare, 1))
          PY
          git diff --check
          git diff -- backend/tests/test_api.py

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up locked dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Select pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Install committed universal lock
        run: uv sync --frozen --extra dev --extra backend

      - name: Full PostgreSQL-backed GREEN
        run: uv run --frozen python -m pytest -q

      - name: Remove temporary workflow and promote repair non-force
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          live_head="$(gh api repos/${GITHUB_REPOSITORY}/pulls/830 --jq .head.sha)"
          test "$live_head" = "$GITHUB_SHA"
          git rm .github/workflows/temporary-axis-finite-830.yml
          git add backend/tests/test_api.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(reports): require finite persisted axis singular values"
          git push origin HEAD:"$PRODUCT_BRANCH"
