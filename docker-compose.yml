name: lineageweave

services:
  postgres:
    # Built (not bind-mounted) so the keycloak-db init script and the
    # product schema migration ship inside the image itself -- portable
    # across hosts/CI runners that don't share a filesystem with the
    # Docker daemon. Context is the repo root so the Dockerfile can COPY
    # migrations/0001_initial_schema.sql (single source of truth --
    # tests/test_schema.py applies this exact same file).
    build:
      context: .
      dockerfile: docker/postgres-init/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lineageweave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lineageweave_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-lineageweave}
    ports:
      # Deliberately not the Postgres default (5432): a developer's machine
      # commonly already runs its own PostgreSQL server on 5432, and this
      # project in particular must never be ambiguous about which Postgres
      # a connection lands on (see ADR 0001 -- real infra, synthetic data).
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lineageweave} -d ${POSTGRES_DB:-lineageweave}"]
      interval: 5s
      timeout: 5s
      retries: 10

  database_migration:
    build:
      context: .
      dockerfile: docker/postgres-init/Dockerfile
    entrypoint: ["/usr/local/bin/lineageweave-migrate"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-lineageweave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lineageweave_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-lineageweave}
    depends_on:
      postgres:
        condition: service_healthy

  valkey:
    image: valkey/valkey:8-alpine@sha256:a038175878d66b9d274fbf8be73c0305e93798b83917647f167e18cef3c71eec
    ports:
      # Not Redis/Valkey's default (6379) for the same collision-avoidance
      # reason as POSTGRES_PORT above.
      - "${VALKEY_PORT:-16379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  searxng:
    # Self-hosted metasearch, never a hosted third-party search API key --
    # relation_verification.py's SearxngRelationVerificationClient checks a
    # Knowledge Graph relation inference against real external evidence
    # (see ADR 0005). Published to a host port (not the default 8080, same
    # collision-avoidance reasoning as every other service here) so
    # backend/tests/test_api.py's real-integration tests -- running as a
    # host process, not inside the compose network -- can reach it too.
    build: ./docker/searxng
    ports:
      - "${SEARXNG_PORT:-18888}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    # Built (not bind-mounted) so the realm-export.json seed ships inside
    # the image itself -- portable across hosts/CI runners that don't share
    # a filesystem with the Docker daemon.
    build: ./docker/keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_only}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-lineageweave}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-lineageweave_dev_only}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      # Not the common local-dev default (8080) for the same reason.
      - "${KEYCLOAK_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  orchestrator:
    # Consume the paper-grounded orchestration service from main; inference
    # remains behind its authenticated OpenAI-compatible boundary.
    build:
      context: ./docker/contextual-orchestrator
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-lineageweave}-orchestrator:71fa80976ea8db69e178bb16b4b04db3c2cf5076
    env_file:
      - ${HOME}/.env
    environment:
      AGENTS_FILE: /app/agents.json
      PORT: 8000
      CONTEXTUAL_ORCHESTRATOR_TOKEN: ${CONTEXTUAL_ORCHESTRATOR_TOKEN:-${ORCHESTRATOR_API_KEY:-lineageweave-orchestrator-dev-only}}
      # Gateway credentials and URL are supplied only by env_file (${HOME}/.env).
      # Do not repeat them under environment:, where Compose interpolation can
      # overwrite env_file values with an empty host-shell value.
      # The upstream default remains 64 KiB for ordinary text APIs. Buyer
      # image blocks are base64 data URIs, so the multimodal boundary gets an
      # explicit bounded 8 MiB limit rather than an unbounded request size.
      CONTEXTUAL_ORCHESTRATOR_MAX_BODY_BYTES: ${CONTEXTUAL_ORCHESTRATOR_MAX_BODY_BYTES:-8388608}
      CONTEXTUAL_ORCHESTRATOR_ALLOWED_PROVIDER_HOSTS: ${CONTEXTUAL_ORCHESTRATOR_ALLOWED_PROVIDER_HOSTS:-host.docker.internal}
      BATCH_JOB_REGISTRY_VALKEY_URL: redis://valkey:6379/1
      OTEL_SERVICE_NAME: ${OTEL_ORCHESTRATOR_SERVICE_NAME:-contextual-orchestrator}
      # Do not set OTEL_EXPORTER_OTLP_ENDPOINT here. An empty
      # ${OTEL_EXPORTER_OTLP_ENDPOINT:-} interpolation would wipe a value from
      # env_file (${HOME}/.env). Export stays opt-in from that file or the host.
    command: ["python", "/app/start.py"]
    depends_on:
      valkey:
        condition: service_healthy
    ports:
      - "${ORCHESTRATOR_PORT:-18000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      # Warm-up window: failures inside start_period do not consume the retry
      # budget, so a booting orchestrator that becomes healthy within 50s is
      # never counted against retries. A dead service trips the gate at
      # ~100s (start_period + 10 x 5s), matching the previous retries: 20
      # budget exactly; the win is boot tolerance, not faster dead detection.
      start_period: 50s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &backend-environment
      DATABASE_URL: postgresql://${POSTGRES_USER:-lineageweave}:${POSTGRES_PASSWORD:-lineageweave_dev_only}@postgres:5432/${POSTGRES_DB:-lineageweave}
      # Internal DNS name for JWKS fetches (always reachable from inside the
      # compose network); KEYCLOAK_ISSUER is the *external*, host-published
      # URL a browser/token actually carries -- see backend/app/config.py.
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://localhost:${KEYCLOAK_PORT:-18080}/realms/lineageweave-demo
      KEYCLOAK_REALM: lineageweave-demo
      KEYCLOAK_CLIENT_ID: lineageweave-frontend
      # Production may set these to the real Keyverse OIDC provider. Empty
      # values keep this stack on its explicit local Keycloak development mode;
      # no Keyverse-shaped identity service is created by Compose.
      KEYVERSE_ISSUER: ${KEYVERSE_ISSUER:-}
      KEYVERSE_CLIENT_ID: ${KEYVERSE_CLIENT_ID:-}
      KEYVERSE_AUDIENCE: ${KEYVERSE_AUDIENCE:-}
      KEYVERSE_DISCOVERY_URI: ${KEYVERSE_DISCOVERY_URI:-}
      KEYVERSE_JWKS_URI: ${KEYVERSE_JWKS_URI:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-lineageweave-api}
      OIDC_DISCOVERY_URI: ${OIDC_DISCOVERY_URI:-}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-}
      OIDC_CLOCK_SKEW_SECONDS: ${OIDC_CLOCK_SKEW_SECONDS:-5}
      FRONTEND_ORIGINS: http://localhost:${FRONTEND_PORT:-15173}
      VALKEY_URL: redis://valkey:6379/0
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-lineageweave}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Empty by default: every LLM/vision channel stays the Null client
      # (dropped, not faked). Set these to a running contextual-orchestrator
      # to turn the channels on. Provider credentials use LLM_GATEWAY_API_URL /
      # LLM_GATEWAY_API_KEY in the orchestrator's private env file.
      ORCHESTRATOR_BASE_URL: ${ORCHESTRATOR_BASE_URL:-http://orchestrator:8000}
      ORCHESTRATOR_API_KEY: ${ORCHESTRATOR_API_KEY:-${CONTEXTUAL_ORCHESTRATOR_TOKEN:-lineageweave-orchestrator-dev-only}}
      SEARXNG_BASE_URL: http://searxng:8080
      TEPP_TRANSPORT_URL: ${TEPP_TRANSPORT_URL:-}
      TEPP_API_KEY: ${TEPP_API_KEY:-}
      CALDAV_BASE_URL: ${CALDAV_BASE_URL:-}
      NARUON_CALENDAR_BASE_URL: ${NARUON_CALENDAR_BASE_URL:-}
      NARUON_CALENDAR_SERVICE_TOKEN: ${NARUON_CALENDAR_SERVICE_TOKEN:-}
      RANKWEAVE_DISABLED: ${RANKWEAVE_DISABLED:-}
      # Process HMAC for ontology source-window continuation. Empty keeps the
      # truncated-without-cursor contract. Never reuse an OIDC or orchestrator secret.
      ONTOLOGY_SOURCE_CURSOR_SECRET: ${ONTOLOGY_SOURCE_CURSOR_SECRET:-}
    ports:
      - "${BACKEND_PORT:-18420}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      database_migration:
        condition: service_completed_successfully
      orchestrator:
        condition: service_healthy
      keycloak:
        condition: service_started
      valkey:
        condition: service_healthy
      searxng:
        condition: service_healthy
      # The HTTP process deliberately does not consume durable queues. Make
      # even a targeted `docker compose up backend` start the sole worker
      # owner and wait for observed event-loop progress before serving jobs.
      backend-worker:
        condition: service_healthy

  backend-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.app.worker"]
    restart: unless-stopped
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      database_migration:
        condition: service_completed_successfully
      orchestrator:
        condition: service_healthy
      valkey:
        condition: service_healthy
      searxng:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "backend.app.worker_health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  mcp:
    profiles: ["mcp"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uvicorn", "backend.app.mcp_server:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lineageweave}:${POSTGRES_PASSWORD:-lineageweave_dev_only}@postgres:5432/${POSTGRES_DB:-lineageweave}
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://localhost:${KEYCLOAK_PORT:-18080}/realms/lineageweave-demo
      KEYCLOAK_REALM: lineageweave-demo
      KEYVERSE_ISSUER: ${KEYVERSE_ISSUER:-}
      KEYVERSE_CLIENT_ID: ${KEYVERSE_CLIENT_ID:-}
      KEYVERSE_AUDIENCE: ${KEYVERSE_AUDIENCE:-}
      KEYVERSE_DISCOVERY_URI: ${KEYVERSE_DISCOVERY_URI:-}
      KEYVERSE_JWKS_URI: ${KEYVERSE_JWKS_URI:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_AUDIENCE: lineageweave-api
      OIDC_DISCOVERY_URI: ${OIDC_DISCOVERY_URI:-}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-}
      OIDC_CLOCK_SKEW_SECONDS: ${OIDC_CLOCK_SKEW_SECONDS:-5}
      VALKEY_URL: redis://valkey:6379/0
      ORCHESTRATOR_BASE_URL: ${ORCHESTRATOR_BASE_URL:-http://orchestrator:8000}
      ORCHESTRATOR_API_KEY: ${ORCHESTRATOR_API_KEY:-${CONTEXTUAL_ORCHESTRATOR_TOKEN:-lineageweave-orchestrator-dev-only}}
      MCP_RESOURCE_URL: http://localhost:18001/mcp
      MCP_AUDIENCE: http://localhost:18001/mcp
      MCP_ALLOWED_HOSTS: localhost:*,127.0.0.1:*,mcp:8001
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      MCP_MAX_REQUEST_BYTES: ${MCP_MAX_REQUEST_BYTES:-65536}
      MCP_RATE_LIMIT_REQUESTS: ${MCP_RATE_LIMIT_REQUESTS:-}
      MCP_RATE_LIMIT_WINDOW_SECONDS: ${MCP_RATE_LIMIT_WINDOW_SECONDS:-}
    ports:
      - "18001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      database_migration:
        condition: service_completed_successfully
      orchestrator:
        condition: service_healthy
      keycloak:
        condition: service_started
      valkey:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_KEYVERSE_ISSUER: ${KEYVERSE_ISSUER:-http://localhost:${KEYCLOAK_PORT:-18080}/realms/lineageweave-demo}
        VITE_KEYVERSE_CLIENT_ID: ${KEYVERSE_CLIENT_ID:-lineageweave-frontend}
        VITE_BACKEND_BASE_URL: http://localhost:${BACKEND_PORT:-18420}
    ports:
      - "${FRONTEND_PORT:-15173}:8080"
    depends_on:
      - backend

volumes:
  postgres_data:
  valkey_data:
