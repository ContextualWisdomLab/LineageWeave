name: lineageweaveoidce2e

# Test-only OIDC relying-party runner.  It deliberately does not define an
# issuer or reuse compose/keyverse_oidc.py: supply a separate conformance IdP.
services:
  lineageweave-oidc-e2e:
    build:
      context: ..
    network_mode: host
    env_file:
      - path: ${LINEAGEWEAVE_E2E_ENV_FILE:-${LINEAGEWEAVE_ENV_FILE:-${HOME}/.env}}
        required: false
    environment:
      LINEAGEWEAVE_HOST: 127.0.0.1
      LINEAGEWEAVE_PORT: ${LINEAGEWEAVE_E2E_PORT:-18105}
      # The direct PostgreSQL source remains mandatory for this browser test.
      LINEAGEWEAVE_DSN: ${LINEAGEWEAVE_E2E_DSN:?set a direct PostgreSQL DSN}
      LINEAGE_SOURCE_TABLE: ${LINEAGEWEAVE_E2E_SOURCE_TABLE:?set the direct PostgreSQL source table}
      LINEAGEWEAVE_DEV_MODE: "1"
      LINEAGEWEAVE_COOKIE_SECURE: "0"
      LINEAGEWEAVE_VALKEY_URL: redis://127.0.0.1:${LINEAGEWEAVE_E2E_VALKEY_PORT:-16479}/0
      LINEAGEWEAVE_COMPOSE_STANDIN_URL: http://127.0.0.1:${LINEAGEWEAVE_STANDIN_PORT:-18081}
      LINEAGEWEAVE_SEARXNG_URL: http://127.0.0.1:${LINEAGEWEAVE_SEARXNG_PORT:-18888}
      KEYVERSE_ISSUER: http://localhost:${LINEAGEWEAVE_E2E_KEYCLOAK_PORT:-18080}/realms/${LINEAGEWEAVE_E2E_KEYCLOAK_REALM:-lw-e2e}
      LINEAGEWEAVE_OIDC_CLIENT_ID: ${LINEAGEWEAVE_E2E_OIDC_CLIENT_ID:-lineageweave-web}
      LINEAGEWEAVE_OIDC_CLIENT_SECRET: ${LINEAGEWEAVE_E2E_OIDC_CLIENT_SECRET:-lineageweave-e2e-client-fixture}
      LINEAGEWEAVE_OIDC_REDIRECT_URI: http://127.0.0.1:${LINEAGEWEAVE_E2E_PORT:-18105}/api/oidc/callback
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${LINEAGEWEAVE_E2E_PORT:-18105}/api/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 12
