name: lineageweaveoidcconformance

# Test infrastructure only. The product Compose profile and worker remain
# relying-party-only; this separate project supplies an interoperable IdP.
services:
  oidc-conformance-idp:
    build:
      context: .
      dockerfile: Dockerfile.oidc-conformance
    network_mode: host
    command:
      - start-dev
      - --import-realm
      - --http-port
      - ${LINEAGEWEAVE_E2E_KEYCLOAK_PORT:-18080}
    environment:
      LINEAGEWEAVE_E2E_OIDC_CLIENT_SECRET: ${LINEAGEWEAVE_E2E_OIDC_CLIENT_SECRET:-lineageweave-e2e-client-fixture}
      LINEAGEWEAVE_E2E_TEST_PASSWORD: ${LINEAGEWEAVE_E2E_TEST_PASSWORD:-lineageweave-e2e-account-fixture}
      LINEAGEWEAVE_E2E_ORG: ${LINEAGEWEAVE_E2E_ORG:-E2E_CORP}
      LINEAGEWEAVE_E2E_WORKSPACE: ${LINEAGEWEAVE_E2E_WORKSPACE:-E2E_PU}
      LINEAGEWEAVE_E2E_REDIRECT_URI: http://127.0.0.1:${LINEAGEWEAVE_E2E_PORT:-18105}/api/oidc/callback
      LINEAGEWEAVE_E2E_WEB_ORIGIN: http://127.0.0.1:${LINEAGEWEAVE_E2E_PORT:-18105}
    healthcheck:
      test: ["CMD-SHELL", "bash -c '>/dev/tcp/127.0.0.1/${LINEAGEWEAVE_E2E_KEYCLOAK_PORT:-18080}'"]
      interval: 5s
      timeout: 3s
      retries: 24

  oidc-e2e-valkey:
    image: valkey/valkey:8-alpine
    network_mode: host
    command: ["valkey-server", "--port", "${LINEAGEWEAVE_E2E_VALKEY_PORT:-16479}"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -p ${LINEAGEWEAVE_E2E_VALKEY_PORT:-16479} ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
