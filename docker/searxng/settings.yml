# Minimal override on top of the base image's settings.yml
# (use_default_settings: true inherits everything else -- engine list,
# UI, etc. -- so this file only states what genuinely differs for this
# private, compose-internal-only instance).
#
# json must be listed explicitly: Searxng's default formats list is
# ["html"] only, so relation_verification.py's SearxngRelationVerificationClient
# (format=json) gets a 403 without this.
use_default_settings: true

general:
  instance_name: "LineageWeave relation verification (internal only)"

search:
  formats:
    - html
    - json

server:
  # Dev-only secret, baked into the image like every other local-dev
  # config in this repo (postgres-init, keycloak realm-export) -- this
  # instance is reachable only inside the compose network, never
  # published to a host port (see docker-compose.yml).
  secret_key: "18d2532b5b9d0d16a5987bb3f203f9814c693df7056252bd5eb1273e7b5c578f"
  limiter: false
  image_proxy: false

# The inherited general engines currently exhaust their anonymous anti-bot
# allowance in this long-running local stack. Bing's built-in SearXNG adapter
# remains responsive and gives the research/verification clients at least one
# real external channel; SearXNG still owns engine selection, not application
# code.
engines:
  - name: bing
    engine: bing
    shortcut: bi
    disabled: false
