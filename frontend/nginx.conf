server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Process liveness for the image HEALTHCHECK. Do not fall through to
    # the SPA -- a missing index.html must not look like a healthy probe.
    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # SPA fallback: react-oidc-context's redirect_uri is the app root, and
    # client-side routing (added in a later phase) needs every path to
    # resolve to index.html.
    location / {
        try_files $uri /index.html;
    }
}
